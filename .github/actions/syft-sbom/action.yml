name: SBOM (syft)
description: >-
  Writes `<output-prefix>.spdx.json` and `<output-prefix>.cyclonedx.json` for a
  directory or file with syft, the same `syft scan` call anchore/sbom-action
  makes. syft is the upstream release for this runner, checked against
  pins.txt; sbom-action instead runs syft's `install.sh`, which checks the
  download only against a checksum file from the same release.

inputs:
  source:
    description: A syft source, e.g. `dir:path/to/bundle` or `file:app.apk`.
    required: true
  output-prefix:
    description: Path the two SBOM files are written under, without extension.
    required: true

runs:
  using: composite
  steps:
    - name: Install syft and write the SBOMs
      shell: bash
      env:
        SYFT_CHECK_FOR_APP_UPDATE: 'false'
        SOURCE: ${{ inputs.source }}
        OUT: ${{ inputs.output-prefix }}
      run: |
        set -euo pipefail
        platform="$(bash scripts/pins.sh platform)"
        dir="$RUNNER_TEMP/syft"
        mkdir -p "$dir"
        if [ "$RUNNER_OS" = Windows ]; then
          bash scripts/pins.sh fetch syft "$platform" "$dir/syft.zip"
          7z x -y -o"$dir" "$dir/syft.zip" syft.exe >/dev/null
          syft="$dir/syft.exe"
        else
          bash scripts/pins.sh fetch syft "$platform" "$dir/syft.tgz"
          tar -xzf "$dir/syft.tgz" -C "$dir" syft
          syft="$dir/syft"
        fi
        "$syft" scan "$SOURCE" -o "spdx-json=$OUT.spdx.json" -o "cyclonedx-json=$OUT.cyclonedx.json"
