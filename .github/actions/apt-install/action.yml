name: apt install (mirror-tolerant, cached)
description: >-
  Install apt packages on a GitHub-hosted runner without letting an unhealthy
  Ubuntu mirror red the PR as a code failure. With `cache: 'true'` the .debs,
  and the package lists they were resolved from, come from an `actions/cache`
  entry keyed on exactly the files the runner image's own lists resolve to; on
  a hit the install runs with no `apt-get update` and no network. Otherwise a
  bounded `apt-get update` runs first, and one that does not finish is a
  WARNING. An install that runs out its bound on its last attempt, or cannot
  download its packages twice, exits 75 (not 1) so "this job could not run" is
  distinguishable from "this job failed".
inputs:
  packages:
    description: >-
      Whitespace/newline-separated package names to install. Names only —
      anything that is not `[A-Za-z0-9][A-Za-z0-9.+_-]*` is rejected rather
      than passed to apt as a flag.
    required: true
  cache:
    description: >-
      'true' restores the .debs and lists from the Actions cache, and saves
      them on a miss from `main` or a `workflow_dispatch` (a PR's save is readable by
      nothing else, #5853). Off by default: a job that signs or publishes
      restores no cache (#3542).
    required: false
    default: 'false'
  warm-only:
    description: >-
      'true' stops at the cache probe on a hit, for a job whose only purpose is
      keeping the entry warm (`ci.yml`'s `e2e-tauri-apt-cache`).
    required: false
    default: 'false'
  update-timeout:
    description: >-
      Seconds to bound each `apt-get update` attempt. Default 300 is the
      repo-wide value #4115 established; pass 120 in short-budget jobs.
    required: false
    default: '300'
  install-timeout:
    description: >-
      Seconds to bound each `apt-get install` attempt. A slow mirror can
      trickle .debs to one runner for most of its job budget while sibling shards
      install in seconds, and Acquire::http::Timeout does not fire on a slow
      connection, only a silent one. The retry opens new connections and
      reuses every .deb the first attempt finished.
    required: false
    default: '300'
runs:
  using: composite
  steps:
    - name: Key the .deb cache on what this image's package lists resolve to
      id: plan
      if: inputs.cache == 'true'
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
      run: |
        set -uo pipefail
        # A fixed key froze its .debs at the versions of its first save: an
        # exact hit is never re-saved, so once -updates moved, every "hit" still
        # pulled most of the closure from the mirror and stalled there (run
        # 44240707721, job 134587774849). Hashing the files apt would fetch
        # gives one key per closure: same key, same files, so a hit is complete.
        # `--print-uris` reads only the local lists; the empty archive dir makes
        # it list every file, cached or not. URIs are dropped because the mirror
        # host differs per runner region; name, size and checksum identify a .deb.
        # The restore writes, and the save reads, as the runner user. Here and
        # not only in prepare-apt: cargo-coverage's lcov runs without it.
        sudo install -d -m 0777 /var/cache/apt/archives/partial
        sudo chmod 0777 /var/cache/apt/archives /var/lib/apt/lists
        empty="$(mktemp -d)"
        mkdir -p "${empty}/partial"
        set -f
        # shellcheck disable=SC2086 # word-split the package list
        if uris="$(apt-get install --print-uris -qq -o Dir::Cache::Archives="${empty}" ${APT_PACKAGES})" \
           && [ -n "${uris}" ]; then
          echo "key=apt-debs-${RUNNER_OS}-$(awk '{print $2, $3, $4}' <<<"${uris}" | sort | sha256sum | cut -c1-32)" >>"${GITHUB_OUTPUT}"
        else
          echo "No .debs to fetch, or the image's lists cannot resolve the packages: no cache."
        fi

    - name: Restore the .debs and the lists they were resolved from
      id: restore
      if: steps.plan.outputs.key != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          /var/cache/apt/archives/*.deb
          /var/lib/apt/lists/*_*
        key: ${{ steps.plan.outputs.key }}
        lookup-only: ${{ inputs.warm-only }}

    - name: apt-get install (no index refresh on a cache hit)
      id: install
      if: inputs.warm-only != 'true' || steps.restore.outputs.cache-hit != 'true'
      shell: bash
      # `inputs.*` reaches the script through `env:`, never through `${{ }}`
      # interpolated into the script text (zizmor template-injection).
      env:
        APT_PACKAGES: ${{ inputs.packages }}
        APT_UPDATE_TIMEOUT: ${{ inputs.update-timeout }}
        APT_INSTALL_TIMEOUT: ${{ inputs.install-timeout }}
        APT_CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
      run: |
        set -uo pipefail

        # On a cache hit the lists and every .deb they resolve to are local, so
        # the first attempt runs with no `apt-get update` and apt opens no
        # connection; only a failed attempt refreshes the index before the retry.
        # Otherwise the index is refreshed first: the image's lists can name a
        # .deb the archive has since dropped (it keeps one superseded version).
        # An update that does not finish is not fatal (#4163: the 300s cap, not
        # the mirror, produced those reds); the install decides.

        set -f  # no globbing while the package list is word-split
        # shellcheck disable=SC2206
        pkgs=( ${APT_PACKAGES} )
        set +f

        if [ "${#pkgs[@]}" -eq 0 ]; then
          echo "::error::apt-install: \`packages\` is empty. \`apt-get install -y\` with no arguments exits 0 having installed nothing, so the job would fail later and elsewhere."
          exit 1
        fi
        for p in "${pkgs[@]}"; do
          case "$p" in
            [A-Za-z0-9]*) ;;
            *) echo "::error::apt-install: refusing package name '$p' — names must start alphanumeric, so a stray flag cannot reach apt."; exit 1 ;;
          esac
        done

        # apt's stdout (`Get:` lines naming the mirror, then dpkg's unpack and
        # `Setting up` lines) goes to this file and is printed only when an attempt
        # fails: that is the evidence a mirror stall needs (#4163). Its stderr
        # (`W:` / `E:`) always prints.
        apt_log="${RUNNER_TEMP}/apt-install.log"
        apt_err="${RUNNER_TEMP}/apt-install.err"
        print_apt_log() {
          cat "${apt_log}"
          cat "${RUNNER_TEMP}/apt-mirrors.diag" 2>/dev/null || true
        }

        # `sudo timeout` makes apt-get timeout's DIRECT child, so the signal does
        # reach it. The kills are for a KILLed apt-get's orphaned acquire methods
        # and dpkg.
        reap_apt() {
          sudo pkill -TERM -x apt-get 2>/dev/null || true
          sleep 5
          sudo pkill -KILL -x apt-get 2>/dev/null || true
          sudo pkill -KILL -x dpkg 2>/dev/null || true
        }

        # Same three locks and ≤180s budget as prepare-apt: an apt-get killed by
        # name does not reap a dpkg child, and dpkg holds /var/lib/dpkg/lock.
        wait_for_apt_locks() {
          for _ in $(seq 1 60); do
            sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock \
                   /var/lib/apt/lists/lock >/dev/null 2>&1 || break
            sleep 3
          done
          sudo dpkg --configure -a || true
        }

        # apt's mirrorlist fails over on an error, never on a slow host, so a
        # host that trickled out a whole bound would serve the retry too
        # (us-east-2.ec2 at ~100 KB/s, #6889's run 44254849878). The host the
        # attempt was last fetching from goes last before the retry.
        mirrors="${APT_MIRRORS:-/etc/apt/apt-mirrors.txt}"
        demote_slow_mirror() {
          local host
          host="$(grep -oE '^(Get|Ign):[0-9]+ https?://[^/ ]+' "${apt_log}" | tail -n 1 | sed -E 's/^[^ ]+ //')"
          [ -n "${host}" ] && [ -r "${mirrors}" ] || return 0
          awk -v h="${host}/" 'index($0, h) == 1 { next } { print }' "${mirrors}" >"${RUNNER_TEMP}/apt-mirrors.new"
          awk -v h="${host}/" 'index($0, h) == 1 { sub(/priority:[0-9]+/, "priority:99"); print }' "${mirrors}" >>"${RUNNER_TEMP}/apt-mirrors.new"
          if ! cmp -s "${mirrors}" "${RUNNER_TEMP}/apt-mirrors.new"; then
            sudo cp "${RUNNER_TEMP}/apt-mirrors.new" "${mirrors}"
            echo "::warning::apt-install: ${host} ran out the bound; the retry tries it last"
          fi
        }

        # apt exits 100 both for a mirror it could not reach and for a package that
        # does not exist; only its `E:` lines tell the two apart.
        fetch_failed() {
          grep -qE 'Temporary failure resolving|Could not resolve|Failed to fetch|Unable to fetch some archives' "${apt_err}"
        }

        # Bounded, advisory: a warning when it does not finish, never the verdict.
        apt_update() {
          local attempt
          update_status=0
          for attempt in 1 2; do
            update_status=0
            : >"${apt_log}"
            # -k: plain `timeout N` waits forever on a child that ignores SIGTERM.
            # shellcheck disable=SC2024 # the log is the runner's own file; sudo only elevates apt
            sudo timeout -k 30 "${APT_UPDATE_TIMEOUT}" apt-get update >>"${apt_log}" || update_status=$?
            [ "${update_status}" -eq 0 ] && return
            print_apt_log
            # 124 when apt-get honours the SIGTERM, 137 when the SIGKILL ends it.
            case "${update_status}" in
              124|137)
                echo "::warning::apt-get update attempt ${attempt} exceeded ${APT_UPDATE_TIMEOUT}s (exit ${update_status}); the Ubuntu mirror is slow or down, this is not the diff"
                reap_apt
                ;;
              *)
                echo "::warning::apt-get update attempt ${attempt} failed (exit ${update_status})"
                ;;
            esac
            wait_for_apt_locks
          done
          echo "::warning::#4163: apt-get update did not complete in 2 attempts; retrying the install against the lists already on the image."
        }

        update_status=0
        install_status=0
        refreshed=false
        for attempt in 1 2; do
          if [ "${refreshed}" = false ] && { [ "${APT_CACHE_HIT}" != true ] || [ "${attempt}" -eq 2 ]; }; then
            apt_update
            refreshed=true
          fi
          install_status=0
          : >"${apt_log}"
          : >"${apt_err}"
          # Keep-Downloaded-Packages so the cache save below finds the .debs.
          # shellcheck disable=SC2024 # as above
          sudo timeout -k 30 "${APT_INSTALL_TIMEOUT}" \
            apt-get install -y -q -o APT::Keep-Downloaded-Packages=true "${pkgs[@]}" \
            >>"${apt_log}" 2>>"${apt_err}" || install_status=$?
          cat "${apt_err}" >&2

          if [ "${install_status}" -eq 0 ]; then
            # The archive dir now holds every .deb the lists resolved to.
            echo "cacheable=true" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          print_apt_log
          case "${install_status}" in
            124|137)
              echo "::warning::apt-get install attempt ${attempt} exceeded ${APT_INSTALL_TIMEOUT}s (exit ${install_status}); the Ubuntu mirror is slow, this is not the diff"
              reap_apt
              wait_for_apt_locks
              demote_slow_mirror
              ;;
            *)
              if fetch_failed; then
                echo "::warning::apt-get install attempt ${attempt} could not download its packages (exit ${install_status}); the Ubuntu mirror is unreachable or the image's lists are stale"
                # A DNS outage often clears within a minute.
                if [ "${attempt}" -eq 1 ] && grep -qE 'Temporary failure resolving|Could not resolve' "${apt_err}"; then
                  sleep 60
                fi
              elif [ "${refreshed}" = true ]; then
                # apt said no against fresh lists: a retry would say the same.
                break
              else
                echo "::warning::apt-get install attempt ${attempt} failed (exit ${install_status}); refreshing the cached lists"
              fi
              ;;
          esac
        done

        infra() {
          echo "::error title=apt mirror (infra, not this diff)::AGARIC_APT_INFRA: $1 Ubuntu mirror problem, not this diff."
          {
            echo "### apt could not run (infra, not this diff)"
            echo
            echo "$1"
            echo "Marker: \`AGARIC_APT_INFRA\`. Step exit: \`75\` (EX_TEMPFAIL), deliberately not \`1\`."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit 75
        }

        case "${install_status}" in
          124|137) infra "apt-get install exceeded ${APT_INSTALL_TIMEOUT}s on its last attempt." ;;
        esac
        if fetch_failed; then
          infra "apt-get install could not download its packages in 2 attempts (exit ${install_status})."
        fi
        if [ "${update_status}" -ne 0 ]; then
          infra "apt-get update never completed and apt-get install then failed (exit ${install_status})."
        fi

        # The index refreshed and the install still failed: an ordinary failure,
        # reported with apt's own status.
        exit "${install_status}"

    - name: Save the .debs and the lists they were resolved from
      # Main saves for every PR to read; a branch dispatch saves too, readable
      # by that branch's next dispatch.
      if: >-
        steps.install.outputs.cacheable == 'true'
        && steps.plan.outputs.key != ''
        && steps.restore.outputs.cache-hit != 'true'
        && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          /var/cache/apt/archives/*.deb
          /var/lib/apt/lists/*_*
        key: ${{ steps.plan.outputs.key }}
