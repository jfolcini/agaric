name: Prepare apt
description: >-
  Make apt installs reliable on GitHub-hosted runners. The runner boots
  `unattended-upgrades` plus the `apt-daily` timers, which grab the dpkg lock at
  startup; an install that lands during that window queues behind a ~6-minute
  background job and can run out the 20-minute job budget during SETUP (the real
  root cause of the intermittent "Playwright timeout" — and the same stall that
  cancels the lint/cargo/mcp `apt-get` steps). This action stops those background
  jobs, waits for the lock to clear, and bounds download stalls so a slow mirror
  fails fast and retries instead of hanging.
runs:
  using: composite
  steps:
    - name: Prepare apt (disable background upgrades, wait for dpkg lock)
      shell: bash
      run: |
        set -euo pipefail

        # Bound apt download stalls: a hung mirror connection fails after 30s and
        # retries, instead of crawling at ~6 min/package with no timeout.
        # `Keep-Downloaded-Packages "true"` stops apt from deleting the .deb
        # archives after install so an `actions/cache` step on
        # /var/cache/apt/archives can persist them across runs (#1464) — the
        # slow part is the mirror download, not the dpkg install.
        sudo tee /etc/apt/apt.conf.d/99-ci-resilience >/dev/null <<'APT'
        Acquire::Retries "5";
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        APT::Keep-Downloaded-Packages "true";
        APT

        # Make the archive dir writable by the runner user (not just root) so the
        # `actions/cache` restore can populate it before the sudo `apt-get`
        # install reads the cached .debs, and the post-job save can read them
        # back. The .debs apt writes are world-readable (0644), so the save's tar
        # can include them even though they stay root-owned.
        sudo install -d -m 0777 /var/cache/apt/archives/partial
        sudo chmod 0777 /var/cache/apt/archives

        # Stop the background apt jobs that hold the dpkg lock at boot. Each is
        # best-effort (the unit may not exist on every image), hence `|| true`.
        sudo systemctl stop unattended-upgrades.service apt-daily.service \
          apt-daily-upgrade.service apt-daily.timer apt-daily-upgrade.timer \
          2>/dev/null || true
        sudo systemctl kill --kill-who=all apt-daily.service 2>/dev/null || true

        # Wait (≤180s) for any in-flight apt/dpkg process to release the lock.
        # `timeout` on the actual install only SIGTERMs its direct child, leaving
        # a grandchild `apt-get` holding the lock — so a hard wait here is what
        # actually lets a retry succeed.
        for _ in $(seq 1 60); do
          if ! sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock \
                 /var/lib/apt/lists/lock >/dev/null 2>&1; then
            break
          fi
          echo "waiting for apt/dpkg lock to clear…"
          sleep 3
        done

        # Repair any half-finished dpkg state a killed background job left behind.
        sudo dpkg --configure -a || true

        # ── #4115's Azure mirror rewrite lived here; #4163 REMOVED it ───────
        #
        # It ran `sed 's|https\?://archive\.ubuntu\.com/ubuntu|http://azure.
        # archive.ubuntu.com/ubuntu|g'` over /etc/apt/sources.list and
        # /etc/apt/sources.list.d/. Two independent things are wrong with it,
        # both read off production logs rather than reasoned about:
        #
        # 1. IT MATCHED NOTHING. The ubuntu-24.04 image points apt at a
        #    MIRRORLIST: the sources say `mirror+file:/etc/apt/apt-mirrors.txt`
        #    and the hostnames live in THAT file, which the sed never opened.
        #    The action's own self-check reported this and nobody read it. In
        #    job 95978698511 (`validate / cargo-tests (1)`, run 32223573172,
        #    06:29:44Z) and again 80 minutes later in job 95996544264
        #    (`validate / lint`, run 32229591417, 07:49:59Z) it printed
        #
        #        #4115: apt sources now name azure 0
        #        0 time(s)
        #
        #    i.e. zero matches — and the companion
        #    `::warning::#4115: non-Azure Ubuntu mirrors still in sources`
        #    never rendered in either job either, so `archive.ubuntu.com` was
        #    not in those files to begin with. Meanwhile the very next step in
        #    both jobs logged `Get:1 file:/etc/apt/apt-mirrors.txt Mirrorlist
        #    [144 B]` and then fetched from hosts named nowhere in what the sed
        #    scanned. A rewrite that edits neither the file apt reads nor any
        #    string apt used cannot have been the mitigation #4115 credited.
        #
        # 2. ITS PREMISE IS BACKWARDS TODAY. #4115 recorded "every Azure
        #    request completed while archive.ubuntu.com hung". On 2026-08-19 it
        #    was the other way round in every job examined. Counting host lines
        #    in job 95996544264: 68 `Ign` against `azure.archive.ubuntu.com`,
        #    and 8 successful `Hit`/`Get` against `archive.ubuntu.com`. Azure
        #    was the sick host; the public archive was the one that answered.
        #    So had the sed worked, it would have pinned apt to the dead mirror
        #    and deleted the fallback that was rescuing those runs.
        #
        # What actually recovers a stall is therefore the image's OWN
        # `mirror+file` failover, measured at T+62s from apt's first attempt to
        # the first byte off the fallback (job 95978698511: 06:29:46 start ->
        # 06:30:48 `Hit: https://archive.ubuntu.com noble InRelease`). Nothing
        # here should second-guess it.
        #
        # What replaces the rewrite is a DIAGNOSTIC. It changes no apt state;
        # it prints the mirror configuration so the next stall is readable
        # straight from the job log instead of being re-derived from scratch —
        # which is what the deleted self-check was for, except that this one
        # looks in the file the hostnames are actually in.
        echo "#4163: ubuntu mirror configuration apt will use —"
        if [ -r /etc/apt/apt-mirrors.txt ]; then
          sed 's|^|  apt-mirrors.txt: |' /etc/apt/apt-mirrors.txt || true
        else
          echo "  (no /etc/apt/apt-mirrors.txt — this image does not use a mirrorlist)"
        fi
        grep -rhoE 'https?://[A-Za-z0-9.-]*(archive|security)\.ubuntu\.com' \
          /etc/apt/sources.list /etc/apt/sources.list.d/ \
          /etc/apt/apt-mirrors.txt 2>/dev/null \
          | sort | uniq -c | sed 's|^|  host: |' || true
