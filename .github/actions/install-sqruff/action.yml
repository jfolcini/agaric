name: Install sqruff
description: >-
  sqruff from its upstream release, checked against pins.txt. taiki-e/install-action
  has no checksummed manifest for sqruff and would fall back to an unverified
  cargo-binstall download. Linux x86_64 only.

runs:
  using: composite
  steps:
    - name: Download and verify sqruff
      shell: bash
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/sqruff"
        mkdir -p "$dir"
        bash scripts/pins.sh fetch sqruff linux-x86_64 "$dir/sqruff.tgz"
        tar -xzf "$dir/sqruff.tgz" -C "$dir" sqruff
        # ~/.cargo/bin is already on PATH in every job that runs prek.
        install -m 0755 "$dir/sqruff" "$HOME/.cargo/bin/sqruff"
        sqruff --version >/dev/null
