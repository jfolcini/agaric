name: Stop PR CI

# Called by a `stop-after-<job>` job, which starts only once <job> has failed
# on a pull request: cancels every unfinished workflow run of the PR's head
# commit, bar the ones named below, the caller's own run last, so one red job
# stops the PR's other jobs instead of letting them run to the end. A job of
# its own rather than a step in the failing job, because cancelling the run
# from inside that job would turn its red into `cancelled`.

on:
  workflow_call:
    inputs:
      failed-job:
        description: The job whose failure stops the PR's CI, named in the notice.
        required: true
        type: string

permissions: {}

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      # The Claude workflows are left running: the review judges the code, not
      # CI, and a new push re-runs it anyway. So is DCO: it takes seconds, and
      # a run cancelled while queued needs a manual re-run. Every API failure
      # is a warning, never a failure: a fork or Dependabot PR's token is
      # read-only, and a run may finish between the listing and its cancel.
      # The failed job already carries the red.
      - name: Cancel the PR's unfinished workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OWN_RUN: ${{ github.run_id }}
          FAILED_JOB: ${{ inputs.failed-job }}
        run: |
          set -euo pipefail
          if ! runs=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=100" --jq '
            .workflow_runs[]
            | select(.status != "completed" and (.id | tostring) != env.OWN_RUN)
            | select(.path | test("/(claude|claude-code-review|dco)\\.yml(@|$)") | not)
            | "\(.id) \(.name)"'); then
            echo "::warning::Could not list the workflow runs of $HEAD_SHA."
            runs=''
          fi
          cancelled=''
          while read -r id name; do
            [ -n "$id" ] || continue
            if gh api -X POST "repos/$REPO/actions/runs/$id/cancel" > /dev/null; then
              cancelled="$cancelled${cancelled:+, }$name"
            else
              echo "::warning::Could not cancel $name (run $id)."
            fi
          done <<< "$runs"
          echo "::notice::$FAILED_JOB failed, so this PR's CI stops: cancelled ${cancelled:-no other run}, then this run."
          gh api -X POST "repos/$REPO/actions/runs/$OWN_RUN/cancel" > /dev/null \
            || echo "::warning::Could not cancel this run ($OWN_RUN)."
