name: Open-PR file overlap (informational)

# #3672 step 1 — two PRs green in isolation can land a red `main`, and nothing
# in the pipeline knows the two exist at the same time.
#
# On 2026-08-09 six pull requests were open simultaneously and the overlap
# between them had to be computed BY HAND with `gh pr view --json files` and
# `comm`. Before that table existed it had already bitten: #3724 re-anchored
# `src-tauri/dynamic-sql-baseline.txt` from a base predating #3717's merge, was
# green on every check, and merged would have left `main` red on a guard for a
# change neither PR made incorrectly. It was caught only because a human merged
# `origin/main` into the branch and re-ran the guard on the combined tree.
#
# This lane posts that table automatically. It is the cheapest item on #3672's
# list on purpose: a checkout, a `gh pr list` and one `node` invocation — no
# build, no test suite, no Rust. It does NOT verify the merge result, which is
# steps 2 and 3 of that issue and costs real CI time.
#
# ─── This lane must never gate a merge ──────────────────────────────────────
#
# It reports a fact a human has to weigh (an overlap is a reason to re-run, not
# a defect), so a red here would be permanent unactionable red of exactly the
# kind #3350 argues turns a gate into something people learn to bypass. The
# workflow name is deliberately NOT in any required-check list — see
# `.github/workflows/branch-protection-assert.yml` — the comment step is
# `continue-on-error` because a fork PR's GITHUB_TOKEN is read-only, and the
# step summary is written unconditionally as the durable copy.
#
# ─── #3967 — the compute/post split ──────────────────────────────────────────
#
# The #3672 adversarial review flagged the original single `overlap` job:
# it held `pull-requests: write` (to post the sticky comment) in the SAME job
# that checked out this PR's own commits — a `pull_request` checkout is
# `refs/pull/N/merge`, which for a fork PR is code the fork author controls.
# Running fork-authored code in a job that also holds a write-scoped token is
# the arrangement where a malicious PR can reach the token. It was not live —
# GitHub issues a READ-ONLY `GITHUB_TOKEN` for a `pull_request` run from a
# fork, regardless of what `permissions:` asks for — but that mitigation lives
# entirely in GitHub's defaults, not in this file, and survives only until the
# trigger changes to `pull_request_target` (which gets no such downgrade) or
# a PAT gets added. A comment cannot enforce that it doesn't; see
# `check-pr-overlap-trust-boundary.mjs` below for the guard that does.
#
# So the job is split by trust level instead of relying on the default:
#
#   * `compute` — the UNTRUSTED half. Checks out this PR's own commits
#     (`refs/pull/N/merge`, fork-controlled for a fork PR), `permissions:
#     contents: read` (no write scope of any kind), NO `GH_TOKEN` anywhere in
#     its environment. It can only compute facts
#     from git history already on disk and write them to a file; it has
#     nothing to exfiltrate and no token to exfiltrate it with. Its one job:
#     the base-divergence half (`scripts/pr-overlap-diverged.sh`), which needs
#     the actual PR branch's commit graph and cannot be done any other way.
#     Uploads its result as an artifact — DATA, not a script, not a token.
#
#   * `post` — the TRUSTED half. Holds `pull-requests: write` (to post/PATCH
#     the sticky comment). Never checks out this PR's commits: its checkout
#     step below pins `ref: ${{ github.event.pull_request.base.sha }}` — a
#     commit on the BASE branch, not attacker-controlled — specifically so it
#     gets `scripts/pr-file-overlap.mjs` from the trusted base repo rather
#     than from whatever version a fork PR shipped. It gets the OPEN-PR file
#     lists straight from `gh pr list` (GitHub's own computation of what each
#     PR touched, not code any PR author runs), and it gets `compute`'s
#     divergence result from the artifact `compute` uploaded.
#
#     That artifact is UNTRUSTED INPUT: `compute` ran with no token, but it
#     still executed whatever `scripts/pr-overlap-diverged.sh` a fork PR's own
#     checkout shipped, so its output is attacker-influenced text, not a
#     verified fact. `post` never lets it near a shell: the download step only
#     produces a FILE (`artifact/diverged.txt`), which is passed to
#     `node scripts/pr-file-overlap.mjs` as a `--diverged-from <path>` CLI
#     argument — the filename, not the content — and the script reads and
#     parses that file itself (`readFileSync` + line-split), the same way it
#     already treats `prs.json`. Nothing in this workflow's `run:` steps
#     string-interpolates the artifact's content into a shell command or a
#     comment body; the comment body is built by `node` and posted with
#     `gh api -F body=@overlap.md`, which reads the file directly rather than
#     expanding it on a command line.
#
# ─── Trade-off: `post` analyses `pr-file-overlap.mjs` from BEFORE this PR ──
#
# Because `post`'s checkout is pinned to `base.sha` (above), a PR that edits
# `scripts/pr-file-overlap.mjs` itself — including its `RATCHET_PATTERNS` —
# is analysed by the PRE-CHANGE version of that script, not the version the
# PR ships. That includes `ratchets` and `basechanged`, the two outputs
# `merge-result` below gates on: a PR editing the ratchet-detection logic is
# judged by the old logic, on itself. Deliberate — the alternative is running
# a fork PR's own script with a write-scoped token, which is the exact
# arrangement #3967 removed — but worth stating plainly since this file
# otherwise documents every trade-off of this kind.
#
# `merge-result` below is unaffected by this split — it already ran with
# `permissions: contents: read` only, no write scope and no comment step, so
# it never had the arrangement #3967 is about; it now simply depends on `post`
# instead of the old single `overlap` job for the two outputs it gates on.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-overlap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # compute — the UNTRUSTED half (#3967). Checks out this PR's own commits;
  # `permissions: contents: read` (no write scope) and no `GH_TOKEN` anywhere
  # below, so there is nothing here for fork-authored code in that checkout
  # to reach for. Not `permissions: {}` — see the job's own comment.
  # ─────────────────────────────────────────────────────────────────────────
  compute:
    runs-on: ubuntu-24.04
    # `contents: read`, not `{}`: `actions/checkout` authenticates its clone
    # with `github.token` regardless of the `permissions:` block, and zero
    # scopes only happens to work because this repo is PUBLIC (unauthenticated
    # clone of a public repo succeeds). On a private repo `permissions: {}`
    # 403s the checkout — and that failure is exactly the silent one this PR
    # is about: `compute` fails, `if-no-files-found: warn` means no error, no
    # artifact, `post` still runs under `!cancelled()`, and the divergence
    # half reports "not computed" forever while the lane stays green.
    # `contents: read` has the identical security property this job cares
    # about — the hazard #3967 removed is a WRITE-scoped token sharing a job
    # with fork-authored code, and that stays absent either way — without
    # coupling correctness to the repo's visibility setting.
    permissions:
      contents: read
    # Generous ceiling on a job whose real cost is seconds; if this ever fires,
    # something is retrying an API call, not computing an overlap.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the divergence half needs a merge base between this
          # branch and the base branch, and `pull_request` otherwise checks out
          # a depth-1 merge commit with nothing to compare against. Measured on
          # this repo's mutation lane, which already does this: 7–8s.
          #
          # No `ref:` override — the `pull_request` event's own default
          # (`refs/pull/N/merge`) is exactly the fork-authored content this
          # job needs to diff against, and is why this job carries NO token:
          # see `check-pr-overlap-trust-boundary.mjs`, which fails if this
          # trigger ever becomes `pull_request_target` while a checkout here
          # still resolves to PR head content.
          fetch-depth: 0
          persist-credentials: false

      - name: Compute this branch's divergence from main
        id: diverged
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The PR's own head, NOT the `refs/pull/N/merge` commit the runner
          # has checked out. See `scripts/pr-overlap-diverged.sh` — the merge
          # ref's first parent is the base tip, so deriving the merge base
          # from HEAD compares the base branch with itself.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # What the base branch has changed since this branch forked off it.
          # This is the half that catches the #3724 near-miss: #3717 had
          # already MERGED when #3724 opened, so no table over open pull
          # requests could ever have paired the two, and the thing that was
          # actually wrong is that #3724's base predated it.
          #
          # The computation lives in a script with its own `--self-test`
          # because the four lines that used to be here were wrong in a way
          # nothing could see: they took the merge base from HEAD, which on a
          # `pull_request` checkout is `refs/pull/N/merge` whose FIRST PARENT
          # IS THE BASE TIP, so the diff was `git diff X X` — empty on every
          # run, and rendered as an affirmative "None".
          #
          # Write to a temp file and `mv` only on success. `if cmd > file`
          # leaves an EMPTY file behind when `cmd` fails, and an empty file is
          # a real answer here ("nothing diverged") — so the failure would
          # again arrive as reassurance. Exit 0 means computed, and the file
          # exists; non-zero means not computed, and it must not.
          rm -f diverged.txt diverged.tmp
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_REF" || true
          fi
          # No `computed=true`/`false` written to $GITHUB_OUTPUT here: this
          # job declares no `outputs:` block and nothing ever read
          # `steps.diverged.outputs.computed` (the #4005 review removed a
          # job output from this same file for the same reason — presence of
          # `diverged.txt` itself, checked by `post` below, is already the
          # live signal).
          if bash scripts/pr-overlap-diverged.sh "$BASE_REF" "$HEAD_SHA" > diverged.tmp; then
            mv diverged.tmp diverged.txt
          else
            echo "divergence not computed; the post job's comment will say so" >&2
            rm -f diverged.tmp
          fi

      - name: Upload the divergence result
        # No token, so this is the only way `post` (below) learns anything
        # this job computed. `diverged.txt` is DATA — a list of paths — never
        # a script and never executed; `post` treats even that as untrusted
        # (see this file's own header). `if-no-files-found: warn`, not
        # `error`: "not computed" is a real, tolerated outcome (the step
        # above already logged why), not a failure of this job.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-overlap-diverged-${{ github.event.pull_request.number }}
          path: diverged.txt
          if-no-files-found: warn
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────
  # post — the TRUSTED half (#3967). Holds `pull-requests: write`; never
  # checks out this PR's own commits — see the checkout step below.
  # ─────────────────────────────────────────────────────────────────────────
  post:
    needs: compute
    # `!cancelled()`, not `always()`: this workflow sets
    # `concurrency.cancel-in-progress: true` above, and `always()` also fires
    # on a run that was CANCELLED (superseded by a newer push), which would
    # let this job post a comment for a stale head. `!cancelled()` still runs
    # despite `compute` failing outright (its own steps are already tolerant
    # of "not computed"; a hard failure — e.g. the checkout itself — should
    # still let this job post the open-PR table with the divergence section
    # reading "not computed", same as before this job existed). Same
    # reasoning `merge-result` below applies to its own `needs:`.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      overlaps: ${{ steps.overlap.outputs.overlaps }}
      ratchets: ${{ steps.overlap.outputs.ratchets }}
      # #3979: every path `main` has changed since this branch's merge base,
      # UNFILTERED by whether this branch touches any of them. See
      # `merge-result`'s own comment for why `diverged` (filtered to shared
      # paths) alone let the gate skip the exact case it exists for.
      basechanged: ${{ steps.overlap.outputs.basechanged }}
    permissions:
      contents: read
      # Posting the informational comment. Read-only on fork PRs, which is why
      # the comment step is `continue-on-error` — kept even though this job no
      # longer checks out fork-authored code, since GitHub's fork downgrade is
      # unconditional on `pull_request` and costs nothing to keep relying on
      # in addition to (not instead of) the structural split #3967 made.
      pull-requests: write
    steps:
      - name: Checkout the TRUSTED script source
        # MUST run before the artifact download below, not after: this is a
        # fresh job with no pre-existing checkout, so `actions/checkout` finds
        # no `.git` in the workspace and takes its "recreate" path, which
        # deletes every entry the workspace directory already contains before
        # cloning — `git-directory-helper.ts`'s `prepareExistingDirectory()`,
        # `remove = true` because `!directoryExistsSync(path.join(repositoryPath,
        # '.git'))`, then `for (const file of await fs.readdir(repositoryPath))
        # await rmRF(...)`. Downloading the artifact FIRST, as an earlier
        # revision of this job did, means this step silently deletes
        # `diverged.txt` before the step below ever reads it — every run then
        # reports the base-divergence half as "not computed", the exact #3724
        # near-miss signal this workflow exists to carry, even on a run where
        # `compute` uploaded a real result. Checking out first means the
        # artifact download below lands in an already-populated (by this
        # step, not by leftover job state) directory that `download-artifact`
        # only adds to, never cleans.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `ref:` pinned to the BASE branch commit GitHub recorded for this
          # PR — a commit in THIS repo's own history, never the fork's. This
          # is the one line that makes the split real: without it, the
          # `pull_request` event's default checkout here would still resolve
          # to `refs/pull/N/merge` (fork content) even though this job holds
          # a write-scoped token, reintroducing the exact combination #3967
          # removed. `check-pr-overlap-trust-boundary.mjs` polices the
          # trigger side of that; this `ref:` is the checkout side.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Download the divergence result
        id: download-diverged
        # Best-effort: `compute` may not have uploaded at all (e.g. its
        # checkout step itself failed), and that must not fail THIS job —
        # same tolerance the inline script below already applies to a missing
        # `diverged.txt`. Runs AFTER the checkout above — see that step's own
        # comment for why the order is load-bearing, not cosmetic.
        #
        # `path: artifact/`, not `.`: the checkout above just populated the
        # workspace root with the TRUSTED tree this job runs
        # `scripts/pr-file-overlap.mjs` from. Extracting the artifact into a
        # separate subdirectory means the "post gets its script from the
        # trusted base repo" invariant this file's header asserts is
        # enforced by LAYOUT — `compute`'s untrusted data can only ever land
        # under `artifact/`, never overwrite anything under `scripts/` —
        # rather than by `compute`'s upload `path:` alone.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-overlap-diverged-${{ github.event.pull_request.number }}
          path: artifact/

      - name: Compute the overlap against every other open PR, and render
        id: overlap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # Every open PR including this one; the script filters `--pr` out.
          # A failed read writes `[]`, which the script renders as "could not
          # be computed" rather than as "no overlap" — the distinction this
          # whole issue is about. This is GitHub's OWN computation of each
          # PR's changed files (the `gh pr list --json files` API), not code
          # any PR author runs, so it needs no special handling as untrusted
          # input the way `artifact/diverged.txt` below does.
          if ! gh pr list --repo "$REPO" --state open --limit 50 \
              --json number,title,files > prs.json; then
            echo '[]' > prs.json
          fi

          # `artifact/diverged.txt`, if `compute` produced one, is UNTRUSTED:
          # it was written by a script `compute` read out of this PR's own
          # (possibly fork-authored) checkout, running with no token but
          # still capable of writing arbitrary text to its stdout. It is
          # passed here as a FILENAME only — `pr-file-overlap.mjs` reads and
          # line-splits the file itself — never expanded into this shell
          # script or into the comment body via string interpolation. It
          # lives under `artifact/`, not the checkout root, so it can never
          # collide with (or, on some other future edit, overwrite) anything
          # under `scripts/` — see the download step's own comment.
          args=(--pr "$PR_NUMBER" --prs prs.json --comment-body overlap.md)
          [ -f artifact/diverged.txt ] && args+=(--diverged-from artifact/diverged.txt)
          node scripts/pr-file-overlap.mjs "${args[@]}"
          cat overlap.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        # Best-effort by design, exactly as `mutation-pr.yml`'s comment step:
        # a fork PR's GITHUB_TOKEN is read-only, and the step summary above
        # carries the same content.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          [ -s overlap.md ] || exit 0
          # Sticky: edit this lane's own previous comment rather than adding one
          # per push. Matched on the marker AND on authorship — the marker is
          # plain text in the body, so a human quoting this comment in a reply
          # would otherwise own a comment this step PATCHes forever.
          marker='<!-- pr-file-overlap -->'
          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\") | select(.body | contains(\"$marker\"))] | .[-1].id // empty" | tail -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@overlap.md >/dev/null
            echo "updated existing comment $existing"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@overlap.md >/dev/null
            echo "posted a new comment"
          fi

  # ---------------------------------------------------------------------------
  # merge-result (#3672 steps 2/3) — the part `compute`/`post` above
  # deliberately do not do: actually verify the MERGE RESULT, not just report
  # which files two PRs touch.
  #
  # Gated on `ratchets`/`basechanged`, NOT on `overlaps` (any shared file). An
  # ordinary shared file is "a fact a human has to weigh" (see the `post` job's
  # own header above) — this lane must not manufacture unactionable red over
  # it, same reasoning #3350 argues for that job itself. `ratchets` IS a
  # whole-tree-ratchet-only count (`pr-file-overlap.mjs`'s `ratchetCount`).
  #
  # `basechanged` (#3979 fix; `pr-file-overlap.mjs`'s `baseChangedCount`) is
  # every path `main` has changed since this branch's merge base, deliberately
  # UNFILTERED by whether this branch touches any of them. This job used to
  # gate on `diverged` instead — `divergedFiles.length`, the mine-FILTERED
  # subset — and that let it skip the exact case it exists for: a ratchet is a
  # whole-tree invariant, so a `.rs` file the base adds under a crate root can
  # break `check-dynamic-sql` without this branch sharing one path with it.
  # Then `ratchets=0` (no open-PR overlap either) and `diverged=0` (the added
  # file is in nobody's "mine" set), and the job never ran — even though the
  # merged tree is exactly the tree nobody built, which is the whole premise
  # of this job. #3979 reproduced it: a base commit adding an unrelated `.rs`
  # file, a PR touching nothing near it, `ratchets`/`diverged` both `0`, the
  # job skipping; after `basechanged` replaced `diverged` in this condition,
  # the same fixture runs the job and it catches a planted ratchet violation
  # in the base-only file. Over-triggering is the safe direction — this job
  # runs on some base movement that turns out not to touch a ratchet file, at
  # the cost of a checkout and six guard invocations (three Python, two bash,
  # one node — see `merge-result`'s own header), never the reverse — so
  # `basechanged` is left as "any base movement" deliberately rather than
  # narrowed to a ratchet-only count `pr-file-overlap.mjs` does not compute
  # yet (it would need to scan `main`'s diverged set with `isRatchetFile`,
  # unfiltered by "mine", which is a `pr-file-overlap.mjs` change of its own).
  # `diverged` itself is left in `pr-file-overlap.mjs`'s own script output —
  # the sticky PR comment reads it there, in-process, via `renderComment()`,
  # not through this workflow's job outputs — but it is not re-exported as a
  # job output of the `post` job (#4005 review): `divergedFiles` is by
  # construction a subset of the unfiltered set `basechanged` counts, so
  # `diverged != '0'` can never be true while `basechanged == '0'`, and
  # nothing in this workflow ever read the job output anyway. Not exporting
  # it here removes a class of reasoning about which gate is correct, which
  # given this job's whole history of gates reasoned wrong is worth something
  # on its own.
  #
  # A whole-tree RATCHET file overlapping or diverging is different in kind
  # from an ordinary shared file: both branches can hold a self-consistent
  # version and the MERGE still be wrong (the #3724 near-miss), which is a
  # claim this job can actually TEST — build the merge fresh and run the
  # guards that police ratchet files against it — rather than merely flag
  # for a human to re-derive.
  #
  # This is therefore the first thing in this repo's CI that verifies a
  # merge RESULT rather than a branch. It is deliberately narrow: no Rust
  # toolchain, no node_modules — `scripts/pr-merge-result-check.sh` runs the
  # six whole-tree ratchet guards against a disposable worktree: the
  # stdlib-only Python trio that shares the five-crate-root scan (#3107),
  # two bash guards (unsafe-allowlist, migrations-immutable) and one node
  # guard (tauri-import-baseline, which imports nothing beyond the stdlib
  # and its sibling scripts/lib/js-scanner.mjs, so it needs no
  # node_modules either) — #3978. Running the FULL `prek
  # --all-files` here (#3672 comment 3's step 3, in full) needs the whole
  # toolchain this lane deliberately does not carry; see that script's own
  # header for the scoping rationale and how to extend it.
  #
  # This job was already unaffected by #3967: it has always run with
  # `permissions: contents: read` only (no write scope, no comment step), so
  # it never carried the write-token-plus-fork-checkout arrangement that
  # issue removed from `overlap` (now `compute`/`post`). It depends on `post`
  # below purely for the two outputs it gates on.
  #
  # What this does NOT do: gate a merge on its own — it is not in the
  # required-check list, so a red here is visible on the PR but not enforced.
  #
  # It is worth being precise about WHY that matters, because the obvious
  # reading is wrong. `gh api repos/<owner>/<repo>/branches/main/protection`
  # returns 404, and that 404 does NOT mean `main` is unprotected: it is the
  # LEGACY endpoint and it cannot see rulesets. `main` is protected by a
  # ruleset — the one `branch-protection-assert.yml` in this same directory
  # already asserts against drift — with required contexts `validate-all` +
  # `dco` AND `strict_required_status_checks_policy: true`, i.e. GitHub's
  # "require branches to be up to date before merging" is already ON, and
  # `validate-all` runs `prek run --all-files` (ratchet guards included) on
  # the up-to-date tree.
  #
  # So this job is not the missing enforcement. The residual gap is the
  # ruleset's `bypass_actors` entry for the built-in `admin` role with
  # `bypass_mode: always`, combined with this repo's habit of merging via
  # `gh pr merge --admin` (named in #3672's own body): an admin merge skips
  # both the required checks and the freshness rule, and no non-required job
  # can change that. What this job buys is a cheap ratchet verdict ON the PR,
  # in seconds rather than a rebase plus a ~15-minute re-run, before anyone
  # reaches for `--admin`. Closing the gap itself is a merge-policy decision
  # (don't `--admin`, or narrow `bypass_actors`), not a script — see #3672.
  #
  # One more wrinkle in the same spot: this job's own trigger set (`opened`,
  # `synchronize`, `reopened`, `ready_for_review` — see the top of this
  # file) means the green "merge result verified" shown on the PR is fresh
  # only as of the LAST PUSH, not as of the merge click. An ordinary merge
  # is covered anyway — `strict_required_status_checks_policy` forces a
  # re-push (and therefore a re-run of this job) if `main` moves in between
  # — but the `--admin` bypass named above skips that re-push requirement
  # too, so it is exactly the case this job's verdict can go stale on
  # without anything re-running it. Not a claim this job cannot support
  # fixing on its own; a fact about how fresh its green actually is on the
  # one merge path where it matters most.
  merge-result:
    needs: post
    # `basechanged` is a count, or the literal `unknown` when
    # pr-overlap-diverged.sh could not compute it. `unknown` must TRIGGER this
    # job, not exempt it: the #3724 shape has no open-PR overlap at all
    # (#3717 had already merged when #3724 opened), so `ratchets` is 0 for it
    # and the base-divergence half is the only thing that would fire. Excluding
    # `unknown` meant a failure in the divergence script silently switched the
    # merge-result lane off for exactly the case it exists for. Running it
    # costs a checkout, six guard invocations (three Python, two bash, one
    # node — see below) and, since #4078, an `npm ci` + `npm run typecheck`;
    # see `timeout-minutes` below for the measured total. Not running it costs
    # the incident — twice now, #3724 in a ratchet and #4074×#4075 in ordinary
    # TypeScript.
    #
    # `!cancelled()` is load-bearing, not decoration: WITHOUT it, `needs:
    # post` alone means any FAILURE in `post` (it is deliberately
    # non-required, and its red is tolerated by design — see its own header)
    # skips this job entirely, silently, rather than evaluating the
    # condition below. That is the exact "reported nothing while looking
    # like it ran" shape the rest of this PR exists to close, one job edge
    # away from the cases already fixed inside `pr-merge-result-check.sh`
    # itself. `needs.post.outputs.*` still reads as empty-string (not
    # `'0'`) when `post` failed before writing outputs, and the `!= '0'`
    # gate below already treats that as "run" — same as the `unknown` case
    # above.
    #
    # `always()` (used here in an earlier revision) is the wrong primitive
    # for that: it ALSO fires when the WORKFLOW RUN itself was cancelled,
    # not only when a dependency job failed — and this workflow sets
    # `concurrency.cancel-in-progress: true` (top of this file), so a rapid
    # second push cancels the in-flight run for the FIRST push, whose
    # `merge-result` job `always()` would then still start against the now
    # STALE head. `!cancelled()` keeps the "run despite post's tolerated
    # failure" behaviour above without also resurrecting a superseded run.
    if: |
      !cancelled() && (
        needs.post.outputs.ratchets != '0' ||
        needs.post.outputs.basechanged != '0'
      )
    runs-on: ubuntu-24.04
    # Measured, not estimated. Before #4078 this job ran 23-25 s (two sampled
    # runs on this repo): a checkout, one `git merge`, six short guard
    # invocations (three Python, two bash, one node). #4078 adds Node setup
    # (5-8 s with the setup-node npm cache warm), `npm ci` (16-21 s across
    # three sampled `_validate.yml` runs) and a cold `npm run typecheck`
    # (7-8 s across two sampled runs) — call it ~35 s, for a job around
    # 55-65 s. The 10-minute ceiling is untouched and still generous, for the
    # same reason as `compute`'s: a ceiling is for a pathological runner, not
    # for the measured case.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: scripts/pr-merge-result-check.sh needs the base
          # branch's commit graph to build a real merge, and the PR head's
          # too. Same rationale as `compute`'s checkout above.
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the base branch, fresh, right now
        # The entire point (#3672): not whatever `main` was when THIS
        # workflow run started, but `main` as of this instant — the base a
        # merge click would actually use.
        #
        # `|| true`, matching the tolerant equivalent above in `compute`
        # (line 184): this runs after `persist-credentials: false`, so it is
        # an anonymous fetch with no fallback credential if the repo is
        # ever made private — a bare failure here would turn permanently red
        # with no diagnostic, on every PR, forever. `fetch-depth: 0` on the
        # checkout above has already populated `origin/<base>` as of when
        # THAT step ran; this fetch only buys the last few seconds between
        # checkout and this step, which is a much smaller gap than the
        # multi-minute-to-hours one #3672 exists to close. Losing that last
        # sliver of freshness on a rare fetch failure is a better trade than
        # this job going red for a reason its own log cannot explain.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --quiet --no-tags origin "$BASE_REF" || true

      # #4078 — the typecheck half needs an install. It is done ONCE, here,
      # in the job checkout, and BORROWED by the merged worktree the script
      # builds (scripts/pr-merge-result-check.sh's `provision_node_modules`
      # symlinks this install's top-level entries in, ~0.03 s). Installing
      # inside the merged worktree instead would pay `npm ci` a second time
      # for a tree that is, for a `pull_request` event, all but identical to
      # this checkout: `actions/checkout` with no `ref:` gives us
      # `refs/pull/N/merge`, and the script's tree is the same head merged
      # onto a base fetched seconds later. The script compares the two
      # lockfiles and re-installs itself in the rare case they disagree.
      - name: Install Node.js
        # Same pinned action and same Node major as every other lane in
        # _validate.yml — a merge-result typecheck that ran on a different
        # Node than the gate would be answering a different question.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        # `.npmrc` sets `ignore-scripts=true` repo-wide (#816) — but the copy IN
        # FORCE here is the MERGED tree's own: this checkout has no `ref:`, so
        # it resolves to `refs/pull/N/merge`, and a PR can edit `.npmrc` to set
        # `ignore-scripts=false` before this step ever runs. That is not NEW
        # exposure — not a guarantee this comment alone can make — the job
        # already executes PR-authored code elsewhere: the merged tree's own
        # guard scripts (python3/bash/node), and now, since #4078, its
        # `package.json`'s `typecheck` script, which is an arbitrary command.
        # It holds only `contents: read`, sets `persist-credentials: false`,
        # and references no secrets (see the trust-boundary guard,
        # scripts/check-pr-overlap-trust-boundary.mjs). #3967 is recent enough
        # that a false reassurance in this file is worth correcting (#4169).
        #
        # #4169 follow-up 1: every OTHER failure mode in this lane routes
        # through pr-merge-result-check.sh and renders a "Merge-result check:
        # VERIFIED NOTHING" summary. A bare `run: npm ci` did not — a registry
        # blip, an engine-strict rejection, or a lockfile npm cannot install
        # turned this job red at a step with no summary at all, one step
        # upstream of the script that exists to model exactly that gap. Wrapped
        # so an install failure renders through the same contract instead of
        # bypassing it.
        run: |
          if ! npm ci; then
            {
              echo "### Merge-result check: VERIFIED NOTHING"
              echo
              echo "\`npm ci\` failed in this job's own checkout — a registry blip, an"
              echo "engine-strict rejection, or a lockfile npm could not install. The merge"
              echo "result was never computed: this is a runner-side gap, not a verdict on"
              echo "the PR. See the npm error in the job log above; fix the runner or the"
              echo "PR's dependencies, then re-run."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::pr-merge-result-check: npm ci failed — verified nothing, see #4169"
            exit 1
          fi

      - name: Verify the merge result (ratchet guards + typecheck)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          # The PR's own head, not the `refs/pull/N/merge` ref this checkout
          # step actually landed on — same reason as `compute`'s HEAD_SHA.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # `run:` executes under GitHub's default shell — `bash --noprofile
          # --norc -e -o pipefail {0}` — so a BARE invocation of a script that
          # exits non-zero aborts the step before the next line runs. Written
          # as `cmd` then `rc=$?`, every branch below except the exit-0 one was
          # dead code: an exit 1 lost its `::error::` and its summary, and an
          # exit 2 ("not computed") became an unexplained red. `|| rc=$?` is
          # the -e-safe capture, and the script's --self-test asserts this
          # exact line still reads that way.
          rc=0
          bash scripts/pr-merge-result-check.sh "$BASE_REF" "$HEAD_SHA" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "Merge result verified: the ratchet guards pass AND the tree type-checks" \
              "on the ACTUAL merge of $BASE_REF (fetched fresh) and this PR's head." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$rc" -eq 2 ]; then
            {
              echo "### Merge-result check: not computed"
              echo
              echo "The merge hit a real textual conflict (GitHub's own merge check"
              echo "already owns that case). This is the ONLY not-computed case left —"
              echo "everything else that used to share this code is now exit 3, below,"
              echo "and treated as a failure. See the job log above for the conflict."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::warning::pr-merge-result-check: not computed — a real textual conflict, see the job log"
          elif [ "$rc" -eq 3 ]; then
            # Distinct from 2 on purpose: 2 is "this merge is not mine to
            # judge" (a real textual conflict — the ONLY exit-2 case), 3 is
            # "I judged nothing": base/head could not be resolved, `mktemp`
            # or `git worktree add` failed on this runner, a guard is
            # missing from the merged tree, no .rs file exists under any
            # known crate root, no python3 — or (#4078) the typecheck half
            # could not run: nothing to borrow a `node_modules` from, or a
            # merged tree carrying no `package.json`, no `typecheck` script
            # or no `tsconfig.json`. All of these used to exit 0,
            # or shared exit 2 with the genuine conflict case and rendered
            # as a `::warning::` on an otherwise GREEN job — a runner-side
            # failure that verified nothing reporting the lane as passing.
            {
              echo "### Merge-result check: VERIFIED NOTHING"
              echo
              echo "The check could not run: base/head could not be resolved, \`mktemp\`"
              echo "or \`git worktree add\` failed on this runner, a guard named in"
              echo "\`RATCHET_GUARDS\` is absent from the merged tree, no \`.rs\` file exists"
              echo "under any crate root the script knows about, python3 is unavailable,"
              echo "or the typecheck half had nothing to run (#4078: no installed"
              echo "\`node_modules\` to borrow, or a merged tree with no \`package.json\`,"
              echo "no \`typecheck\` script or no \`tsconfig.json\`). This is not a pass —"
              echo "see the job log for which, and fix the script or the runner rather"
              echo "than the PR."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::pr-merge-result-check: verified nothing — the check itself is broken"
            exit 1
          elif [ "$rc" -eq 4 ]; then
            # #4078. Its own branch rather than falling into the `else`
            # below, which would tell the author a ratchet guard failed and
            # send them to `prek --all-files` — an instrument that cannot
            # reproduce a TS2304 and a lane they have learned reports
            # ratchet noise. The remedy is the same shape, the diagnosis is
            # not, and a wrong diagnosis on a real finding is how the
            # finding gets ignored.
            {
              echo "### Merge-result check: THE MERGE DOES NOT TYPECHECK"
              echo
              echo "The #4078 shape (two PRs edit disjoint hunks of the same file, one"
              echo "deletes a symbol the other starts using, git merges them with no"
              echo "conflict). Every ratchet guard passed, so no OTHER guard in this"
              echo "lane would have reported it before it became \`main\`."
              echo
              echo "Only the merge is type-checked here. If \`validate / typecheck\` is"
              echo "also red on this PR, the head is broken on its own and the merge is"
              echo "not what to look at first."
              echo
              echo "Merge \`$BASE_REF\` into this branch and run \`npm run typecheck\`;"
              echo "the tsc diagnostics are in the job log above."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::pr-merge-result-check: the merge result does not typecheck — see #4078"
            exit 1
          else
            {
              echo "### Merge-result check: FAILED"
              echo
              echo "A ratchet guard that BOTH branches pass alone fails on their actual"
              echo "merge — the #3724 near-miss. Merge \`$BASE_REF\` into this branch and"
              echo "re-run \`prek --all-files\` before merging; see the job log above for"
              echo "which guard and which file."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::pr-merge-result-check: a ratchet guard fails on the merge result — see #3672"
            exit 1
          fi
