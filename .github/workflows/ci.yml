name: CI

on:
  # Push to main is the post-merge sanity check (linux smoke + android).
  # Feature-branch CI runs through the pull_request trigger below — this
  # keeps GitHub from dispatching two parallel workflow runs on the same
  # SHA every time a feature branch is pushed while its PR is open, and
  # gives outside-contributor forks a CI signal (push events from forks
  # don't trigger workflows in the parent repo).
  #
  # Tag pushes are handled by release.yml (which owns the full
  # macOS/Windows/Android matrix and produces shippable artifacts).
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
    branches: [main]

# Cancel an in-flight CI run when a new push lands on the same ref. On a PR
# branch that is unambiguously right: a push-then-fix cycle supersedes its own
# earlier run and only the latest head is interesting.
#
# ─── Why `main` is excluded (#3672) ─────────────────────────────────────────
#
# The paragraph that used to be here argued the same cancellation was safe on
# `main`, on the grounds that main CI is a post-merge sanity check and "the
# latest state always is" validated. The second half of that sentence is the
# part that stopped being true, and it is measurable: on 2026-08-09, five PRs
# merged in about 45 minutes and the run history shows FOUR consecutive
# cancelled main runs — 91022aaeb, a650ab4de, 4ccac145b, 23776e853 — with the
# last main CI to actually COMPLETE being 4f2efb1bf, before all of them. Across
# the whole day, 31 of 47 main CI runs were cancelled. `main` was not
# "validated at its latest state"; it was unvalidated across five commits, and
# while merges keep arriving at that rate the latest state is cancelled too, so
# main CI never completes at all.
#
# That is the sharpest form of #3672. That issue is that nothing verifies a
# merge RESULT before it becomes `main`; this made it worse, because the
# post-merge run which is the last thing that could have caught it was being
# cancelled by the next merge. A break introduced by merge #2 and masked in
# merge #5's tree would never have been attributed to anything.
#
# So: cancel on PR refs, never on `main`. Push-mode CI is not a merge gate
# either way — `validate / validate-all` and `dco` still gate the PR — but a
# completed verdict per merged commit is what makes a red main attributable to
# the merge that caused it.
#
# ─── Why `cancel-in-progress: false` was not enough ─────────────────────────
#
# It only protects the RUNNING run. A concurrency group holds at most ONE
# pending run, so a third push evicts the second before it ever starts — and an
# evicted run is `cancelled` with zero jobs, indistinguishable at a glance from
# a run that was cancelled for cause. Measured on 2026-09-22, all three on
# `main`: `e26dc1ae` started 08:48:18 and was still running; `5090cb91b` queued
# 09:15:20; `d49aaa59d` arrived 09:22:33 and `5090cb91b` was cancelled having
# dispatched nothing. That is #3672 again, one layer down, and the paragraph
# above claimed it was fixed.
#
# The group therefore has to be per-COMMIT on `main`, not per-ref: runs that
# share no group cannot evict each other, whatever `cancel-in-progress` says.
# The cost is the one the note above already accepted — N back-to-back merges
# burn N full main runs — except now they run rather than queue behind one
# slot. PR refs keep the per-ref group, where superseding is the point.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Default to read-only for the workflow's GITHUB_TOKEN. Individual jobs do
# not need to write back to the repo (artifact uploads use separate scopes
# inside `actions/upload-artifact`), so the principle-of-least-privilege
# applies. Release-time write access lives in `release.yml`, which is
# triggered separately by tag pushes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The live log carries warnings and errors only; the tools' own switches, as
  # in `_validate.yml` (which sets the same for its jobs): npm prints no
  # notices, funding or audit summary. Cargo is not quieted: its `-q` also
  # drops cargo's own warnings.
  NPM_CONFIG_LOGLEVEL: warn
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'

jobs:
  # ---------------------------------------------------------------------------
  # Lint, format, audit, type-check, test — the same checks `prek run
  # --all-files` runs locally, plus the full test/E2E/bundle smoke suites.
  # Source of truth: prek.toml.
  #
  # Always runs — `validate` includes markdownlint + lychee, which
  # docs-only PRs still benefit from.
  # ---------------------------------------------------------------------------
  validate:
    # `actions: write` is for _validate.yml's stop-after-* jobs alone; its
    # other jobs keep its own read-only `permissions:`.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/_validate.yml

  # ---------------------------------------------------------------------------
  # Linux smoke build. Catches Tauri-config drift early without burning
  # macOS/Windows runner minutes (~10× the Linux cost) on every PR. The
  # full desktop matrix is built only at release time by `release.yml`
  # on tag push, which is the only place macOS/Windows artifacts must
  # actually ship.
  #
  # Path-gated on `validate.outputs.desktop == 'true'` (the classifier is
  # `scripts/classify-changes.sh`, run by `_validate.yml` and riding out as a
  # `workflow_call` output) — only diffs touching desktop bundle-relevant
  # paths (`src-tauri/**` minus test-only Rust files, bundling scripts, JS
  # manifests, this workflow) pay the ~24 min runner slot. Frontend-only,
  # docs-only and Rust-tests-only PRs skip it entirely.
  #
  # If a Tauri / wry / cargo-tauri bump breaks a non-Linux target, the
  # tag-push release will surface it — the solo maintainer tagging the
  # release notices immediately and either patches forward or rolls
  # back the bump. Multi-maintainer projects that want PR-time signal
  # on non-Linux platforms can add a label-gated re-add or a scheduled
  # nightly job (see the README for the rationale).
  #
  # `needs: [validate]` is a DELIBERATE fail-fast-vs-latency choice
  # (#819 (5)): the build consumes nothing from validate, so removing
  # the edge would start the ~24-min slot in parallel and cut wall
  # clock. We keep the serialization anyway — a PR that fails the
  # cheap validate stage should not burn the expensive runner slot,
  # and the bundle signal is not on the review critical path (logic
  # correctness lives in `validate`). Revisit only if bundle-drift
  # feedback latency starts hurting.
  # ---------------------------------------------------------------------------
  build:
    needs: validate
    if: needs.validate.outputs.desktop == 'true'
    # PEND-41 R1 — observed Linux wall-clock 24.3 min (run 25966040732,
    # 2026-05-16, n=1). +50% headroom + round up → 50.
    timeout-minutes: 50
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain (apt, mold, Rust, Node, npm ci)
        uses: ./.github/actions/toolchain
        with:
          # patchelf + libappindicator3-dev back the AppImage bundling step
          # (linuxdeploy rewrites RPATH on the bundled .so files), and the
          # GStreamer plugins are what the AppImage bundles for capture — matching
          # release.yml's apt list so both workflows produce identical bundles.
          bundle-deps: 'true'
          rust-shared-key: rust-release

      - name: Build Tauri app
        # `-v` raises tauri-bundler's log level so the real stdout/stderr
        # of linuxdeploy / candle / light / codesign is captured in CI
        # logs. Without it, every bundling failure surfaces only the
        # generic `failed to run <tool>` wrapper from `output_ok()` in
        # tauri-bundler, with no underlying error text. See the
        # equivalent comment in release.yml.
        #
        # The whole `-v` output (bundler and linuxdeploy chatter included, a
        # few thousand lines) goes to `tauri-build.log`, which the next step
        # prints when the build fails and the step after uploads.
        #
        # The CLI is the prebuilt `@tauri-apps/cli` that `npm ci` installed,
        # not a `cargo install tauri-cli` compile on every Rust-cache miss
        # (#5853).
        id: tauri-build
        run: npm run tauri -- build -v > tauri-build.log 2>&1

      - name: Full bundler log (build failed)
        if: failure() && steps.tauri-build.outcome == 'failure'
        run: cat tauri-build.log

      - name: Upload bundler log
        # The log holds the build's warnings (rustc, tauri, linuxdeploy), which
        # a passing build no longer prints.
        if: ${{ !cancelled() && steps.tauri-build.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-build-log
          path: tauri-build.log
          retention-days: 7

      - name: Fix AppImage icon symlinks
        run: bash scripts/fix-appimage-icons.sh

      - name: Verify the AppImage bundles the capture plugins
        # #5718: without them the AppImage finds no camera or microphone.
        run: bash scripts/check-appimage-media-plugins.sh src-tauri/target/release/bundle/appimage/Agaric.AppDir

      # ---------------------------------------------------------------------
      # FEAT-4f — verify the `agaric-mcp` sidecar binary is staged for, and
      # landed in, the bundled artifact. Missing here breaks MCP clients
      # that rely on the installed stub.
      # ---------------------------------------------------------------------
      - name: Verify externalBin staging
        run: test -x src-tauri/binaries/agaric-mcp-x86_64-unknown-linux-gnu

      - name: Verify agaric-mcp inside .deb
        run: |
          # Use a glob (instead of `ls | head -n 1`) so shellcheck SC2012 is happy
          # and filenames with spaces / newlines parse correctly. Bundle dir
          # only contains a single .deb per build but still — defensive.
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "ERROR: no .deb produced in src-tauri/target/release/bundle/deb/" >&2
            exit 1
          fi
          deb="${debs[0]}"
          echo "Inspecting $deb"
          dpkg-deb -c "$deb" | grep -E '(^|/)agaric-mcp( |$)'

      - name: Upload Linux bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          # Smoke-build output, ~100 MB per main push — only ever
          # inspected within days of the run. Shippable artifacts come
          # from release.yml; the 90-day default just accumulated
          # storage (#819 (4)).
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Android APK build. Path-gated on `validate.outputs.android` alone:
  # the ~28-min slot is paid only by a PR that actually touches Android
  # paths (scaffold/override/conf files, the cross-compile dependency graph,
  # the multicast shim, the patch script, or this workflow), and those are
  # exactly the PRs whose Android breakage should be caught before merge
  # rather than after. Not a required check, so it never blocks a merge.
  # `release.yml` builds the signed Android artifact at tag time
  # independently, covering everything this gate skips.
  # ---------------------------------------------------------------------------
  android-build:
    needs: validate
    if: needs.validate.outputs.android == 'true'
    runs-on: ubuntu-24.04
    # PEND-41 R1 — observed wall-clock 27.8 min (run 25966040732, 2026-05-16,
    # n=1). +50% headroom + round up → 45 min.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free up runner disk space
        # The two-arch Android build (x86_64 debug + aarch64 release) plus the
        # NDK and the Rust release `target/` trees exhausted the ~14 GB the
        # default ubuntu-24.04 runner leaves free → "No space left on device"
        # (run 26804729629, android-build). Reclaim the large preinstalled
        # toolchains this job never uses BEFORE the SDK/NDK install and the
        # builds. The preinstalled Android NDKs are removed too — `setup-android`
        # below reinstalls the single pinned NDK this build needs. ~20-25 GB
        # recovered; `|| true` so a missing path never fails the build. The
        # "Disk usage" step at the end of the job prints `df` when it fails.
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null || true

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          # #640: exact toolchain pin — keep in lockstep with
          # rust-toolchain.toml and src-tauri/Cargo.toml `rust-version`.
          # The cross `targets` below install onto this exact toolchain.
          toolchain: 1.95.0
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Rust cache
        # zizmor: ignore[cache-poisoning] — this `android-build` job only
        # compiles and tests; it never signs or publishes the cached target/
        # tree. Anchored on the step itself, not by line number (#3737);
        # guarded by scripts/check-cache-poisoning-suppressions.mjs.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # PEND-39 C6: separate `rust-android` key — Android cross-
          # compiles to aarch64-linux-android / x86_64-linux-android,
          # which means a different `target/` tree and different
          # rustup target installed. Sharing with the `rust-deps` key
          # (used by validate + Linux desktop build for the host triple)
          # would defeat both caches.
          shared-key: rust-android
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Do not print the accepted licence texts.
          log-accepted-android-sdk-licenses: false
          packages: >
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018

      - name: Install Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare externalBin placeholder (FEAT-4f)
        # tauri-build validates `externalBin` paths on every cargo
        # invocation. Android builds don't ship the sidecar (see
        # tauri.android.conf.json override), but the host-triple
        # placeholder must exist so `tauri android init` /
        # `build` can proceed past validation.
        run: node scripts/prepare-external-bins.mjs --placeholder-only

      - name: Initialize Tauri Android project
        # `src-tauri/gen/android/` is gitignored EXCEPT for a handful of
        # tracked override files (AndroidManifest.xml + the two res/xml
        # configs + proguard-rules.pro) that carry CAMERA / Wi-Fi-multicast
        # permissions, the FileProvider and AndroidTV LEANBACK_LAUNCHER
        # tweaks, and the network_security_config / file_paths overrides.
        # On a fresh CI checkout the directory therefore looks like a
        # *partially* initialised Android scaffold, which trips Tauri 2's
        # `android init` (it sees the existing files, then fails because
        # `app/src/main/java/com/agaric/app/` is missing — exactly the
        # state the user is asked to recreate from scratch).
        #
        # Solution: stash the tracked overrides, wipe `gen/android/`, run
        # init against a clean slate, then restore the overrides on top of
        # the freshly-generated scaffold so our customisations are
        # preserved. Tauri re-generates the directory on first build, but
        # doing it explicitly here gives the patch step below a stable
        # target file.
        shell: bash
        run: |
          set -euo pipefail

          OVERRIDES="$(mktemp -d)"
          if [ -d src-tauri/gen/android ]; then
            while IFS= read -r f; do
              rel="${f#src-tauri/gen/android/}"
              mkdir -p "$OVERRIDES/$(dirname "$rel")"
              cp "$f" "$OVERRIDES/$rel"
            done < <(git ls-files src-tauri/gen/android)
            rm -rf src-tauri/gen/android
          fi

          # The prebuilt npm CLI, not a compiled `cargo-tauri` (#5853). Init
          # records its runner in the generated Gradle build, so the APK
          # builds below call back into the same CLI.
          npm run tauri -- android init

          # Restore the tracked overrides on top of the regenerated scaffold.
          if find "$OVERRIDES" -mindepth 1 -print -quit | grep -q .; then
            cp -R "$OVERRIDES/." src-tauri/gen/android/
          fi
          rm -rf "$OVERRIDES"
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018

      - name: Apply platform-baseline overrides (minSdk 30, jvmTarget 17)
        run: bash scripts/patch-android-build.sh

      - name: Build Android APK (x86_64 debug)
        run: npm run tauri -- android build --target x86_64 --debug
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018

      # #4425 — the 0.9.9 release APK shipped with 4 KB-aligned ELF LOAD
      # segments, so the app cannot start on a device booted with a 16 KB page
      # size (Android 15+). Nothing said so: the on-device
      # "This app isn't 16 KB-compatible" dialog appears only for DEBUGGABLE
      # builds, and the release build is silently identical, failing later on
      # hardware we do not test on. The fix is a linker flag emitted by
      # src-tauri/build.rs; these two steps are what stop it regressing
      # silently a second time.
      #
      # Each ABI is judged immediately after its own build rather than both
      # together at the end, so neither step depends on an assumption about
      # what the next gradle invocation leaves behind — a guard that reds
      # because its input vanished teaches nothing.
      #
      # `--stage=pre-zipalign` on both: ci.yml has no zipalign step at all,
      # so a ZIP-offset finding here is AGP's own packaging, not something
      # any step below can fix — the guard's remediation text says so
      # instead of pointing at release.yml's signing step (#4425 review
      # notes 2 and 3).
      - name: Assert 16 KB page alignment (x86_64 debug APK) (#4425)
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          node scripts/check-android-so-alignment.mjs --stage=pre-zipalign \
            src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk \
            || rc=$?
          # The guard's contract is 0 clean / 2 finding / 3 verified-nothing.
          # `1` is node's own crash code and is deliberately unused by the
          # contract, so each case below says only what was actually observed —
          # a crash must never be reported as a misaligned library.
          case "$rc" in
            0) ;;
            2) echo "::error::The x86_64 debug APK's native library is NOT 16 KB-aligned (#4425) — see the guard output above."
               exit 1 ;;
            3) echo "::error::The 16 KB alignment guard could not verify the x86_64 debug APK, so nothing was checked. This is NOT a report that the library is misaligned; the reason is printed above."
               exit 1 ;;
            *) echo "::error::The 16 KB alignment guard itself exited $rc, which its contract never emits (1 is node's crash code). Nothing was verified — do not read this as a misalignment."
               exit 1 ;;
          esac

      - name: Build Android APK (aarch64 release, unsigned)
        run: npm run tauri -- android build --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018

      # Same assertion for the ABI that actually ships, placed before the
      # upload so a misaligned APK never becomes an artifact.
      - name: Assert 16 KB page alignment (aarch64 release APK) (#4425)
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          node scripts/check-android-so-alignment.mjs --stage=pre-zipalign \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk \
            || rc=$?
          case "$rc" in
            0) ;;
            2) echo "::error::The aarch64 release APK's native library is NOT 16 KB-aligned (#4425) — see the guard output above."
               exit 1 ;;
            3) echo "::error::The 16 KB alignment guard could not verify the aarch64 release APK, so nothing was checked. This is NOT a report that the library is misaligned; the reason is printed above."
               exit 1 ;;
            *) echo "::error::The 16 KB alignment guard itself exited $rc, which its contract never emits (1 is node's crash code). Nothing was verified — do not read this as a misalignment."
               exit 1 ;;
          esac

      - name: Upload Android release APK (aarch64, unsigned)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agaric-android-aarch64-unsigned
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          if-no-files-found: error
          retention-days: 90

      - name: Disk usage (job failed)
        # The runner's disk is the known way this job dies ("No space left on
        # device"); the cleanup step at the top no longer prints `df`.
        if: failure()
        run: df -h /

  # ---------------------------------------------------------------------------
  # Prune superseded Rust cache generations (#5853). A `Cargo.lock` change
  # starts a new generation of every `v0-rust-<shared-key>-` family, and the
  # old one sits in the shared 10 GB quota until LRU eviction takes it, along
  # with whatever else was read least recently. After `main`'s Rust jobs save,
  # this keeps each family's newest `refs/heads/main` entry and deletes the
  # rest, including any PR-scoped copy: every Rust family is main-only
  # (`save-if`), so a PR copy is readable by nobody else. Runs on every main
  # push, docs-only ones included, because `_validate.yml` does not export
  # which Rust lanes ran; a run with nothing to prune takes seconds.
  # ---------------------------------------------------------------------------
  cache-prune:
    needs: [validate, build, android-build]
    # `refs/heads/main` is only ever a push here: PR runs carry `refs/pull/N/merge`.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete all but the newest main entry of each Rust cache family
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Safe when two main runs prune at once (one concurrency group per
        # commit): each deletes only entries older than one it listed, under
        # the same total order, so no run deletes a family's newest entry. A
        # listing or delete error is a warning, not a red `main`: the worst
        # outcome is a stale generation that the next push prunes.
        run: |
          set -euo pipefail
          if ! listing="$(gh cache list --key v0-rust- --limit 100 --json id,key,createdAt,ref)"; then
            echo "::warning::could not list the Rust caches; nothing pruned"
            exit 0
          fi
          # A key outside rust-cache's `<family>-Linux-x64-<env>-<lock>` shape
          # (a rust-cache bump changing it) fails the job before any delete:
          # a misparsed family would merge two keys and delete one's newest.
          stale="$(jq -r '
            map(select(.key | test("^v0-rust-.+-Linux-x64-[0-9a-f]+-[0-9a-f]+$") | not) | .key) as $bad
            | if ($bad | length) > 0 then error("unparsed Rust cache keys: \($bad)") else . end
            | group_by(.key | sub("-Linux-x64-[0-9a-f]+-[0-9a-f]+$"; ""))
            | map(
                (map(select(.ref == "refs/heads/main")) | max_by([.createdAt, .id]) | .id) as $keep
                | .[] | select(.id != $keep)
              )
            | .[] | [.id, .ref, .key] | @tsv
          ' <<<"$listing")"
          if [ -z "$stale" ]; then
            echo "nothing to prune"
            exit 0
          fi
          while IFS=$'\t' read -r id ref key; do
            if out="$(gh cache delete "$id" 2>&1)"; then
              echo "deleted $key ($ref)"
            elif grep -q 'Could not find a cache' <<<"$out"; then
              echo "already deleted, by a concurrent prune: $key ($ref)"
            else
              echo "::warning::could not delete $key ($ref): $out"
            fi
          done <<<"$stale"
