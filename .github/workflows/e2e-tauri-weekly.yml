# =============================================================================
# WebdriverIO + tauri-driver real-backend E2E (issue #155)
# =============================================================================
# This is a STANDALONE workflow that RUNS ON pull requests but GATES none of
# them. Both halves are deliberate (#4671). It runs per-PR so a real-backend
# regression is reported on the PR that introduces it instead of up to a week
# later. It is still not part of the PR gate — not a job of `_validate.yml`,
# not in `validate-all`'s `needs`, and not a required status-check context
# (`branch-protection-assert.yml` pins those to `dco` + `validate-all`) — so a
# red run here never blocks a merge; it remains a high-fidelity canary. Its
# `e2e-tauri-gate` job reports on every PR, so it can become one.
#
# Unlike the Playwright `e2e/` suite (which drives the app in headless Chromium
# against the JS Tauri mock), this lane builds the REAL Agaric debug binary and
# drives it in a real WebKitWebView via `tauri-driver`, exercising the genuine
# Rust backend over real Tauri IPC. `src/main.tsx` only installs the mock when
# `window.__TAURI_INTERNALS__` is absent; the real binary provides it, so the
# app uses live IPC automatically — hence the binary is a plain (non-VITE_E2E)
# debug build.
#
# `tauri-driver` is a CARGO binary (installed below), not an npm package. On
# Linux it proxies `WebKitWebDriver` from the `webkit2gtk-driver` apt package.
# Docs: https://v2.tauri.app/develop/tests/webdriver/ . Running it on a dev
# box: e2e-tauri/AGENTS.md § Running.
#
# -----------------------------------------------------------------------------
# SPEC SCOPE — why this lane runs `e2e-tauri/*.e2e.ts` and NOT the 100+ specs
# under `e2e/`.
# -----------------------------------------------------------------------------
# `wdio.conf.ts` already globs `./e2e-tauri/**/*.e2e.ts`, so there is no
# allowlist here to widen: this lane runs EVERY real-backend spec that exists.
# The set is small because the specs themselves are what is scarce, not the
# runner configuration — a new `e2e-tauri/<name>.e2e.ts` is picked up with no
# workflow edit.
#
# The `e2e/` Playwright specs CANNOT be pointed at this lane's real backend.
# They are a different harness end to end, not a different flag:
#   * Playwright drives headless CHROMIUM over CDP against a `vite preview`
#     build on http://localhost:5173 (see `playwright.config.ts`). The real
#     app renders in a WebKitGTK WebView driven by `WebKitWebDriver` (W3C
#     WebDriver) through `tauri-driver` — different engine, different wire
#     protocol. There is no Playwright browser/adapter that attaches to it.
#   * The `e2e/` build is produced with `VITE_E2E=1` specifically so the JS
#     mock survives tree-shaking (`src/main.tsx`); this lane builds WITHOUT
#     `VITE_E2E` precisely so no mock is present. The two builds are mutually
#     exclusive by construction.
#   * `page.*` / `expect(locator)` (Playwright) vs `$`/`waitForExist`
#     (WebdriverIO) means every spec body has to be re-authored, not re-pointed
#     — which is exactly what `e2e-tauri/helpers.ts` exists to make cheap.
# Additionally `wdio.conf.ts` pins `maxInstances: 1`: real-backend specs run
# serially against ONE app process sharing ONE real SQLite database, so any
# ported spec must be self-cleaning/order-independent. The Playwright suite
# relies on `fullyParallel` + a per-context mock reset and is not written to
# that constraint.
#
# So widening coverage here is a TEST-AUTHORING task (port high-value specs to
# `e2e-tauri/`, one at a time, each validated by a scheduled/dispatch run),
# tracked by #155 — not a CI-configuration change. Mock↔backend divergence in
# the meantime is guarded by the `conformance/fixtures/*.json` harness, which
# replays the same op sequences against BOTH the real backend and the mock
# (see `e2e/AGENTS.md`).
# =============================================================================

# The display name drops "weekly", which stopped being true here. The FILENAME
# does not: `check-workflow-liveness.mjs` keys its watchdog entry on it.
name: e2e-tauri

on:
  schedule:
    # Weekly, Mondays 02:43 UTC — off-peak and a non-:00 minute so this heavy
    # job does not pile onto the top-of-hour cron rush on GitHub's shared runners.
    #
    # Deliberately staggered ~1.5h ahead of scheduled-deep-checks (04:17 Mon):
    # this lane takes ~17 min, so it drains well before that far heavier lane
    # (~40 min full-suite + ~26 min bench-slo + fuzz + mutants) starts. Running
    # both on the same minute made the two heaviest lanes contend for the same
    # runner pool. Keep these two crons apart when changing either. See #3168.
    - cron: '43 2 * * 1'
  workflow_dispatch: {}
  # Every PR to main, with no `paths:` filter: a `paths`-skipped workflow
  # produces no check run at all, and a required context that never reports
  # blocks the merge forever (#4671). `detect` decides whether the heavy job
  # runs; `gate` always reports.
  pull_request:
    branches: [main]

# Per-REF, so a new push supersedes only that PR's own in-flight run: PR runs
# carry `refs/pull/<n>/merge` and cron runs `refs/heads/main`, disjoint groups.
concurrency:
  group: e2e-tauri-weekly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Is this diff relevant to the lane? `scripts/classify-changes.sh`'s
  # `real_backend`: could the change alter what this lane BUILDS or RUNS (the
  # Rust app minus test-only files, the frontend bundle, the specs and their
  # runner, the manifests). One serial native build tells a docs-only or
  # Rust-tests-only PR nothing. Schedule and dispatch have no
  # diff and classify as relevant.
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      real_backend: ${{ steps.classify.outputs.real_backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the three-dot diff can resolve the merge-base.
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/classify-changes.sh >> "$GITHUB_OUTPUT"

  e2e-tauri:
    name: Real-backend WebdriverIO smoke
    needs: detect
    if: needs.detect.outputs.real_backend == 'true'
    runs-on: ubuntu-24.04
    # Generous ceiling: cold Rust debug build of the whole Tauri app + apt +
    # cargo-install tauri-driver + the WebKitWebView run. Bounds a wedged run.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          # Keep in lockstep with rust-toolchain.toml / src-tauri/Cargo.toml.
          toolchain: 1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Cache `~/.cargo/bin/` so the `cargo install tauri-driver` below
          # survives week to week (same `cache-bin` pattern `_validate.yml`'s
          # lint job uses for sqlx-cli). tauri-driver has no prebuilt binary in
          # taiki-e/install-action's manifest, so it compiles from source on
          # every cold run; the install step below is guarded on
          # `command -v tauri-driver` so a cache hit skips that compile
          # entirely — mirroring the sqlx-cli guard in `_validate.yml`.
          cache-bin: 'true'
          # Per-job-class key (issue #813): rust-cache keeps ONE immutable
          # cache per key, so lanes with different target trees must not share
          # one. This lane's tree is a `tauri build --debug` of the whole app
          # (dev profile) plus the `e2e_sync_peer` binary, and matches none
          # of `rust-lint` / `rust-cov` / `rust-mcp` / `rust-release` /
          # `rust-mutants`.
          shared-key: rust-e2e-tauri
          # Only runs on `main` write the cache; a `workflow_dispatch` from a
          # feature branch reads main's cache and writes only an ephemeral
          # layer. Same `save-if` discipline as every sibling lane.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: 24
          cache: npm

      - name: Prepare apt (free dpkg lock, bound downloads)
        # Same composite action `_validate.yml` (lint / playwright / cargo-tests
        # / mcp-tests) and `scheduled-deep-checks.yml` (full-suite) use: stops the runner's boot-time `unattended-upgrades`
        # / `apt-daily` jobs that hold the dpkg lock, bounds mirror stalls, and
        # — load-bearing for the cache step below — sets
        # `APT::Keep-Downloaded-Packages "true"` + makes
        # /var/cache/apt/archives writable so the .debs survive the install and
        # can be saved. Without this step an `actions/cache` on the archive dir
        # saves nothing (#1464).
        uses: ./.github/actions/prepare-apt

      # Cache the .debs across runs (#1464), same pattern as the `apt-tauri-*`
      # and `apt-playwright-*` caches in `_validate.yml` /
      # `scheduled-deep-checks.yml`: on a hit `apt-get install` resolves from
      # the cache instead of the Ubuntu mirror (the observed slow part — the
      # sibling lanes' comments record ~12 min apt steps on a bad mirror).
      #
      # OWN KEY (`apt-tauri-e2e-…`), deliberately NOT the shared `apt-tauri-…`
      # key: this lane installs a SUPERSET (webkit2gtk-driver, xvfb and
      # dbus-daemon on top of the standard Tauri stack). Reusing the shared
      # key would let whichever lane saved first pin its own package set, so
      # a hit here could be missing exactly the .debs this lane adds. Bump
      # the `-vN` suffix when the package list below changes.
      - name: Cache apt archives (Tauri system deps + WebDriver/Xvfb)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-tauri-e2e-${{ runner.os }}-v4

      - name: Install system dependencies
        # The Tauri Linux build deps are copied verbatim from `_validate.yml`'s
        # "Install system dependencies" step (webkit/gtk/ssl/rsvg/soup + mold).
        # ADDED for this lane:
        #   - webkit2gtk-driver — provides WebKitWebDriver, which tauri-driver
        #     proxies on Linux (the actual WebDriver backend for the WebView).
        #   - xvfb — a virtual display so the WebKitWebView can render headless.
        #   - dbus-daemon — owns `dbus-run-session` (verified in release.yml:
        #     `dpkg -S /usr/bin/dbus-run-session` on noble), for the launch
        #     step below (#4444).
        #   - openbox — a window manager, so the app window gets focus (#5457).
        #   - gstreamer1.0-plugins-good — WebKitGTK's WAV demuxer (wavparse), so
        #     `editor-durability.e2e.ts` can play an audio attachment (#5733).
        # #4163: `apt-get update` is ADVISORY inside this action -- a mirror
        # that cannot serve the index no longer reds this job as a code
        # failure; the INSTALL decides. Measured trace + exit codes in
        # .github/actions/apt-install/action.yml.
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libssl-dev
            librsvg2-dev
            libsoup-3.0-dev
            pkg-config
            mold
            webkit2gtk-driver
            xvfb
            dbus-daemon
            openbox
            gstreamer1.0-plugins-good

      - name: Enable mold linker (CI-only .cargo/config.toml)
        # Mirrors `_validate.yml`: the repo ships `.cargo/config.toml.example`
        # (mold linker) staged so local builds don't require mold; CI has mold
        # from the apt step above, so materialise the active config for a faster
        # link step on the debug build.
        run: |
          mkdir -p .cargo
          cp .cargo/config.toml.example .cargo/config.toml

      - name: Install npm dependencies
        run: npm ci

      - name: Install tauri-driver
        # tauri-driver is a cargo binary (NOT npm); it lands in ~/.cargo/bin,
        # where wdio.conf.ts looks for it. --locked pins its own dependency tree.
        #
        # Guarded on `command -v` so a warm `cache-bin` restore (see the Rust
        # cache step) skips the from-source compile entirely — the same
        # idempotence guard `_validate.yml` and `scheduled-deep-checks.yml` use
        # for sqlx-cli, which is likewise absent from taiki-e/install-action's
        # prebuilt manifest. On a cache miss this still compiles as before.
        run: |
          if ! command -v tauri-driver >/dev/null; then cargo install tauri-driver --locked; fi

      - name: Build Agaric debug binary
        # `tauri build --debug --no-bundle` compiles the real app to
        # src-tauri/target/debug/agaric (Cargo bin name) without producing
        # installers. Plain build (no VITE_E2E) → the app talks to the real
        # backend, not the JS mock.
        #
        # `--config` narrows tauri.conf.json's beforeBuildCommand to the vite
        # build. The default also runs prepare-external-bins.mjs, a RELEASE
        # build of the agaric-mcp sidecar no bundle ships (`--no-bundle`; no
        # `externalBin` entry either); the spec that spawns the bridge uses
        # the debug build below, so skipping it only saves build time.
        run: >-
          npm run tauri -- build --debug --no-bundle
          --config '{"build":{"beforeBuildCommand":"npm run build"}}'

      - name: Build the sync peer
        # The second device the sync specs pair the app with (#5365): a
        # headless vault on the app's own sync daemon. Its own
        # step because `tauri build` builds only the app crate; it recompiles
        # the tauri crates once more, without the CLI's `custom-protocol`.
        working-directory: src-tauri
        run: cargo build -p agaric-diagnostics --bin e2e_sync_peer

      - name: Build the agaric-mcp bridge
        # The bridge `mcp-agent-token.e2e.ts` spawns with an agent's token
        # (#5667). The debug bin reuses the lib the sync peer step just built.
        working-directory: src-tauri
        run: cargo build -p agaric --bin agaric-mcp

      - name: Run WebdriverIO real-backend smoke (Xvfb)
        # The binary is already built above, so tell wdio.conf.ts to skip its
        # own onPrepare build. xvfb-run gives the WebKitWebView a display and
        # dbus-run-session a session bus (#4444: without one every worker boot
        # stalled a flat 30 s, consistent with the 25 s dbus default timeout),
        # the composition release.yml uses for its boot smoke. Bare Xvfb has no
        # window manager, so nothing ever focuses the app window and
        # `document.hasFocus()` stays false; openbox focuses new windows
        # (#5457), and waitForAppReady fails the run if it did not.
        #
        # #3334 — no vault isolation is configured HERE on purpose. The runner
        # being ephemeral used to be the only thing keeping this lane off a real
        # vault, which is exactly why a developer running the same command
        # locally wrote into their own notes. wdio.conf.ts now mints a throwaway
        # vault per run and refuses to start if the app does not use it, so CI
        # and a laptop get the identical guarantee from the identical code path
        # — nothing about this job may be load-bearing for it. Set
        # WDIO_KEEP_VAULT=1 to retain the sandbox for a post-mortem.
        env:
          WDIO_SKIP_TAURI_BUILD: '1'
        run: xvfb-run -a dbus-run-session -- bash -c 'openbox & npm run test:e2e-tauri'

      - name: Upload WebdriverIO logs
        # #4428 — `**/*.log` swept `node_modules`. Every failing run's
        # `e2e-tauri-logs` artifact was byte-identical at 1114 bytes and held
        # exactly three files: `node_modules/spdx-compare/test.log`,
        # `node_modules/spdx-ranges/outdated.log`,
        # `node_modules/spdx-satisfies/test.log`. No WebdriverIO log, no app
        # log, ever — `logs/` and `wdio-logs*/` are never created (wdio.conf.ts
        # sets no `outputDir`; the spec reporter writes to stdout). A step that
        # produces a plausibly-named artifact containing none of the evidence it
        # promises is worse than one that produces nothing, so exclude the
        # dependency tree: with `if-no-files-found: ignore` the step now yields
        # NO artifact rather than a misleading one.
        #
        # The exclusion is `!**/node_modules/**`, not `!node_modules/**`: the
        # latter matches the TOP-LEVEL tree only, while the pattern it has to
        # cancel (`**/*.log`) reaches every depth. `.gitignore:10` is a bare
        # `node_modules`, which git applies at any depth; `!**/node_modules/**`
        # is the spelling that covers that same set here. (Nothing nested
        # exists in this tree today — this is the defensive spelling, not a fix
        # for an observed miss.) The comment lives here rather than beside the
        # pattern because `path: |` is a literal block scalar: a `#` line
        # inside it is DATA handed to the globber, not a comment.
        #
        # The evidence that does exist is in `e2e-tauri-diagnostics` below:
        # wdio.conf.ts now copies the app's own
        # `<AGARIC_DATA_DIR>/logs/agaric.log*` into `e2e-tauri/artifacts/`
        # before the throwaway vault that holds it is deleted — from
        # `afterTest` per failing test, and from `afterSession` once per
        # session, which is the only one of the two that fires when the app
        # never boots and no test ever runs.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-tauri-logs
          path: |
            logs/
            wdio-logs*/
            **/*.log
            !**/node_modules/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure diagnostics (screenshots)
        # On-failure artifacts written by wdio.conf.ts's afterTest hook (issue
        # #155): per-test screenshots under e2e-tauri/artifacts/. The distilled
        # page-source/testid/URL/sidebar excerpts are logged to stdout (captured
        # in the run log). SHA pinned byte-identical to the logs step above.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-tauri-diagnostics
          path: e2e-tauri/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # The one stable context this workflow emits on every PR, so it can become a
  # required check (#4671). `if: always()` is load-bearing: a skipped required
  # check counts as passing. Mirrors `validate-all`: `detect` must succeed, the
  # lane must succeed, and a skipped lane is accepted only when `detect` said
  # the diff is not relevant.
  gate:
    name: e2e-tauri-gate
    needs: [detect, e2e-tauri]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert the real-backend lane passed or was not needed
        env:
          DETECT: ${{ needs.detect.result }}
          RELEVANT: ${{ needs.detect.outputs.real_backend }}
          LANE: ${{ needs.e2e-tauri.result }}
        run: |
          set -euo pipefail
          echo "detect=$DETECT real_backend=${RELEVANT:-<empty>} e2e-tauri=$LANE"
          if [ "$DETECT" != "success" ]; then
            echo "::error::detect result=$DETECT; failing closed."
            exit 1
          fi
          case "$LANE" in
            success) ;;
            skipped)
              if [ "$RELEVANT" != "false" ]; then
                echo "::error::the lane was skipped but detect said real_backend='${RELEVANT}', not 'false'."
                exit 1
              fi ;;
            *)
              echo "::error::e2e-tauri result=$LANE."
              exit 1 ;;
          esac
