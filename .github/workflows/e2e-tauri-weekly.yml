# =============================================================================
# WebdriverIO + tauri-driver real-backend E2E — WEEKLY lane (issue #155)
# =============================================================================
# This is a STANDALONE, NON-BLOCKING workflow. It is intentionally NOT part of
# the PR gate (`_validate.yml` / branch protection) and nothing depends on it,
# so a red run here never blocks a merge — it is a slow, high-fidelity canary.
#
# Unlike the Playwright `e2e/` suite (which drives the app in headless Chromium
# against the JS Tauri mock), this lane builds the REAL Agaric debug binary and
# drives it in a real WebKitWebView via `tauri-driver`, exercising the genuine
# Rust backend over real Tauri IPC. `src/main.tsx` only installs the mock when
# `window.__TAURI_INTERNALS__` is absent; the real binary provides it, so the
# app uses live IPC automatically — hence the binary is a plain (non-VITE_E2E)
# debug build.
#
# `tauri-driver` is a CARGO binary (installed below), not an npm package. On
# Linux it proxies `WebKitWebDriver` from the `webkit2gtk-driver` apt package.
# Docs: https://v2.tauri.app/develop/tests/webdriver/
#
# Runtime validation of this harness is deferred to the first scheduled run or
# a manual `workflow_dispatch` (WebKitWebDriver cannot run on a dev box without
# a display / the driver packages).
#
# -----------------------------------------------------------------------------
# SPEC SCOPE — why this lane runs `e2e-tauri/*.e2e.ts` and NOT the 100+ specs
# under `e2e/`.
# -----------------------------------------------------------------------------
# `wdio.conf.ts` already globs `./e2e-tauri/**/*.e2e.ts`, so there is no
# allowlist here to widen: this lane runs EVERY real-backend spec that exists.
# The set is small because the specs themselves are what is scarce, not the
# runner configuration — a new `e2e-tauri/<name>.e2e.ts` is picked up with no
# workflow edit.
#
# The `e2e/` Playwright specs CANNOT be pointed at this lane's real backend.
# They are a different harness end to end, not a different flag:
#   * Playwright drives headless CHROMIUM over CDP against a `vite preview`
#     build on http://localhost:5173 (see `playwright.config.ts`). The real
#     app renders in a WebKitGTK WebView driven by `WebKitWebDriver` (W3C
#     WebDriver) through `tauri-driver` — different engine, different wire
#     protocol. There is no Playwright browser/adapter that attaches to it.
#   * The `e2e/` build is produced with `VITE_E2E=1` specifically so the JS
#     mock survives tree-shaking (`src/main.tsx`); this lane builds WITHOUT
#     `VITE_E2E` precisely so no mock is present. The two builds are mutually
#     exclusive by construction.
#   * `page.*` / `expect(locator)` (Playwright) vs `$`/`waitForExist`
#     (WebdriverIO) means every spec body has to be re-authored, not re-pointed
#     — which is exactly what `e2e-tauri/helpers.ts` exists to make cheap.
# Additionally `wdio.conf.ts` pins `maxInstances: 1`: real-backend specs run
# serially against ONE app process sharing ONE real SQLite database, so any
# ported spec must be self-cleaning/order-independent. The Playwright suite
# relies on `fullyParallel` + a per-context mock reset and is not written to
# that constraint.
#
# So widening coverage here is a TEST-AUTHORING task (port high-value specs to
# `e2e-tauri/`, one at a time, each validated by a scheduled/dispatch run),
# tracked by #155 — not a CI-configuration change. Mock↔backend divergence in
# the meantime is guarded by the `conformance/fixtures/*.json` harness, which
# replays the same op sequences against BOTH the real backend and the mock
# (see `e2e/AGENTS.md`).
# =============================================================================

name: e2e-tauri-weekly

on:
  schedule:
    # Weekly, Mondays 02:43 UTC — off-peak and a non-:00 minute so this heavy
    # job does not pile onto the top-of-hour cron rush on GitHub's shared runners.
    #
    # Deliberately staggered ~1.5h ahead of scheduled-deep-checks (04:17 Mon):
    # this lane takes ~17 min, so it drains well before that far heavier lane
    # (~40 min full-suite + ~26 min bench-slo + fuzz + mutants) starts. Running
    # both on the same minute made the two heaviest lanes contend for the same
    # runner pool. Keep these two crons apart when changing either. See #3168.
    - cron: '43 2 * * 1'
  workflow_dispatch: {}

# Never run two of these at once; a newer trigger supersedes an in-flight run.
concurrency:
  group: e2e-tauri-weekly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-tauri:
    name: Real-backend WebdriverIO smoke
    runs-on: ubuntu-24.04
    # Generous ceiling: cold Rust debug build of the whole Tauri app + apt +
    # cargo-install tauri-driver + the WebKitWebView run. Bounds a wedged run.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          # Keep in lockstep with rust-toolchain.toml / src-tauri/Cargo.toml.
          toolchain: 1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Cache `~/.cargo/bin/` so the `cargo install tauri-driver` below
          # survives week to week (same `cache-bin` pattern `_validate.yml`'s
          # lint job uses for sqlx-cli). tauri-driver has no prebuilt binary in
          # taiki-e/install-action's manifest, so it compiles from source on
          # every cold run; the install step below is guarded on
          # `command -v tauri-driver` so a cache hit skips that compile
          # entirely — mirroring the sqlx-cli guard in `_validate.yml`.
          cache-bin: 'true'
          # Per-job-class key (issue #813): rust-cache keeps ONE immutable
          # cache per key, so lanes with different target trees must not share
          # one. This lane's tree is a `tauri build --debug` of the whole app
          # (dev profile, real binary + externalBin sidecar) and matches none
          # of `rust-lint` / `rust-cov` / `rust-mcp` / `rust-release` /
          # `rust-bench*` / `rust-full-suite`.
          shared-key: rust-e2e-tauri
          # Only runs on `main` write the cache; a `workflow_dispatch` from a
          # feature branch reads main's cache and writes only an ephemeral
          # layer. Same `save-if` discipline as every sibling lane.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Prepare apt (free dpkg lock, bound downloads)
        # Same composite action `_validate.yml` (lint / playwright / cargo-tests
        # / mcp-tests) and `scheduled-deep-checks.yml` (prek-all-files /
        # full-suite) use: stops the runner's boot-time `unattended-upgrades`
        # / `apt-daily` jobs that hold the dpkg lock, bounds mirror stalls, and
        # — load-bearing for the cache step below — sets
        # `APT::Keep-Downloaded-Packages "true"` + makes
        # /var/cache/apt/archives writable so the .debs survive the install and
        # can be saved. Without this step an `actions/cache` on the archive dir
        # saves nothing (#1464).
        uses: ./.github/actions/prepare-apt

      # Cache the .debs across runs (#1464), same pattern as the `apt-tauri-*`
      # and `apt-playwright-*` caches in `_validate.yml` /
      # `scheduled-deep-checks.yml`: on a hit `apt-get install` resolves from
      # the cache instead of the Ubuntu mirror (the observed slow part — the
      # sibling lanes' comments record ~12 min apt steps on a bad mirror).
      #
      # OWN KEY (`apt-tauri-e2e-…`), deliberately NOT the shared `apt-tauri-…`
      # key: this lane installs a SUPERSET (webkit2gtk-driver + xvfb on top of
      # the standard Tauri stack). Reusing the shared key would let whichever
      # lane saved first pin its own package set, so a hit here could be
      # missing exactly the two .debs this lane adds. Bump the `-v1` suffix
      # when the package list below changes.
      - name: Cache apt archives (Tauri system deps + WebDriver/Xvfb)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-tauri-e2e-${{ runner.os }}-v1

      - name: Install system dependencies
        # The Tauri Linux build deps are copied verbatim from `_validate.yml`'s
        # "Install system dependencies" step (webkit/gtk/ssl/rsvg/soup + mold).
        # ADDED for this lane:
        #   - webkit2gtk-driver — provides WebKitWebDriver, which tauri-driver
        #     proxies on Linux (the actual WebDriver backend for the WebView).
        #   - xvfb — a virtual display so the WebKitWebView can render headless.
        run: |
          # #4115: bound a stalled mirror. A hung `InRelease` fetch is not
          # covered by Acquire::*::Timeout, so without this it consumes the
          # whole `timeout-minutes` budget and reads as a code failure.
          sudo timeout 300 apt-get update || {
            echo '::warning::apt-get update stalled or failed; retrying once'
            sudo timeout 300 apt-get update || {
              echo '::error::#4115: apt-get update failed twice — likely a hung Ubuntu mirror, not this diff.'
              exit 1
            }
          }
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config \
            mold \
            webkit2gtk-driver \
            xvfb

      - name: Enable mold linker (CI-only .cargo/config.toml)
        # Mirrors `_validate.yml`: the repo ships `.cargo/config.toml.example`
        # (mold linker) staged so local builds don't require mold; CI has mold
        # from the apt step above, so materialise the active config for a faster
        # link step on the debug build.
        run: |
          mkdir -p .cargo
          cp .cargo/config.toml.example .cargo/config.toml

      - name: Install npm dependencies
        run: npm ci

      - name: Install tauri-driver
        # tauri-driver is a cargo binary (NOT npm); it lands in ~/.cargo/bin,
        # where wdio.conf.ts looks for it. --locked pins its own dependency tree.
        #
        # Guarded on `command -v` so a warm `cache-bin` restore (see the Rust
        # cache step) skips the from-source compile entirely — the same
        # idempotence guard `_validate.yml` and `scheduled-deep-checks.yml` use
        # for sqlx-cli, which is likewise absent from taiki-e/install-action's
        # prebuilt manifest. On a cache miss this still compiles as before.
        run: |
          if ! command -v tauri-driver >/dev/null; then cargo install tauri-driver --locked; fi

      - name: Build Agaric debug binary
        # `tauri build --debug --no-bundle` compiles the real app to
        # src-tauri/target/debug/agaric (Cargo bin name) without producing
        # installers. tauri.conf.json's beforeBuildCommand runs
        # prepare-external-bins.mjs (builds the agaric-mcp sidecar) + the vite
        # build, so the frontend + externalBin are ready. Plain build (no
        # VITE_E2E) → the app talks to the real backend, not the JS mock.
        run: npm run tauri -- build --debug --no-bundle

      - name: Run WebdriverIO real-backend smoke (Xvfb)
        # The binary is already built above, so tell wdio.conf.ts to skip its
        # own onPrepare build. xvfb-run gives the WebKitWebView a display.
        #
        # #3334 — no vault isolation is configured HERE on purpose. The runner
        # being ephemeral used to be the only thing keeping this lane off a real
        # vault, which is exactly why a developer running the same command
        # locally wrote into their own notes. wdio.conf.ts now mints a throwaway
        # vault per run and refuses to start if the app does not use it, so CI
        # and a laptop get the identical guarantee from the identical code path
        # — nothing about this job may be load-bearing for it. Set
        # WDIO_KEEP_VAULT=1 to retain the sandbox for a post-mortem.
        env:
          WDIO_SKIP_TAURI_BUILD: '1'
        run: xvfb-run -a npm run test:e2e-tauri

      - name: Upload WebdriverIO logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-tauri-logs
          path: |
            logs/
            wdio-logs*/
            **/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure diagnostics (screenshots)
        # On-failure artifacts written by wdio.conf.ts's afterTest hook (issue
        # #155): per-test screenshots under e2e-tauri/artifacts/. The distilled
        # page-source/testid/URL/sidebar excerpts are logged to stdout (captured
        # in the run log). SHA pinned byte-identical to the logs step above.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-tauri-diagnostics
          path: e2e-tauri/artifacts/
          if-no-files-found: ignore
          retention-days: 14
