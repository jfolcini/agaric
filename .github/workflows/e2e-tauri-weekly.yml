# =============================================================================
# WebdriverIO + tauri-driver real-backend E2E (issue #155)
# =============================================================================
# This workflow runs on every pull request and gates it: its `e2e-tauri-gate`
# job is a required status-check context (#4671), pinned with `dco` and
# `validate / validate-all` by `branch-protection-assert.yml`. It stays a
# separate workflow, not a job of `_validate.yml`, so the real-backend build
# does not sit in `validate-all`'s `needs`.
#
# A release is the exception: `release.yml` calls this workflow on every tag
# and `publish-release` requires it, so a red run leaves the release a draft.
#
# Unlike the Playwright `e2e/` suite (which drives the app in headless Chromium
# against the JS Tauri mock), this lane builds the REAL Agaric debug binary and
# drives it in a real WebKitWebView via `tauri-driver`, exercising the genuine
# Rust backend over real Tauri IPC. `src/main.tsx` only installs the mock when
# `window.__TAURI_INTERNALS__` is absent; the real binary provides it, so the
# app uses live IPC automatically — hence the binary is a plain (non-VITE_E2E)
# debug build.
#
# `tauri-driver` is a CARGO binary (built by the `build` job and shipped to the
# shards with the app), not an npm package. On Linux it proxies
# `WebKitWebDriver` from the `webkit2gtk-driver` apt package.
# Docs: https://v2.tauri.app/develop/tests/webdriver/ . Running it on a dev
# box: e2e-tauri/AGENTS.md § Running.
#
# -----------------------------------------------------------------------------
# SPEC SCOPE — why this lane runs `e2e-tauri/*.e2e.ts` and NOT the 100+ specs
# under `e2e/`.
# -----------------------------------------------------------------------------
# `wdio.conf.ts` already globs `./e2e-tauri/**/*.e2e.ts`, so there is no
# allowlist here to widen: this lane runs EVERY real-backend spec that exists.
# The set is small because the specs themselves are what is scarce, not the
# runner configuration — a new `e2e-tauri/<name>.e2e.ts` is picked up with no
# workflow edit.
#
# The `e2e/` Playwright specs CANNOT be pointed at this lane's real backend.
# They are a different harness end to end, not a different flag:
#   * Playwright drives headless CHROMIUM over CDP against a `vite preview`
#     build on http://localhost:5173 (see `playwright.config.ts`). The real
#     app renders in a WebKitGTK WebView driven by `WebKitWebDriver` (W3C
#     WebDriver) through `tauri-driver` — different engine, different wire
#     protocol. There is no Playwright browser/adapter that attaches to it.
#   * The `e2e/` build is produced with `VITE_E2E=1` specifically so the JS
#     mock survives tree-shaking (`src/main.tsx`); this lane builds WITHOUT
#     `VITE_E2E` precisely so no mock is present. The two builds are mutually
#     exclusive by construction.
#   * `page.*` / `expect(locator)` (Playwright) vs `$`/`waitForExist`
#     (WebdriverIO) means every spec body has to be re-authored, not re-pointed
#     — which is exactly what `e2e-tauri/helpers.ts` exists to make cheap.
# Additionally `wdio.conf.ts` pins `maxInstances: 1`: real-backend specs run
# serially against ONE app process sharing ONE real SQLite database, so any
# ported spec must be self-cleaning/order-independent. The Playwright suite
# relies on `fullyParallel` + a per-context mock reset and is not written to
# that constraint.
#
# So widening coverage here is a TEST-AUTHORING task (port high-value specs to
# `e2e-tauri/`, one at a time, each validated by a scheduled/dispatch run),
# tracked by #155 — not a CI-configuration change. Mock↔backend divergence in
# the meantime is guarded by the `conformance/fixtures/*.json` harness, which
# replays the same op sequences against BOTH the real backend and the mock
# (see `e2e/AGENTS.md`).
# =============================================================================

# The display name drops "weekly", which stopped being true here. The FILENAME
# does not: `check-workflow-liveness.mjs` keys its watchdog entry on it.
name: e2e-tauri

on:
  schedule:
    # Weekly, Mondays 02:43 UTC — off-peak and a non-:00 minute so this heavy
    # job does not pile onto the top-of-hour cron rush on GitHub's shared runners.
    #
    # Deliberately staggered ~1.5h ahead of scheduled-deep-checks (04:17 Mon):
    # this lane takes ~17 min, so it drains well before that far heavier lane
    # (~40 min full-suite + ~26 min bench-slo + fuzz + mutants) starts. Running
    # both on the same minute made the two heaviest lanes contend for the same
    # runner pool. Keep these two crons apart when changing either. See #3168.
    - cron: '43 2 * * 1'
  workflow_dispatch: {}
  # Every PR to main, with no `paths:` filter: a `paths`-skipped workflow
  # produces no check run at all, and a required context that never reports
  # blocks the merge forever (#4671). `detect` decides whether the heavy job
  # runs; `gate` always reports.
  pull_request:
    branches: [main]
  # `release.yml`'s `e2e-tauri` job.
  workflow_call: {}

# Per-REF, so a new push supersedes only that PR's own in-flight run: PR runs
# carry `refs/pull/<n>/merge` and cron runs `refs/heads/main`, disjoint groups.
# Under `workflow_call` the context is the caller's, so `github.workflow` is
# `Release` there: a dispatch on a release tag cannot cancel the release's run.
concurrency:
  group: e2e-tauri-weekly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The live log carries warnings and errors only (`_validate.yml`'s env block
  # says what each switch hides, and why cargo is not one of them).
  NPM_CONFIG_LOGLEVEL: warn
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'

jobs:
  # Is this diff relevant to the lane? `scripts/classify-changes.sh`'s
  # `real_backend`: could the change alter what this lane BUILDS or RUNS (the
  # Rust app minus test-only files, the frontend bundle, the specs and their
  # runner, the manifests). One serial native build tells a docs-only or
  # Rust-tests-only PR nothing. Schedule, dispatch and `release.yml`'s call
  # (a tag push) have no diff and run every spec. When the lane's only paths
  # are `e2e-tauri/*.e2e.ts` specs, `real_backend_specs` lists the changed ones
  # still on disk and the run step passes just those (#5853); helpers,
  # `wdio.conf.ts` or the app empty it and every spec runs.
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      real_backend: ${{ steps.classify.outputs.real_backend }}
      real_backend_specs: ${{ steps.classify.outputs.real_backend_specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the three-dot diff can resolve the merge-base.
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/classify-changes.sh >> "$GITHUB_OUTPUT"

  # Build once, then run the specs in three shards from the build's binaries
  # (#5849): a build per shard would cost each shard minutes of compile for a
  # few minutes of specs. Every spec file boots the app on its own vault, so a
  # file runs the same in any shard (e2e-tauri/AGENTS.md § Rules).
  build:
    name: Build the real-backend binaries
    needs: detect
    if: needs.detect.outputs.real_backend == 'true'
    runs-on: ubuntu-24.04
    # A cold Rust debug build of the whole Tauri app, plus apt on a slow mirror.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Up to the Rust cache, these steps run in `actions/toolchain`'s order and
      # environment, so the restore computes `mcp-tests`' key: rust-cache hashes
      # `.cargo/config.toml` (the mold step) and every `CARGO*` / `RUST*`
      # variable into it, so this job's `CARGO*` environment must stay equal to
      # `_validate.yml`'s, which `mcp-tests` runs under.
      - name: Prepare apt (free dpkg lock, bound downloads)
        uses: ./.github/actions/prepare-apt

      - name: Restore apt archives (Tauri system deps)
        # The shared key `actions/toolchain` saves on main for exactly the list
        # below. Restored, never saved: a PR's save is readable by nothing else,
        # and main runs this lane only weekly (#5853).
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-tauri-${{ runner.os }}-v1

      - name: Install system dependencies
        # `actions/toolchain`'s list: webkit/gtk/ssl/rsvg/soup compile the
        # Tauri crates; mold links them. #4163: `apt-get update` is ADVISORY
        # inside this action; the install decides.
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libssl-dev
            librsvg2-dev
            libsoup-3.0-dev
            pkg-config
            mold

      - name: Enable mold linker (CI-only .cargo/config.toml)
        # The repo ships `.cargo/config.toml.example` so local builds don't
        # require mold; CI has mold from the apt step above.
        run: |
          mkdir -p .cargo
          cp .cargo/config.toml.example .cargo/config.toml

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          # Keep in lockstep with rust-toolchain.toml / src-tauri/Cargo.toml.
          toolchain: 1.95.0

      - name: Rust cache (mcp-tests' entry, read-only)
        # `mcp-tests` compiles the same dev profile of the same dependency graph
        # and stays the key's only writer. This lane's own key never hit: only
        # main saved it, and main runs this lane only weekly (#5853). Cargo's
        # fingerprints decide what rebuilds; tauri and everything above it
        # always do, because this build adds tauri's `custom-protocol`.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # `mcp-tests` saves with it, and the cached paths are part of the
          # entry's identity.
          cache-bin: 'true'
          shared-key: rust-mcp
          save-if: false

      - name: Install Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install tauri-driver
        # A cargo binary with no prebuilt release; the shards run this build of
        # it from the artifact below.
        run: cargo install tauri-driver --locked

      - name: Build the app, the sync peer and the agaric-mcp bridge
        # One compile. The CLI runs `cargo build --bins --features
        # tauri/custom-protocol` with the arguments after `--`, so it emits
        # src-tauri/target/debug/agaric (the app, `dist/` embedded), the
        # `agaric-mcp` bridge `mcp-agent-token.e2e.ts` spawns, and the
        # `e2e_sync_peer` second device of the sync specs (#5365), plus the two
        # diagnostics tools nothing here runs. A cargo call of its own would
        # compile `agaric` again: the app's build script reruns when
        # `TAURI_CONFIG`, which only the CLI sets, changes. Adding the
        # diagnostics crate changes no feature of the app's dependencies.
        #
        # Plain build (no VITE_E2E), so the app talks to the real backend, not
        # the JS mock. `--config` narrows beforeBuildCommand to the vite build:
        # the default also runs prepare-external-bins.mjs, a RELEASE build of
        # the agaric-mcp sidecar that `--no-bundle` ships nowhere.
        run: >-
          npm run tauri -- build --debug --no-bundle
          --config '{"build":{"beforeBuildCommand":"npm run build"}}'
          -- -p agaric -p agaric-diagnostics

      - name: Stage tauri-driver beside the binaries
        run: cp ~/.cargo/bin/tauri-driver src-tauri/target/debug/

      - name: Upload the binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-tauri-binaries
          path: |
            src-tauri/target/debug/agaric
            src-tauri/target/debug/agaric-mcp
            src-tauri/target/debug/e2e_sync_peer
            src-tauri/target/debug/tauri-driver
          if-no-files-found: error
          # Read only by this run's shards.
          retention-days: 1

  specs:
    name: Real-backend specs
    needs: [detect, build]
    runs-on: ubuntu-24.04
    # apt on a slow mirror plus a shard of specs, which the slowest files can
    # make uneven.
    timeout-minutes: 40
    strategy:
      # Every shard runs to the end, so a run reports every failing spec.
      fail-fast: false
      matrix:
        # One leg for a spec-only diff: it runs just the changed specs.
        shard: ${{ fromJSON(needs.detect.outputs.real_backend_specs == '' && '[1, 2, 3]' || '[1]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare apt (free dpkg lock, bound downloads)
        uses: ./.github/actions/prepare-apt

      - name: Install runtime dependencies
        # What the specs run; the build deps stay in `build`.
        #   - webkit2gtk-driver — provides WebKitWebDriver, which tauri-driver
        #     proxies on Linux. It pins `libwebkit2gtk-4.1-0`, whose
        #     dependencies provide every shared library the binaries link.
        #   - xvfb — a virtual display so the WebKitWebView can render headless.
        #   - dbus-daemon — owns `dbus-run-session` (verified in release.yml:
        #     `dpkg -S /usr/bin/dbus-run-session` on noble), for the run step
        #     below (#4444).
        #   - openbox — a window manager, so the app window gets focus (#5457).
        #   - gstreamer1.0-plugins-good — WebKitGTK's WAV demuxer (wavparse), so
        #     `editor-durability.e2e.ts` can play an audio attachment (#5733).
        #   - xdotool — presses OS-level chords at the X server for the Quick
        #     Capture hotkey spec (#5741).
        #   - dbus-bin — `dbus-monitor`, the reminder spec's notification sink
        #     (#5741); dbus-daemon depends on it, named because a spec calls it.
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            webkit2gtk-driver
            xvfb
            dbus-daemon
            openbox
            gstreamer1.0-plugins-good
            xdotool
            dbus-bin

      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-tauri-binaries
          path: src-tauri/target/debug

      - name: Restore the binaries' exec bits
        # An artifact does not keep file modes.
        working-directory: src-tauri/target/debug
        run: chmod +x agaric agaric-mcp e2e_sync_peer tauri-driver

      - name: Run WebdriverIO real-backend specs (Xvfb)
        # The binaries come from `build`, so tell wdio.conf.ts to skip its
        # own onPrepare build. `--shard 1/1`, the spec-only leg's, selects
        # every spec it is given. xvfb-run gives the WebKitWebView a display and
        # dbus-run-session a session bus (#4444: without one every worker boot
        # stalled a flat 30 s, consistent with the 25 s dbus default timeout),
        # the composition release.yml uses for its boot smoke. Bare Xvfb has no
        # window manager, so nothing ever focuses the app window and
        # `document.hasFocus()` stays false; openbox focuses new windows
        # (#5457), and waitForAppReady fails the run if it did not.
        #
        # #3334 — no vault isolation is configured HERE on purpose. The runner
        # being ephemeral used to be the only thing keeping this lane off a real
        # vault, which is exactly why a developer running the same command
        # locally wrote into their own notes. wdio.conf.ts now mints a throwaway
        # vault per run and refuses to start if the app does not use it, so CI
        # and a laptop get the identical guarantee from the identical code path
        # — nothing about this job may be load-bearing for it. Set
        # WDIO_KEEP_VAULT=1 to retain the sandbox for a post-mortem.
        env:
          WDIO_SKIP_TAURI_BUILD: '1'
          TAURI_DRIVER_PATH: ${{ github.workspace }}/src-tauri/target/debug/tauri-driver
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          SPECS: ${{ needs.detect.outputs.real_backend_specs }}
        run: |
          args=(--shard "$SHARD")
          for spec in $SPECS; do args+=(--spec "$spec"); done
          xvfb-run -a dbus-run-session -- bash -c 'openbox & npm run test:e2e-tauri -- "$@"' bash "${args[@]}"

      - name: Upload WebdriverIO logs
        # #4428 — `**/*.log` swept `node_modules`. Every failing run's
        # `e2e-tauri-logs` artifact was byte-identical at 1114 bytes and held
        # exactly three files: `node_modules/spdx-compare/test.log`,
        # `node_modules/spdx-ranges/outdated.log`,
        # `node_modules/spdx-satisfies/test.log`. No WebdriverIO log, no app
        # log, ever — `logs/` and `wdio-logs*/` are never created (wdio.conf.ts
        # sets no `outputDir`; the spec reporter writes to stdout). A step that
        # produces a plausibly-named artifact containing none of the evidence it
        # promises is worse than one that produces nothing, so exclude the
        # dependency tree: with `if-no-files-found: ignore` the step now yields
        # NO artifact rather than a misleading one.
        #
        # The exclusion is `!**/node_modules/**`, not `!node_modules/**`: the
        # latter matches the TOP-LEVEL tree only, while the pattern it has to
        # cancel (`**/*.log`) reaches every depth. `.gitignore:10` is a bare
        # `node_modules`, which git applies at any depth; `!**/node_modules/**`
        # is the spelling that covers that same set here. (Nothing nested
        # exists in this tree today — this is the defensive spelling, not a fix
        # for an observed miss.) The comment lives here rather than beside the
        # pattern because `path: |` is a literal block scalar: a `#` line
        # inside it is DATA handed to the globber, not a comment.
        #
        # The evidence that does exist is in `e2e-tauri-diagnostics-<shard>`
        # below: wdio.conf.ts now copies the app's own
        # `<AGARIC_DATA_DIR>/logs/agaric.log*` into `e2e-tauri/artifacts/`
        # before the throwaway vault that holds it is deleted — from
        # `afterTest` per failing test, and from `afterSession` once per
        # session, which is the only one of the two that fires when the app
        # never boots and no test ever runs.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-tauri-logs-${{ matrix.shard }}
          path: |
            logs/
            wdio-logs*/
            **/*.log
            !**/node_modules/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure diagnostics (screenshots)
        # On-failure artifacts written by wdio.conf.ts's afterTest hook (issue
        # #155): per-test screenshots under e2e-tauri/artifacts/. The distilled
        # page-source/testid/URL/sidebar excerpts are logged to stdout (captured
        # in the run log). SHA pinned byte-identical to the logs step above.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-tauri-diagnostics-${{ matrix.shard }}
          path: e2e-tauri/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # The one stable context this workflow emits on every PR, so it can become a
  # required check (#4671). `if: always()` is load-bearing: a skipped required
  # check counts as passing. Mirrors `validate-all`: `detect` must succeed, the
  # build and every shard must succeed, and a skipped job is accepted only when
  # `detect` said the diff is not relevant. A failed build skips `specs`, which
  # then fails here too.
  gate:
    name: e2e-tauri-gate
    needs: [detect, build, specs]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert the real-backend lane passed or was not needed
        env:
          DETECT: ${{ needs.detect.result }}
          RELEVANT: ${{ needs.detect.outputs.real_backend }}
          BUILD: ${{ needs.build.result }}
          SHARDS: ${{ needs.specs.result }}
        run: |
          set -euo pipefail
          echo "detect=$DETECT real_backend=${RELEVANT:-<empty>} build=$BUILD specs=$SHARDS"
          if [ "$DETECT" != "success" ]; then
            echo "::error::detect result=$DETECT; failing closed."
            exit 1
          fi
          check() {
            case "$2" in
              success) ;;
              skipped)
                if [ "$RELEVANT" != "false" ]; then
                  echo "::error::$1 was skipped but detect said real_backend='${RELEVANT}', not 'false'."
                  exit 1
                fi ;;
              *)
                echo "::error::$1 result=$2."
                exit 1 ;;
            esac
          }
          check build "$BUILD"
          check specs "$SHARDS"
