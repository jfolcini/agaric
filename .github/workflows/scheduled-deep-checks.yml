name: Scheduled deep checks

# Heavy correctness/perf tooling that is too slow for the per-PR critical
# path (the PR gate is `ci.yml` → `_validate.yml`). Runs weekly + on manual
# dispatch. None of these jobs is a required check; they surface signal via
# step summaries and uploaded artifacts, and a maintainer triages survivors.
#
# Lanes:
#   clippy-clean   — cache-busting full-workspace `cargo fmt --all --check` +
#                    `cargo clippy`: no rust-cache, cold compile, `--workspace`.
#                    The warm per-PR cache never re-lints unchanged targets when
#                    a lint is newly added to a Cargo.toml, so violations stay
#                    latent (this masked #1875's pedantic lints in the
#                    diagnostics bins + an app-lib test); the per-PR fmt/clippy
#                    hooks also omit --all/--workspace, skipping the diagnostics
#                    member entirely. This lane fails on that drift weekly.
#   bench-smoke    — #639/#978: SHARDED across N runners. Each shard compiles
#                    ONLY its slice of the criterion benches (single cohesive
#                    `cargo bench --no-run --bench …` invocation) then SMOKE-RUNS
#                    that slice once (`--test`) so a drifted seed/fixture fails
#                    CI instead of rotting silently. Sharding keeps the combined
#                    compile+smoke wall-clock under budget (the old single-runner
#                    `bench-compile` job blew the 90 min cap mid-smoke — #2122).
#   bench-slo      — #639: RUNS the interactive_slo SLO gate + the `#[ignore]`d
#                    20k-row perf gates, which nothing else exercises. Split out
#                    of the smoke shards so a smoke timeout can never skip the
#                    SLO gate again. `workflow_dispatch` can flip
#                    `slo_include_problem` to also measure the cache and
#                    MostLinked counterfactual probes (#2508 / #2585).
#   mutants        — #649/#3393: cargo-mutants scoped to the invariant core
#                    (op, op_log, reverse, loro/engine), SHARDED one job per
#                    (package, shard) with the counts derived from measured
#                    per-mutant cost. Non-blocking; the survivor list is the
#                    deliverable to triage into tests.
#   mutants-merge  — #3393: reassembles the shards into the single
#                    `mutants-out` artifact + step summary the filer below
#                    and every other reader have always consumed.
#   mutants-frontend — #886: StrykerJS scoped to a handful of pure,
#                    deterministic frontend libs (search-query's pure
#                    modules, agenda-sort, filters/model, date-utils,
#                    tree-utils — never components or Tauri IPC).
#                    Non-blocking, same triage-signal posture as `mutants`.
#   file-mutation-survivors — #2947: push-based triage loop for the two
#                    mutants lanes above. Diffs their combined survivor list
#                    against a single open tracking issue's last-known set
#                    and files/updates that ONE issue only on genuinely NEW
#                    survivors (see `scripts/file-mutation-survivors.mjs`).
#                    Since #3667 it also keeps one CHILD issue per AREA under
#                    that parent (`--children`), so the individual fixes are
#                    assignable/closable work items rather than lines in a
#                    40 KB body. Scheduled-event-only; needs `issues: write`.
#   fuzz           — #650/#2590/#2945: short coverage-guided fuzz runs over
#                    the raw-input parsers (snapshot decode, deeplink parse,
#                    Markdown/Obsidian import parse, FTS strip/sanitize, HTML
#                    link-metadata parse). Smoke-length here (the per-target
#                    time budget is small); a real fuzzing campaign runs longer
#                    out-of-band.
#   file-fuzz-findings — #3169: the same push-based triage loop as
#                    `file-mutation-survivors`, for the `fuzz` lane. Turns the
#                    lane's per-target status files into findings (build
#                    failure, crash reproducer, timeout, target that never
#                    ran), diffs them against a single tracking issue's
#                    last-known set and files/updates that ONE issue only on
#                    genuinely NEW findings (see
#                    `scripts/file-fuzz-findings.mjs`). Writes only when
#                    `CRON_EQUIVALENT` (below) holds; needs `issues: write`.
#   type-aware-lint — #4408: `oxlint --type-aware`, the type-aware half of
#                    the linter, which needs the separately-published
#                    `oxlint-tsgolint` (typescript-go) binary and so had never
#                    run against this repo at all. REPORTING-ONLY: it reports
#                    hundreds of pre-existing findings and failing on them
#                    would make the lane permanently red and therefore
#                    ignored. What it CAN fail on is liveness
#                    (`scripts/check-type-aware-liveness.mjs`), because a step
#                    that cannot fail is a step that can silently stop running
#                    — see #3330 and `mutants-frontend` above. Findings feed
#                    the per-rule burn-down; promote a rule to `error` in
#                    `.oxlintrc.json` once its count reaches zero.
#   report-scheduled-failures — #3359: the NOTIFICATION path for this whole
#                    workflow. Every lane above is non-blocking, so before
#                    this job a red lane was visible only to whoever opened
#                    the Actions tab (the #3163 fuzz break survived five days
#                    that way). It reads every other job's `needs.*.result`
#                    and keeps ONE rolling tracking issue that reopens on a
#                    newly-failing lane and closes itself when all are green
#                    (see `scripts/file-scheduled-failures.mjs`). Its own
#                    `if: failure()` bash fallback covers the reporter
#                    breaking. Needs `issues: write`.
on:
  schedule:
    # Mondays 04:17 UTC — off-peak, odd minute to avoid the top-of-hour
    # scheduler stampede. Weekly is enough for trend/triage tooling.
    #
    # e2e-tauri-weekly is deliberately scheduled earlier (02:43 Mon) so it
    # drains before this lane starts; the two used to share this exact minute
    # and contended for the same runner pool. See #3168.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      mutants_timeout:
        description: >-
          Test-phase timeout (seconds) for the mutants lane — applies to
          BOTH the unmutated baseline and every individual mutant (#3057:
          `--in-place` disables cargo-mutants' automatic 5x-baseline
          multiplier, so this fixed value is the only timeout in effect).
          Default carries headroom over the observed ~300s baseline
          test-phase need.
        required: false
        default: '900'
      fuzz_seconds:
        description: 'Per-target fuzz time budget (seconds)'
        required: false
        default: '300'
      slo_include_problem:
        description: 'Also run the interactive_slo cache/counterfactual probes (#2508/#2585) — off by default so the scheduled gate tracks only in-budget commands'
        required: false
        type: boolean
        default: false
      lanes:
        description: >-
          Which lanes to run: `all`, or a comma-separated subset of
          clippy-clean, bench-smoke, bench-slo, mutants, mutants-frontend,
          fuzz, type-aware-lint, full-suite. Re-running one lane after a fix
          costs that lane instead of the whole ~4 h matrix. Any subset makes
          the run a smoke run (see `CRON_EQUIVALENT`), because the tracking
          issues span lanes and a partial set must not rewrite them.
        required: false
        default: 'all'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # #3362 — the SINGLE source of truth for which benches the `bench-slo` job
  # warm-runs, and therefore which ones `bench-smoke` excludes from its shards.
  # Space-separated.
  #
  # Both jobs read THIS value: `bench-slo` builds its `--bench` arguments from
  # it, `bench-smoke` derives its exclusion from it, and each asserts every name
  # in it is a real bench target in `cargo metadata` before using it. The union
  # of the two lanes is then the whole bench universe by construction, and a
  # bench that fell out of both would have to be missing from `cargo metadata`
  # — which those assertions catch.
  #
  # Before this, `bench-smoke` excluded `interactive_slo` with a hardcoded
  # `grep -vx` and NOTHING asserted `bench-slo` still covered it: rename the
  # bench, rename the job, or drift its list, and the project's only automated
  # latency signal ran in NEITHER lane while every shard still exited 0.
  #
  # `scripts/check-bench-lane-coverage.mjs` (prek hook `bench-lane-coverage`)
  # holds the half the workflow cannot check about itself — that BOTH jobs
  # still exist and still read this variable outside comments.
  SLO_BENCHES: interactive_slo
  # #3960 — the runs the three writers (`file-mutation-survivors`,
  # `file-fuzz-findings`, `report-scheduled-failures`) treat as authoritative:
  # the cron, and a `workflow_dispatch` on `refs/heads/main` with every input
  # at its declared default, which tests exactly what the cron tests and so
  # writes for real. Any other ref (the tracking issues are repo-wide; a
  # branch's lane health is not the repository's) or a changed input (a
  # shortened budget can report a still-broken lane as recovered, and a lane
  # subset reports the lanes it did not run as skipped) is a smoke run: the
  # writers still perform every read and `--dry-run` the `gh` writes. Every
  # declared input appears in it, at its declared default.
  #
  # TWO of the three writers read this value directly. `file-mutation-survivors`
  # derives a narrower `LANE_AUTHORITATIVE` from it: since its tracking issue
  # was split per lane, `lanes == 'all'` is no longer part of ITS authority,
  # because a lane subset is complete data about every issue it writes. The
  # clause is still right for the other two, whose trackers span the whole run.
  # See that job for the full reasoning.
  CRON_EQUIVALENT: >-
    ${{ github.event_name == 'schedule'
      || (github.ref == 'refs/heads/main'
          && (github.event.inputs.mutants_timeout || '900') == '900'
          && (github.event.inputs.fuzz_seconds || '300') == '300'
          && (github.event.inputs.slo_include_problem || 'false') == 'false'
          && (github.event.inputs.lanes || 'all') == 'all') }}

jobs:
  # ---------------------------------------------------------------------------
  # select-lanes — resolves the `lanes` input into one boolean per lane.
  #
  # A job-level `if:` cannot read workflow `env`, so the choice is this job or
  # the same parse repeated in eight `if:` expressions. Once, here, because the
  # naive spelling is wrong in a way that reads fine: `contains(lanes,
  # 'mutants')` is ALSO true for `mutants-frontend`, so asking for the frontend
  # lane alone would silently start the 21-shard rust matrix. Matching is
  # therefore space-anchored against a whole-word list.
  #
  # Fails CLOSED on an unknown name. A typo would otherwise select no lane at
  # all: every lane `skipped`, which `file-scheduled-failures.mjs` reads as
  # failing (`isFailing` is `result !== 'success'`), so the run would report
  # eight broken lanes instead of one bad argument.
  # ---------------------------------------------------------------------------
  select-lanes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      clippy_clean: ${{ steps.pick.outputs.clippy_clean }}
      bench_smoke: ${{ steps.pick.outputs.bench_smoke }}
      bench_slo: ${{ steps.pick.outputs.bench_slo }}
      mutants: ${{ steps.pick.outputs.mutants }}
      mutants_frontend: ${{ steps.pick.outputs.mutants_frontend }}
      fuzz: ${{ steps.pick.outputs.fuzz }}
      type_aware_lint: ${{ steps.pick.outputs.type_aware_lint }}
      full_suite: ${{ steps.pick.outputs.full_suite }}
    steps:
      - name: Resolve the lane selection
        id: pick
        env:
          # Rides via `env:`, not inline `${{ }}`, per zizmor
          # template-injection: this is attacker-controllable in the sense
          # that anything a dispatch input carries reaches the shell.
          LANES: ${{ github.event.inputs.lanes || 'all' }}
        run: |
          set -euo pipefail
          known='clippy-clean bench-smoke bench-slo mutants mutants-frontend fuzz type-aware-lint full-suite'
          sel=$(printf '%s' "$LANES" | tr ',' ' ' | tr -s '[:space:]' ' ' \
                | sed 's/^ //; s/ $//')
          # Not `sel=all`: `github.event.inputs.lanes || 'all'` already covers
          # unset and empty, so the only inputs reaching here are
          # whitespace/comma-only ones — `lanes=' '`, `lanes=','` — and those
          # are typos. Erroring beats both silent readings: `sel=all` runs the
          # full ~4 h matrix, and simply falling through selects NOTHING (an
          # empty list makes the loop below iterate zero times, so the
          # unknown-lane branch never fires — measured, not assumed).
          if [ -z "$sel" ]; then
            echo "::error::lanes is empty after normalising '$LANES'. Use 'all' or a comma-separated subset of: $known"
            exit 1
          fi
          if [ "$sel" = all ]; then
            sel="$known"
          else
            for name in $sel; do
              case " $known " in
                *" $name "*) ;;
                *)
                  echo "::error::unknown lane '$name'. Known lanes: $known. Use 'all' or a comma-separated subset."
                  exit 1
                  ;;
              esac
            done
          fi
          # Output KEYS underscore the lane name: a hyphenated job id in
          # `needs.<id>` is proven here (`needs.mutants-merge.outputs.…`),
          # a hyphenated OUTPUT name is not, and `a.b-c` has a second
          # reading as subtraction. Same convention as `shards_merged`.
          for name in $known; do
            key=${name//-/_}
            case " $sel " in
              *" $name "*) echo "$key=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "$key=false" >> "$GITHUB_OUTPUT" ;;
            esac
          done
          echo "Lanes selected: $sel" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # clippy-clean — cache-busting full-workspace clippy. The per-PR clippy hook
  # restores the Swatinem rust-cache, which never re-lints already-compiled,
  # unchanged targets when a lint is newly added to a Cargo.toml — so the new
  # lint's violations stay latent until a cache-miss. This masked #1875's
  # pedantic lints in the diagnostics bins + an app-lib test. This lane builds
  # COLD (no rust-cache) and lints every workspace member (`--workspace`, which
  # the per-PR hook also omits), so latent drift fails here weekly instead of
  # ambushing the next unrelated Rust PR.
  # ---------------------------------------------------------------------------
  clippy-clean:
    needs: select-lanes
    if: needs.select-lanes.outputs.clippy_clean == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare apt (free dpkg lock, bound downloads)
        uses: ./.github/actions/prepare-apt

      - name: Install system dependencies
        # #4163: `apt-get update` is ADVISORY inside this action -- a mirror
        # that cannot serve the index no longer reds this job as a code
        # failure; the INSTALL decides. Measured trace + exit codes in
        # .github/actions/apt-install/action.yml.
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libssl-dev
            librsvg2-dev
            libsoup-3.0-dev
            pkg-config
            mold

      - name: Enable mold linker (CI-only .cargo/config.toml)
        run: |
          mkdir -p .cargo
          cp .cargo/config.toml.example .cargo/config.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Check formatting over the whole workspace
        working-directory: src-tauri
        # `--all`: check every member, incl. agaric-diagnostics (the per-PR
        # fmt hook omits it, so that crate's formatting is otherwise never
        # enforced). No compile needed, so it runs before the clippy build.
        run: cargo fmt --all --check

      # No Swatinem/rust-cache here ON PURPOSE: a warm cache is exactly what
      # masks newly-added lints on unchanged targets. This lane must compile
      # cold so clippy re-checks everything.

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare externalBin placeholder (FEAT-4f)
        # Tauri's build.rs validates externalBin paths on every cargo
        # invocation, including the clippy compile below.
        run: node scripts/prepare-external-bins.mjs --placeholder-only

      - name: Clean-compile clippy over the whole workspace
        working-directory: src-tauri
        # `--workspace`: lint every member, incl. agaric-diagnostics (the
        # per-PR hook omits it, so those bins are otherwise never linted).
        # `-D warnings`: any lint is a failure. Cold build → no cache masking.
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # bench-smoke (#639/#978) — SHARDED compile + seed/fixture smoke-run.
  #
  # A single `bench-compile` job used to compile all 29 benches (~36 min) then
  # smoke-run them (~53 min) on ONE runner; the combined walk blew the 90 min
  # cap and got cancelled mid-smoke (#2122), which ALSO skipped the
  # interactive_slo SLO gate that ran as a later step in the same job. This job
  # shards the compile+smoke across N runners: each shard compiles ONLY its
  # slice of the benches and smoke-runs exactly that slice, so no single runner
  # carries the whole suite. The SLO gate + ignored perf gates moved to the
  # separate `bench-slo` job below, immune to a smoke timeout.
  # ---------------------------------------------------------------------------
  bench-smoke:
    needs: select-lanes
    if: needs.select-lanes.outputs.bench_smoke == 'true'
    runs-on: ubuntu-24.04
    # Per-shard budget. The heavy 100K-seed benches cluster in the odd shards
    # (deterministic `index % 4` split): shards 0/2 smoke in ~1 min, but shard 1
    # (7 benches incl. the heavy cache/pagination seeds) has been observed to
    # need compile (~21 min) + smoke (~25+ min) — over the old 45-min cap, which
    # cancelled the shard mid-smoke (a false red, not a real bench failure). 70
    # gives headroom while staying well under the 90-min GitHub job ceiling.
    timeout-minutes: 70
    strategy:
      # Don't cancel sibling shards when one bench's seed drifts — we want every
      # shard's verdict in a single run, not a fail-fast that hides the rest.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare apt (free dpkg lock, bound downloads)
        uses: ./.github/actions/prepare-apt

      - name: Install system dependencies
        # #4163: `apt-get update` is ADVISORY inside this action -- a mirror
        # that cannot serve the index no longer reds this job as a code
        # failure; the INSTALL decides. Measured trace + exit codes in
        # .github/actions/apt-install/action.yml.
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libssl-dev
            librsvg2-dev
            libsoup-3.0-dev
            pkg-config
            mold

      - name: Enable mold linker (CI-only .cargo/config.toml)
        run: |
          mkdir -p .cargo
          cp .cargo/config.toml.example .cargo/config.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # ONE shared bench cache across all shards (own key — the bench/test
          # profile tree matches neither the lint nor the llvm-cov instrumented
          # tree, issue #813). The expensive, shard-invariant cost is the agaric
          # lib + deps + cargo-registry downloads; caching it once and having
          # every shard RESTORE it is the real win. Only shard 0 SAVES (on main)
          # so the four shards never race to write the same key — the per-shard
          # bench objects that differ are cheap to recompile on top of the warm
          # lib.
          shared-key: rust-bench
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 0 }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare externalBin placeholder (FEAT-4f)
        # Tauri's build.rs validates externalBin paths on every cargo
        # invocation, including the `cargo bench` build below.
        run: node scripts/prepare-external-bins.mjs --placeholder-only

      - name: Compile this shard's bench slice (no-run)
        working-directory: src-tauri
        shell: bash
        # Deterministic sharding: list every `[[bench]]` (minus the benches the
        # bench-slo job warm-runs, i.e. `$SLO_BENCHES`), sort for a stable
        # order, and keep
        # the names where `index % SHARD_TOTAL == SHARD_INDEX`. A bench newly
        # added to Cargo.toml automatically lands in some shard — no matrix edit
        # needed, so the #978 coverage guarantee can't silently regress.
        #
        # #3330: that guarantee used to be asserted by a comment only. The list
        # came from a text-shape heuristic — `grep -A1 '^\[\[bench\]\]'
        # Cargo.toml | sed -n 's/^name = "\(.*\)"/\1/p'` — which sees ONLY the
        # single line following the header, so a `[[bench]]` block whose first
        # key is `required-features` (or `harness`, or a comment) contributed
        # NOTHING and the bench vanished from every shard. Because the pipeline
        # runs inside a process substitution, `mapfile` never observes its exit
        # status, and the per-shard "no benches — nothing to do" early exit
        # below turned that into a green shard: a check that cannot fail. Now
        # the list is parsed STRUCTURALLY out of `cargo metadata` and
        # cross-checked against the number of `[[bench]]` blocks declared in
        # the manifest, so a dropped bench is a hard, loud failure.
        #
        # #3362: the EXCLUSION was the remaining hole. It was a hardcoded
        # `grep -vx interactive_slo` justified by "bench-slo warm-runs it",
        # with nothing checking that bench-slo still did. A rename or a drifted
        # bench-slo list dropped that bench from BOTH lanes and every shard
        # still exited 0, because from this step's point of view excluding it
        # is correct behaviour. The exclusion is now DERIVED from the
        # workflow-level `$SLO_BENCHES` that bench-slo runs, every excluded
        # name must be a real bench target, and the union of the two lanes is
        # asserted to equal the bench universe before anything is sharded.
        #
        # The slice compiles in a SINGLE `cargo bench --no-run --bench a
        # --bench b …` invocation. That is still ONE cohesive build: the cargo
        # #6313 libagaric_lib link race only bites SEPARATE per-bench cargo
        # invocations (see benches/AGENTS.md), so the prebuilt-binary approach
        # the smoke step relies on stays race-free.
        run: |
          set -euo pipefail
          # Structural bench list — cargo parses the manifest, we don't.
          mapfile -t declared_targets < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "agaric") | .targets[]
                     | select(.kind[] == "bench") | .name' \
            | sort)
          # Independent cross-check against the raw manifest. Deliberately
          # ONE-directional: every `[[bench]]` block must produce a target, so
          # FEWER targets than blocks means the extraction is broken and
          # benches are dropping out — hard fail. MORE targets than blocks is
          # benign (autobenches is on, so `benches/foo.rs` without a block is
          # auto-discovered and still lands in a shard) — note it, don't fail,
          # because a check that goes red when nothing is wrong gets ignored.
          declared_count="$(grep -c '^\[\[bench\]\]' Cargo.toml || true)"
          # The cross-check is only as live as this count. On a missing or
          # renamed manifest `grep -c` prints NOTHING, the `|| true` swallows
          # its exit status, and an empty string evaluates as 0 in arithmetic
          # context — so the `<` comparison below would silently pass no
          # matter how many benches went missing. Same class of bug as the
          # heuristic this step replaced, so assert the count is real first.
          if ! [[ "$declared_count" =~ ^[0-9]+$ ]] || (( declared_count == 0 )); then
            echo "::error::could not count [[bench]] blocks in src-tauri/Cargo.toml (got '$declared_count') — the manifest cross-check below would then silently pass regardless of how many benches dropped out of the shard union (#3330). Check that the manifest is still there and still declares its benches as \`[[bench]]\` blocks."
            exit 1
          fi
          if (( ${#declared_targets[@]} == 0 )); then
            echo "::error::bench discovery produced ZERO bench targets from cargo metadata — the shard union would cover nothing and every shard would report success (#3330). Check that the \`agaric\` package still exists and jq is available."
            exit 1
          fi
          if (( ${#declared_targets[@]} < declared_count )); then
            echo "::error::bench discovery found only ${#declared_targets[@]} bench target(s) but src-tauri/Cargo.toml declares $declared_count [[bench]] block(s): ${declared_targets[*]}. At least one declared bench is missing from the shard union, so it would never be compiled or smoke-run (#3330/#978)."
            exit 1
          fi
          if (( ${#declared_targets[@]} > declared_count )); then
            echo "::notice::${#declared_targets[@]} bench target(s) vs $declared_count [[bench]] block(s) — the extra one(s) are cargo-autodiscovered from src-tauri/benches/ and are sharded normally."
          fi
          # #3362 — the OTHER lane. `$SLO_BENCHES` is the workflow-level list
          # the bench-slo job warm-runs; this step excludes exactly that list
          # and nothing else. Every name in it must be a real bench target,
          # because a stale name here means bench-slo runs nothing for it while
          # this step still excludes it — the bench then runs in NEITHER lane.
          read -r -a slo_lane <<< "${SLO_BENCHES:-}"
          if (( ${#slo_lane[@]} == 0 )); then
            echo "::error::SLO_BENCHES is empty or unset — the shards would then smoke-run the SLO gate cold (its budgets need the warm bench-slo run) and the two lanes would have no agreed split at all (#3362)."
            exit 1
          fi
          for b in "${slo_lane[@]}"; do
            if ! printf '%s\n' "${declared_targets[@]}" | grep -qxF -- "$b"; then
              echo "::error::SLO_BENCHES names '$b', which is NOT a bench target in cargo metadata (universe: ${declared_targets[*]}). bench-slo would run nothing for it and this step excludes it, so it is in NEITHER lane and every shard would still exit 0 (#3362). If a bench was renamed, update SLO_BENCHES in this workflow's top-level env."
              exit 1
            fi
          done
          mapfile -t all < <(printf '%s\n' "${declared_targets[@]}" \
            | grep -vxF -f <(printf '%s\n' "${slo_lane[@]}") || true)
          if (( ${#all[@]} == 0 )); then
            echo "::error::no shardable benches after excluding the SLO_BENCHES lane (${slo_lane[*]}) — nothing would ever be compiled or smoke-run in ANY shard (#3330)."
            exit 1
          fi
          # The invariant #3362 is about, asserted rather than assumed: the two
          # lanes must PARTITION the bench universe — cover all of it (union)
          # and not overlap (disjoint). Both halves are needed, and each catches
          # an edit the other does not:
          #
          #   UNION      — any future edit that filters the list for a second
          #                reason (a skip list, a `required-features` bench)
          #                drops a bench out of BOTH lanes; caught here instead
          #                of going green.
          #   DISJOINT   — weakening or deleting the `grep -vxF` exclusion above
          #                puts the SLO bench back into the shards. The union
          #                check alone CANNOT see that (the union is still the
          #                whole universe), so it passed with every job green
          #                while `interactive_slo` got cold `--test`-smoke-run
          #                in a shard — exactly what the warm bench-slo lane
          #                exists to prevent, and enough to trip the bench's own
          #                inline latency-budget `panic!`s on a cold run.
          #                Added in review of #3362; the union check on its own
          #                left this mutation alive.
          lane_union="$(printf '%s\n' "${all[@]}" "${slo_lane[@]}" | sort -u)"
          universe="$(printf '%s\n' "${declared_targets[@]}" | sort -u)"
          if [ "$lane_union" != "$universe" ]; then
            echo "::error::bench lane union does not equal the bench universe (#3362). shards=[${all[*]}] bench-slo=[${slo_lane[*]}] universe=[${declared_targets[*]}]. Benches in neither lane are never compiled, never smoke-run and never timed, with every job still green."
            exit 1
          fi
          overlap="$(printf '%s\n' "${all[@]}" \
            | grep -xF -f <(printf '%s\n' "${slo_lane[@]}") || true)"
          if [ -n "$overlap" ]; then
            echo "::error::bench lane overlap (#3362): ${overlap//$'\n'/ } is in BOTH lanes. The shard exclusion must remove exactly \$SLO_BENCHES; a bench the warm bench-slo lane runs must not also be cold-smoke-run in a shard, where its latency budgets have no warm-up and can panic. shards=[${all[*]}] bench-slo=[${slo_lane[*]}]."
            exit 1
          fi
          echo "bench lanes partition ${#declared_targets[@]} target(s): ${#all[@]} sharded + ${#slo_lane[@]} warm-run — bench-slo: ${slo_lane[*]}"
          echo "bench universe (${#all[@]} shardable of $declared_count declared): ${all[*]}"
          mine=()
          for i in "${!all[@]}"; do
            if (( i % SHARD_TOTAL == SHARD_INDEX )); then mine+=("${all[i]}"); fi
          done
          if (( ${#mine[@]} == 0 )); then
            echo "shard $SHARD_INDEX/$SHARD_TOTAL has no benches — nothing to do"
            : > "$RUNNER_TEMP/shard-benches.txt"
            exit 0
          fi
          echo "shard $SHARD_INDEX/$SHARD_TOTAL benches: ${mine[*]}"
          # Persist the slice so the smoke step runs exactly what we compiled.
          printf '%s\n' "${mine[@]}" > "$RUNNER_TEMP/shard-benches.txt"
          args=(); for b in "${mine[@]}"; do args+=(--bench "$b"); done
          cargo bench --no-run "${args[@]}"

      - name: Smoke-run this shard's benches (--test) — #978 seed/fixture guard
        working-directory: src-tauri
        # WHAT THIS VALIDATES: that every bench's SEED/FIXTURE is still valid
        # against the live schema — NOT performance. Criterion's `--test` runs
        # each benchmark function exactly ONCE (a cold single shot, no timing
        # budget), so a bench whose hand-seeded raw-SQL fixture drifted from the
        # schema PANICS here and fails the shard. We run the PREBUILT binaries
        # from the `--no-run` build above (no per-bench recompile → race-free),
        # discovering them dynamically (no hardcoded hashes): each `[[bench]]`
        # becomes a `target/release/deps/<name>-<hash>` executable; we pick the
        # newest non-metadata file (`.d`/`.so`/`.dwp` filtered out).
        #
        # Concurrency 3 (`wait -n` gate) within the shard cuts wall-clock while
        # keeping peak memory sane on the 100K-seed benches. Each bench is
        # backgrounded with output BUFFERED to a per-bench `.log` and its verdict
        # to a per-bench `.status`; after the barrier we replay logs in order
        # (folding intact) and reduce. A MISSING `.status` (subshell killed
        # mid-run, e.g. OOM) is a FAILURE, never a silent pass.
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          newest_bench_bin() {
            local name="$1" newest="" f
            for f in "target/release/deps/${name}-"*; do
              [[ -f "$f" && -x "$f" ]] || continue
              case "$f" in *.d|*.so|*.dwp) continue ;; esac
              if [[ -z "$newest" || "$f" -nt "$newest" ]]; then
                newest="$f"
              fi
            done
            printf '%s' "$newest"
          }
          # The exact slice this shard compiled (written by the step above).
          # #3330: an ABSENT slice file means the compile step never reached
          # its `printf` — that is a broken step, not an empty shard, and must
          # not be swallowed by the empty-slice early exit below. The compile
          # step has already proven the GLOBAL bench list non-empty, so an
          # empty file here really does mean "this shard's modulo slice is
          # empty" and is a legitimate skip.
          if [ ! -f "$RUNNER_TEMP/shard-benches.txt" ]; then
            echo "::error::shard slice file $RUNNER_TEMP/shard-benches.txt is missing — the compile step did not run to completion; refusing to report this shard as smoked (#3330)."
            exit 1
          fi
          mapfile -t benches < "$RUNNER_TEMP/shard-benches.txt"
          if (( ${#benches[@]} == 0 )); then
            echo "no benches for this shard — skipping smoke"
            exit 0
          fi
          status_dir="$(mktemp -d)"
          smoke_one() {
            local name="$1" bin
            bin="$(newest_bench_bin "$name")"
            if [ -z "$bin" ]; then
              echo "::error::no prebuilt binary for bench '$name' (did --no-run compile it?)"
              echo fail > "$status_dir/$name.status"
              return
            fi
            echo "running: $bin --test"
            if "$bin" --test; then
              echo "smoke OK: $name"
              echo ok > "$status_dir/$name.status"
            else
              echo "::error::bench '$name' FAILED its --test smoke run (seed/fixture drift?)"
              echo fail > "$status_dir/$name.status"
            fi
          }
          jobs=$(( $(nproc) < 3 ? $(nproc) : 3 ))
          echo "smoke-running ${#benches[@]} benches at concurrency $jobs"
          running=0
          for name in "${benches[@]}"; do
            smoke_one "$name" > "$status_dir/$name.log" 2>&1 &
            running=$((running + 1))
            if (( running >= jobs )); then
              wait -n
              running=$((running - 1))
            fi
          done
          wait
          for name in "${benches[@]}"; do
            echo "::group::smoke $name"
            [ -f "$status_dir/$name.log" ] && cat "$status_dir/$name.log"
            echo "::endgroup::"
            if [ ! -f "$status_dir/$name.status" ]; then
              echo "::error::bench '$name' wrote no status — killed before completion (OOM?)"
              fail=1
            elif [ "$(cat "$status_dir/$name.status")" = fail ]; then
              fail=1
            fi
          done
          exit "$fail"

  # ---------------------------------------------------------------------------
  # bench-slo (#639) — the interactive_slo SLO gate + the `#[ignore]`d 20k-row
  # perf gates, split out of the smoke shards so a smoke timeout can never skip
  # them (the old single-job layout ran the SLO gate AFTER the whole smoke walk,
  # so the #2122 mid-smoke cancellation took the gate down with it). A
  # `workflow_dispatch` can also flip `slo_include_problem` to measure the
  # cache/counterfactual probes (#2508 / #2585).
  # ---------------------------------------------------------------------------
  bench-slo:
    needs: select-lanes
    if: needs.select-lanes.outputs.bench_slo == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare apt (free dpkg lock, bound downloads)
        uses: ./.github/actions/prepare-apt

      - name: Install system dependencies
        # #4163: `apt-get update` is ADVISORY inside this action -- a mirror
        # that cannot serve the index no longer reds this job as a code
        # failure; the INSTALL decides. Measured trace + exit codes in
        # .github/actions/apt-install/action.yml.
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libssl-dev
            librsvg2-dev
            libsoup-3.0-dev
            pkg-config
            mold

      - name: Enable mold linker (CI-only .cargo/config.toml)
        run: |
          mkdir -p .cargo
          cp .cargo/config.toml.example .cargo/config.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Own bench-profile cache (separate key from the smoke shards so this
          # job's single writer never races them). Caches the agaric lib + deps
          # + cargo registry + the interactive_slo bench + the nextest perf-gate
          # test binaries, so week-over-week this job restores warm.
          shared-key: rust-bench-slo
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare externalBin placeholder (FEAT-4f)
        # Tauri's build.rs validates externalBin paths on every cargo
        # invocation, including `cargo bench` / nextest below.
        run: node scripts/prepare-external-bins.mjs --placeholder-only

      - name: Run interactive_slo SLO gate (#639)
        working-directory: src-tauri
        # The bench self-`panic!`s if any command's accumulated mean latency
        # exceeds its inline budget, so a non-zero exit IS the gate.
        #
        # #3362: WHICH benches this lane runs is no longer a hardcoded name
        # here. It is the workflow-level `$SLO_BENCHES` — the same list
        # `bench-smoke` excludes from its shards — and every name in it is
        # verified against `cargo metadata` before we run it. A bench renamed
        # in Cargo.toml but not here used to be excluded from the shards AND
        # absent from this lane, i.e. never run, with both jobs green.
        #
        # By default the #2508 cache direct-query probes and #2585 MostLinked
        # cache/counterfactual probes stay gated OUT (SLO_INCLUDE_PROBLEM
        # unset), so the scheduled gate tracks only the default command set. A
        # `workflow_dispatch` with `slo_include_problem=true` exports
        # SLO_INCLUDE_PROBLEM=1 to MEASURE those probes @ 100K. We export it
        # ONLY when asked, because the bench treats ANY value (even an empty
        # string) as "on".
        #
        # #978: tee stdout so the SLO summary step can capture the per-command
        # observed-mean-vs-budget lines. `pipefail` preserves the bench's exit
        # code through the pipe so a budget breach still fails the run.
        shell: bash
        env:
          SLO_INCLUDE_PROBLEM_INPUT: ${{ github.event.inputs.slo_include_problem || 'false' }}
        run: |
          set -euo pipefail
          if [ "$SLO_INCLUDE_PROBLEM_INPUT" = "true" ]; then
            echo "SLO_INCLUDE_PROBLEM=1 — cache/counterfactual probes ENABLED via dispatch (#2508/#2585)"
            export SLO_INCLUDE_PROBLEM=1
          fi
          # Same structural bench list `bench-smoke` derives its exclusion from.
          mapfile -t declared_targets < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "agaric") | .targets[]
                     | select(.kind[] == "bench") | .name' \
            | sort)
          if (( ${#declared_targets[@]} == 0 )); then
            echo "::error::cargo metadata reported ZERO bench targets — this lane cannot verify it is running the benches bench-smoke excludes on its behalf (#3362)."
            exit 1
          fi
          read -r -a slo_lane <<< "${SLO_BENCHES:-}"
          if (( ${#slo_lane[@]} == 0 )); then
            echo "::error::SLO_BENCHES is empty or unset — this lane would run NOTHING while bench-smoke still excludes its list, so those benches would run in neither lane (#3362)."
            exit 1
          fi
          args=()
          for b in "${slo_lane[@]}"; do
            if ! printf '%s\n' "${declared_targets[@]}" | grep -qxF -- "$b"; then
              echo "::error::SLO_BENCHES names '$b', which is NOT a bench target in cargo metadata (universe: ${declared_targets[*]}). bench-smoke excludes it on this lane's behalf, so it is in NEITHER lane (#3362). If a bench was renamed, update SLO_BENCHES in this workflow's top-level env."
              exit 1
            fi
            args+=(--bench "$b")
          done
          echo "bench-slo lane runs: ${slo_lane[*]}"
          # Log name is historical (`interactive_slo.log`) and is what the
          # summary step below parses; it carries every bench in the lane.
          cargo bench "${args[@]}" 2>&1 | tee interactive_slo.log

      - name: SLO summary + threshold flagging (#978)
        if: always()
        working-directory: src-tauri
        # MEASURE-not-imagine: every number here is read back from the bench
        # itself — the observed mean and the budget both come from the
        # `interactive_slo:` lines the bench `println!`s (format defined in
        # benches/interactive_slo.rs::assert_under_budget). We invent no
        # thresholds; we surface the bench's own pass/fail per command and
        # flag any line the bench did not mark PASS. Robust to no data:
        # if the log is missing or matches nothing, we say so and exit 0.
        shell: bash
        run: |
          {
            echo "## interactive_slo (#978) — observed vs budget @ 100K"
            echo
            if [ ! -f interactive_slo.log ]; then
              echo "_No interactive_slo.log produced (bench step did not run) — see job log._"
              exit 0
            fi
            # Stable lines, e.g.:
            #   interactive_slo: get_block @ 100K = 0.42 ms <= budget 1 ms (PASS)
            #   interactive_slo: foo SKIPPED (set SLO_INCLUDE_PROBLEM=1 ...)
            if ! grep -q '^interactive_slo:' interactive_slo.log; then
              echo "_No \`interactive_slo:\` lines found in the bench output._"
              echo "_(The bench format may have changed — see benches/interactive_slo.rs.)_"
              exit 0
            fi
            echo "| command | observed | budget | status |"
            echo "|---------|---------:|-------:|:------:|"
            # PASS lines carry both numbers; emit them as a row. Any
            # interactive_slo: line that is neither PASS nor SKIPPED is a
            # FLAG (the bench would normally panic first, but if a future
            # tier reports without asserting we still surface it).
            grep '^interactive_slo:' interactive_slo.log | while IFS= read -r line; do
              body="${line#interactive_slo: }"
              if printf '%s' "$body" | grep -q '(PASS)$'; then
                cmd="${body%% = *}"
                rest="${body#* = }"
                obs="${rest%% <= budget *}"
                bud="${rest#* <= budget }"; bud="${bud% (PASS)}"
                echo "| \`$cmd\` | $obs | $bud | PASS |"
              elif printf '%s' "$body" | grep -q 'SKIPPED'; then
                cmd="${body%% SKIPPED*}"
                echo "| \`$cmd\` | — | — | SKIPPED |"
              else
                echo "| (raw) | | | FLAG |"
                echo "| \`$body\` | | | |"
              fi
            done
            echo
            echo "_Budgets are sourced from the bench's inline constants; a"
            echo "breach \`panic!\`s the gate above. Track these rows across"
            echo "weekly runs for drift._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SLO results (log + criterion estimates)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interactive-slo
          # The raw log (stable observed/budget lines) plus criterion's own
          # JSON estimates (medians/MAD per benchmark id) for finer-grained
          # over-time trend analysis beyond the mean-vs-budget gate.
          path: |
            src-tauri/interactive_slo.log
            src-tauri/target/criterion/**/estimates.json
            src-tauri/target/criterion/**/benchmark.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Install cargo-nextest via prebuilt binary
        uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-nextest

      - name: Run the #[ignore]d perf gates (#639)
        working-directory: src-tauri
        # The 20k-row perf gates are `#[ignore]`d so the per-PR suite doesn't
        # pay for 20k-row seeding; they assert wall-clock budgets and fail on
        # regression. BUT `--run-ignored=only` runs EVERY `#[ignore]`d test, not
        # just the perf gates — so it would also sweep in any intentionally-
        # failing documented oracle kept `#[ignore]`d AND failing on purpose as
        # a greppable design-divergence marker. Such a test must NOT red this
        # gate, so it gets excluded via `-E`.
        #
        # THE RULE: the `#[ignore]` and the `-E` exclusion go together. Adding a
        # failing oracle means adding its exclusion; un-`#[ignore]`ing it (or
        # renaming it) means removing that exclusion in the same commit. A stale
        # exclusion is worse than none: `-E 'not test(<name>)'` for a name that
        # no longer exists matches nothing and fails silently, and if the name
        # DOES come back it silently un-gates a test that is now expected to
        # pass.
        #
        # There are currently NO such oracles, so the list is deliberately
        # empty and no `-E` is passed. It was last non-empty for the batch-vs-
        # fold reproducers (#3818, #3819) and for a reverse-round-trip oracle;
        # all three were fixed or rewritten to pin the real behaviour, and lost
        # their `#[ignore]` and their exclusion together. (The reverse one had
        # been left behind here under its pre-rename name — the exact silent-
        # no-op this rule exists to prevent.) Every remaining `#[ignore]`d test
        # in the workspace is a perf gate, a measurement harness, or a manual
        # codegen task, and all of them are expected to PASS in this sweep.
        # `--workspace` (#3212): bare form is package-scoped to `agaric` only,
        # and since #4242 it is no longer a no-op — the three
        # `..._residency_at_*_blocks_4242` measurement tests live in
        # `agaric-store` (`cache::tests`) and are reachable ONLY through
        # `--workspace`. Dropping the flag would silently skip them, which is
        # exactly the failure mode #3212 added it to prevent. Those three read
        # `/proc/self/status` and are `#[cfg(target_os = "linux")]`. That
        # hole is no longer held shut by this comment: #4273 added
        # `residency_lane_is_not_linux_4273` plus same-named `#[ignore]`d twins
        # under `cfg(not(target_os = "linux"))`, so if this lane ever leaves
        # `ubuntu-*` the sweep FAILS LOUDLY instead of quietly reporting three
        # fewer tests. Keep `runs-on: ubuntu-*` — but the assertion, not this
        # paragraph, is what enforces it.
        run: >-
          cargo nextest run --workspace --run-ignored=only --no-fail-fast

  # ---------------------------------------------------------------------------
  # mutants (#649) — cargo-mutants scoped (via `.cargo/mutants.toml`'s
  # `examine_globs` — see that file's header: the path is load-bearing, #3386)
  # to the invariant core, SHARDED one job per (package, shard) since #3393.
  # Non-blocking: the deliverable is the survivor list in `mutants-merge`'s
  # step summary + its merged artifact, which a maintainer triages into test
  # gaps. `|| true` is intentional — a surviving mutant is signal, not a CI
  # failure (this lane is not a required check and is never gated).
  # ---------------------------------------------------------------------------
  mutants:
    needs: select-lanes
    if: needs.select-lanes.outputs.mutants == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      # A shard that dies must not cancel the other 20: each carries a
      # different slice of the surface, and the slices that DID run are still
      # the week's deliverable.
      fail-fast: false
      matrix:
        # #3393 — the shard counts are DERIVED, not guessed. A shard's
        # capacity is floor((MUTANTS_WALL_BUDGET - baseline) / one viable
        # mutant), both measured on this 4-vCPU runner, and a package's shard
        # count is the smallest n whose largest round-robin slice,
        # ceil(generated/n), fits that capacity with a mutant to spare. The
        # spare one is the point: a slice sized at exactly capacity truncates
        # on any suite growth, and a truncated shard still records a Success
        # baseline, so it counts as usable and its untested survivors go
        # missing from `missed.txt` without anything going red (#3364). The
        # measurements and the arithmetic are in
        # `docs/session-log/session-1486-mutants-shard-matrix.md`; the results:
        #
        #   agaric-store   125 mutants, 42/shard →  3 shards  (cap 44)
        #   agaric-engine  566 mutants, 32/shard → 18 shards  (cap 44, est.)
        #
        # `agaric-engine` runs at 32/shard rather than the 44 the rule allows:
        # its capacity is borrowed from `agaric-store`, and one mutant of slack
        # only means something on a measured cost. Its PARTIAL notices on the
        # first crons are what settle the estimate. The 183 `reverse/**`
        # mutants that were the whole `agaric` surface (6/shard, 31 shards,
        # cap 7 — every one paid the app crate's build) moved into
        # `agaric-engine` with #4499 phase 1 and are sized here at the engine's
        # per-mutant cost; the app package has no examine_glob left and no
        # shard. `-p` runs only the examined package's tests, so the suites
        # that kill those mutants moved with them: `agaric-engine/tests/
        # reverse_tests.rs` and `reverse_proptest_b1.rs`. Two suites stayed in
        # the app package and kill nothing this lane counts: the eleven
        # reverse tests that need the app's `Materializer` in
        # `tests/app_tests/reverse_tests.rs`, and the
        # `compute_reverse_batch_matches_per_op_fold` parity oracle in
        # `src/bulk_equivalence/reverse_batch.rs`, which `-p agaric-engine`
        # never runs.
        #
        # `shards` is the denominator every shard of that package must agree on
        # (cargo-mutants: "all shards must be run with the same arguments and
        # the same sharding denominator, or the results will be meaningless"),
        # and the indices must run 0..n-1 or the missing index is a slice
        # nobody tests — indistinguishable downstream from a smaller package.
        # `scripts/check-mutants-scope.mjs` checks both.
        include:
          - { package: agaric-store, shard: 0, shards: 3 }
          - { package: agaric-store, shard: 1, shards: 3 }
          - { package: agaric-store, shard: 2, shards: 3 }
          - { package: agaric-engine, shard: 0, shards: 18 }
          - { package: agaric-engine, shard: 1, shards: 18 }
          - { package: agaric-engine, shard: 2, shards: 18 }
          - { package: agaric-engine, shard: 3, shards: 18 }
          - { package: agaric-engine, shard: 4, shards: 18 }
          - { package: agaric-engine, shard: 5, shards: 18 }
          - { package: agaric-engine, shard: 6, shards: 18 }
          - { package: agaric-engine, shard: 7, shards: 18 }
          - { package: agaric-engine, shard: 8, shards: 18 }
          - { package: agaric-engine, shard: 9, shards: 18 }
          - { package: agaric-engine, shard: 10, shards: 18 }
          - { package: agaric-engine, shard: 11, shards: 18 }
          - { package: agaric-engine, shard: 12, shards: 18 }
          - { package: agaric-engine, shard: 13, shards: 18 }
          - { package: agaric-engine, shard: 14, shards: 18 }
          - { package: agaric-engine, shard: 15, shards: 18 }
          - { package: agaric-engine, shard: 16, shards: 18 }
          - { package: agaric-engine, shard: 17, shards: 18 }
    # Job-level so the run step and the guard step below quote the SAME
    # number: the guard names the budget in its partial-coverage notice, and
    # two copies of it would drift (#3386).
    #
    # 5400 s is the OTHER derived number, and small on purpose: many short
    # shards finish the sweep in about half the wall-clock of a few long ones,
    # and the extra baselines they each pay for cost nothing on a public repo.
    # The arithmetic against a larger budget is in the session log.
    env:
      MUTANTS_WALL_BUDGET: '5400'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare apt (free dpkg lock, bound downloads)
        uses: ./.github/actions/prepare-apt

      - name: Install system dependencies
        # #4163: `apt-get update` is ADVISORY inside this action -- a mirror
        # that cannot serve the index no longer reds this job as a code
        # failure; the INSTALL decides. Measured trace + exit codes in
        # .github/actions/apt-install/action.yml.
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libssl-dev
            librsvg2-dev
            libsoup-3.0-dev
            pkg-config
            mold

      - name: Enable mold linker (CI-only .cargo/config.toml)
        run: |
          mkdir -p .cargo
          cp .cargo/config.toml.example .cargo/config.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: rust-mutants
          # ONE saver, not 46 (#3393): every shard restores the same target
          # dir, and 46 concurrent saves of a multi-GB cache would churn the
          # repository's 10 GB cache quota and evict other workflows' caches
          # for no gain. `agaric` shard 0 is the saver because `agaric` is the
          # package whose build the other shards benefit most from.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.package == 'agaric' && matrix.shard == 0 }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare externalBin placeholder (FEAT-4f)
        run: node scripts/prepare-external-bins.mjs --placeholder-only

      - name: Install cargo-mutants + cargo-nextest via prebuilt binary
        # PINNED (#3393): the shard counts above are derived from per-mutant
        # costs measured under 27.1.0, and shards must agree on how the mutant
        # list is divided — a floating version can change either.
        uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest

      - name: Mutation-scope guard (#3386) — config is readable and every glob is live
        # Runs BEFORE the expensive step, because every failure mode it checks
        # for produces a run that burns its full budget and yields nothing:
        #   * the config sitting anywhere but `src-tauri/.cargo/mutants.toml`
        #     (cargo-mutants then silently uses `Config::default()`),
        #   * an `examine_globs` entry that matches no file, or matches files
        #     in a package this lane does not examine (the #2621 arch-wave
        #     drift: op.rs / op_log / loro-engine moved to `agaric-store` and
        #     `agaric-engine`, which a bare `cargo mutants` never mutates),
        #   * a shard matrix whose indices do not cover 0..n-1 for the `shards`
        #     denominator each entry declares (#3393),
        #   * the paths the steps below read drifting away from where
        #     cargo-mutants actually writes (`--output DIR` creates
        #     `DIR/mutants.out`, not `DIR`).
        # Same guard runs as a `manual`-stage prek hook on every PR (#4556).
        run: node scripts/check-mutants-scope.mjs

      - name: Run cargo-mutants (scoped to invariant core)
        working-directory: src-tauri
        # Scope, test-tool (nextest), and timeouts come from
        # `src-tauri/.cargo/mutants.toml`.
        # `--in-place` avoids the default copy-to-tmp (faster; the runner is
        # ephemeral). Safe HERE and not on a dev box: an interrupted
        # `--in-place` run can leave a mutant written into a TRACKED source
        # file, and a mutant a proptest catches makes proptest write a
        # `<pkg>/proptest-regressions/<mod>.txt` seed that only fails under
        # that mutant — both tracked, so .gitignore will not save you.
        # Reproduce a survivor locally without `--in-place`, or in a
        # throwaway worktree. Never gate here: surviving mutants are triage signal
        # (the *zero-coverage guard* step below — deliberately OUTSIDE this
        # `|| true` — is what catches a false-green baseline timeout; see
        # its comment for the #3057 story).
        #
        # #3057: cargo-mutants docs (mutants.rs/timeouts.html) — the
        # automatic "5x baseline test time" timeout multiplier is DISABLED
        # whenever `--baseline=skip` OR `--in-place` is set; since this lane
        # already passes `--in-place`, `--timeout` is the ONLY timeout in
        # effect and applies to BOTH the baseline's test phase and every
        # mutant's. The observed failure was a ~322s baseline BUILD (no cap
        # — `--build-timeout` is off by default, so that phase always ran to
        # completion) followed by a baseline TEST phase that blew the old
        # 300s `--timeout`, aborting the whole run with `total_mutants: 0`
        # while `cargo mutants ... || true` still exited 0 (false-green).
        # Hence `--timeout` 900 and a `--build-timeout` of 600: sized for
        # headroom, not to make the baseline fit. Narrowing
        # `.cargo/mutants.toml`'s test scope would have been the cheaper fix
        # and would have weakened the coverage signal this lane exists to
        # measure. Both were sized against a WORKSPACE baseline; since #3393
        # a shard is `-p "$PACKAGE"`, so the phase `--timeout` applies to is
        # ONE package's suite — 87 s for `agaric-store`, and the app crate's
        # 473 s suite (1.90x under the 900 s) no longer runs here at all: since
        # #4499 phase 1 moved `reverse/` down, `agaric` has no examine_glob and
        # no shard, and `agaric-engine`'s suite is the one that grows, across
        # 18 shards at once.
        # The dispatch input rides via `env:` (not inline `${{ }}`) so it
        # can't expand into the shell as code (zizmor template-injection);
        # the matrix values ride the same way for the same reason.
        #
        # `-p "$PACKAGE"` (#3393) replaces the `--workspace` this step used to
        # pass. Per cargo-mutants' package-selection docs, `-p` scopes mutant
        # GENERATION to that package, and the test scope follows it: the
        # baseline "runs the tests from all and only the packages for which
        # mutants will be generated", and "each mutant runs only the tests
        # from the package that's being mutated". That is what makes a shard
        # affordable: the workspace baseline runs all three suites (1088 s) and
        # every shard would pay it, where a package-scoped one pays only its
        # own — 164 s for `agaric-store`. The union of the matrix's packages is
        # what keeps every `examine_globs` entry reachable;
        # `check-mutants-scope.mjs` asserts that union, not this one job's slice.
        #
        # `--shard k/n --sharding round-robin`: shards are `k/n` with k in
        # 0..n-1 and n the denominator every shard of a package repeats;
        # `round-robin` assigns mutant i to shard i % n, so a truncated shard
        # still covers a SPREAD of the package's files rather than the front
        # of one file (the default `slice` algorithm is the deterministic
        # prefix this lane used to be, one package at a time).
        #
        # No `--baseline=skip`, though it would buy back one baseline per
        # shard: the zero-coverage guard below is built on a Success baseline
        # in this shard's own outcomes.json, and a lane that cannot detect its
        # own false green is exactly what #3057 was. The shard capacities in
        # the matrix above already pay for it.
        #
        # No `--output`: `-o/--output DIR` means "create mutants.out WITHIN
        # this directory" — so `--output mutants-out` wrote
        # `src-tauri/mutants-out/mutants.out/`, while the guard, the summary
        # and the `file-mutation-survivors` filer all read `mutants-out/…`.
        # Every one of them was reading a path that never existed (#3386),
        # which is why `--require-input` in the filer (#3387) could never see a
        # `missed.txt`. The default location, `src-tauri/mutants.out/`, is
        # what the steps below read.
        #
        # The wall-clock budget stays what it was, now per shard. 90 min
        # leaves ~25 min of the job's 120 for setup, install and upload
        # (observed: ~2 min of setup before cargo-mutants starts). Without it
        # a slow shard would be CANCELLED at 120 minutes, the guard step below
        # would never run, and the lane would be red for a brand-new reason.
        # `timeout --signal=INT` instead makes cargo-mutants stop cleanly: it
        # writes the partial `outcomes.json` / `missed.txt` for the mutants it
        # did test, with the baseline still recorded as Success, so everything
        # the steps below read is present and honest (measured on cargo-mutants
        # 27.1.0: a SIGINT'd run left `total_mutants: 5` against a 20-mutant
        # `mutants.json`).
        #
        env:
          MUTANTS_TIMEOUT: ${{ github.event.inputs.mutants_timeout || '900' }}
          MUTANTS_BUILD_TIMEOUT: '600'
          PACKAGE: ${{ matrix.package }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          timeout --signal=INT --kill-after=120 "$MUTANTS_WALL_BUDGET" \
            cargo mutants --in-place -p "$PACKAGE" \
              --shard "$SHARD/$SHARDS" --sharding round-robin \
              --timeout "$MUTANTS_TIMEOUT" \
              --build-timeout "$MUTANTS_BUILD_TIMEOUT" || true

      - name: Zero-coverage guard (#3057) — the load-bearing acceptance item
        # Deliberately OUTSIDE the `|| true` above: a baseline that times out
        # or fails aborts the run with `total_mutants: 0`, and the previous
        # step's `|| true` would otherwise let that read as a green job (the
        # exact false-green this issue is about). This step is the ONLY
        # place that fails the job — and it fails ONLY on zero coverage /
        # a non-Success baseline, never on surviving (missed) mutants, which
        # stay pure triage signal per the `mutants` lane's whole design.
        #
        # Per SHARD since #3393, unchanged in substance: each shard runs its
        # own baseline and writes its own outcomes.json, so a shard whose
        # baseline broke reds that shard while the other 20 still report. A
        # merge-time-only guard would let one dead shard hide inside the
        # merged totals.
        #
        # Schema (sourcefrog/cargo-mutants `src/outcome.rs` `LabOutcome` /
        # `ScenarioOutcome`): the top-level object carries an aggregate
        # `total_mutants` counter plus an `outcomes[]` array of per-scenario
        # entries; the baseline's entry has `scenario == "Baseline"` and a
        # `summary` that is one of `Success` / `Failure` / `Timeout` (the
        # baseline never produces `Unviable`/`CaughtMutant`/`MissedMutant` —
        # those are mutant-only outcomes). We gate on:
        #   (a) outcomes.json missing entirely (crashed before writing any
        #       output — strictly worse than zero coverage, same verdict),
        #   (b) total_mutants == 0 (the literal #3057 symptom), or
        #   (c) the Baseline scenario's own summary != Success (covers
        #       Timeout/Failure even in the — currently unreachable per the
        #       source — case where total_mutants ended up nonzero anyway).
        if: always()
        working-directory: src-tauri
        run: |
          set -uo pipefail
          outcomes=mutants.out/outcomes.json
          if [ ! -f "$outcomes" ]; then
            echo "::error::cargo-mutants wrote no $outcomes — the run crashed or aborted before producing any output; treating as zero mutation coverage (#3057)."
            exit 1
          fi
          if ! jq -e . "$outcomes" >/dev/null 2>&1; then
            echo "::error::$outcomes is not valid JSON — treating as zero mutation coverage (#3057)."
            exit 1
          fi
          total=$(jq -r '.total_mutants // 0' "$outcomes")
          baseline_summary=$(jq -r '([.outcomes[]? | select(.scenario == "Baseline") | .summary] | first) // "MISSING"' "$outcomes")
          fail=0
          if [ "$baseline_summary" != "Success" ]; then
            echo "::error::cargo-mutants baseline did not succeed (summary=$baseline_summary) — the unmutated build/test baseline failed or timed out, so any results are unreliable. Consider raising MUTANTS_TIMEOUT / MUTANTS_BUILD_TIMEOUT further, or fix the underlying baseline failure."
            fail=1
          fi
          if ! [ "$total" -gt 0 ] 2>/dev/null; then
            echo "::error::cargo-mutants tested ZERO mutants (total_mutants=$total) — this is the #3057 false-green: the previous step's \`|| true\` would otherwise let this report as job success with no mutation coverage at all."
            fail=1
          fi
          if [ "$fail" -eq 1 ]; then
            exit 1
          fi
          # #3386: the wall-clock budget can stop a shard part-way through its
          # slice. That is an acceptable, DELIBERATE truncation — but it must
          # never be silent, so state it. `mutants.json` is this shard's
          # generated slice (written before testing begins); `total_mutants`
          # is what was actually tested.
          generated=$(jq -r 'length' mutants.out/mutants.json 2>/dev/null || echo 0)
          echo "zero-coverage guard OK: total_mutants=$total baseline=$baseline_summary (surviving/missed mutants, if any, are triage signal — see the summary in \`mutants-merge\` — and never gate this job)"
          if [ "$generated" -gt 0 ] && [ "$total" -lt "$generated" ]; then
            echo "::notice::mutation coverage is PARTIAL for this shard: $total of $generated mutants in its slice were tested before the ${MUTANTS_WALL_BUDGET}s wall-clock budget stopped it. Round-robin sharding means the untested remainder is spread across the package's files rather than concentrated at its tail; if this fires every week the package needs more shards (see the derivation on the matrix above)."
          fi

      - name: Upload this shard's mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # One artifact per shard — upload-artifact v7 rejects a duplicate
          # name. `mutants-merge` globs them back into the single
          # `mutants-out` artifact the filer downloads.
          name: mutants-out-${{ matrix.package }}-${{ matrix.shard }}
          # Must be cargo-mutants' output directory ITSELF, not a parent:
          # `file-mutation-survivors` reads `mutants-artifact/missed.txt`
          # flat off the downloaded artifact root (#3386/#3387).
          path: src-tauri/mutants.out/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # mutants-merge (#3393) — reassembles the shards into the ONE `mutants-out`
  # layout the summary and `file-mutation-survivors` have always read. Sharding
  # is the only thing that changed about this lane; teaching every downstream
  # reader about shards would have been the larger change.
  # ---------------------------------------------------------------------------
  mutants-merge:
    needs: [mutants, select-lanes]
    # `always()`: a dead shard must not take the surviving 20 shards' results
    # with it. A SHORT merge is published for the same reason and reported as
    # a warning — see the merge step, which also puts the filer in dry-run.
    # The lane clause is what `always()` would otherwise defeat: without it a
    # run that deselects `mutants` would still merge, over zero shards.
    if: always() && needs.select-lanes.outputs.mutants == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Read by `file-mutation-survivors` below, which must not rewrite the
    # tracking issue from a partial survivor set.
    outputs:
      shards_merged: ${{ steps.merge.outputs.merged }}
      shards_expected: ${{ steps.merge.outputs.expected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download every shard's output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # NOT `merge-multiple: true`: every shard writes the same file names,
          # so a flat merge would silently keep one shard's missed.txt and drop
          # the rest. One directory per shard, concatenated below; the merge
          # `find`s by file name, so it does not depend on how the action lays
          # the extraction out.
          pattern: mutants-out-*
          path: shards

      - name: Merge the shards into one mutants.out
        id: merge
        # The merge is only as complete as the shards that uploaded, and with
        # `fail-fast: false` across 21 jobs the realistic failure is a HANDFUL
        # of dead shards, not all of them. The shards that DID run are real
        # signal, so a short merge is published — what must not run on a short
        # set is the FILER'S REWRITE: the missing shards' survivors are simply
        # absent from `missed.txt`, and `file-mutation-survivors` diffs that
        # file against the tracking issue's marker block, its only cross-run
        # memory, so the absent lines report as "Resolved since last run",
        # leave the tracked set and come back as new next week (#3364).
        # Hence: count the shards that actually produced results, publish
        # either way, and export the counts so the filer job below can force
        # `--dry-run` (every read, no `gh` write) when they disagree. Only a
        # merge with nothing USABLE in it still fails — there is no artifact
        # worth publishing and no summary to render.
        #
        # The expected count is read from the matrix itself by
        # `check-mutants-scope.mjs`, the guard that already parses it; a second
        # hand-written copy of the number is the drift that guard exists to
        # catch.
        run: |
          set -euo pipefail
          expected=$(node scripts/check-mutants-scope.mjs --shard-count)
          mapfile -t outcomes < <(find shards -type f -name outcomes.json | sort)
          # Uploading is not the same as having results. The per-shard upload
          # is `if: always()`, and a shard whose BASELINE failed or timed out
          # still writes an outcomes.json (carrying that Baseline verdict) and
          # an empty missed.txt. Counting files would therefore read the exact
          # week this gate exists to catch — the `agaric` suite outgrowing
          # `--timeout`, all 31 of its shards aborting on a Timeout baseline —
          # as a FULL merge, and let the filer resolve away every `agaric`
          # survivor (#3364). Usable means what the per-shard zero-coverage
          # guard means by it: `Baseline` summary == Success.
          merged=0
          # `parsed` is the subset the concatenation below may read. A shard
          # SIGKILLed by `--kill-after` or cancelled at the job cap can upload a
          # half-written outcomes.json, and `jq -s` over it exits non-zero under
          # `set -e` — after the four .txt files are already written, so the
          # artifact would ship without the outcomes.json the summary reads and
          # a week that mostly ran would render `_No merged output_`.
          parsed=()
          for outcome in "${outcomes[@]}"; do
            if ! summary=$(jq -r '([.outcomes[]? | select(.scenario == "Baseline") | .summary] | first) // "MISSING"' "$outcome" 2>/dev/null); then
              echo "::warning::shard '$(dirname "$outcome")' uploaded an unreadable outcomes.json — excluded from the merge and from the merged total."
              continue
            fi
            parsed+=("$outcome")
            if [ "$summary" = "Success" ]; then
              merged=$((merged + 1))
            else
              echo "::warning::shard '$(dirname "$outcome")' tested nothing (baseline summary=$summary) — it uploaded output but its slice is uncovered, so it does not count toward the merged total."
            fi
          done
          {
            echo "merged=$merged"
            echo "expected=$expected"
          } >> "$GITHUB_OUTPUT"
          if [ "$merged" -eq 0 ]; then
            echo "::error::no shard produced usable results (${#outcomes[@]} of $expected uploaded an outcomes.json, none of them with a successful baseline). Nothing to merge; the filer's \`--require-input\` will red rather than read an empty missed.txt as 'no rust survivors' (#3364)."
            exit 1
          fi
          if [ "$merged" -lt "$expected" ]; then
            echo "::warning::SHORT MERGE: only $merged of $expected mutants shards produced usable results. The missing shards' survivors are absent from this week's missed.txt, so \`file-mutation-survivors\` runs --dry-run: it would otherwise report them as resolved, drop them from the tracking issue's marker block and re-report them as new next week (#3364). The merged artifact below still unions every shard whose output was READABLE, unusable ones included: such a shard contributes an empty missed.txt against its full mutants.json, which is what renders its package as \`0 of N  <-- NOT COVERED\` in the summary. Re-run the failed shards for a full week."
          fi
          mkdir -p mutants.out
          # The four lists are one finding per line, and the shards partition
          # the mutant set, so concatenation IS the union.
          for f in caught missed unviable timeout; do
            find shards -type f -name "$f.txt" -exec cat {} + > "mutants.out/$f.txt"
          done
          # `total_mutants` is a per-run count of what was TESTED and
          # `outcomes[]` a per-scenario array, so summing and concatenating
          # reproduce a single run's file. Each shard contributes its own
          # Baseline entry; the readers select mutants by `.scenario.Mutant`,
          # and the per-shard zero-coverage guard is what judges baselines.
          jq -s '{
              cargo_mutants_version: (map(.cargo_mutants_version) | first),
              total_mutants: (map(.total_mutants // 0) | add),
              outcomes: (map(.outcomes // []) | add),
            }' "${parsed[@]}" > mutants.out/outcomes.json
          # `mutants.json` under `--shard` is that shard's slice and the shards
          # partition the mutant set, so concatenating them IS the union. No
          # `unique`: it cannot fix a double count, only hide one, and it would
          # shrink the `generated` denominator the summary reports against.
          # Skipped the same way `outcomes.json` is: a shard killed mid-write
          # uploads truncated JSON, and one `jq -s` over it under `set -e`
          # would red the step after the files above are already on disk.
          # `</dev/null` because a `jq -s` with no file arguments would read
          # stdin and hang.
          generated=()
          while IFS= read -r m; do
            if jq -e . "$m" >/dev/null 2>&1; then
              generated+=("$m")
            else
              echo "::warning::shard '$(dirname "$m")' uploaded an unreadable mutants.json — excluded from the generated denominator."
            fi
          done < <(find shards -type f -name mutants.json | sort)
          jq -s add "${generated[@]}" </dev/null > mutants.out/mutants.json
          echo "merged $merged of $expected shard(s)"

      - name: Mutants summary
        if: always()
        env:
          MERGED: ${{ steps.merge.outputs.merged }}
          EXPECTED: ${{ steps.merge.outputs.expected }}
        run: |
          {
            echo "## cargo-mutants (invariant core)"
            echo
            if [ -f mutants.out/outcomes.json ]; then
              echo '```'
              # tested-of-generated first (#3386): the wall-clock budget can
              # truncate a shard, and a tally that omits the denominator reads
              # as full coverage of a small surface.
              echo "tested: $(jq -r '.total_mutants // 0' mutants.out/outcomes.json) of $(jq -r 'length' mutants.out/mutants.json 2>/dev/null || echo '?') generated"
              # A shard that never uploaded takes its slice out of BOTH sides
              # of that ratio, so it is invisible there — and since a short
              # merge is published, this is where a reader sees that the week
              # was short. The counts come from the merge step, not a second
              # count of the same files.
              echo "shards merged: ${MERGED:-?} of ${EXPECTED:-?}"
              # …then the same split PER PACKAGE (#3386 review). Since #3393
              # each package has its own shard count derived from its own
              # per-mutant cost, so this split is how you tell whether that
              # derivation still holds: a package testing well under its
              # generated count every week needs more shards.
              # Defensive throughout: this step must not be able to fail (see
              # the `Mutation summary` note on the frontend lane).
              echo "per package (tested of generated):"
              jq -r '.[].package' mutants.out/mutants.json 2>/dev/null | sort | uniq -c |
                while read -r generated pkg; do
                  [ -n "$pkg" ] || continue
                  tested=$(jq -r --arg p "$pkg" '[.outcomes[]? | select((.scenario|type) == "object") | select(.scenario.Mutant.package == $p)] | length' mutants.out/outcomes.json 2>/dev/null || echo 0)
                  if [ "${tested:-0}" -eq 0 ]; then
                    echo "  $pkg: 0 of $generated  <-- NOT COVERED this run (every shard of it failed or timed out)"
                  else
                    echo "  $pkg: $tested of $generated"
                  fi
                done || true
              # caught / missed / unviable / timeout tallies
              for f in caught missed unviable timeout; do
                if [ -f "mutants.out/$f.txt" ]; then
                  echo "$f: $(wc -l < "mutants.out/$f.txt")"
                fi
              done
              echo '```'
              echo
              if [ -s mutants.out/missed.txt ]; then
                echo "### Surviving (missed) mutants — triage into test gaps"
                echo '```'
                cat mutants.out/missed.txt
                echo '```'
              fi
            else
              echo "_No merged output. Either no shard produced any, or the merge step failed before writing it — read its log first, then the shard jobs'._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # The name `file-mutation-survivors` downloads. It reads missed.txt
          # flat off the artifact root, so the path is the merged directory
          # itself, never a parent (#3386/#3387).
          name: mutants-out
          path: mutants.out/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # mutants-frontend (#886) — StrykerJS scoped to a handful of pure,
  # deterministic frontend libs (search-query's pure modules, agenda-sort,
  # filters/model, date-utils, tree-utils — never components or Tauri IPC).
  # Mirrors the `mutants` (Rust) lane above: non-blocking, survivor list is
  # the deliverable to triage into tests. See `stryker.modules.mjs` /
  # `stryker.config.mjs` / `stryker.vitest.config.mjs` and
  # `docs/BUILD.md`'s "Mutation testing (nightly)" section for the recipe
  # (why each module runs in its own Stryker invocation, scoped to just its
  # own test file(s) — vitest's default "related" test-selection resolves
  # through barrel re-exports like `search-query/index.ts` and drags in
  # 271+ unrelated component tests otherwise).
  # ---------------------------------------------------------------------------
  mutants-frontend:
    needs: select-lanes
    if: needs.select-lanes.outputs.mutants_frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run Stryker mutation testing (scoped frontend libs)
        # Never gate: surviving mutants are triage signal, not a merge
        # blocker. `npm run mutation` loops `stryker run` once per module
        # (see `scripts/run-mutation.mjs`); a non-zero exit here means an
        # actual Stryker crash, not a low mutation score (no
        # `thresholds.break` is configured).
        run: npm run mutation || true

      - name: Lane-liveness guard (#3330) — the load-bearing acceptance item
        # Deliberately OUTSIDE the `|| true` above, and the exact frontend
        # analogue of the Rust lane's `Zero-coverage guard (#3057)` step.
        # Before this step existed, `mutants-frontend` was STRUCTURALLY
        # INCAPABLE of failing: `|| true` ate a total StrykerJS crash, the
        # `Mutation summary` step below `process.exit(0)`s on a missing
        # `reports/mutation` and renders `| <mod> | _no report_ | … |` for a
        # module that silently dropped out, and the artifact upload uses
        # `if-no-files-found: ignore`. Nothing read a mutant count, so a
        # crashed run and a perfect run were the same green tick — and the
        # downstream `file-mutation-survivors` job then read the empty
        # artifact as "zero survivors" on the (thereby false) premise that
        # lane failure is visible via this job's own status.
        #
        # This step fails ONLY on lane liveness — a missing reports root, a
        # module that produced no/invalid `mutation.json`, or a zero total
        # mutant count — never on mutation SCORE, which stays pure triage
        # signal per the lane's whole design. Its own fixture suite USED to run
        # as the `mutation-reports-guard-selftest` prek hook; #4556 unwired it,
        # so it runs nowhere until #4556 Phase 2 restages the self-tests.
        if: always()
        run: node scripts/check-mutation-reports.mjs --reports-dir reports/mutation

      - name: Mutation summary
        # Presentational only — never fails, by design (same as the Rust
        # lane's `Mutants summary`). The liveness guard above is the single
        # place this job can go red; if it did, the `_no report_` rows below
        # are the diagnosis, not a silent pass.
        #
        # #3350: the renderer moved out of an inline heredoc into
        # `scripts/render-mutation-summary.mjs`, because the per-PR
        # diff-scoped lane (`mutation-pr.yml`) has to render the SAME shape
        # and a heredoc can be neither imported nor unit-tested. Its ordering
        # rules (worst module first, survivors grouped per module) and its
        # "cannot fail" property are pinned by that script's own fixture
        # suite, which #4556 unwired from prek.toml (it was the
        # `mutation-summary-renderer-selftest` hook) and #4556 Phase 2 will
        # restage into CI. Until then it runs only when invoked by hand.
        if: always()
        run: node scripts/render-mutation-summary.mjs --reports-dir reports/mutation >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-frontend-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # file-mutation-survivors (#2947) — closes the pull-based triage gap: `mutants`
  # and `mutants-frontend` above only ever surface survivors in THIS run's step
  # summary, so nobody is notified unless someone remembers to open it. This
  # job downloads both lanes' survivor output (cargo-mutants' `missed.txt`,
  # StrykerJS's per-module `mutation.json`), diffs the combined set against
  # the SINGLE open tracking issue's last-known set (via
  # `scripts/file-mutation-survivors.mjs`), and files/updates that ONE issue
  # only when a genuinely NEW survivor appears — a no-op otherwise, so this
  # never spams a new issue weekly. State lives in the tracking issue's body
  # (a marked, machine-readable block), not a committed baseline file, so
  # this job needs `issues: write` only — never `contents: write`.
  #
  # `if: always()`: runs even if `mutants` / `mutants-frontend` failed outright
  # (both lanes are non-blocking and best-effort already) — a missing/absent
  # artifact just contributes zero survivors from that lane (see the script's
  # own doc comment).
  #
  # #3394 — this lane is NOT gated on `github.event_name == 'schedule'`: it has
  # no failure mode of its own (every red it has gone was `mutants` failing to
  # hand it a `missed.txt`, run 30794686024), so a job-level gate meant a
  # `mutants` fix could not be confirmed to have un-blocked it until the next
  # cron. The job runs on every event; the step dry-runs unless
  # `CRON_EQUIVALENT` holds, so a smoke dispatch exercises the whole path
  # (artifact download, both `--require-*` gates, the `gh issue list` lookup,
  # the body render) and writes nothing (#2947), while a default-input
  # dispatch on `main` files exactly what the cron would.
  # ---------------------------------------------------------------------------
  file-mutation-survivors:
    # `mutants-merge`, not `mutants` (#3393): the artifact this job downloads
    # is the merged one, and `mutants` is now 21 shard jobs.
    needs: [mutants-merge, mutants-frontend, select-lanes]
    # EITHER lane, and safely so since the split: each lane owns its own
    # tracking issue and the step below runs the filer once per lane that
    # actually ran, requiring only that lane's artifact. The `&&` this briefly
    # carried existed because a single shared issue plus unconditional
    # `--require-rust --require-frontend` made a one-lane run exit 1 (#4685
    # review); per-lane issues remove the cause rather than working around it.
    if: always() && (needs.select-lanes.outputs.mutants == 'true' || needs.select-lanes.outputs.mutants_frontend == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download cargo-mutants survivor list
        # Best-effort: if `mutants-merge` never uploaded (e.g. every shard
        # errored before its outcomes existed), this lane simply contributes
        # zero rust survivors below rather than failing the whole triage step.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutants-out
          path: mutants-artifact

      - name: Download StrykerJS survivor reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-frontend-report
          path: mutation-artifact

      - name: File or update the single mutation-survivor tracking issue
        # `--require-input` (#3364): a lane that produced NO data must not be
        # read as "that lane has no survivors" — an absent artifact would
        # otherwise empty that lane's marker block, this filer's only
        # cross-run memory, and re-report every entry as "new" the following
        # week. #3330's liveness guard makes the LANE red but does not stop
        # this job, which runs under `if: always()`.
        #
        # The flag is now PER LANE, and so is the blast radius: since the
        # split each invocation reads only its own lane's input and writes
        # only its own lane's issue, so a dead rust artifact can no longer
        # take the frontend lane's survivors with it. That cross-lane
        # deletion is what the old `--require-rust` / `--require-frontend`
        # pair existed to make loud.
        #
        # This deliberately turns a dead lane into a RED filer job rather than
        # a skipped one (`needs.<lane>.result == 'success'` would skip it):
        # `report-scheduled-failures` below `needs:` this job, so the failure
        # is reported through the ordinary path instead of vanishing as a skip.
        #
        # `--dry-run` unless `LANE_AUTHORITATIVE` (below) holds. The dry
        # run still performs every read — including the real `gh issue list`
        # lookup (only `--known-body-file` stubs that out, and this never
        # passes it) — and only skips the `gh issue edit` / `close` / `reopen`
        # writes. There are no comment writes: this job never comments.
        #
        # `--children`: the rolling parent is the notification, not the
        # worktop. Measured 2026-08-09, it carried 261 survivors across 9
        # areas in one 40 756-character body that nothing could assign, close
        # or reference from a PR. `--children` adds one CHILD issue per area
        # carrying that area's survivors — the unit a maintainer actually
        # fixes — while all state stays single-copy in the parent's marker
        # blocks. Dedup is the parent's recorded `area -> #number` block
        # first, a verbatim-title lookup second, so repeated weekly runs
        # update the same children instead of filing new ones. See the
        # § Parent/child section in the script header.
        #
        # `--dry-run` ALSO on a short merge (#3393 review): with 21 shards the
        # realistic failure is a handful of dead ones, and their survivors are
        # then absent from `missed.txt` — present-and-shorter, which
        # `--require-input` cannot tell from real data. Rewriting the body from
        # that set would report them resolved, drop them from the marker block
        # and re-report them as new next week (#3364). Dry-run performs every
        # read and skips only the `gh` writes, so a short week still renders
        # its body and comment into the log. Fails CLOSED: `mutants-merge`
        # dying outright leaves both counts empty, which counts as short.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAN_RUST: ${{ needs.select-lanes.outputs.mutants }}
          RAN_FRONTEND: ${{ needs.select-lanes.outputs.mutants_frontend }}
          # PER-LANE authority, deliberately not `CRON_EQUIVALENT`.
          #
          # That value folds in `lanes == 'all'` because the fuzz and
          # scheduled-failure trackers span the WHOLE run: a subset there
          # really is partial data about what they report. Since the split
          # this filer is not — each lane writes its OWN issue and cannot see
          # the other's, so a lane subset is complete data about every issue
          # this job touches. Without this the split would be pointless: a
          # `lanes=mutants-frontend` re-run would reach the filer and then
          # write nothing.
          #
          # Every OTHER clause of `CRON_EQUIVALENT` is kept — the ref, and the
          # one declared input that changes what the mutants lane measures.
          # `fuzz_seconds` and `slo_include_problem` cannot affect either
          # mutation lane, so they are not part of this lane's authority.
          LANE_AUTHORITATIVE: >-
            ${{ github.event_name == 'schedule'
              || (github.ref == 'refs/heads/main'
                  && (github.event.inputs.mutants_timeout || '900') == '900') }}
          SHORT_MERGE: >-
            ${{ needs.mutants-merge.outputs.shards_merged == ''
              || needs.mutants-merge.outputs.shards_merged
                 != needs.mutants-merge.outputs.shards_expected }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$LANE_AUTHORITATIVE" != 'true' ]; then
            extra=(--dry-run)
          fi
          # The two invocations must fail INDEPENDENTLY. Under `set -e` a
          # non-zero rust exit aborts the step before the frontend one runs,
          # and `assertLaneInputsPresent` throws before the --dry-run branch
          # is even consulted — so a dead `mutants-out` (the only red this
          # lane has ever had: run 30794686024) would stop the FRONTEND issue
          # being written that week, with `mutants-frontend` green and its
          # artifact complete. `|| rc=1` keeps each lane's failure its own
          # while still reddening the step.
          rc=0
          # ONE INVOCATION PER LANE (#3364 superseded): each lane has its own
          # tracking issue, so a lane that did not run is simply not filed for
          # — no cross-lane `--require-*` pair, and no way for one lane's data
          # to rewrite the other's issue.
          if [ "$RAN_RUST" = 'true' ]; then
            # SHORT_MERGE counts the 21 cargo-mutants shards that reached the
            # merged artifact, so it is a RUST signal and is consulted only
            # here. Evaluating it outside this branch also warned about
            # dry-running a rust lane that never ran, on every frontend-only
            # dispatch (`mutants-merge` skipped => `shards_merged` empty).
            rust_extra=("${extra[@]}")
            if [ "$SHORT_MERGE" = 'true' ]; then
              echo "::warning::running --dry-run for the RUST lane: mutants-merge reported a short merge, so the rust tracking issue is not rewritten from a partial survivor set (#3364). See the merge job's warning for the shard counts."
              rust_extra=(--dry-run)
            fi
            node scripts/file-mutation-survivors.mjs \
              --lane rust \
              --rust-missed mutants-artifact/missed.txt \
              --require-input \
              --children \
              "${rust_extra[@]}" || rc=1
          fi
          if [ "$RAN_FRONTEND" = 'true' ]; then
            node scripts/file-mutation-survivors.mjs \
              --lane frontend \
              --frontend-dir mutation-artifact \
              --require-input \
              --children \
              "${extra[@]}" || rc=1
          fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  # fuzz (#650/#2590) — short coverage-guided fuzz of the raw-input parsers. The
  # fuzz crate (src-tauri/fuzz) builds under stable for compile-checking but
  # `cargo fuzz run` needs nightly (libFuzzer instrumentation). Each weekly
  # run continues from the corpus the previous one saved (#4496), so the
  # per-target budget below is how far each week explores past the last;
  # a longer campaign still runs out-of-band. Non-blocking.
  # ---------------------------------------------------------------------------
  fuzz:
    needs: select-lanes
    if: needs.select-lanes.outputs.fuzz == 'true'
    runs-on: ubuntu-24.04
    # 155, not 60. The arithmetic, written out because review showed an earlier
    # figure had less headroom than its own comment implied — N is the derived
    # target count, currently 8:
    #
    #   setup (apt, toolchain, node, npm, install-action)   ~10 min
    #   N nightly ASan builds, COLD rust-cache              24-40 min
    #   N targets x 300s of fuzzing                         ~40 min
    #   cmin, at its own step bound                         up to 30 min
    #   artifact uploads                                     ~2 min
    #                                                      ------------
    #   worst case                                          ~122 min
    #
    # N is pinned ONCE, as `BUDGETED_TARGETS` in the fuzz step, which warns when
    # the derivation outgrows it. The figures above are that N substituted in —
    # not a second declaration of it — and re-deriving them for a larger N is
    # the work that warning exists to prompt.
    #
    # The build range is the five-target 15-25 min figure scaled to eight. On a
    # warm cache (`save-if` on main keeps main warm) the build term is a
    # fraction of that and the job finishes far inside the bound; the number
    # exists for the cold-cache worst case, which is the one that would fail.
    #
    # Headroom matters more here than elsewhere because of HOW this overruns: a
    # JOB timeout is a cancellation, which correctly skips the corpus save, so
    # the symptom is a corpus that silently stops accumulating — the failure
    # #4496 exists to remove — rather than a red lane anyone would look at. The
    # cmin step's own `timeout-minutes` is the loud bound; this one is the quiet
    # one, and is sized not to be reached.
    #
    # History: #4497 took the count from five to eight, this bound from 90 to
    # 110, and then to 130 once the build term was scaled by arithmetic rather
    # than by assumption, and to 155 when the per-target budget went from
    # 120s to 300s.
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Placed IMMEDIATELY after checkout, before every setup step, and that
      # position is load-bearing rather than tidy (#4503 review). It depends on
      # nothing in between — apt, the nightly toolchain, rust-cache, node, npm
      # and install-action are all irrelevant to extracting a corpus tarball —
      # and running it first buys two things:
      #
      #   * ~8 minutes back on the 7-day eviction margin (#4504), since what
      #     resets the entry's idle clock is the RESTORE, not the save;
      #   * survival of a setup failure. With the restore below apt, a failed
      #     `npm ci` skipped it, so the newest entry went unaccessed for that
      #     whole week and was evicted a week later — losing the lineage
      #     silently. Above setup the restore still runs, cmin then finds no
      #     manifest and writes `collapsed=0`, and the save republishes the
      #     restored corpus, refreshing the timestamp.
      - name: Restore the accumulated fuzz corpus (#4496)
        # Coverage-guided fuzzing only reaches depth if the corpus ACCUMULATES.
        # Before this, `src-tauri/fuzz/corpus/` was uploaded as an artifact and
        # never restored — the `Swatinem/rust-cache` step covers `~/.cargo` and
        # `target/`, not the corpus — so every weekly run restarted all five
        # targets from the seeds committed to git (8 files over 2 targets at the
        # time; the other three had no corpus directory at all). Each run then
        # re-explored the same shallow frontier that `-max_total_time` reaches
        # from cold, indefinitely, and reported `ok` for doing so.
        #
        # `restore`/`save` are split rather than using one `actions/cache`.
        # Not for the tempting reason: a combined action's post step re-globs
        # and tars `path` from disk at post-job time, so cmin's result WOULD be
        # captured (only the key and exact-hit flag ride forward in state). The
        # reasons that actually hold are:
        #   * the save point is explicit and ordered — it happens HERE, before
        #     the artifact upload below, not in an implicit post-job step whose
        #     position relative to other post steps is not ours to choose;
        # (A second reason is sometimes given — that a combined action skips the
        # save on an exact-key hit — but it does not apply here: a run-scoped
        # primary key never hits on read, so that branch is unreachable either
        # way. The ordering above is what carries the decision.)
        # The run-scoped key never hits on read — `restore-keys` takes the most
        # recent prefix match — which is what makes each run write a fresh
        # entry instead of being stuck on the first one saved.
        id: corpus-cache
        # `continue-on-error` so this step cannot STOP the fuzzing: before this
        # change the lane fuzzed from the committed seeds regardless of any
        # cache, and it still must.
        #
        # What it buys is narrower than it looks. Checked against
        # `@actions/cache`'s `restoreCache`
        # (actions/toolkit, packages/cache/src/cache.ts): only a
        # `ValidationError` (over-long key, bad path) is re-thrown; EVERY other
        # failure — a cache service outage included — is logged via
        # `core.error`/`core.warning` and the function returns `undefined`. So:
        #
        #   * `continue-on-error` matters only for the ValidationError path;
        #   * a service outage leaves this step `outcome: success` with an EMPTY
        #     `cache-matched-key`, i.e. indistinguishable from a genuine cold
        #     start, so the `outcome == 'success'` gates below do NOT catch it.
        #
        # KNOWN RESIDUAL HOLE (#4504): on such a run the lane fuzzes from seeds
        # only and then publishes a seeds-only entry as the newest
        # `fuzz-corpus-*`, resetting the lineage — the thing those gates exist
        # to prevent. It self-heals the following week and is still strictly
        # better than the pre-change every-run-cold behaviour, which is why it
        # is not fixed here. It is NOT closable by a content check either: a
        # genuine cold start and an outage both end with the seeds plus
        # whatever this run found, so nothing inside the job can separate them
        # without querying the cache API.
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          # MARGIN, addressed by #4504: GitHub evicts cache entries not
          # ACCESSED for 7 days. What resets an entry's idle clock is THIS
          # step, not the save. Measured (jfolcini, review of #4503): the
          # restore lands ~8 min into the job, the save ~25 min in, so
          # save-to-next-restore is about 6d23h43m — roughly SEVENTEEN
          # minutes of headroom, not the ~25 originally estimated.
          # `restore-keys` gives no cushion: it touches only the newest entry,
          # so every older one is already a full 7 days idle by the next
          # restore. There is no second chance, and scheduled runs are
          # routinely delayed past that margin under load. The warm/cold step
          # that follows is what makes an eviction visible rather than
          # silent.
          #
          # `.github/workflows/fuzz-corpus-refresh.yml` is the fix (#4504):
          # a separate, minimal weekly job that ONLY restores this cache
          # (never saves), scheduled roughly midway between two fuzz runs
          # purely to touch the entry's access timestamp — see that file for
          # the schedule derivation. That moves the margin from ~17 minutes
          # to ~3.5 days on either side of the week.
          #
          # Restore is deliberately NOT branch-gated while save is: Actions
          # cache scoping lets any branch read the default branch's entries, so
          # a `workflow_dispatch` run on a feature branch starts from main's
          # accumulated corpus and then discards whatever it finds, because it
          # will not save. That asymmetry is the intended trade — such a run
          # gets a realistic starting corpus without spending the cache budget.
          restore-keys: |
            fuzz-corpus-

      - name: Report whether this run started warm or cold (#4496)
        # Whether the restore HIT is the single most useful fact in this lane's
        # log, and it is exactly what was invisible before this change: a silent
        # cache miss looks identical to a working lane that simply found
        # nothing. `cache-matched-key` names the entry this run inherited.
        env:
          MATCHED: ${{ steps.corpus-cache.outputs.cache-matched-key }}
          RESTORE_OUTCOME: ${{ steps.corpus-cache.outcome }}
        run: |
          # The `!= success` branch fires only for a ValidationError, because
          # `restoreCache` swallows every other failure (see the restore step).
          # An empty `$MATCHED` therefore means EITHER a genuine cold start OR a
          # cache-service outage, and nothing here can tell them apart — so the
          # message below says so instead of asserting the cheerful reading.
          if [ "$RESTORE_OUTCOME" != "success" ]; then
            echo "::warning::corpus restore FAILED (outcome=$RESTORE_OUTCOME) — fuzzing from the committed seeds only."
            echo "cmin and the save are gated on this outcome, so this run will NOT publish a corpus entry."
          elif [ -n "$MATCHED" ]; then
            echo "corpus restored from cache entry: $MATCHED (warm start)"
          else
            echo "::warning::NO corpus cache entry matched — fuzzing from the committed seeds only."
            echo "EITHER a genuine cold start OR a cache-service outage: restoreCache swallows the latter"
            echo "and returns empty, so they are indistinguishable here (#4504). Expected exactly once, just"
            echo "after this landed; on any later run suspect the save side or an evicted entry."
          fi
          find src-tauri/fuzz/corpus -type f 2>/dev/null | wc -l | xargs echo "corpus files on disk before fuzzing:"

      - name: Prepare apt (free dpkg lock, bound downloads)
        uses: ./.github/actions/prepare-apt

      - name: Install system dependencies
        # #4163: `apt-get update` is ADVISORY inside this action -- a mirror
        # that cannot serve the index no longer reds this job as a code
        # failure; the INSTALL decides. Measured trace + exit codes in
        # .github/actions/apt-install/action.yml.
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libssl-dev
            librsvg2-dev
            libsoup-3.0-dev
            pkg-config
            mold

      - name: Enable mold linker (CI-only .cargo/config.toml)
        run: |
          mkdir -p .cargo
          cp .cargo/config.toml.example .cargo/config.toml

      - name: Install nightly Rust toolchain
        # cargo-fuzz requires nightly for the libFuzzer sanitizer coverage
        # instrumentation (`-Z sanitizer`). The production toolchain stays
        # pinned at 1.95.0; only this lane uses nightly.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri/fuzz
          shared-key: rust-fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare externalBin placeholder (FEAT-4f)
        run: node scripts/prepare-external-bins.mjs --placeholder-only

      - name: Install cargo-fuzz via prebuilt binary
        uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-fuzz

      - name: Fuzz each parser target
        working-directory: src-tauri/fuzz
        # `-max_total_time` bounds each target so the weekly lane stays
        # bounded; a crash exits non-zero and the artifact upload
        # below preserves the reproducer. The starting corpus is the checked-in
        # seeds under fuzz/corpus/<target>/ UNIONED with whatever the restore
        # step above recovered from previous runs (#4496) — the seeds are the
        # floor on a cache miss, not the whole input set. The dispatch input
        # rides via `env:` (not inline `${{ }}`) per zizmor template-injection.
        env:
          FUZZ_SECONDS: ${{ github.event.inputs.fuzz_seconds || '300' }}
          # cargo-fuzz builds with `-Zsanitizer=address`, which rustc rejects
          # when libc is statically linked ("sanitizer is incompatible with
          # statically linked libc"). Disable crt-static for the fuzz build;
          # cargo-fuzz reads RUSTFLAGS and appends its own sanitizer flags, so
          # both survive. gnu defaults to dynamic libc, so the gnu target pinned
          # below is ASan-compatible.
          RUSTFLAGS: "-C target-feature=-crt-static"
        run: |
          # RUN-ALL-THEN-FAIL, not fail-fast (#3169). `set -e` stays on for the
          # script as a whole, but each target's `cargo fuzz run` is invoked in
          # a SUBSHELL whose non-zero exit is captured (`|| rc=$?`) instead of
          # propagating. Before this, the first failing target aborted the loop
          # outright: `snapshot_decode` failed to COMPILE and, being first,
          # silently cost `deeplink_parse` and `import_parse` their runs too —
          # three targets' worth of coverage lost to one error, with nothing in
          # the output saying so. Every target is now attempted independently;
          # the step still exits non-zero at the end if ANY target failed
          # (`overall`), so the lane stays red exactly as before.
          set -euo pipefail
          # Per-target machine-readable results for the `file-fuzz-findings`
          # triage job below (uploaded as the `fuzz-status` artifact). Statuses
          # are pre-seeded to `not_run`, which stays meaningful even now that
          # the loop runs to completion: a job cancelled or killed (job-level
          # timeout, runner death) mid-loop leaves the targets it never reached
          # marked `not_run` rather than absent — and an absent file would read
          # as "fine".
          RESULT_DIR="${GITHUB_WORKSPACE}/fuzz-status"
          mkdir -p "$RESULT_DIR"
          # Derived from the `[[bin]]` entries in src-tauri/fuzz/Cargo.toml
          # rather than restated here. This WAS a hand-maintained second copy of
          # that list, and #2945 is what the copy cost when it went stale:
          # `fts_strip` and `html_parse` were added to the manifest and not
          # here, so for three months they were built and never fuzzed while
          # this lane reported success. `--no-deps` reads the manifest only —
          # no dependency resolution, no network, no build — and adding a
          # [[bin]] is now the entire act of enrolling a target in this lane.
          # `+nightly`, not a bare `cargo`: rustup searches upward from the
          # working directory for a toolchain file and finds the repo root's
          # `rust-toolchain.toml`, which pins 1.95.0 AND mandates the clippy and
          # rustfmt components. This job installs ONLY nightly, so a bare `cargo`
          # here would trigger a full toolchain-plus-components download inside
          # the step the fuzz budget is measured against — a network dependency
          # for a command that only reads a manifest. Nightly is already present.
          #
          # Through a FILE, not a process substitution — and the difference is
          # the whole point. `mapfile < <(cmd)` cannot see that producer's exit
          # status: not with `set -e`, not with `pipefail`. So a jq filter that
          # stopped matching (a metadata schema change, a renamed package) would
          # leave the loop below with nothing to iterate and the step exiting 0:
          # a green fuzz lane that fuzzed nothing. Redirecting to a file puts
          # the pipeline back under `pipefail`, which separates the two failures
          # this guard used to conflate — "the producer broke" and "the manifest
          # has no targets" — so the annotation can name the one that happened
          # instead of always blaming Cargo.toml.
          derived_targets="$(mktemp)"
          if ! cargo +nightly metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "agaric-fuzz")
                     | .targets[] | select(.kind | index("bin")) | .name' \
            | sort > "$derived_targets"; then
            rm -f "$derived_targets"
            echo "::error::could not derive the fuzz target list: 'cargo +nightly metadata | jq | sort' failed. This is a TOOLING failure (nightly missing, jq missing, a path dependency's manifest unparseable), not a missing [[bin]] — the command's own stderr is immediately above this line."
            exit 1
          fi
          mapfile -t targets < "$derived_targets"
          rm -f "$derived_targets"
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::the fuzz target list derived from src-tauri/fuzz/Cargo.toml is EMPTY: the manifest declares no [[bin]] entries, or the jq filter no longer matches them. The producer itself succeeded."
            exit 1
          fi
          echo "fuzzing ${#targets[@]} targets: ${targets[*]}"
          # Auto-enrolment has one quiet edge: a `[[bin]]` added without a
          # `corpus/<target>/` directory is fuzzed from libFuzzer's single empty
          # input, every week, and nothing about that reads as wrong.
          # `cargo fuzz run` creates the directory, and cmin's `find ... || true`
          # on the input COUNT tolerates it being absent beforehand (not cmin's
          # own exit status, which #4496 changed from `|| true` to `|| rc=$?`
          # precisely so a broken cmin stops being silent) — so the lane stays
          # green while that target explores from cold forever, which is the
          # exact behaviour #4496 exists to end, reintroduced one target at a
          # time. Not fatal (an unseeded target still fuzzes, and a first run
          # legitimately has none), so this warns rather than fails.
          #
          # Ask git ONCE whether it can answer at all, because the guard below
          # reads an empty `git ls-files` as "this target has no committed
          # seeds" — and a `git ls-files` that FAILS is also empty. A
          # `safe.directory` ownership mismatch after a runner or checkout-action
          # change is the realistic route, and it would turn one broken
          # precondition into eight confident false reports, on a green run,
          # about the exact targets whose seeding nobody would then re-check.
          # A guard is allowed to say nothing; it is not allowed to invert.
          seed_check_available=1
          seedless_targets=()
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            seed_check_available=0
            seedless_skip_msg="the committed-seed check was SKIPPED: 'git rev-parse --is-inside-work-tree' failed, so an empty 'git ls-files' cannot be distinguished from a failed one. No conclusion about seeding should be drawn from this run."
            echo "::warning::$seedless_skip_msg"
            {
              echo "### :warning: seed-corpus check skipped"
              echo
              echo "$seedless_skip_msg"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$seed_check_available" -eq 1 ]; then
            for target in "${targets[@]}"; do
              # `git ls-files`, NOT `find`: the question is whether this target
              # has COMMITTED seeds, and the working tree cannot answer it here.
              # The restore step (#4496) extracts the accumulated corpus into
              # `corpus/` ~160 lines above this one, so after a seedless target's
              # first run its directory is non-empty on every subsequent run and a
              # `find` would go quiet — precisely when the warning still applies,
              # since the committed floor is still empty and the next cache miss
              # still starts that target from libFuzzer's empty input. A guard
              # that fires only on the one run where the target is new AND the
              # cache also missed is barely a guard.
              # Names are ACCUMULATED here and reported once after the loop — eight seedless targets used to render eight identical
              # H3 headings in the run summary, which is the one surface this
              # warning exists to be read from and the one place a repeated
              # heading reads as noise rather than as eight findings.
              if [ -z "$(git ls-files "corpus/$target" | head -n 1)" ]; then
                seedless_targets+=("$target")
              fi
            done
            if [ "${#seedless_targets[@]}" -gt 0 ]; then
              seedless_msg="fuzz target(s) with no COMMITTED seed corpus: ${seedless_targets[*]} — on a cache miss each starts from libFuzzer's empty input. Add seeds under corpus/<target>/ that reach distinct branches."
              echo "::warning::$seedless_msg"
              # To the run summary as well: this fires on a GREEN run — targets
              # quietly exploring from cold forever — and nobody opens the log of
              # a job that passed. An annotation alone would be a signal with no
              # reader, which is the failure the warning itself describes.
              {
                echo "### :warning: fuzz target(s) without seeds"
                echo
                echo "$seedless_msg"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          # Enrolling a target is now a one-line `[[bin]]` edit that never opens
          # this file — which trades list drift (#2945) for BUDGET drift, and
          # budget drift fails silently in the worse direction: overrunning the
          # JOB bound is a cancellation, which correctly skips the corpus save,
          # so the symptom is a corpus that quietly stops accumulating rather
          # than a red lane. `timeout-minutes` on this job and on the cmin step
          # are hand-sized for the count below; exceeding it is not an error
          # (the budgets carry headroom) but it must not pass unremarked.
          BUDGETED_TARGETS=8
          if [ "${#targets[@]}" -gt "$BUDGETED_TARGETS" ]; then
            msg="${#targets[@]} fuzz targets, but the job and cmin timeouts were sized for $BUDGETED_TARGETS. Re-check timeout-minutes on this job and on the cmin step, then raise BUDGETED_TARGETS here."
            echo "::warning::$msg"
            # ALSO to the run summary, not only the annotation. This lane runs
            # weekly and unattended, and a `::warning::` on an otherwise-green
            # run is a signal with no reader — nobody opens the log of a job
            # that passed. `$GITHUB_STEP_SUMMARY` renders on the run page
            # itself, which is the one surface a passing scheduled run gets
            # looked at from.
            {
              echo "### :warning: fuzz target budget"
              echo
              echo "$msg"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '%s\n' "${targets[@]}" > "$RESULT_DIR/targets.txt"
          for target in "${targets[@]}"; do
            echo not_run > "$RESULT_DIR/$target.status"
          done
          overall=0
          for target in "${targets[@]}"; do
            echo "::group::fuzz $target"
            # Per-target log (stdout+stderr), never a shared blob — the triage
            # job attributes each error to the target that produced it.
            log="$RESULT_DIR/$target.full.log"
            rc=0
            # `--target x86_64-unknown-linux-gnu` pins the gnu HOST target.
            # Recent cargo-fuzz defaults `--target` to
            # x86_64-unknown-linux-musl (for a statically-linked fuzzer), but
            # the nightly toolchain installed here only ships the host (gnu)
            # std, so the musl default fails to build with
            # `error[E0463]: can't find crate for std` (#2123). Pinning the
            # host target builds against the installed std and keeps the
            # dynamic-libc that ASan requires.
            (
              cargo +nightly fuzz run "$target" \
                --target x86_64-unknown-linux-gnu -- \
                -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=4096
            ) > "$log" 2>&1 || rc=$?
            cat "$log"
            if [ "$rc" -eq 0 ]; then
              status=ok
            elif grep -q 'libFuzzer: timeout' "$log"; then
              status=timed_out
            elif grep -qE 'Test unit written to|deadly signal|AddressSanitizer|LeakSanitizer' "$log"; then
              status=crashed
            elif grep -qE '^error(\[E[0-9]+\])?:|could not compile|failed to build fuzz' "$log"; then
              status=build_failed
            else
              status=failed
            fi
            echo "$status" > "$RESULT_DIR/$target.status"
            # Bounded tail is what rides in the artifact: a libFuzzer log can be
            # thousands of lines. The full log stays on the runner only.
            tail -n 500 "$log" > "$RESULT_DIR/$target.log"
            rm -f "$log"
            ls -1 "artifacts/$target" > "$RESULT_DIR/$target.artifacts" 2>/dev/null || true
            echo "fuzz $target: $status (exit $rc)"
            [ "$status" = ok ] || overall=1
            echo "::endgroup::"
          done
          echo "--- fuzz lane summary ---"
          for target in "${targets[@]}"; do
            echo "  $target: $(cat "$RESULT_DIR/$target.status")"
          done
          # Aggregate: any non-ok target fails the job. Never silently green.
          exit "$overall"

      - name: Minimise the corpus, then persist it (#4496)
        id: corpus-cmin
        # The one step here with no time bound of its own: the fuzz step caps
        # itself with `-max_total_time`, but the merge re-executes every corpus
        # input with only `-rss_limit_mb` to bound it. As the corpus grows this
        # is the likeliest thing to push the job into its own `timeout-minutes`
        # (the job's, above — deliberately not restated here, since a copy of it
        # is what went stale twice), and a job timeout is a CANCELLATION,
        # which correctly skips the save,
        # so the symptom would be a corpus that silently stops accumulating:
        # the exact failure mode this change exists to remove. A step-level
        # bound makes it a loud, attributable failure instead.
        #
        # 30, raised from 20 by #4497: the merge re-executes every corpus input
        # of every target, so the bound scales with the target count, which
        # #4497 raised from five (see `BUDGETED_TARGETS` in the fuzz step for
        # the current figure — deliberately not restated here). Hitting this
        # bound is a step failure
        # (loud) rather than a job timeout (a cancellation, hence silent
        # non-accumulation) — but the fuzz step above still owns the lane's
        # verdict, so a red cmin does not by itself mean a target crashed.
        timeout-minutes: 30
        # Condition is `!cancelled() && steps.corpus-cache.outcome == 'success'`
        # (spelled out below). A crash in ONE target still leaves every OTHER
        # target with a run's worth of new coverage, and discarding that because the
        # lane went red would make a single crashing target permanently reset
        # every sibling's corpus — so a failed FUZZ step must not stop this.
        #
        # `cargo fuzz cmin` keeps a minimal input set covering the same edges,
        # so the cache stays proportional to REACHED COVERAGE rather than to
        # the number of runs. Without it the corpus only grows, and a corpus
        # that outgrows the cache entry limit stops being restored at all —
        # which would silently return this lane to the cold-start behaviour
        # this step exists to end.
        #
        # Failures here are non-fatal (captured per target as `|| rc=$?`, then
        # reported as a `::warning::` — NOT `|| true`, which is the mechanism
        # this step replaced precisely because it discarded the exit status):
        # cmin is an optimisation, and a corpus that failed to minimise is
        # still a corpus worth saving. cargo-fuzz's `exec_cmin` swaps the
        # directory only `if status.success()` (it merges into a temp dir, then
        # `fs::rename`s the old corpus away and the minimised one into place),
        # so a failed cmin leaves that target's corpus intact rather than
        # emptied. The fuzz step above owns the lane's pass/fail verdict.
        #
        # Two conditions, guarding two different ways the corpus lineage gets
        # silently reset to the committed seeds.
        #
        # `!cancelled()` rather than `always()`: cmin replaces `corpus/<target>`
        # in place once its merge succeeds, so a cancellation or runner loss
        # landing inside that swap leaves the directory absent — and `always()`
        # would then let the save step below store THAT as the newest
        # `fuzz-corpus-*` entry for the next run to inherit.
        #
        # `steps.corpus-cache.outcome == 'success'` is a DEFENCE IN DEPTH gate,
        # and it is worth being honest that it is close to vacuous today: only
        # `actions/checkout` precedes the restore now, so the failure it was
        # written for cannot really occur.
        #
        # It is kept because it costs nothing and would catch the same shape if
        # a step were ever inserted between checkout and the restore: any step
        # that fails there skips the restore while these two, carrying their own
        # `if:`, would run anyway — cmin finding no manifest and the save then
        # publishing a `corpus/` holding only what `git checkout` put there,
        # which every later run would inherit via `restore-keys`.
        #
        # `== 'success'`, not `!= 'skipped'`: the latter also passes when the
        # restore ran and FAILED (cache service unavailable), and an absent step
        # evaluates to `''`, which is likewise `!= 'skipped'`. A cache MISS is
        # still `success`, which is correct — a genuine cold start should save.
        if: ${{ !cancelled() && steps.corpus-cache.outcome == 'success' }}
        working-directory: src-tauri/fuzz
        env:
          RUSTFLAGS: "-C target-feature=-crt-static"
        run: |
          # `set -uo pipefail` does NOT clear the `-e` that GitHub's default
          # `bash -e {0}` already set, so every `find | wc -l` below carries
          # `|| true`: `find` exits 1 on a missing directory, `pipefail`
          # propagates that, and the assignment's non-zero status would trip
          # `-e`, aborting the loop before the remaining targets are minimised.
          # Unreachable while every target has a committed seed dir, but
          # reachable the moment one is added without seeds and its build
          # fails — `cargo fuzz run` builds before it creates `corpus/<target>`.
          # That is the exact fail-fast shape #3169 removed from the fuzz step's
          # own target loop; not reintroducing it here.
          set -uo pipefail
          # Read the target list the fuzz step already wrote, rather than
          # restating it. The `[[bin]]` entries in `src-tauri/fuzz/Cargo.toml`
          # are the single source; the step above derives its list from them and
          # writes `targets.txt`, and this step consumes that. #2945 is what a
          # second copy costs when it goes stale: two targets were added to the
          # manifest and not to the workflow, so they were built and never
          # fuzzed for three months while the lane stayed green.
          collapsed=0
          manifest="${GITHUB_WORKSPACE}/fuzz-status/targets.txt"
          if [ ! -f "$manifest" ]; then
            # The fuzz step died before writing it (runner loss, job timeout).
            # Save what is on disk unminimised rather than guessing a list.
            echo "no target manifest at $manifest — skipping cmin"
            # Still record a clean result: the corpus here is exactly what the
            # restore left — un-minimised but intact — so republishing it is a
            # no-op that also refreshes the entry's access timestamp. Without
            # this the fail-closed gate below would read `''` and decline.
            echo "collapsed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `|| [ -n "$target" ]` so a final unterminated line is not dropped.
          # Safe today — the producer is `printf '%s\n'`, which always
          # terminates — but the producer is a different step from this
          # consumer, and removing the coupling costs nothing.
          while read -r target || [ -n "$target" ]; do
            [ -n "$target" ] || continue
            before=$(find "corpus/$target" -type f 2>/dev/null | wc -l || true)
            # `< /dev/null`: this loop's stdin IS the manifest (`done < ...`).
            # cargo-fuzz nulls the fuzz binary's own stdin so this is fine
            # today, but a child that ever read stdin would swallow the
            # remaining target lines and cmin only the first — and the
            # redirect below would hide that completely.
            log="$RUNNER_TEMP/cmin-$target.log"
            rc=0
            # `-rss_limit_mb=4096` mirrors the fuzz step: without it the merge
            # inherits libFuzzer's 2048 MB default, which is the most likely
            # way cmin starts failing as the corpus grows — i.e. exactly when
            # minimisation matters most.
            cargo +nightly fuzz cmin "$target" \
              --target x86_64-unknown-linux-gnu </dev/null \
              -- -rss_limit_mb=4096 >"$log" 2>&1 || rc=$?
            after=$(find "corpus/$target" -type f 2>/dev/null | wc -l || true)
            echo "cmin $target: $before -> $after inputs"
            # Non-fatal, but never SILENT. `>/dev/null 2>&1 || true`
            # discarded the exit status too, so a permanently broken
            # cmin (a CLI change, or a target that stops building under
            # a newer nightly) would surface only as `N -> N inputs` —
            # which is ALSO the correct output for an already-minimal
            # corpus. The corpus would then grow unbounded until it
            # outgrew the cache entry limit: the very failure this step
            # exists to prevent, with nothing in the log saying so.
            if [ "$rc" -ne 0 ]; then
              echo "::warning::cmin FAILED for $target (exit $rc) — corpus left un-minimised"
              tail -n 20 "$log" || true
            fi
            # The one silent-reset path the two `if:` gates above cannot see: a
            # cmin that exits 0 having collapsed a non-empty corpus to nothing.
            # The save would publish that as the newest `fuzz-corpus-` entry and
            # every later run would inherit it through `restore-keys`. Flag it
            # and let the save step stand down; the previous entry then stays
            # newest and the next run recovers on its own.
            if [ "$before" -gt 0 ] && [ "$after" -eq 0 ]; then
              echo "::warning::cmin collapsed $target from $before inputs to 0 — standing down the save for ALL targets this run (the flag is run-wide), so the previous cache entry stays newest"
              collapsed=1
            fi
          done < "$manifest"
          echo "collapsed=$collapsed" >> "$GITHUB_OUTPUT"

      - name: Save the minimised fuzz corpus (#4496)
        # Keyed on `github.run_id`, so every run writes a NEW entry that the
        # next run's `restore-keys: fuzz-corpus-` prefix match then picks up.
        # A content-independent constant key would be written once and never
        # updated (GitHub's cache is immutable per key), freezing the corpus at
        # whatever the first run produced.
        #
        # Gated on `main` for the same reason the `Swatinem/rust-cache` step
        # above carries `save-if: github.ref == 'refs/heads/main'`. Nothing
        # prunes these entries explicitly, but they do NOT accumulate.
        # `restore-keys` touches only the NEWEST entry, so every
        # older one goes unaccessed for a week and is evicted by the same 7-day
        # idle rule described on the restore step. Steady state is about two.
        # The `main` gate is therefore about not spending a feature branch's
        # cache budget, not about bounding growth. Cache scoping already keeps such an entry out of main's
        # restores. The scheduled run this lane exists for is on `main`, and
        # still saves.
        #
        # `!cancelled() && steps.corpus-cache.outcome == 'success'` for the two
        # reasons spelled out on the step above — a cancellation mid-cmin, and a
        # setup failure before the restore — either of which would otherwise
        # publish a truncated or seeds-only corpus as the newest entry.
        # `steps.corpus-cmin.outputs.collapsed == '0'` is the third gate, and it
        # is deliberately fail-CLOSED, and the explicit `'0'` matters: a test of
        # `!= '1'` would pass on `''`, and `''` is not only the skipped case.
        # What that catches: cmin hitting its own `timeout-minutes` is marked
        # FAILED, not cancelled, so `!cancelled()` stays true while the output
        # write never ran — and `!= '1'` would have published a half-minimised
        # corpus as the newest entry. (The missing-manifest path is NOT such a
        # case: it writes `collapsed=0` explicitly before its early exit, since
        # the corpus there is intact and republishing it is a useful no-op.)
        # Requiring an explicit `'0'` means every path that did not finish the
        # loop and record a clean result declines to publish, leaving the
        # previous entry newest.
        if: ${{ !cancelled() && steps.corpus-cache.outcome == 'success' && steps.corpus-cmin.outputs.collapsed == '0' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/fuzz/corpus
          # `run_attempt` is in the key because `run_id` alone is STABLE across
          # attempts: re-running this job from the Actions UI would hit the
          # already-reserved key, and `actions/cache/save` warns and continues
          # rather than failing — so the step stays green while that attempt's
          # corpus is silently dropped. The `fuzz-corpus-` prefix is unchanged,
          # so `restore-keys` still selects the newest entry.
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload fuzz artifacts (crashes / corpus)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: |
            src-tauri/fuzz/artifacts/
            src-tauri/fuzz/corpus/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload per-target fuzz status (#3169)
        # Separate from `fuzz-artifacts` above on purpose: adding a workspace-
        # root path to that multi-path upload would move its least-common-
        # ancestor and reshuffle the existing artifact's layout.
        #
        # `if-no-files-found: ignore` stays (#3360): a lane that died before it
        # could write anything is already red, and turning that into a second
        # red upload step adds noise, not signal. The ambiguity it creates for
        # the CONSUMER — "no findings" vs "no data" — is closed on the consumer
        # side instead, by the `--require-results` /
        # `--require-targets-manifest` flags the `file-fuzz-findings` job passes.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-status
          path: fuzz-status/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # file-fuzz-findings (#3169) — the same push-based triage loop
  # `file-mutation-survivors` above runs for the mutants lanes, applied to
  # `fuzz`. The fuzz lane's only signal was a red job in a weekly workflow,
  # which is easy to miss: the #3163 compile break landed 2026-07-24 and
  # survived five days. This job downloads the lane's per-target status files,
  # turns them into findings (build failure with the compiler error, crash
  # reproducer with the target + input hash, per-input timeout, target that
  # never ran), diffs them against the SINGLE tracking issue's last-known set
  # (via `scripts/file-fuzz-findings.mjs`), and files/updates that ONE issue
  # only when a genuinely NEW finding appears — a no-op otherwise, so a
  # persistent failure never spams a weekly issue or comment. State lives in
  # the tracking issue's body (a marked, machine-readable block), not a
  # committed baseline file, so this job needs `issues: write` only — never
  # `contents: write`.
  #
  # `if: always()`: runs even when `fuzz` failed outright — which is the whole
  # point, since the real-world failure was a COMPILE error, not a crash
  # artifact. A missing artifact contributes zero per-target findings rather
  # than failing triage (`continue-on-error` download); `needs.fuzz.result` is
  # passed in so a lane that died before it could upload anything still gets
  # reported. Writes only when `CRON_EQUIVALENT` (workflow `env`) holds and
  # dry-runs otherwise (#2947): a smoke dispatch testing a `fuzz_seconds`
  # tweak exercises the whole path and never touches the real tracking issue.
  # ---------------------------------------------------------------------------
  file-fuzz-findings:
    needs: [fuzz, select-lanes]
    if: always() && needs.select-lanes.outputs.fuzz == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download per-target fuzz status
        # Best-effort: if the `fuzz` job never uploaded (e.g. it errored during
        # setup, before the fuzz step existed), this contributes zero per-target
        # findings below and the `--job-status` fallback reports the lane
        # failure instead of failing the triage step.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fuzz-status
          path: fuzz-status-artifact

      - name: File or update the single fuzz-findings tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Rides via `env:` (not inline `${{ }}`) per zizmor template-injection.
          FUZZ_JOB_RESULT: ${{ needs.fuzz.result }}
        # `--require-results` / `--require-targets-manifest` (#3360): the
        # `fuzz-status` upload is `if-no-files-found: ignore` and this job's
        # download is `continue-on-error`, so a lost or partial artifact used to
        # reach the filer as "zero findings" — a cheerful no-op indistinguishable
        # from a clean week. The flags only fire where the script's own `[lane]`
        # fallback does not (a lane that succeeded, or whose status is unknown,
        # and a partial artifact with no `targets.txt`), so a lane that died
        # outright still gets reported rather than erroring out first. The
        # resulting red filer job is itself reported by #3359's
        # `report-scheduled-failures`, which `needs:` this job.
        run: |
          set -euo pipefail
          # Seeded, never `extra=()`: see the reporter step below.
          extra=(--require-results --require-targets-manifest)
          if [ "$CRON_EQUIVALENT" != 'true' ]; then
            extra+=(--dry-run)
          fi
          node scripts/file-fuzz-findings.mjs \
            --result-dir fuzz-status-artifact \
            --job-status "$FUZZ_JOB_RESULT" \
            "${extra[@]}"

  # ---------------------------------------------------------------------------
  # type-aware-lint (#4408) — `oxlint --type-aware`. Reporting-only, with a
  # liveness guard that is emphatically NOT reporting-only.
  #
  # Why it is not a gate: 397 of the findings it reports today pre-date the
  # lane (the type-aware backend had never been installed, so these rules had
  # never once been evaluated — two of them, `typescript/only-throw-error` and
  # `typescript/require-await`, were configured as `error` in `.oxlintrc.json`
  # the whole time and were inert). Failing on them would put this lane
  # permanently red on day one, which is how a lane stops being read. Runtime
  # is not the reason: the whole-repo type-aware run measures ~4s wall clock
  # against ~1.1s for the plain one, so `validate` could afford it — the
  # backlog is what disqualifies it, and the burn-down below is the path back.
  #
  # Why it can still go red: #3330. `mutants-frontend` above spent a while
  # STRUCTURALLY INCAPABLE of failing — a `|| true` ate a total crash and the
  # summary rendered a crashed run identically to a perfect one. So the
  # analysis step tolerates findings and NOTHING else, and the liveness guard
  # after it classifies the run POSITIVELY: allow-listed exit code, a
  # parseable `-f json` envelope, exit code and error count that agree, a
  # generated canary fixture that must still trip its type-aware rule, and the
  # rule count below.
  #
  # The canary is load-bearing rather than belt-and-braces, because the exit
  # code cannot carry this signal. Measured against oxlint 1.79.0, ALL of
  # these exit 1: findings exist, `oxlint-tsgolint` missing, unknown flag,
  # rejected config, absent path. Keying lane health on "exit 1 means it
  # worked" would be a deny-list that fails open on every breakage nobody has
  # thought of yet. See the script header for the full rationale.
  #
  # And the canary alone is still not enough, because it builds its own argv
  # with `--type-aware` hardcoded: it proves the TOOLCHAIN works, not that
  # THIS run used the flag. Delete `--type-aware` from the invocation below
  # and every other check passes — the report is a valid envelope, exit 0
  # agrees with a warnings-only body, and the canary fires on its own flag.
  # So the guard also compares the main run's `number_of_rules` against a
  # plain baseline it measures at run time over THE SAME TARGET: a type-aware
  # run registers strictly more rules than a plain one of the same config. If
  # you edit the oxlint line below, that check is what will catch you dropping
  # the flag — and if you narrow its target, the guard's own file-count parity
  # check reports that the two runs are no longer comparable rather than
  # comparing them anyway.
  #
  # No count is hardcoded here or in the guard — not 397, not a threshold.
  # Every figure in the step summary is computed from the report just
  # produced, so the burn-down cannot make this lane lie.
  # ---------------------------------------------------------------------------
  type-aware-lint:
    needs: select-lanes
    if: needs.select-lanes.outputs.type_aware_lint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        # `npm ci` (not `npm install`): `oxlint-tsgolint` is a devDependency
        # whose exact version is pinned in the lock and checked against the
        # `typescript` it pairs with by the `tsgolint-version-pin` prek hook.
        run: npm ci

      - name: Run oxlint --type-aware
        # Reporting-only: findings must not fail this step. The exit code is
        # captured rather than propagated, and handed to the liveness guard
        # below, which is the ONLY thing in this job allowed to judge the run.
        #
        # `-f json` on purpose: the human-readable formatter cannot be told
        # apart from an error message, whereas every known failure mode prints
        # a bare line INSTEAD of the JSON envelope. stderr goes to its own file
        # so it can never corrupt the report the guard parses.
        run: |
          mkdir -p reports/type-aware
          set +e
          npx oxlint --type-aware -f json \
            > reports/type-aware/report.json \
            2> reports/type-aware/stderr.log
          echo "oxlint_exit=$?" >> "$GITHUB_ENV"
          set -e

      - name: Liveness guard (#4408) — the load-bearing acceptance item
        # Deliberately OUTSIDE the reporting-only step above, and the direct
        # analogue of `mutants-frontend`'s `Lane-liveness guard (#3330)`.
        # Fails ONLY on whether the lane RAN — never on how many findings it
        # reported, which stays pure triage signal per this lane's design.
        # (Its fixture suite USED to run as the `type-aware-liveness-selftest`
        # prek hook; #4556 unwired that hook, so the suite runs nowhere today
        # until #4556 Phase 2 restages the self-tests into CI.)
        if: always()
        env:
          OXLINT_EXIT: ${{ env.oxlint_exit }}
        run: |
          node scripts/check-type-aware-liveness.mjs \
            --report reports/type-aware/report.json \
            --exit-code "$OXLINT_EXIT"

      - name: Type-aware summary
        # Presentational only — never fails, by design (same contract as the
        # mutation lanes' summaries). The liveness guard above is the single
        # place this job can go red; if it did, this table is the diagnosis.
        if: always()
        run: |
          node scripts/check-type-aware-liveness.mjs \
            --summary --report reports/type-aware/report.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload type-aware report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: type-aware-report
          path: reports/type-aware/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # full-suite — the WHOLE-TREE BACKSTOP that makes per-PR category gating safe.
  #
  # ci/path-conditional-jobs: the per-PR `_validate.yml` lint job and the local
  # `scripts/verify-ci-equivalent.sh` Phase A now SKIP the prek hooks whose
  # category (frontend/backend/ci/docs) a given push did not touch — trading
  # whole-tree coverage of the ABSENT categories for a faster gate. This job is
  # the counterweight: on the weekly schedule (and on demand) it runs the FULL,
  # UNSKIPPED prek suite (both pre-commit and pre-push stages) plus the FULL
  # vitest / playwright / nextest / doc-test suites over the entire tree, so a
  # latent breach in an untouched, unchanged-category file is caught here even
  # when no PR re-linted it. Nothing is category-gated: every hook and every
  # test runs. Not a required check — a maintainer triages any failure.
  # ---------------------------------------------------------------------------
  full-suite:
    needs: select-lanes
    if: needs.select-lanes.outputs.full_suite == 'true'
    runs-on: ubuntu-24.04
    # The slow exhaustive lane: cold-ish compile + the full prek suite (both
    # stages) + full vitest + full playwright + full nextest + doc-tests.
    # 60 -> 75: the 4 sqlx-prepare compile passes and the Node 22 floor run,
    # each previously a lane of its own, now sit inside this one budget.
    # 75 -> 100: the lane hit the 75 cap and was cancelled on run 33823056127.
    # Measured growth, not a regression: 46 min (08-24) -> 48 (08-31) -> 69
    # (09-03) -> cap. The two 16-minute "failures" between the 69-min run and
    # the timeout were #4647's broken intra-doc links killing the job early,
    # which hid how little headroom was left. The suite really did grow —
    # agaric-engine went 942 -> 965 tests and the pre-push `cargo doc` gained
    # three rustdoc lints (#4665).
    #
    # This buys headroom ONCE. The lane's cost tracks test-suite growth, so the
    # durable fix is to shard it the way `mutants` already is here: #4675.
    # A cancelled job also reports through #3394 as a failing lane and produces
    # no artifact, so the failure mode is worse than a slow pass.
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks (run via prek) inspects git history; fetch the full graph.
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space on runner
        # The full test + coverage-free nextest tree plus the Playwright browser
        # download are heavy; drop the unused preinstalled toolchains first
        # (same rationale as the cargo-tests job in _validate.yml).
        run: |
          set -euo pipefail
          echo "Before:" && df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /usr/local/share/boost \
                      /usr/local/share/powershell \
                      /usr/share/swift \
                      "$AGENT_TOOLSDIRECTORY"
          echo "After:" && df -h /

      - name: Toolchain (apt, mold, Rust, Node, npm ci)
        uses: ./.github/actions/toolchain
        with:
          rust-shared-key: rust-full-suite

      - name: Prepare externalBin placeholder (FEAT-4f)
        # Tauri's build.rs validates externalBin paths on every cargo
        # invocation (clippy hook, nextest, doc-tests).
        run: node scripts/prepare-external-bins.mjs --placeholder-only

      - name: Install prek + non-Rust lint tools via prebuilt binaries
        # Mirrors the lint job's first (ungated) tool install: prek runs the
        # whole suite; zizmor/taplo/typos/sqruff are invoked by prek hooks.
        uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          # sqruff pinned to 0.38.x: >=0.39 needs rustc 1.96 while this repo
          # pins 1.95.0 (see the lint job in _validate.yml). Bump in lockstep.
          # zizmor pinned (#3476) to `ZIZMOR_PINNED_VERSION` in
          # scripts/zizmor-hook.sh; the wrapper fails the run on a mismatch.
          # prek/taplo-cli/typos-cli pinned (#3742) — must match
          # `pinned_version_for` in scripts/setup-hooks.sh and the other
          # tool: lists in this repo. Verified by
          # scripts/check-prek-version-pin.mjs.
          tool: prek@0.3.8,zizmor@1.28.0,taplo-cli@0.10.0,typos-cli@1.46.0,sqruff@0.38.0

      - name: Install cargo plugins via prebuilt binaries
        # cargo-deny/cargo-machete are invoked by prek Rust hooks; cargo-nextest
        # backs both the cargo-test hook and the explicit nextest step below.
        uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-deny,cargo-machete,cargo-audit,cargo-nextest

      - name: Install sqlx-cli (custom features, cargo fallback)
        # Same as the lint job: sqlx-cli's feature set isn't in taiki-e's binary
        # list, so compile from source (cached via rust-cache cache-bin).
        run: |
          if ! command -v cargo-sqlx >/dev/null; then cargo install --locked sqlx-cli --no-default-features --features rustls,sqlite; fi

      # sqlx offline cache checks (4 lanes) — one per crate carrying a
      # committed `.sqlx/` cache, mirroring `_validate.yml`'s lint job. This is
      # the pre-push `verify-ci-equivalent` hook Phase E, invoked directly: the
      # hook itself recurses into a nested whole-tree prek run and fail-exits
      # on the empty push range a scheduled on-`main` run always has. The three
      # non-root crates get absolute throwaway DBs under `runner.temp`, since a
      # relative sqlite path resolves against the workspace root, not the crate
      # dir. The action creates + migrates each DB, so an absent file never
      # false-fails this.
      - name: sqlx offline cache check (root, dev.db)
        uses: ./.github/actions/sqlx-offline-check
        with:
          working-directory: src-tauri
          database-url: 'sqlite:dev.db'

      - name: sqlx offline cache check (agaric-store)
        uses: ./.github/actions/sqlx-offline-check
        with:
          working-directory: src-tauri/agaric-store
          database-url: 'sqlite:${{ runner.temp }}/agaric-store-sqlx-prepare.db'

      - name: sqlx offline cache check (agaric-engine)
        uses: ./.github/actions/sqlx-offline-check
        with:
          working-directory: src-tauri/agaric-engine
          database-url: 'sqlite:${{ runner.temp }}/agaric-engine-sqlx-prepare.db'

      - name: sqlx offline cache check (agaric-sync)
        uses: ./.github/actions/sqlx-offline-check
        with:
          working-directory: src-tauri/agaric-sync
          database-url: 'sqlite:${{ runner.temp }}/agaric-sync-sqlx-prepare.db'

      - name: Install lychee (prebuilt binary)
        # The `lychee` prek hook is a `local` hook calling the system binary;
        # install it the same pinned+checksummed way the lint job does.
        run: |
          set -euo pipefail
          VERSION=lychee-v0.24.2
          DIR=lychee-x86_64-unknown-linux-gnu
          TARBALL="${DIR}.tar.gz"
          SHA256=1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
          curl -fsSL -o /tmp/lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/${VERSION}/${TARBALL}"
          echo "${SHA256}  /tmp/lychee.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/lychee.tar.gz -C /tmp "${DIR}/lychee"
          install -m 0755 "/tmp/${DIR}/lychee" "${HOME}/.local/bin/lychee"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/lychee" --version

      - name: Restore lychee link-check cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ hashFiles('**/*.md', '!node_modules/**') }}
          restore-keys: |
            lychee-${{ runner.os }}-

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright system deps
        # #4115: deliberately UNBOUNDED, unlike the `apt-get update` sites in
        # this file. A 300s cap was tried and reverted: `_validate.yml:1220`
        # records `install-deps` taking 760s (12.7 min) on a slow-but-healthy
        # Ubuntu mirror, and the 20 -> 30 minute job bump was paid specifically
        # to absorb that. Any cap below the observed runtime converts a slow
        # pass into a hard red, which is a worse failure than the one #4115 is
        # about — and picking a number above it (900s?) would be inventing a
        # bound from a single observation.
        #
        # Two further reasons a wrapper here is weaker than it looks: `timeout`
        # runs as the runner user while `npx` shells out to `sudo apt-get`, so
        # the SIGTERM cannot reach the root grandchild actually holding the
        # mirror connection (prepare-apt's own comment records this); and this
        # job, unlike _validate.yml's playwright job, has no
        # `/var/cache/apt/archives/*.deb` cache, so it pays the full ~33 MB
        # download every run.
        #
        # This note used to end by pointing at prepare-apt's Azure mirror
        # rewrite as "the mitigation with evidence behind it". #4163 deleted
        # that rewrite: its own self-check had been printing `apt sources now
        # name azure 0` (jobs 95978698511 and 95996544264), because the
        # ubuntu-24.04 image keeps its mirror hostnames in
        # /etc/apt/apt-mirrors.txt and the sed only ever read
        # /etc/apt/sources.list*. And the direction was inverted: in job
        # 95996544264, azure.archive.ubuntu.com was `Ign`d 68 times while
        # archive.ubuntu.com answered. So there is no mirror mitigation to
        # credit here — what recovers a stall is the image's own `mirror+file`
        # failover, and this step's real exposure is still the missing
        # `/var/cache/apt/archives/*.deb` cache. Bounding it properly needs
        # that cache first; tracked in #4115.
        run: npx playwright install-deps chromium

      - name: Install Playwright browser binaries (on cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run the FULL prek suite — pre-commit stage (no SKIP, whole tree)
        # The whole-tree backstop for the per-PR category-gated Phase A: NO SKIP,
        # so every category's hooks run against every file.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: prek run --all-files

      - name: Run the FULL prek suite — pre-push stage (whole tree)
        # Pre-push-staged hooks (knip, npm-audit, lychee, cargo-clippy) do NOT
        # run in the pre-commit invocation above — run them whole-tree here so
        # the backstop covers them too.
        #
        # SKIP carries only the pre-push hooks that are meaningless / broken in
        # a whole-tree CI-on-main context, exactly like the `lint` job:
        #   * no-commit-to-branch — the `--branch=main` protected-branch guard
        #     is a LOCAL-dev push guard; this scheduled job runs ON main, so it
        #     would HARD-FAIL the whole step every run.
        #   * verify-ci-equivalent — the pre-push verifier itself; letting it
        #     run here re-invokes the entire Phase A prek suite + range tests
        #     NESTED inside this prek process (recursion / wasted wall-clock,
        #     and it fail-exits when the on-main push range is empty).
        #   * vitest / cargo-test — the range-scoped test hooks; the FULL
        #     vitest + nextest suites run as their own explicit steps below, so
        #     these would only re-read `--cached` (nothing staged) and add noise.
        # Every REAL category hook still runs unskipped — the backstop holds.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP: no-commit-to-branch,verify-ci-equivalent,vitest,cargo-test
        run: prek run --all-files --hook-stage pre-push

      - name: Run prek manual stage (self-tests + CI-only guards, #4556 Phase 2)
        # Every surviving self-test and the CI-only guards live in the `manual`
        # stage, which `prek run --all-files` above never selects. SKIP is
        # emptied explicitly, mirroring the `lint` job in `_validate.yml`.
        # Exact count, not `> 0`, and no `Skipped`: a `files:`-scoped hook that
        # matches nothing reports Skipped and exits 0 (the knip false-green shape).
        env:
          SKIP: ''
        run: |
          set -euo pipefail
          # Counted from prek.toml at run time, the independent source: every
          # manual hook is that line. `|| true` because grep -c exits 1 on none.
          expected=$(grep -cE '^stages = \["manual"\]$' prek.toml || true)
          [ "$expected" -gt 0 ] || { echo "no manual-stage hooks found in prek.toml"; exit 1; }
          listed=$(prek list --hook-stage manual --output-format json | jq length)
          [ "$listed" -eq "$expected" ] || { echo "manual stage lists $listed hooks, expected $expected"; exit 1; }
          prek run --all-files --hook-stage manual 2>&1 | tee manual.log
          passed=$(grep -c 'Passed$' manual.log || true)
          [ "$passed" -eq "$expected" ] || { echo "$passed of $expected manual hooks reported Passed"; exit 1; }
          if grep -q 'Skipped' manual.log; then echo "a manual-stage hook was Skipped"; exit 1; fi

      - name: Vitest (full suite)
        run: npx vitest run

      - name: Playwright E2E tests (full suite)
        run: npx playwright test

      - name: Cargo nextest (full suite) + doc-tests
        working-directory: src-tauri
        # nextest does NOT run doc-tests (they compile as their own per-example
        # binaries), so run both to keep executable doc examples honest (#2555).
        #
        # `--workspace` (#3212): without it, both commands are package-scoped to
        # `agaric` only — this "full suite" step was silently skipping every
        # agaric-core/store/engine/sync/observability/diagnostics test (and their
        # doc-tests), the same class of gap #2817/#2951 already fixed for the
        # PR-gating `cargo-tests` job and the pre-push Phase D2 doc-test step.
        run: |
          cargo nextest run --workspace --profile ci
          cargo test --doc --workspace

      - name: Install Node 22 (the `engines.node` floor)
        # The Node floor is checked weekly here, not per PR. Pinned to the
        # exact floor of `engines.node` (^22.22.2), not a floating 22, so the
        # lane tests the lowest version we claim to support — keep in lockstep
        # with package.json. Last in the job: it replaces the Node 24 every
        # step above ran on.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install npm dependencies (Node 22)
        # `.npmrc` sets engine-strict=true, so this step is itself part of the
        # test: npm refuses to install if `engines.node` excludes 22.22.2.
        run: npm ci

      - name: Typecheck + vitest on Node 22 (no coverage)
        run: |
          npm run typecheck
          npx vitest run

  # ---------------------------------------------------------------------------
  # report-scheduled-failures (#3359) — the notification path for THIS
  # workflow. Every lane above is non-blocking triage signal, and #3365 spent
  # its whole diff making three of them capable of going red at all. But a
  # guard that goes red into the void is barely better than the swallowed
  # `|| true` it replaced: until this job existed, a failed weekly lane was
  # visible only to whoever happened to open the Actions tab. The #3163 fuzz
  # compile break survived five days that way.
  #
  # This is the same push-based triage loop as `file-mutation-survivors` and
  # `file-fuzz-findings`, one level up: those two triage a lane's CONTENT,
  # this one triages lane HEALTH. It keeps ONE rolling tracking issue that
  # reopens on a newly-failing lane and closes itself once every lane is green
  # (rationale for rolling-vs-per-lane is in the script's header). State lives
  # in that issue's body, so this job needs `issues: write` only.
  #
  # The failure path must not depend on the thing that broke, so:
  #   * it reads ONLY the `needs` context — GitHub's own job results — never a
  #     lane's artifacts. A lane that dies during `apt-get`, before it could
  #     upload anything, still reports `result: failure`.
  #   * `needs:` lists EVERY other job in this workflow, including the two
  #     content filers, so a filer that throws (which #3364/#3365 make
  #     possible on purpose) is itself reported here. The
  #     `scheduled-failure-reporter-selftest` prek hook USED to fail if a job
  #     in this file was missing from the list below; #4556 unwired it, so
  #     that list is unenforced until #4556 Phase 2 restages the self-tests.
  #   * `if: always()` so a failed/cancelled/skipped upstream lane cannot skip
  #     the reporter — which is the entire point.
  #   * the last step is a deliberately minimal bash fallback that fires when
  #     the Node reporter ITSELF failed, using nothing but `gh`.
  # Irreducible remainder: if this job never starts at all (invalid workflow,
  # runner-pool outage, whole-run cancellation) nothing reports. That needs an
  # out-of-band watchdog; `actionlint` in prek covers the invalid-workflow half.
  #
  # It writes for real whenever `CRON_EQUIVALENT` (workflow `env`) holds and
  # dry-runs otherwise, like the two content filers. Writing on a dispatch is
  # safe: the tracking issue is a SET, not an append-log (`decideAction` /
  # `diffLanes` are idempotent), so a dispatch that finds nothing new no-ops
  # exactly like an unchanged scheduled run (#3716). No lane is gated on the
  # event any more, so a `skipped` lane is a real failure on every
  # authoritative run — which the `lanes` input preserves rather than breaks:
  # selecting a subset skips lanes, and selecting a subset is exactly what
  # makes `CRON_EQUIVALENT` false, so such a run is never authoritative.
  # ---------------------------------------------------------------------------
  report-scheduled-failures:
    needs:
      # `select-lanes` included so the comment above stays true, and for a
      # concrete failure: if it dies for an infra reason on the cron, all
      # eleven lanes skip and this reporter — authoritative, since `lanes`
      # defaults to `all` — would file eleven broken lanes without naming
      # the one job that actually failed.
      - select-lanes
      - clippy-clean
      - bench-smoke
      - bench-slo
      - mutants
      - mutants-merge
      - mutants-frontend
      - file-mutation-survivors
      - fuzz
      - file-fuzz-findings
      - type-aware-lint
      - full-suite
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: File, update or close the single scheduled-failure tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Rides via `env:` (not inline `${{ }}`) per zizmor template-injection.
          # `toJSON(needs)` carries every needed job's `result`; written to a
          # file rather than passed as an argv string so a payload containing
          # quotes can never be re-parsed by the shell.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS_JSON" > needs.json
          # SEEDED, never `extra=()`: on bash < 4.4 — stock /bin/bash on
          # macOS, which scripts/setup-hooks.sh keeps compatibility with on
          # purpose — expanding an EMPTY array under `set -u` is an
          # unbound-variable abort, not an empty expansion. On the `schedule`
          # path this array stayed empty, so the step aborted before running
          # the reporter at all for anyone on that shell. Keeping the always-
          # passed arguments in the array means it is never empty at the point
          # of expansion.
          extra=(--needs-json-file needs.json)
          if [ "$CRON_EQUIVALENT" != 'true' ]; then
            extra+=(--dry-run)
          fi
          node scripts/file-scheduled-failures.mjs "${extra[@]}"

      - name: Last-resort notice (the reporter itself broke)
        # Fires only when a step ABOVE in this job failed — i.e. the Node
        # reporter is the thing that broke, so the normal tracking issue was
        # NOT updated and the week's lane failures went unreported.
        #
        # Deliberately minimal and Node-free: three `gh` calls, no parsing, no
        # marker block, and a SEPARATE tracking issue so it cannot corrupt the
        # primary issue's machine-readable state. This is the step that makes
        # the failure path independent of the reporter it reports on; keep it
        # boring. `|| true` on `issue reopen` because reopening an
        # already-open issue exits non-zero.
        #
        # Fires for exactly the runs that can WRITE (#3960). This step used
        # to be gated on `schedule` because a dispatch ran the reporter with
        # `--dry-run`: it wrote nothing, so a crash there cost nothing but
        # the human's own console output. #3716 removed that `--dry-run`, so
        # the gate was removed with it — a dispatch issues real `gh issue
        # edit` / `comment` / `close` calls in that order, and a reporter
        # crash MID-SEQUENCE leaves the tracking issue partially rewritten,
        # a body whose marker block no longer matches its comments. Being
        # watched by a human is not coverage: the whole point of this
        # fallback is that the run's own summary is the thing that broke.
        #
        # But the un-gate then outlived its premise, in the same PR: #3960's
        # third pass RESTORED `--dry-run` for every ref except the cron's, so
        # a branch dispatch writes nothing again and a crash there cannot
        # have left anything half-written. Reopening the repo-wide "the
        # reporter is broken" issue for it is a false alarm on the one
        # channel that must stay trustworthy. So the condition tracks the ref
        # the way the reporter step does.
        #
        # It deliberately does NOT also track the dispatch INPUTS. A cron-ref
        # dispatch with a shortened budget writes nothing either, and this
        # notice still firing for it over-approximates in the LOUD direction —
        # the only direction a last-resort notice may err in. Over-firing
        # costs a comment on an idempotent issue; under-firing is the silence
        # this job exists to end. Keep the ref in step with the authority
        # gate's.
        if: failure() && (github.event_name == 'schedule' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          title='Scheduled deep checks: the failure reporter is broken (auto-filed, do not rename)'
          body="$(printf '%s\n' \
            "The \`report-scheduled-failures\` job's own reporting step failed, so the rolling \"failing lanes\" tracking issue was **not** updated for this run — this week's lane results are unreported." \
            "" \
            "This notice is written by a deliberately minimal bash fallback (no Node, no parsing, no shared code with the reporter) so that a break in \`scripts/file-scheduled-failures.mjs\` cannot also swallow the report of itself (#3359)." \
            "" \
            "Run: $RUN_URL" \
            "" \
            "Open that run and read the lane results directly, then fix the reporter.")"
          number="$(gh issue list --repo "$TARGET_REPO" \
            --search "in:title \"$title\"" --state all \
            --json number,title,state --limit 20 \
            --jq "[.[] | select(.title == \"$title\")] | sort_by(.state != \"OPEN\") | .[0].number // empty")"
          # Every `gh` WRITE below is checked explicitly. `set -e` is
          # deliberately NOT used — a failing `gh issue list` must still fall
          # through to `gh issue create` rather than abort — but that also
          # means a bare `gh ...` followed by `echo` would leave the step's
          # exit status at the `echo`'s 0, i.e. this last-resort notice would
          # report "filed" while having written NOTHING. That is the exact
          # class of vacuous check (#3359) this job exists to eliminate, in
          # the one layer that has no layer beneath it.
          if [ -n "$number" ]; then
            gh issue reopen "$number" --repo "$TARGET_REPO" || true
            if gh issue comment "$number" --repo "$TARGET_REPO" --body "$body"; then
              echo "commented on existing reporter-broken issue #$number"
            else
              echo "::error::could not comment on reporter-broken issue #$number — this run's lane results are UNREPORTED"
              exit 1
            fi
          else
            if gh issue create --repo "$TARGET_REPO" --title "$title" --body "$body" \
              --label github-actions --label testing; then
              echo "filed a new reporter-broken issue"
            else
              echo "::error::could not file the reporter-broken issue — this run's lane results are UNREPORTED"
              exit 1
            fi
          fi
