name: Scheduled deep checks

# Heavy correctness/perf tooling that is too slow for the per-PR critical
# path (the PR gate is `ci.yml` → `_validate.yml`). Runs weekly + on manual
# dispatch. None of these jobs is a required check; they surface signal via
# step summaries and uploaded artifacts, and a maintainer triages survivors.
#
# Lanes:
#   clippy-clean   — cache-busting full-workspace `cargo fmt --all --check` +
#                    `cargo clippy`: no rust-cache, cold compile, `--workspace`.
#                    The warm per-PR cache never re-lints unchanged targets when
#                    a lint is newly added to a Cargo.toml, so violations stay
#                    latent (this masked #1875's pedantic lints in the
#                    diagnostics bins + an app-lib test); the per-PR fmt/clippy
#                    hooks also omit --all/--workspace, skipping the diagnostics
#                    member entirely. This lane fails on that drift weekly.
#   bench-smoke    — #639/#978: SHARDED across N runners. Each shard compiles
#                    ONLY its slice of the criterion benches (single cohesive
#                    `cargo bench --no-run --bench …` invocation) then SMOKE-RUNS
#                    that slice once (`--test`) so a drifted seed/fixture fails
#                    CI instead of rotting silently. Sharding keeps the combined
#                    compile+smoke wall-clock under budget (the old single-runner
#                    `bench-compile` job blew the 90 min cap mid-smoke — #2122).
#   bench-slo      — #639: RUNS the interactive_slo SLO gate + the `#[ignore]`d
#                    20k-row perf gates, which nothing else exercises. Split out
#                    of the smoke shards so a smoke timeout can never skip the
#                    SLO gate again. `workflow_dispatch` can flip
#                    `slo_include_problem` to also measure the cache and
#                    MostLinked counterfactual probes (#2508 / #2585).
#   mutants        — #649: cargo-mutants scoped to the invariant core
#                    (op, op_log, reverse, loro/engine). Non-blocking; the
#                    survivor list is the deliverable to triage into tests.
#   mutants-frontend — #886: StrykerJS scoped to a handful of pure,
#                    deterministic frontend libs (search-query's pure
#                    modules, agenda-sort, filters/model, date-utils,
#                    tree-utils — never components or Tauri IPC).
#                    Non-blocking, same triage-signal posture as `mutants`.
#   file-mutation-survivors — #2947: push-based triage loop for the two
#                    mutants lanes above. Diffs their combined survivor list
#                    against a single open tracking issue's last-known set
#                    and files/updates that ONE issue only on genuinely NEW
#                    survivors (see `scripts/file-mutation-survivors.mjs`).
#                    Scheduled-event-only; needs `issues: write`.
#   fuzz           — #650/#2590/#2945: short coverage-guided fuzz runs over
#                    the raw-input parsers (snapshot decode, deeplink parse,
#                    Markdown/Obsidian import parse, FTS strip/sanitize, HTML
#                    link-metadata parse). Smoke-length here (the per-target
#                    time budget is small); a real fuzzing campaign runs longer
#                    out-of-band.
#   file-fuzz-findings — #3169: the same push-based triage loop as
#                    `file-mutation-survivors`, for the `fuzz` lane. Turns the
#                    lane's per-target status files into findings (build
#                    failure, crash reproducer, timeout, target that never
#                    ran), diffs them against a single tracking issue's
#                    last-known set and files/updates that ONE issue only on
#                    genuinely NEW findings (see
#                    `scripts/file-fuzz-findings.mjs`). Scheduled-event-only;
#                    needs `issues: write`.
#   prek-all-files — #3058: `prek run --all-files` (pre-commit stage, whole
#                    tree), HARD-FAILING — unlike every other lane above,
#                    this one gates. No cargo build/clippy/test (the
#                    pre-commit stage doesn't need them) so hook drift gets a
#                    clean, undiluted signal instead of being buried inside
#                    `full-suite`'s much slower everything-job — it still
#                    needs the Tauri system deps + toolchain to back its 4
#                    `cargo sqlx prepare --check` compile passes (see below).
#                    `full-suite` below separately covers the pre-push-staged
#                    hooks (fmt-check/clippy/knip/npm-audit/lychee) as part
#                    of its own broader backstop; this lane's `sqlx offline
#                    cache check` steps are the pre-push `verify-ci-equivalent`
#                    hook's Phase E equivalent, run directly (not via that
#                    hook) to avoid the recursion `full-suite` documents
#                    avoiding for the same reason.
#   report-scheduled-failures — #3359: the NOTIFICATION path for this whole
#                    workflow. Every lane above is non-blocking, so before
#                    this job a red lane was visible only to whoever opened
#                    the Actions tab (the #3163 fuzz break survived five days
#                    that way). It reads every other job's `needs.*.result`
#                    and keeps ONE rolling tracking issue that reopens on a
#                    newly-failing lane and closes itself when all are green
#                    (see `scripts/file-scheduled-failures.mjs`). Its own
#                    `if: failure()` bash fallback covers the reporter
#                    breaking. Needs `issues: write`.
on:
  schedule:
    # Mondays 04:17 UTC — off-peak, odd minute to avoid the top-of-hour
    # scheduler stampede. Weekly is enough for trend/triage tooling.
    #
    # e2e-tauri-weekly is deliberately scheduled earlier (02:43 Mon) so it
    # drains before this lane starts; the two used to share this exact minute
    # and contended for the same runner pool. See #3168.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      mutants_timeout:
        description: >-
          Test-phase timeout (seconds) for the mutants lane — applies to
          BOTH the unmutated baseline and every individual mutant (#3057:
          `--in-place` disables cargo-mutants' automatic 5x-baseline
          multiplier, so this fixed value is the only timeout in effect).
          Default carries headroom over the observed ~300s baseline
          test-phase need.
        required: false
        default: '900'
      fuzz_seconds:
        description: 'Per-target fuzz time budget (seconds)'
        required: false
        default: '120'
      slo_include_problem:
        description: 'Also run the interactive_slo cache/counterfactual probes (#2508/#2585) — off by default so the scheduled gate tracks only in-budget commands'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # #3362 — the SINGLE source of truth for which benches the `bench-slo` job
  # warm-runs, and therefore which ones `bench-smoke` excludes from its shards.
  # Space-separated.
  #
  # Both jobs read THIS value: `bench-slo` builds its `--bench` arguments from
  # it, `bench-smoke` derives its exclusion from it, and each asserts every name
  # in it is a real bench target in `cargo metadata` before using it. The union
  # of the two lanes is then the whole bench universe by construction, and a
  # bench that fell out of both would have to be missing from `cargo metadata`
  # — which those assertions catch.
  #
  # Before this, `bench-smoke` excluded `interactive_slo` with a hardcoded
  # `grep -vx` and NOTHING asserted `bench-slo` still covered it: rename the
  # bench, rename the job, or drift its list, and the project's only automated
  # latency signal ran in NEITHER lane while every shard still exited 0.
  #
  # `scripts/check-bench-lane-coverage.mjs` (prek hook `bench-lane-coverage`)
  # holds the half the workflow cannot check about itself — that BOTH jobs
  # still exist and still read this variable outside comments.
  SLO_BENCHES: interactive_slo

jobs:
  # ---------------------------------------------------------------------------
  # clippy-clean — cache-busting full-workspace clippy. The per-PR clippy hook
  # restores the Swatinem rust-cache, which never re-lints already-compiled,
  # unchanged targets when a lint is newly added to a Cargo.toml — so the new
  # lint's violations stay latent until a cache-miss. This masked #1875's
  # pedantic lints in the diagnostics bins + an app-lib test. This lane builds
  # COLD (no rust-cache) and lints every workspace member (`--workspace`, which
  # the per-PR hook also omits), so latent drift fails here weekly instead of
  # ambushing the next unrelated Rust PR.
  # ---------------------------------------------------------------------------
  clippy-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config \
            mold

      - name: Enable mold linker (CI-only .cargo/config.toml)
        run: |
          mkdir -p .cargo
          cp .cargo/config.toml.example .cargo/config.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Check formatting over the whole workspace
        working-directory: src-tauri
        # `--all`: check every member, incl. agaric-diagnostics (the per-PR
        # fmt hook omits it, so that crate's formatting is otherwise never
        # enforced). No compile needed, so it runs before the clippy build.
        run: cargo fmt --all --check

      # No Swatinem/rust-cache here ON PURPOSE: a warm cache is exactly what
      # masks newly-added lints on unchanged targets. This lane must compile
      # cold so clippy re-checks everything.

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare externalBin placeholder (FEAT-4f)
        # Tauri's build.rs validates externalBin paths on every cargo
        # invocation, including the clippy compile below.
        run: node scripts/prepare-external-bins.mjs --placeholder-only

      - name: Clean-compile clippy over the whole workspace
        working-directory: src-tauri
        # `--workspace`: lint every member, incl. agaric-diagnostics (the
        # per-PR hook omits it, so those bins are otherwise never linted).
        # `-D warnings`: any lint is a failure. Cold build → no cache masking.
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # bench-smoke (#639/#978) — SHARDED compile + seed/fixture smoke-run.
  #
  # A single `bench-compile` job used to compile all 29 benches (~36 min) then
  # smoke-run them (~53 min) on ONE runner; the combined walk blew the 90 min
  # cap and got cancelled mid-smoke (#2122), which ALSO skipped the
  # interactive_slo SLO gate that ran as a later step in the same job. This job
  # shards the compile+smoke across N runners: each shard compiles ONLY its
  # slice of the benches and smoke-runs exactly that slice, so no single runner
  # carries the whole suite. The SLO gate + ignored perf gates moved to the
  # separate `bench-slo` job below, immune to a smoke timeout.
  # ---------------------------------------------------------------------------
  bench-smoke:
    runs-on: ubuntu-24.04
    # Per-shard budget. The heavy 100K-seed benches cluster in the odd shards
    # (deterministic `index % 4` split): shards 0/2 smoke in ~1 min, but shard 1
    # (7 benches incl. the heavy cache/pagination seeds) has been observed to
    # need compile (~21 min) + smoke (~25+ min) — over the old 45-min cap, which
    # cancelled the shard mid-smoke (a false red, not a real bench failure). 70
    # gives headroom while staying well under the 90-min GitHub job ceiling.
    timeout-minutes: 70
    strategy:
      # Don't cancel sibling shards when one bench's seed drifts — we want every
      # shard's verdict in a single run, not a fail-fast that hides the rest.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config \
            mold

      - name: Enable mold linker (CI-only .cargo/config.toml)
        run: |
          mkdir -p .cargo
          cp .cargo/config.toml.example .cargo/config.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # ONE shared bench cache across all shards (own key — the bench/test
          # profile tree matches neither the lint nor the llvm-cov instrumented
          # tree, issue #813). The expensive, shard-invariant cost is the agaric
          # lib + deps + cargo-registry downloads; caching it once and having
          # every shard RESTORE it is the real win. Only shard 0 SAVES (on main)
          # so the four shards never race to write the same key — the per-shard
          # bench objects that differ are cheap to recompile on top of the warm
          # lib.
          shared-key: rust-bench
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 0 }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare externalBin placeholder (FEAT-4f)
        # Tauri's build.rs validates externalBin paths on every cargo
        # invocation, including the `cargo bench` build below.
        run: node scripts/prepare-external-bins.mjs --placeholder-only

      - name: Compile this shard's bench slice (no-run)
        working-directory: src-tauri
        shell: bash
        # Deterministic sharding: list every `[[bench]]` (minus the benches the
        # bench-slo job warm-runs, i.e. `$SLO_BENCHES`), sort for a stable
        # order, and keep
        # the names where `index % SHARD_TOTAL == SHARD_INDEX`. A bench newly
        # added to Cargo.toml automatically lands in some shard — no matrix edit
        # needed, so the #978 coverage guarantee can't silently regress.
        #
        # #3330: that guarantee used to be asserted by a comment only. The list
        # came from a text-shape heuristic — `grep -A1 '^\[\[bench\]\]'
        # Cargo.toml | sed -n 's/^name = "\(.*\)"/\1/p'` — which sees ONLY the
        # single line following the header, so a `[[bench]]` block whose first
        # key is `required-features` (or `harness`, or a comment) contributed
        # NOTHING and the bench vanished from every shard. Because the pipeline
        # runs inside a process substitution, `mapfile` never observes its exit
        # status, and the per-shard "no benches — nothing to do" early exit
        # below turned that into a green shard: a check that cannot fail. Now
        # the list is parsed STRUCTURALLY out of `cargo metadata` and
        # cross-checked against the number of `[[bench]]` blocks declared in
        # the manifest, so a dropped bench is a hard, loud failure.
        #
        # #3362: the EXCLUSION was the remaining hole. It was a hardcoded
        # `grep -vx interactive_slo` justified by "bench-slo warm-runs it",
        # with nothing checking that bench-slo still did. A rename or a drifted
        # bench-slo list dropped that bench from BOTH lanes and every shard
        # still exited 0, because from this step's point of view excluding it
        # is correct behaviour. The exclusion is now DERIVED from the
        # workflow-level `$SLO_BENCHES` that bench-slo runs, every excluded
        # name must be a real bench target, and the union of the two lanes is
        # asserted to equal the bench universe before anything is sharded.
        #
        # The slice compiles in a SINGLE `cargo bench --no-run --bench a
        # --bench b …` invocation. That is still ONE cohesive build: the cargo
        # #6313 libagaric_lib link race only bites SEPARATE per-bench cargo
        # invocations (see benches/AGENTS.md), so the prebuilt-binary approach
        # the smoke step relies on stays race-free.
        run: |
          set -euo pipefail
          # Structural bench list — cargo parses the manifest, we don't.
          mapfile -t declared_targets < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "agaric") | .targets[]
                     | select(.kind[] == "bench") | .name' \
            | sort)
          # Independent cross-check against the raw manifest. Deliberately
          # ONE-directional: every `[[bench]]` block must produce a target, so
          # FEWER targets than blocks means the extraction is broken and
          # benches are dropping out — hard fail. MORE targets than blocks is
          # benign (autobenches is on, so `benches/foo.rs` without a block is
          # auto-discovered and still lands in a shard) — note it, don't fail,
          # because a check that goes red when nothing is wrong gets ignored.
          declared_count="$(grep -c '^\[\[bench\]\]' Cargo.toml || true)"
          # The cross-check is only as live as this count. On a missing or
          # renamed manifest `grep -c` prints NOTHING, the `|| true` swallows
          # its exit status, and an empty string evaluates as 0 in arithmetic
          # context — so the `<` comparison below would silently pass no
          # matter how many benches went missing. Same class of bug as the
          # heuristic this step replaced, so assert the count is real first.
          if ! [[ "$declared_count" =~ ^[0-9]+$ ]] || (( declared_count == 0 )); then
            echo "::error::could not count [[bench]] blocks in src-tauri/Cargo.toml (got '$declared_count') — the manifest cross-check below would then silently pass regardless of how many benches dropped out of the shard union (#3330). Check that the manifest is still there and still declares its benches as \`[[bench]]\` blocks."
            exit 1
          fi
          if (( ${#declared_targets[@]} == 0 )); then
            echo "::error::bench discovery produced ZERO bench targets from cargo metadata — the shard union would cover nothing and every shard would report success (#3330). Check that the \`agaric\` package still exists and jq is available."
            exit 1
          fi
          if (( ${#declared_targets[@]} < declared_count )); then
            echo "::error::bench discovery found only ${#declared_targets[@]} bench target(s) but src-tauri/Cargo.toml declares $declared_count [[bench]] block(s): ${declared_targets[*]}. At least one declared bench is missing from the shard union, so it would never be compiled or smoke-run (#3330/#978)."
            exit 1
          fi
          if (( ${#declared_targets[@]} > declared_count )); then
            echo "::notice::${#declared_targets[@]} bench target(s) vs $declared_count [[bench]] block(s) — the extra one(s) are cargo-autodiscovered from src-tauri/benches/ and are sharded normally."
          fi
          # #3362 — the OTHER lane. `$SLO_BENCHES` is the workflow-level list
          # the bench-slo job warm-runs; this step excludes exactly that list
          # and nothing else. Every name in it must be a real bench target,
          # because a stale name here means bench-slo runs nothing for it while
          # this step still excludes it — the bench then runs in NEITHER lane.
          read -r -a slo_lane <<< "${SLO_BENCHES:-}"
          if (( ${#slo_lane[@]} == 0 )); then
            echo "::error::SLO_BENCHES is empty or unset — the shards would then smoke-run the SLO gate cold (its budgets need the warm bench-slo run) and the two lanes would have no agreed split at all (#3362)."
            exit 1
          fi
          for b in "${slo_lane[@]}"; do
            if ! printf '%s\n' "${declared_targets[@]}" | grep -qxF -- "$b"; then
              echo "::error::SLO_BENCHES names '$b', which is NOT a bench target in cargo metadata (universe: ${declared_targets[*]}). bench-slo would run nothing for it and this step excludes it, so it is in NEITHER lane and every shard would still exit 0 (#3362). If a bench was renamed, update SLO_BENCHES in this workflow's top-level env."
              exit 1
            fi
          done
          mapfile -t all < <(printf '%s\n' "${declared_targets[@]}" \
            | grep -vxF -f <(printf '%s\n' "${slo_lane[@]}") || true)
          if (( ${#all[@]} == 0 )); then
            echo "::error::no shardable benches after excluding the SLO_BENCHES lane (${slo_lane[*]}) — nothing would ever be compiled or smoke-run in ANY shard (#3330)."
            exit 1
          fi
          # The invariant #3362 is about, asserted rather than assumed: the two
          # lanes must PARTITION the bench universe — cover all of it (union)
          # and not overlap (disjoint). Both halves are needed, and each catches
          # an edit the other does not:
          #
          #   UNION      — any future edit that filters the list for a second
          #                reason (a skip list, a `required-features` bench)
          #                drops a bench out of BOTH lanes; caught here instead
          #                of going green.
          #   DISJOINT   — weakening or deleting the `grep -vxF` exclusion above
          #                puts the SLO bench back into the shards. The union
          #                check alone CANNOT see that (the union is still the
          #                whole universe), so it passed with every job green
          #                while `interactive_slo` got cold `--test`-smoke-run
          #                in a shard — exactly what the warm bench-slo lane
          #                exists to prevent, and enough to trip the bench's own
          #                inline latency-budget `panic!`s on a cold run.
          #                Added in review of #3362; the union check on its own
          #                left this mutation alive.
          lane_union="$(printf '%s\n' "${all[@]}" "${slo_lane[@]}" | sort -u)"
          universe="$(printf '%s\n' "${declared_targets[@]}" | sort -u)"
          if [ "$lane_union" != "$universe" ]; then
            echo "::error::bench lane union does not equal the bench universe (#3362). shards=[${all[*]}] bench-slo=[${slo_lane[*]}] universe=[${declared_targets[*]}]. Benches in neither lane are never compiled, never smoke-run and never timed, with every job still green."
            exit 1
          fi
          overlap="$(printf '%s\n' "${all[@]}" \
            | grep -xF -f <(printf '%s\n' "${slo_lane[@]}") || true)"
          if [ -n "$overlap" ]; then
            echo "::error::bench lane overlap (#3362): ${overlap//$'\n'/ } is in BOTH lanes. The shard exclusion must remove exactly \$SLO_BENCHES; a bench the warm bench-slo lane runs must not also be cold-smoke-run in a shard, where its latency budgets have no warm-up and can panic. shards=[${all[*]}] bench-slo=[${slo_lane[*]}]."
            exit 1
          fi
          echo "bench lanes partition ${#declared_targets[@]} target(s): ${#all[@]} sharded + ${#slo_lane[@]} warm-run — bench-slo: ${slo_lane[*]}"
          echo "bench universe (${#all[@]} shardable of $declared_count declared): ${all[*]}"
          mine=()
          for i in "${!all[@]}"; do
            if (( i % SHARD_TOTAL == SHARD_INDEX )); then mine+=("${all[i]}"); fi
          done
          if (( ${#mine[@]} == 0 )); then
            echo "shard $SHARD_INDEX/$SHARD_TOTAL has no benches — nothing to do"
            : > "$RUNNER_TEMP/shard-benches.txt"
            exit 0
          fi
          echo "shard $SHARD_INDEX/$SHARD_TOTAL benches: ${mine[*]}"
          # Persist the slice so the smoke step runs exactly what we compiled.
          printf '%s\n' "${mine[@]}" > "$RUNNER_TEMP/shard-benches.txt"
          args=(); for b in "${mine[@]}"; do args+=(--bench "$b"); done
          cargo bench --no-run "${args[@]}"

      - name: Smoke-run this shard's benches (--test) — #978 seed/fixture guard
        working-directory: src-tauri
        # WHAT THIS VALIDATES: that every bench's SEED/FIXTURE is still valid
        # against the live schema — NOT performance. Criterion's `--test` runs
        # each benchmark function exactly ONCE (a cold single shot, no timing
        # budget), so a bench whose hand-seeded raw-SQL fixture drifted from the
        # schema PANICS here and fails the shard. We run the PREBUILT binaries
        # from the `--no-run` build above (no per-bench recompile → race-free),
        # discovering them dynamically (no hardcoded hashes): each `[[bench]]`
        # becomes a `target/release/deps/<name>-<hash>` executable; we pick the
        # newest non-metadata file (`.d`/`.so`/`.dwp` filtered out).
        #
        # Concurrency 3 (`wait -n` gate) within the shard cuts wall-clock while
        # keeping peak memory sane on the 100K-seed benches. Each bench is
        # backgrounded with output BUFFERED to a per-bench `.log` and its verdict
        # to a per-bench `.status`; after the barrier we replay logs in order
        # (folding intact) and reduce. A MISSING `.status` (subshell killed
        # mid-run, e.g. OOM) is a FAILURE, never a silent pass.
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          newest_bench_bin() {
            local name="$1" newest="" f
            for f in "target/release/deps/${name}-"*; do
              [[ -f "$f" && -x "$f" ]] || continue
              case "$f" in *.d|*.so|*.dwp) continue ;; esac
              if [[ -z "$newest" || "$f" -nt "$newest" ]]; then
                newest="$f"
              fi
            done
            printf '%s' "$newest"
          }
          # The exact slice this shard compiled (written by the step above).
          # #3330: an ABSENT slice file means the compile step never reached
          # its `printf` — that is a broken step, not an empty shard, and must
          # not be swallowed by the empty-slice early exit below. The compile
          # step has already proven the GLOBAL bench list non-empty, so an
          # empty file here really does mean "this shard's modulo slice is
          # empty" and is a legitimate skip.
          if [ ! -f "$RUNNER_TEMP/shard-benches.txt" ]; then
            echo "::error::shard slice file $RUNNER_TEMP/shard-benches.txt is missing — the compile step did not run to completion; refusing to report this shard as smoked (#3330)."
            exit 1
          fi
          mapfile -t benches < "$RUNNER_TEMP/shard-benches.txt"
          if (( ${#benches[@]} == 0 )); then
            echo "no benches for this shard — skipping smoke"
            exit 0
          fi
          status_dir="$(mktemp -d)"
          smoke_one() {
            local name="$1" bin
            bin="$(newest_bench_bin "$name")"
            if [ -z "$bin" ]; then
              echo "::error::no prebuilt binary for bench '$name' (did --no-run compile it?)"
              echo fail > "$status_dir/$name.status"
              return
            fi
            echo "running: $bin --test"
            if "$bin" --test; then
              echo "smoke OK: $name"
              echo ok > "$status_dir/$name.status"
            else
              echo "::error::bench '$name' FAILED its --test smoke run (seed/fixture drift?)"
              echo fail > "$status_dir/$name.status"
            fi
          }
          jobs=$(( $(nproc) < 3 ? $(nproc) : 3 ))
          echo "smoke-running ${#benches[@]} benches at concurrency $jobs"
          running=0
          for name in "${benches[@]}"; do
            smoke_one "$name" > "$status_dir/$name.log" 2>&1 &
            running=$((running + 1))
            if (( running >= jobs )); then
              wait -n
              running=$((running - 1))
            fi
          done
          wait
          for name in "${benches[@]}"; do
            echo "::group::smoke $name"
            [ -f "$status_dir/$name.log" ] && cat "$status_dir/$name.log"
            echo "::endgroup::"
            if [ ! -f "$status_dir/$name.status" ]; then
              echo "::error::bench '$name' wrote no status — killed before completion (OOM?)"
              fail=1
            elif [ "$(cat "$status_dir/$name.status")" = fail ]; then
              fail=1
            fi
          done
          exit "$fail"

  # ---------------------------------------------------------------------------
  # bench-slo (#639) — the interactive_slo SLO gate + the `#[ignore]`d 20k-row
  # perf gates, split out of the smoke shards so a smoke timeout can never skip
  # them (the old single-job layout ran the SLO gate AFTER the whole smoke walk,
  # so the #2122 mid-smoke cancellation took the gate down with it). A
  # `workflow_dispatch` can also flip `slo_include_problem` to measure the
  # cache/counterfactual probes (#2508 / #2585).
  # ---------------------------------------------------------------------------
  bench-slo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config \
            mold

      - name: Enable mold linker (CI-only .cargo/config.toml)
        run: |
          mkdir -p .cargo
          cp .cargo/config.toml.example .cargo/config.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Own bench-profile cache (separate key from the smoke shards so this
          # job's single writer never races them). Caches the agaric lib + deps
          # + cargo registry + the interactive_slo bench + the nextest perf-gate
          # test binaries, so week-over-week this job restores warm.
          shared-key: rust-bench-slo
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare externalBin placeholder (FEAT-4f)
        # Tauri's build.rs validates externalBin paths on every cargo
        # invocation, including `cargo bench` / nextest below.
        run: node scripts/prepare-external-bins.mjs --placeholder-only

      - name: Run interactive_slo SLO gate (#639)
        working-directory: src-tauri
        # The bench self-`panic!`s if any command's accumulated mean latency
        # exceeds its inline budget, so a non-zero exit IS the gate.
        #
        # #3362: WHICH benches this lane runs is no longer a hardcoded name
        # here. It is the workflow-level `$SLO_BENCHES` — the same list
        # `bench-smoke` excludes from its shards — and every name in it is
        # verified against `cargo metadata` before we run it. A bench renamed
        # in Cargo.toml but not here used to be excluded from the shards AND
        # absent from this lane, i.e. never run, with both jobs green.
        #
        # By default the #2508 cache direct-query probes and #2585 MostLinked
        # cache/counterfactual probes stay gated OUT (SLO_INCLUDE_PROBLEM
        # unset), so the scheduled gate tracks only the default command set. A
        # `workflow_dispatch` with `slo_include_problem=true` exports
        # SLO_INCLUDE_PROBLEM=1 to MEASURE those probes @ 100K. We export it
        # ONLY when asked, because the bench treats ANY value (even an empty
        # string) as "on".
        #
        # #978: tee stdout so the SLO summary step can capture the per-command
        # observed-mean-vs-budget lines. `pipefail` preserves the bench's exit
        # code through the pipe so a budget breach still fails the run.
        shell: bash
        env:
          SLO_INCLUDE_PROBLEM_INPUT: ${{ github.event.inputs.slo_include_problem || 'false' }}
        run: |
          set -euo pipefail
          if [ "$SLO_INCLUDE_PROBLEM_INPUT" = "true" ]; then
            echo "SLO_INCLUDE_PROBLEM=1 — cache/counterfactual probes ENABLED via dispatch (#2508/#2585)"
            export SLO_INCLUDE_PROBLEM=1
          fi
          # Same structural bench list `bench-smoke` derives its exclusion from.
          mapfile -t declared_targets < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "agaric") | .targets[]
                     | select(.kind[] == "bench") | .name' \
            | sort)
          if (( ${#declared_targets[@]} == 0 )); then
            echo "::error::cargo metadata reported ZERO bench targets — this lane cannot verify it is running the benches bench-smoke excludes on its behalf (#3362)."
            exit 1
          fi
          read -r -a slo_lane <<< "${SLO_BENCHES:-}"
          if (( ${#slo_lane[@]} == 0 )); then
            echo "::error::SLO_BENCHES is empty or unset — this lane would run NOTHING while bench-smoke still excludes its list, so those benches would run in neither lane (#3362)."
            exit 1
          fi
          args=()
          for b in "${slo_lane[@]}"; do
            if ! printf '%s\n' "${declared_targets[@]}" | grep -qxF -- "$b"; then
              echo "::error::SLO_BENCHES names '$b', which is NOT a bench target in cargo metadata (universe: ${declared_targets[*]}). bench-smoke excludes it on this lane's behalf, so it is in NEITHER lane (#3362). If a bench was renamed, update SLO_BENCHES in this workflow's top-level env."
              exit 1
            fi
            args+=(--bench "$b")
          done
          echo "bench-slo lane runs: ${slo_lane[*]}"
          # Log name is historical (`interactive_slo.log`) and is what the
          # summary step below parses; it carries every bench in the lane.
          cargo bench "${args[@]}" 2>&1 | tee interactive_slo.log

      - name: SLO summary + threshold flagging (#978)
        if: always()
        working-directory: src-tauri
        # MEASURE-not-imagine: every number here is read back from the bench
        # itself — the observed mean and the budget both come from the
        # `interactive_slo:` lines the bench `println!`s (format defined in
        # benches/interactive_slo.rs::assert_under_budget). We invent no
        # thresholds; we surface the bench's own pass/fail per command and
        # flag any line the bench did not mark PASS. Robust to no data:
        # if the log is missing or matches nothing, we say so and exit 0.
        shell: bash
        run: |
          {
            echo "## interactive_slo (#978) — observed vs budget @ 100K"
            echo
            if [ ! -f interactive_slo.log ]; then
              echo "_No interactive_slo.log produced (bench step did not run) — see job log._"
              exit 0
            fi
            # Stable lines, e.g.:
            #   interactive_slo: get_block @ 100K = 0.42 ms <= budget 1 ms (PASS)
            #   interactive_slo: foo SKIPPED (set SLO_INCLUDE_PROBLEM=1 ...)
            if ! grep -q '^interactive_slo:' interactive_slo.log; then
              echo "_No \`interactive_slo:\` lines found in the bench output._"
              echo "_(The bench format may have changed — see benches/interactive_slo.rs.)_"
              exit 0
            fi
            echo "| command | observed | budget | status |"
            echo "|---------|---------:|-------:|:------:|"
            # PASS lines carry both numbers; emit them as a row. Any
            # interactive_slo: line that is neither PASS nor SKIPPED is a
            # FLAG (the bench would normally panic first, but if a future
            # tier reports without asserting we still surface it).
            grep '^interactive_slo:' interactive_slo.log | while IFS= read -r line; do
              body="${line#interactive_slo: }"
              if printf '%s' "$body" | grep -q '(PASS)$'; then
                cmd="${body%% = *}"
                rest="${body#* = }"
                obs="${rest%% <= budget *}"
                bud="${rest#* <= budget }"; bud="${bud% (PASS)}"
                echo "| \`$cmd\` | $obs | $bud | PASS |"
              elif printf '%s' "$body" | grep -q 'SKIPPED'; then
                cmd="${body%% SKIPPED*}"
                echo "| \`$cmd\` | — | — | SKIPPED |"
              else
                echo "| (raw) | | | FLAG |"
                echo "| \`$body\` | | | |"
              fi
            done
            echo
            echo "_Budgets are sourced from the bench's inline constants; a"
            echo "breach \`panic!\`s the gate above. Track these rows across"
            echo "weekly runs for drift._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SLO results (log + criterion estimates)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interactive-slo
          # The raw log (stable observed/budget lines) plus criterion's own
          # JSON estimates (medians/MAD per benchmark id) for finer-grained
          # over-time trend analysis beyond the mean-vs-budget gate.
          path: |
            src-tauri/interactive_slo.log
            src-tauri/target/criterion/**/estimates.json
            src-tauri/target/criterion/**/benchmark.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Install cargo-nextest via prebuilt binary
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest

      - name: Run the #[ignore]d perf gates (#639)
        working-directory: src-tauri
        # The 20k-row perf gates are `#[ignore]`d so the per-PR suite doesn't
        # pay for 20k-row seeding; they assert wall-clock budgets and fail on
        # regression. BUT `--run-ignored=only` runs EVERY `#[ignore]`d test, not
        # just the perf gates — so it also sweeps in intentionally-failing
        # documented oracles kept `#[ignore]`d AND failing on purpose as
        # greppable design-divergence markers (see `src/reverse/tests.rs`'s
        # `create_block_apply_then_reverse_round_trip_i_lifecycle_3`: reverse of
        # a create is a soft-delete, so a strict identity round-trip cannot hold
        # — a deliberate design choice, not a bug). Those must NOT red this gate,
        # so exclude them via `-E`. Add any future such failing oracle here too.
        # `--workspace` (#3212): bare form is package-scoped to `agaric` only. No
        # #[ignore]d test currently lives outside that package (verified via
        # `cargo nextest list --workspace`), so this is a no-op today, but it
        # keeps a future ignored perf gate added to agaric-engine/store/etc.
        # from being silently skipped by this sweep.
        run: >-
          cargo nextest run --workspace --run-ignored=only --no-fail-fast
          -E 'not test(create_block_apply_then_reverse_round_trip_i_lifecycle_3)'

  # ---------------------------------------------------------------------------
  # mutants (#649) — cargo-mutants scoped (via `.cargo/mutants.toml`'s
  # `examine_globs` — see that file's header: the path is load-bearing, #3386)
  # to the invariant core. Non-blocking: the deliverable is the survivor list
  # in the step summary + uploaded artifact, which a maintainer triages into
  # test gaps. `|| true` is intentional — a surviving mutant is signal, not a
  # CI failure (this lane is not a required check and is never gated).
  # ---------------------------------------------------------------------------
  mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Job-level so the run step and the guard step below quote the SAME
    # number: the guard names the budget in its partial-coverage notice, and
    # two copies of it would drift (#3386).
    env:
      MUTANTS_WALL_BUDGET: '5400'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config \
            mold

      - name: Enable mold linker (CI-only .cargo/config.toml)
        run: |
          mkdir -p .cargo
          cp .cargo/config.toml.example .cargo/config.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: rust-mutants
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare externalBin placeholder (FEAT-4f)
        run: node scripts/prepare-external-bins.mjs --placeholder-only

      - name: Install cargo-mutants + cargo-nextest via prebuilt binary
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-mutants,cargo-nextest

      - name: Mutation-scope guard (#3386) — config is readable and every glob is live
        # Runs BEFORE the expensive step, because every failure mode it checks
        # for produces a run that burns its full budget and yields nothing:
        #   * the config sitting anywhere but `src-tauri/.cargo/mutants.toml`
        #     (cargo-mutants then silently uses `Config::default()`),
        #   * an `examine_globs` entry that matches no file, or matches files
        #     in a package this lane does not examine (the #2621 arch-wave
        #     drift: op.rs / op_log / loro-engine moved to `agaric-store` and
        #     `agaric-engine`, which a bare `cargo mutants` never mutates),
        #   * the paths the steps below read drifting away from where
        #     cargo-mutants actually writes (`--output DIR` creates
        #     `DIR/mutants.out`, not `DIR`).
        # Same guard runs as a prek hook on every commit that touches the
        # config, this workflow, or the invariant-core sources.
        run: node scripts/check-mutants-scope.mjs

      - name: Run cargo-mutants (scoped to invariant core)
        working-directory: src-tauri
        # Scope, test-tool (nextest), and timeouts come from
        # `src-tauri/.cargo/mutants.toml`.
        # `--in-place` avoids the default copy-to-tmp (faster; the runner is
        # ephemeral). Never gate here: surviving mutants are triage signal
        # (the *zero-coverage guard* step below — deliberately OUTSIDE this
        # `|| true` — is what catches a false-green baseline timeout; see
        # its comment for the #3057 story).
        #
        # #3057: cargo-mutants docs (mutants.rs/timeouts.html) — the
        # automatic "5x baseline test time" timeout multiplier is DISABLED
        # whenever `--baseline=skip` OR `--in-place` is set; since this lane
        # already passes `--in-place`, `--timeout` is the ONLY timeout in
        # effect and applies to BOTH the baseline's test phase and every
        # mutant's. The observed failure was a ~322s baseline BUILD (no cap
        # — `--build-timeout` is off by default, so that phase always ran to
        # completion) followed by a baseline TEST phase that blew the old
        # 300s `--timeout`, aborting the whole run with `total_mutants: 0`
        # while `cargo mutants ... || true` still exited 0 (false-green).
        # Fix, in order of what we changed:
        #   1. `--timeout` (MUTANTS_TIMEOUT) 300 → 900: ~3x headroom over
        #      the observed baseline test-phase failure point. We did NOT
        #      also narrow `.cargo/mutants.toml`'s test scope — nextest is already
        #      the full, real test arbiter for the invariant core, and
        #      trimming it to "make the baseline faster" would weaken the
        #      very coverage signal mutation testing exists to measure.
        #      Raising the timeout is the honest fix; narrowing scope is not.
        #   2. New `--build-timeout` (MUTANTS_BUILD_TIMEOUT, 600s): the build
        #      itself was never the observed failure (it has no default cap
        #      at all), but a bad mutant CAN make rustc const-eval loop
        #      indefinitely with no cap to stop it — 600s gives ~1.9x
        #      headroom over the observed ~322s baseline build without
        #      letting one hung mutant silently eat the job's 120-minute
        #      budget.
        # The dispatch input rides via `env:` (not inline `${{ }}`) so it
        # can't expand into the shell as code (zizmor template-injection).
        #
        # #3386, three further corrections:
        #
        #   a. `--workspace`. The four `examine_globs` are the invariant core,
        #      but the #2621 arch waves moved three of them into the
        #      `agaric-store` / `agaric-engine` packages. cargo-mutants only
        #      generates mutants in the packages it examines, and this
        #      workspace's root manifest is itself the `agaric` package with
        #      no `default-members`, so a bare invocation examines ONLY
        #      `agaric` — 137 of the 607 mutants the config asks for, with the
        #      other three globs silently matching nothing. Measured with
        #      `cargo mutants --list` on 2026-07-31: 137 without
        #      `--workspace`, 607 with it.
        #
        #   b. No `--output`. `-o/--output DIR` means "create mutants.out
        #      WITHIN this directory" — so `--output mutants-out` wrote
        #      `src-tauri/mutants-out/mutants.out/`, while the guard, the
        #      summary and the `file-mutation-survivors` filer all read
        #      `mutants-out/…` directly. Every one of them was reading a path
        #      that never existed, which is why `--require-rust` in the filer
        #      (#3387) could never see a `missed.txt`. The default location,
        #      `src-tauri/mutants.out/`, is what the steps below read.
        #
        #   c. A wall-clock budget. 607 mutants do not fit in the job's 120
        #      minutes: measured locally (16 cores) a mutant costs ~26s in
        #      `agaric-store` and 13-35s+ in `agaric`, and a 4-vCPU runner is
        #      several times slower — cargo-mutants also runs mutants
        #      SEQUENTIALLY by default (`--jobs` defaults to 1). Without a
        #      budget the job would be CANCELLED at 120 minutes, the guard
        #      step below would never run, and the lane would be red for a
        #      brand-new reason. `timeout --signal=INT` instead makes
        #      cargo-mutants stop cleanly: it writes the partial
        #      `outcomes.json` / `missed.txt` for the mutants it did test, with
        #      the baseline still recorded as Success, so everything the steps
        #      below read is present and honest (measured on cargo-mutants
        #      27.1.0: a SIGINT'd run left `total_mutants: 5` against a
        #      20-mutant `mutants.json`). Tree restoration on SIGINT is
        #      usually but NOT reliably clean — 12 of 13 measured runs left
        #      `git status` clean, one left a mutant written into the source
        #      file. That is harmless on an ephemeral runner (the steps below
        #      read only `mutants.out/`, and the artifact is that directory),
        #      but if you reproduce this locally with `--in-place`, check
        #      `git status` afterwards: a stray mutant lands in a TRACKED file
        #      and .gitignore will not save you. The same applies, EVERY run,
        #      to proptest: a mutant caught by a proptest makes proptest write
        #      `<pkg>/proptest-regressions/<mod>.txt` recording a seed that
        #      only fails because a mutant was applied. cargo-mutants restores
        #      the source it mutated and knows nothing about those files, and
        #      they are deliberately not gitignored (the repo tracks six real
        #      ones). Delete them after a local run; never commit them.
        #      Mutant order is deterministic (`--no-shuffle` is the default),
        #      so a truncated run covers a STABLE prefix and the survivor
        #      filer's cross-run diff does not churn. That stability is also
        #      the catch: the prefix is ordered by package, so the cut is not
        #      a proportional sample and the LAST packages are never tested.
        #      Measured 2026-07-31: src/reverse occupies positions 1-137,
        #      agaric-engine/src/loro 138-509, agaric-store 510-607 — so
        #      op.rs / op_log, the hash-chain core this lane exists for, is
        #      reached only if the budget covers ~84% of the surface, which it
        #      does not. Right-sizing (a rotating `--shard`, `--jobs > 1`, or
        #      narrower globs) is tracked separately; until then the summary
        #      step prints the per-package split so the blind spot is named
        #      rather than merely disclosed as a ratio.
        #      90 min leaves ~25 min of the 120 for setup, install and upload
        #      (observed: ~2 min of setup before cargo-mutants starts).
        env:
          MUTANTS_TIMEOUT: ${{ github.event.inputs.mutants_timeout || '900' }}
          MUTANTS_BUILD_TIMEOUT: '600'
        run: |
          timeout --signal=INT --kill-after=120 "$MUTANTS_WALL_BUDGET" \
            cargo mutants --in-place --workspace \
              --timeout "$MUTANTS_TIMEOUT" \
              --build-timeout "$MUTANTS_BUILD_TIMEOUT" || true

      - name: Zero-coverage guard (#3057) — the load-bearing acceptance item
        # Deliberately OUTSIDE the `|| true` above: a baseline that times out
        # or fails aborts the run with `total_mutants: 0`, and the previous
        # step's `|| true` would otherwise let that read as a green job (the
        # exact false-green this issue is about). This step is the ONLY
        # place that fails the job — and it fails ONLY on zero coverage /
        # a non-Success baseline, never on surviving (missed) mutants, which
        # stay pure triage signal per the `mutants` lane's whole design.
        #
        # Schema (sourcefrog/cargo-mutants `src/outcome.rs` `LabOutcome` /
        # `ScenarioOutcome`): the top-level object carries an aggregate
        # `total_mutants` counter plus an `outcomes[]` array of per-scenario
        # entries; the baseline's entry has `scenario == "Baseline"` and a
        # `summary` that is one of `Success` / `Failure` / `Timeout` (the
        # baseline never produces `Unviable`/`CaughtMutant`/`MissedMutant` —
        # those are mutant-only outcomes). We gate on:
        #   (a) outcomes.json missing entirely (crashed before writing any
        #       output — strictly worse than zero coverage, same verdict),
        #   (b) total_mutants == 0 (the literal #3057 symptom), or
        #   (c) the Baseline scenario's own summary != Success (covers
        #       Timeout/Failure even in the — currently unreachable per the
        #       source — case where total_mutants ended up nonzero anyway).
        if: always()
        working-directory: src-tauri
        run: |
          set -uo pipefail
          outcomes=mutants.out/outcomes.json
          if [ ! -f "$outcomes" ]; then
            echo "::error::cargo-mutants wrote no $outcomes — the run crashed or aborted before producing any output; treating as zero mutation coverage (#3057)."
            exit 1
          fi
          if ! jq -e . "$outcomes" >/dev/null 2>&1; then
            echo "::error::$outcomes is not valid JSON — treating as zero mutation coverage (#3057)."
            exit 1
          fi
          total=$(jq -r '.total_mutants // 0' "$outcomes")
          baseline_summary=$(jq -r '([.outcomes[]? | select(.scenario == "Baseline") | .summary] | first) // "MISSING"' "$outcomes")
          fail=0
          if [ "$baseline_summary" != "Success" ]; then
            echo "::error::cargo-mutants baseline did not succeed (summary=$baseline_summary) — the unmutated build/test baseline failed or timed out, so any results are unreliable. Consider raising MUTANTS_TIMEOUT / MUTANTS_BUILD_TIMEOUT further, or fix the underlying baseline failure."
            fail=1
          fi
          if ! [ "$total" -gt 0 ] 2>/dev/null; then
            echo "::error::cargo-mutants tested ZERO mutants (total_mutants=$total) — this is the #3057 false-green: the previous step's \`|| true\` would otherwise let this report as job success with no mutation coverage at all."
            fail=1
          fi
          if [ "$fail" -eq 1 ]; then
            exit 1
          fi
          # #3386: the wall-clock budget can stop the run part-way through the
          # generated set. That is an acceptable, DELIBERATE truncation — but
          # it must never be silent, so state it. `mutants.json` is the full
          # generated set (written before testing begins); `total_mutants` is
          # what was actually tested.
          generated=$(jq -r 'length' mutants.out/mutants.json 2>/dev/null || echo 0)
          echo "zero-coverage guard OK: total_mutants=$total baseline=$baseline_summary (surviving/missed mutants, if any, are triage signal — see the summary step below — and never gate this job)"
          if [ "$generated" -gt 0 ] && [ "$total" -lt "$generated" ]; then
            echo "::notice::mutation coverage is PARTIAL: $total of $generated generated mutants were tested before the ${MUTANTS_WALL_BUDGET}s wall-clock budget stopped the run. Mutant order is deterministic, so the same prefix is covered each week; the untested tail carries no signal either way."
          fi

      - name: Mutants summary
        if: always()
        working-directory: src-tauri
        run: |
          {
            echo "## cargo-mutants (invariant core)"
            echo
            if [ -f mutants.out/outcomes.json ]; then
              echo '```'
              # tested-of-generated first (#3386): the wall-clock budget can
              # truncate the run, and a tally that omits the denominator reads
              # as full coverage of a small surface.
              echo "tested: $(jq -r '.total_mutants // 0' mutants.out/outcomes.json) of $(jq -r 'length' mutants.out/mutants.json 2>/dev/null || echo '?') generated"
              # …then the same split PER PACKAGE (#3386 review). The budget
              # stops the run at a deterministic prefix, and the mutant list is
              # ordered by package, so the cut is not a proportional sample: the
              # packages at the END of the order get ZERO mutants tested, the
              # same ones every week. `agaric-store` (op.rs / op_log — the
              # hash-chain core this lane exists for) is last in that order, so
              # a bare "tested: N of 607" can read as healthy sampling while the
              # highest-value surface is never mutated at all. Naming the
              # per-package split is what makes the truncation legible rather
              # than merely disclosed. Defensive throughout: this step must not
              # be able to fail (see the `Mutation summary` note on the
              # frontend lane).
              echo "per package (tested of generated):"
              jq -r '.[].package' mutants.out/mutants.json 2>/dev/null | sort | uniq -c |
                while read -r generated pkg; do
                  [ -n "$pkg" ] || continue
                  tested=$(jq -r --arg p "$pkg" '[.outcomes[]? | select((.scenario|type) == "object") | select(.scenario.Mutant.package == $p)] | length' mutants.out/outcomes.json 2>/dev/null || echo 0)
                  if [ "${tested:-0}" -eq 0 ]; then
                    echo "  $pkg: 0 of $generated  <-- NOT COVERED this run (budget stopped before this package)"
                  else
                    echo "  $pkg: $tested of $generated"
                  fi
                done || true
              # caught / missed / unviable / timeout tallies
              for f in caught missed unviable timeout; do
                if [ -f "mutants.out/$f.txt" ]; then
                  echo "$f: $(wc -l < "mutants.out/$f.txt")"
                fi
              done
              echo '```'
              echo
              if [ -s mutants.out/missed.txt ]; then
                echo "### Surviving (missed) mutants — triage into test gaps"
                echo '```'
                cat mutants.out/missed.txt
                echo '```'
              fi
            else
              echo "_No outcomes produced (build or config error) — see job log._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-out
          # Must be cargo-mutants' output directory ITSELF, not a parent:
          # `file-mutation-survivors` reads `mutants-artifact/missed.txt`
          # flat off the downloaded artifact root (#3386/#3387).
          path: src-tauri/mutants.out/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # mutants-frontend (#886) — StrykerJS scoped to a handful of pure,
  # deterministic frontend libs (search-query's pure modules, agenda-sort,
  # filters/model, date-utils, tree-utils — never components or Tauri IPC).
  # Mirrors the `mutants` (Rust) lane above: non-blocking, survivor list is
  # the deliverable to triage into tests. See `stryker.modules.mjs` /
  # `stryker.config.mjs` / `stryker.vitest.config.mjs` and
  # `docs/BUILD.md`'s "Mutation testing (nightly)" section for the recipe
  # (why each module runs in its own Stryker invocation, scoped to just its
  # own test file(s) — vitest's default "related" test-selection resolves
  # through barrel re-exports like `search-query/index.ts` and drags in
  # 271+ unrelated component tests otherwise).
  # ---------------------------------------------------------------------------
  mutants-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run Stryker mutation testing (scoped frontend libs)
        # Never gate: surviving mutants are triage signal, not a merge
        # blocker. `npm run mutation` loops `stryker run` once per module
        # (see `scripts/run-mutation.mjs`); a non-zero exit here means an
        # actual Stryker crash, not a low mutation score (no
        # `thresholds.break` is configured).
        run: npm run mutation || true

      - name: Lane-liveness guard (#3330) — the load-bearing acceptance item
        # Deliberately OUTSIDE the `|| true` above, and the exact frontend
        # analogue of the Rust lane's `Zero-coverage guard (#3057)` step.
        # Before this step existed, `mutants-frontend` was STRUCTURALLY
        # INCAPABLE of failing: `|| true` ate a total StrykerJS crash, the
        # `Mutation summary` step below `process.exit(0)`s on a missing
        # `reports/mutation` and renders `| <mod> | _no report_ | … |` for a
        # module that silently dropped out, and the artifact upload uses
        # `if-no-files-found: ignore`. Nothing read a mutant count, so a
        # crashed run and a perfect run were the same green tick — and the
        # downstream `file-mutation-survivors` job then read the empty
        # artifact as "zero survivors" on the (thereby false) premise that
        # lane failure is visible via this job's own status.
        #
        # This step fails ONLY on lane liveness — a missing reports root, a
        # module that produced no/invalid `mutation.json`, or a zero total
        # mutant count — never on mutation SCORE, which stays pure triage
        # signal per the lane's whole design. Its own fixture suite runs as
        # the `mutation-reports-guard-selftest` prek hook.
        if: always()
        run: node scripts/check-mutation-reports.mjs --reports-dir reports/mutation

      - name: Mutation summary
        # Presentational only — never fails, by design (same as the Rust
        # lane's `Mutants summary`). The liveness guard above is the single
        # place this job can go red; if it did, the `_no report_` rows below
        # are the diagnosis, not a silent pass.
        #
        # #3350: the renderer moved out of an inline heredoc into
        # `scripts/render-mutation-summary.mjs`, because the per-PR
        # diff-scoped lane (`mutation-pr.yml`) has to render the SAME shape
        # and a heredoc can be neither imported nor unit-tested. Its ordering
        # rules (worst module first, survivors grouped per module) and its
        # "cannot fail" property are pinned by that script's own fixture
        # suite, wired as the `mutation-summary-renderer-selftest` prek hook.
        if: always()
        run: node scripts/render-mutation-summary.mjs --reports-dir reports/mutation >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-frontend-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # file-mutation-survivors (#2947) — closes the pull-based triage gap: `mutants`
  # and `mutants-frontend` above only ever surface survivors in THIS run's step
  # summary, so nobody is notified unless someone remembers to open it. This
  # job downloads both lanes' survivor output (cargo-mutants' `missed.txt`,
  # StrykerJS's per-module `mutation.json`), diffs the combined set against
  # the SINGLE open tracking issue's last-known set (via
  # `scripts/file-mutation-survivors.mjs`), and files/updates that ONE issue
  # only when a genuinely NEW survivor appears — a no-op otherwise, so this
  # never spams a new issue weekly. State lives in the tracking issue's body
  # (a marked, machine-readable block), not a committed baseline file, so
  # this job needs `issues: write` only — never `contents: write`.
  #
  # `if: always()`: runs even if `mutants` / `mutants-frontend` failed outright
  # (both lanes are non-blocking and best-effort already) — a missing/absent
  # artifact just contributes zero survivors from that lane (see the script's
  # own doc comment). Scheduled-event-only per #2947: a `workflow_dispatch`
  # smoke run (e.g. testing a `mutants_timeout` tweak) must never file/update
  # the real tracking issue.
  # ---------------------------------------------------------------------------
  file-mutation-survivors:
    needs: [mutants, mutants-frontend]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download cargo-mutants survivor list
        # Best-effort: if the `mutants` job never uploaded (e.g. it errored
        # before the outcomes existed), this lane simply contributes zero
        # rust survivors below rather than failing the whole triage step.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutants-out
          path: mutants-artifact

      - name: Download StrykerJS survivor reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-frontend-report
          path: mutation-artifact

      - name: File or update the single mutation-survivor tracking issue
        # `--require-rust` / `--require-frontend` (#3364): a lane that produced
        # NO data must not be read as "that lane has no survivors". Without
        # them, a dead frontend lane contributes `[]`, and one new rust
        # survivor is enough to rewrite the issue body from the rust half
        # alone — DELETING every frontend survivor from the marker block,
        # which is this filer's only cross-run memory, and re-reporting them
        # as "new" the following week. #3330's liveness guard makes the LANE
        # red but does not stop this job, which runs under `if: always()`.
        #
        # This deliberately turns a dead lane into a RED filer job rather than
        # a skipped one (`needs.<lane>.result == 'success'` would skip it):
        # `report-scheduled-failures` below `needs:` this job, so the failure
        # is reported through the ordinary path instead of vanishing as a skip.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/file-mutation-survivors.mjs \
            --rust-missed mutants-artifact/missed.txt \
            --frontend-dir mutation-artifact \
            --require-rust \
            --require-frontend

  # ---------------------------------------------------------------------------
  # fuzz (#650/#2590) — short coverage-guided fuzz of the raw-input parsers. The
  # fuzz crate (src-tauri/fuzz) builds under stable for compile-checking but
  # `cargo fuzz run` needs nightly (libFuzzer instrumentation). Smoke-length
  # budget here; a longer campaign runs out-of-band. Non-blocking.
  # ---------------------------------------------------------------------------
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config \
            mold

      - name: Enable mold linker (CI-only .cargo/config.toml)
        run: |
          mkdir -p .cargo
          cp .cargo/config.toml.example .cargo/config.toml

      - name: Install nightly Rust toolchain
        # cargo-fuzz requires nightly for the libFuzzer sanitizer coverage
        # instrumentation (`-Z sanitizer`). The production toolchain stays
        # pinned at 1.95.0; only this lane uses nightly.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri/fuzz
          shared-key: rust-fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare externalBin placeholder (FEAT-4f)
        run: node scripts/prepare-external-bins.mjs --placeholder-only

      - name: Install cargo-fuzz via prebuilt binary
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-fuzz

      - name: Fuzz each parser target (smoke length)
        working-directory: src-tauri/fuzz
        # `-max_total_time` keeps each target to a smoke budget so the weekly
        # lane stays bounded; a crash exits non-zero and the artifact upload
        # below preserves the reproducer. Seeds come from the checked-in
        # corpora under fuzz/corpus/<target>/. The dispatch input rides via
        # `env:` (not inline `${{ }}`) per zizmor template-injection.
        env:
          FUZZ_SECONDS: ${{ github.event.inputs.fuzz_seconds || '120' }}
          # cargo-fuzz builds with `-Zsanitizer=address`, which rustc rejects
          # when libc is statically linked ("sanitizer is incompatible with
          # statically linked libc"). Disable crt-static for the fuzz build;
          # cargo-fuzz reads RUSTFLAGS and appends its own sanitizer flags, so
          # both survive. gnu defaults to dynamic libc, so the gnu target pinned
          # below is ASan-compatible.
          RUSTFLAGS: "-C target-feature=-crt-static"
        run: |
          # RUN-ALL-THEN-FAIL, not fail-fast (#3169). `set -e` stays on for the
          # script as a whole, but each target's `cargo fuzz run` is invoked in
          # a SUBSHELL whose non-zero exit is captured (`|| rc=$?`) instead of
          # propagating. Before this, the first failing target aborted the loop
          # outright: `snapshot_decode` failed to COMPILE and, being first,
          # silently cost `deeplink_parse` and `import_parse` their runs too —
          # three targets' worth of coverage lost to one error, with nothing in
          # the output saying so. Every target is now attempted independently;
          # the step still exits non-zero at the end if ANY target failed
          # (`overall`), so the lane stays red exactly as before.
          set -euo pipefail
          # Per-target machine-readable results for the `file-fuzz-findings`
          # triage job below (uploaded as the `fuzz-status` artifact). Statuses
          # are pre-seeded to `not_run`, which stays meaningful even now that
          # the loop runs to completion: a job cancelled or killed (job-level
          # timeout, runner death) mid-loop leaves the targets it never reached
          # marked `not_run` rather than absent — and an absent file would read
          # as "fine".
          RESULT_DIR="${GITHUB_WORKSPACE}/fuzz-status"
          mkdir -p "$RESULT_DIR"
          # Keep this list in sync with the `[[bin]]` targets in
          # src-tauri/fuzz/Cargo.toml — #2945 added `fts_strip`/`html_parse`
          # there but not here, so for three months they were built and never
          # fuzzed. All five are smoke-verified to build and run crash-free.
          targets=(snapshot_decode deeplink_parse import_parse fts_strip html_parse)
          printf '%s\n' "${targets[@]}" > "$RESULT_DIR/targets.txt"
          for target in "${targets[@]}"; do
            echo not_run > "$RESULT_DIR/$target.status"
          done
          overall=0
          for target in "${targets[@]}"; do
            echo "::group::fuzz $target"
            # Per-target log (stdout+stderr), never a shared blob — the triage
            # job attributes each error to the target that produced it.
            log="$RESULT_DIR/$target.full.log"
            rc=0
            # `--target x86_64-unknown-linux-gnu` pins the gnu HOST target.
            # Recent cargo-fuzz defaults `--target` to
            # x86_64-unknown-linux-musl (for a statically-linked fuzzer), but
            # the nightly toolchain installed here only ships the host (gnu)
            # std, so the musl default fails to build with
            # `error[E0463]: can't find crate for std` (#2123). Pinning the
            # host target builds against the installed std and keeps the
            # dynamic-libc that ASan requires.
            (
              cargo +nightly fuzz run "$target" \
                --target x86_64-unknown-linux-gnu -- \
                -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=4096
            ) > "$log" 2>&1 || rc=$?
            cat "$log"
            if [ "$rc" -eq 0 ]; then
              status=ok
            elif grep -q 'libFuzzer: timeout' "$log"; then
              status=timed_out
            elif grep -qE 'Test unit written to|deadly signal|AddressSanitizer|LeakSanitizer' "$log"; then
              status=crashed
            elif grep -qE '^error(\[E[0-9]+\])?:|could not compile|failed to build fuzz' "$log"; then
              status=build_failed
            else
              status=failed
            fi
            echo "$status" > "$RESULT_DIR/$target.status"
            # Bounded tail is what rides in the artifact: a libFuzzer log can be
            # thousands of lines. The full log stays on the runner only.
            tail -n 500 "$log" > "$RESULT_DIR/$target.log"
            rm -f "$log"
            ls -1 "artifacts/$target" > "$RESULT_DIR/$target.artifacts" 2>/dev/null || true
            echo "fuzz $target: $status (exit $rc)"
            [ "$status" = ok ] || overall=1
            echo "::endgroup::"
          done
          echo "--- fuzz lane summary ---"
          for target in "${targets[@]}"; do
            echo "  $target: $(cat "$RESULT_DIR/$target.status")"
          done
          # Aggregate: any non-ok target fails the job. Never silently green.
          exit "$overall"

      - name: Upload fuzz artifacts (crashes / corpus)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: |
            src-tauri/fuzz/artifacts/
            src-tauri/fuzz/corpus/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload per-target fuzz status (#3169)
        # Separate from `fuzz-artifacts` above on purpose: adding a workspace-
        # root path to that multi-path upload would move its least-common-
        # ancestor and reshuffle the existing artifact's layout.
        #
        # `if-no-files-found: ignore` stays (#3360): a lane that died before it
        # could write anything is already red, and turning that into a second
        # red upload step adds noise, not signal. The ambiguity it creates for
        # the CONSUMER — "no findings" vs "no data" — is closed on the consumer
        # side instead, by the `--require-results` /
        # `--require-targets-manifest` flags the `file-fuzz-findings` job passes.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-status
          path: fuzz-status/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # file-fuzz-findings (#3169) — the same push-based triage loop
  # `file-mutation-survivors` above runs for the mutants lanes, applied to
  # `fuzz`. The fuzz lane's only signal was a red job in a weekly workflow,
  # which is easy to miss: the #3163 compile break landed 2026-07-24 and
  # survived five days. This job downloads the lane's per-target status files,
  # turns them into findings (build failure with the compiler error, crash
  # reproducer with the target + input hash, per-input timeout, target that
  # never ran), diffs them against the SINGLE tracking issue's last-known set
  # (via `scripts/file-fuzz-findings.mjs`), and files/updates that ONE issue
  # only when a genuinely NEW finding appears — a no-op otherwise, so a
  # persistent failure never spams a weekly issue or comment. State lives in
  # the tracking issue's body (a marked, machine-readable block), not a
  # committed baseline file, so this job needs `issues: write` only — never
  # `contents: write`.
  #
  # `if: always()`: runs even when `fuzz` failed outright — which is the whole
  # point, since the real-world failure was a COMPILE error, not a crash
  # artifact. A missing artifact contributes zero per-target findings rather
  # than failing triage (`continue-on-error` download); `needs.fuzz.result` is
  # passed in so a lane that died before it could upload anything still gets
  # reported. Scheduled-event-only per #2947: a `workflow_dispatch` smoke run
  # (e.g. testing a `fuzz_seconds` tweak) must never file/update the real
  # tracking issue.
  # ---------------------------------------------------------------------------
  file-fuzz-findings:
    needs: [fuzz]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download per-target fuzz status
        # Best-effort: if the `fuzz` job never uploaded (e.g. it errored during
        # setup, before the fuzz step existed), this contributes zero per-target
        # findings below and the `--job-status` fallback reports the lane
        # failure instead of failing the triage step.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fuzz-status
          path: fuzz-status-artifact

      - name: File or update the single fuzz-findings tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Rides via `env:` (not inline `${{ }}`) per zizmor template-injection.
          FUZZ_JOB_RESULT: ${{ needs.fuzz.result }}
        # `--require-results` / `--require-targets-manifest` (#3360): the
        # `fuzz-status` upload is `if-no-files-found: ignore` and this job's
        # download is `continue-on-error`, so a lost or partial artifact used to
        # reach the filer as "zero findings" — a cheerful no-op indistinguishable
        # from a clean week. The flags only fire where the script's own `[lane]`
        # fallback does not (a lane that succeeded, or whose status is unknown,
        # and a partial artifact with no `targets.txt`), so a lane that died
        # outright still gets reported rather than erroring out first. The
        # resulting red filer job is itself reported by #3359's
        # `report-scheduled-failures`, which `needs:` this job.
        run: |
          node scripts/file-fuzz-findings.mjs \
            --result-dir fuzz-status-artifact \
            --job-status "$FUZZ_JOB_RESULT" \
            --require-results \
            --require-targets-manifest

  # ---------------------------------------------------------------------------
  # prek-all-files (#3058) — the whole-tree pre-commit-stage prek backstop.
  # Unlike every other lane in this workflow, this one GATES: these are the
  # same hooks that block a local push, so a scheduled whole-tree finding on
  # `main` is the strongest signal this workflow can produce.
  #
  # Scoped to the pre-commit stage (`prek run --all-files`, no
  # `--hook-stage`): the pre-push-staged hooks (`cargo-fmt-check`,
  # `cargo-clippy`, `cargo-test`, `knip`, `npm-audit`, `lychee`,
  # `verify-ci-equivalent`) are already covered, unskipped bar the four
  # exceptions it documents, by `full-suite` below — duplicating that here
  # would just re-run the same slow compile+clippy work twice. This lane's
  # own value-add on top of the literal pre-commit stage is the `sqlx
  # offline cache check` steps: the pre-push `verify-ci-equivalent` hook's
  # Phase E (`cargo sqlx prepare --check`, one lane per crate carrying a
  # committed `.sqlx/` cache) equivalent, invoked directly via the same
  # composite action `_validate.yml` uses per-PR — NOT via the
  # `verify-ci-equivalent` hook itself, which `full-suite` documents SKIPping
  # for the same reason we don't invoke it here either: it recurses into a
  # nested whole-tree Phase A prek run and fail-exits on the empty push
  # range a scheduled on-`main` run always has.
  # ---------------------------------------------------------------------------
  prek-all-files:
    runs-on: ubuntu-24.04
    # No cargo build/clippy/test/vitest/playwright/nextest here (unlike
    # `full-suite`) — just the pre-commit hook suite + 4
    # `cargo sqlx prepare --check` compile passes (which is why the Tauri
    # system deps + Rust toolchain below are still needed).
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks (a pre-commit-stage hook) inspects git history.
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare apt (free dpkg lock, bound downloads)
        uses: ./.github/actions/prepare-apt

      - name: Cache apt archives (Tauri system deps)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-tauri-${{ runner.os }}-v1

      - name: Install system dependencies
        # Needed for the `cargo sqlx prepare --check` compile passes below
        # (Tauri crates pull in the webkit/gtk stack) — the pre-commit prek
        # hooks themselves don't compile anything.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config \
            mold

      - name: Enable mold linker (CI-only .cargo/config.toml)
        run: |
          mkdir -p .cargo
          cp .cargo/config.toml.example .cargo/config.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0
          # rustfmt backs the `cargo-fmt` hook (pre-commit); clippy isn't
          # invoked by anything in this job (that hook is pre-push-staged,
          # see `full-suite`) but matches every other lane's toolchain step.
          components: clippy,rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Cache ~/.cargo/bin so sqlx-cli (installed below) persists.
          cache-bin: 'true'
          # Own per-job-class key (issue #813): this tree (cargo-fmt/
          # deny/machete + 4 sqlx-prepare compiles, no clippy/test) matches
          # none of the other lanes' caches.
          shared-key: rust-prek-all-files
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        # oxlint/oxfmt/tsc and most of the local JS/TS pre-commit hooks need
        # node_modules present.
        run: npm ci

      - name: Prepare externalBin placeholder (FEAT-4f)
        # Tauri's build.rs validates externalBin paths on every cargo
        # invocation, including the sqlx-prepare compile passes below.
        run: node scripts/prepare-external-bins.mjs --placeholder-only

      - name: Install prek + non-Rust lint tools via prebuilt binaries
        # Mirrors the lint job's ungated tool install: prek runs the whole
        # suite; zizmor/taplo/typos/sqruff are invoked by prek hooks.
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          # sqruff pinned to 0.38.x: >=0.39 needs rustc 1.96 while this repo
          # pins 1.95.0 — bump in lockstep with the lint job / `full-suite`.
          # zizmor pinned (#3476) to `ZIZMOR_PINNED_VERSION` in
          # scripts/zizmor-hook.sh; the wrapper fails the run on a mismatch.
          tool: prek,zizmor@1.28.0,taplo-cli,typos-cli,sqruff@0.38.0

      - name: Install cargo plugins via prebuilt binaries
        # Back the `cargo-deny` / `cargo-machete` pre-commit hooks.
        # cargo-nextest/cargo-audit are NOT needed: `cargo-test` and
        # `cargo audit` are pre-push-staged, not run by this job.
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-deny,cargo-machete

      - name: Install sqlx-cli (custom features, cargo fallback)
        # Same as the lint job: sqlx-cli's feature set isn't in taiki-e's
        # binary list, so compile from source (cached via rust-cache
        # cache-bin above). Backs the 4 sqlx offline-cache-check steps below
        # — none of which is itself a prek hook (see the job header).
        run: |
          if ! command -v cargo-sqlx >/dev/null; then cargo install --locked sqlx-cli --no-default-features --features rustls,sqlite; fi

      # sqlx offline cache checks (4 lanes) — mirror `_validate.yml`'s lint
      # job exactly, one per crate carrying a committed `.sqlx/` cache. This
      # is the `verify-ci-equivalent` pre-push hook's Phase E, run directly
      # via the same composite action instead of through that hook (see the
      # job header comment for why). `sqlite:dev.db` matches the local-dev
      # convention (`src-tauri/.env`); the other three crates use unique
      # per-crate throwaway DBs under `runner.temp` so their absolute paths
      # resolve outside the workspace root (a relative sqlite path resolves
      # against the workspace root, not the crate dir — see
      # `_validate.yml`'s agaric-store lane comment for the failure mode
      # that taught us this). The composite action itself creates + migrates
      # each DB before `cargo sqlx prepare --check`, so a missing/absent DB
      # file never false-fails this — it's created fresh every run.
      - name: sqlx offline cache check (root, dev.db)
        uses: ./.github/actions/sqlx-offline-check
        with:
          working-directory: src-tauri
          database-url: 'sqlite:dev.db'

      - name: sqlx offline cache check (agaric-store)
        uses: ./.github/actions/sqlx-offline-check
        with:
          working-directory: src-tauri/agaric-store
          database-url: 'sqlite:${{ runner.temp }}/agaric-store-sqlx-prepare.db'

      - name: sqlx offline cache check (agaric-engine)
        uses: ./.github/actions/sqlx-offline-check
        with:
          working-directory: src-tauri/agaric-engine
          database-url: 'sqlite:${{ runner.temp }}/agaric-engine-sqlx-prepare.db'

      - name: sqlx offline cache check (agaric-sync)
        uses: ./.github/actions/sqlx-offline-check
        with:
          working-directory: src-tauri/agaric-sync
          database-url: 'sqlite:${{ runner.temp }}/agaric-sync-sqlx-prepare.db'

      - name: Run prek — pre-commit stage, whole tree, HARD-FAIL (#3058)
        # No `|| true`, no SKIP: unlike every other lane in this workflow,
        # this one gates. These are the same hooks that block a local push
        # (`prek run --all-files` with no `--hook-stage` runs the
        # pre-commit-staged hooks), so a finding here means the whole tree —
        # not just this week's PR diffs — has drifted.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: prek run --all-files

  # ---------------------------------------------------------------------------
  # full-suite — the WHOLE-TREE BACKSTOP that makes per-PR category gating safe.
  #
  # ci/path-conditional-jobs: the per-PR `_validate.yml` lint job and the local
  # `scripts/verify-ci-equivalent.sh` Phase A now SKIP the prek hooks whose
  # category (frontend/backend/ci/docs) a given push did not touch — trading
  # whole-tree coverage of the ABSENT categories for a faster gate. This job is
  # the counterweight: on the weekly schedule (and on demand) it runs the FULL,
  # UNSKIPPED prek suite (both pre-commit and pre-push stages) plus the FULL
  # vitest / playwright / nextest / doc-test suites over the entire tree, so a
  # latent breach in an untouched, unchanged-category file is caught here even
  # when no PR re-linted it. Nothing is category-gated: every hook and every
  # test runs. Not a required check — a maintainer triages any failure.
  # ---------------------------------------------------------------------------
  full-suite:
    runs-on: ubuntu-24.04
    # The slow exhaustive lane: cold-ish compile + the full prek suite (both
    # stages) + full vitest + full playwright + full nextest + doc-tests.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks (run via prek) inspects git history; fetch the full graph.
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space on runner
        # The full test + coverage-free nextest tree plus the Playwright browser
        # download are heavy; drop the unused preinstalled toolchains first
        # (same rationale as the cargo-tests job in _validate.yml).
        run: |
          set -euo pipefail
          echo "Before:" && df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /usr/local/share/boost \
                      /usr/local/share/powershell \
                      /usr/share/swift \
                      "$AGENT_TOOLSDIRECTORY"
          echo "After:" && df -h /

      - name: Prepare apt (free dpkg lock, bound downloads)
        uses: ./.github/actions/prepare-apt

      - name: Cache apt archives (Tauri system deps)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-tauri-${{ runner.os }}-v1

      - name: Install system dependencies
        # Same Tauri stack as the lint / cargo-tests / mcp-tests jobs in
        # _validate.yml — webkit/gtk/ssl/rsvg/soup + mold for fast linking.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config \
            mold

      - name: Enable mold linker (CI-only .cargo/config.toml)
        run: |
          mkdir -p .cargo
          cp .cargo/config.toml.example .cargo/config.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          # #640: exact toolchain pin — keep in lockstep with
          # rust-toolchain.toml and src-tauri/Cargo.toml `rust-version`.
          toolchain: 1.95.0
          # The prek cargo hooks run `cargo clippy -- -D warnings` and
          # `cargo fmt --check`; dtolnay installs `--profile minimal`, which
          # ships neither component, so request them explicitly (mirrors lint).
          components: clippy,rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Cache ~/.cargo/bin so the cargo-installed plugins (sqlx-cli) persist.
          cache-bin: 'true'
          # Own per-job-class key (issue #813): the full unskipped prek + plain
          # nextest tree matches none of the lint/cov/mcp/bench trees.
          shared-key: rust-full-suite
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare externalBin placeholder (FEAT-4f)
        # Tauri's build.rs validates externalBin paths on every cargo
        # invocation (clippy hook, nextest, doc-tests).
        run: node scripts/prepare-external-bins.mjs --placeholder-only

      - name: Install prek + non-Rust lint tools via prebuilt binaries
        # Mirrors the lint job's first (ungated) tool install: prek runs the
        # whole suite; zizmor/taplo/typos/sqruff are invoked by prek hooks.
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          # sqruff pinned to 0.38.x: >=0.39 needs rustc 1.96 while this repo
          # pins 1.95.0 (see the lint job in _validate.yml). Bump in lockstep.
          # zizmor pinned (#3476) to `ZIZMOR_PINNED_VERSION` in
          # scripts/zizmor-hook.sh; the wrapper fails the run on a mismatch.
          tool: prek,zizmor@1.28.0,taplo-cli,typos-cli,sqruff@0.38.0

      - name: Install cargo plugins via prebuilt binaries
        # cargo-deny/cargo-machete are invoked by prek Rust hooks; cargo-nextest
        # backs both the cargo-test hook and the explicit nextest step below.
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-deny,cargo-machete,cargo-audit,cargo-nextest

      - name: Install sqlx-cli (custom features, cargo fallback)
        # Same as the lint job: sqlx-cli's feature set isn't in taiki-e's binary
        # list, so compile from source (cached via rust-cache cache-bin).
        run: |
          if ! command -v cargo-sqlx >/dev/null; then cargo install --locked sqlx-cli --no-default-features --features rustls,sqlite; fi

      - name: Install lychee (prebuilt binary)
        # The `lychee` prek hook is a `local` hook calling the system binary;
        # install it the same pinned+checksummed way the lint job does.
        run: |
          set -euo pipefail
          VERSION=lychee-v0.24.2
          DIR=lychee-x86_64-unknown-linux-gnu
          TARBALL="${DIR}.tar.gz"
          SHA256=1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
          curl -fsSL -o /tmp/lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/${VERSION}/${TARBALL}"
          echo "${SHA256}  /tmp/lychee.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/lychee.tar.gz -C /tmp "${DIR}/lychee"
          install -m 0755 "/tmp/${DIR}/lychee" "${HOME}/.local/bin/lychee"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/lychee" --version

      - name: Restore lychee link-check cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ hashFiles('**/*.md', '!node_modules/**') }}
          restore-keys: |
            lychee-${{ runner.os }}-

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      - name: Install Playwright browser binaries (on cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run the FULL prek suite — pre-commit stage (no SKIP, whole tree)
        # The whole-tree backstop for the per-PR category-gated Phase A: NO SKIP,
        # so every category's hooks run against every file.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: prek run --all-files

      - name: Run the FULL prek suite — pre-push stage (whole tree)
        # Pre-push-staged hooks (knip, npm-audit, lychee, cargo-clippy) do NOT
        # run in the pre-commit invocation above — run them whole-tree here so
        # the backstop covers them too.
        #
        # SKIP carries only the pre-push hooks that are meaningless / broken in
        # a whole-tree CI-on-main context, exactly like the `lint` job:
        #   * no-commit-to-branch — the `--branch=main` protected-branch guard
        #     is a LOCAL-dev push guard; this scheduled job runs ON main, so it
        #     would HARD-FAIL the whole step every run.
        #   * verify-ci-equivalent — the pre-push verifier itself; letting it
        #     run here re-invokes the entire Phase A prek suite + range tests
        #     NESTED inside this prek process (recursion / wasted wall-clock,
        #     and it fail-exits when the on-main push range is empty).
        #   * vitest / cargo-test — the range-scoped test hooks; the FULL
        #     vitest + nextest suites run as their own explicit steps below, so
        #     these would only re-read `--cached` (nothing staged) and add noise.
        # Every REAL category hook still runs unskipped — the backstop holds.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP: no-commit-to-branch,verify-ci-equivalent,vitest,cargo-test
        run: prek run --all-files --hook-stage pre-push

      - name: Vitest (full suite)
        run: npx vitest run

      - name: Playwright E2E tests (full suite)
        run: npx playwright test

      - name: Cargo nextest (full suite) + doc-tests
        working-directory: src-tauri
        # nextest does NOT run doc-tests (they compile as their own per-example
        # binaries), so run both to keep executable doc examples honest (#2555).
        #
        # `--workspace` (#3212): without it, both commands are package-scoped to
        # `agaric` only — this "full suite" step was silently skipping every
        # agaric-core/store/engine/sync/observability/diagnostics test (and their
        # doc-tests), the same class of gap #2817/#2951 already fixed for the
        # PR-gating `cargo-tests` job and the pre-push Phase D2 doc-test step.
        run: |
          cargo nextest run --workspace --profile ci
          cargo test --doc --workspace

  # ---------------------------------------------------------------------------
  # report-scheduled-failures (#3359) — the notification path for THIS
  # workflow. Every lane above is non-blocking triage signal, and #3365 spent
  # its whole diff making three of them capable of going red at all. But a
  # guard that goes red into the void is barely better than the swallowed
  # `|| true` it replaced: until this job existed, a failed weekly lane was
  # visible only to whoever happened to open the Actions tab. The #3163 fuzz
  # compile break survived five days that way.
  #
  # This is the same push-based triage loop as `file-mutation-survivors` and
  # `file-fuzz-findings`, one level up: those two triage a lane's CONTENT,
  # this one triages lane HEALTH. It keeps ONE rolling tracking issue that
  # reopens on a newly-failing lane and closes itself once every lane is green
  # (rationale for rolling-vs-per-lane is in the script's header). State lives
  # in that issue's body, so this job needs `issues: write` only.
  #
  # The failure path must not depend on the thing that broke, so:
  #   * it reads ONLY the `needs` context — GitHub's own job results — never a
  #     lane's artifacts. A lane that dies during `apt-get`, before it could
  #     upload anything, still reports `result: failure`.
  #   * `needs:` lists EVERY other job in this workflow, including the two
  #     content filers, so a filer that throws (which #3364/#3365 make
  #     possible on purpose) is itself reported here. The
  #     `scheduled-failure-reporter-selftest` prek hook fails if a job in this
  #     file is missing from the list below.
  #   * `if: always()` so a failed/cancelled/skipped upstream lane cannot skip
  #     the reporter — which is the entire point.
  #   * the last step is a deliberately minimal bash fallback that fires when
  #     the Node reporter ITSELF failed, using nothing but `gh`.
  # Irreducible remainder: if this job never starts at all (invalid workflow,
  # runner-pool outage, whole-run cancellation) nothing reports. That needs an
  # out-of-band watchdog; `actionlint` in prek covers the invalid-workflow half.
  #
  # Unlike the two content filers this job is NOT scheduled-event-only: on
  # `workflow_dispatch` it runs in `--dry-run` (writes nothing, prints the
  # issue body it would have written) so a manual dispatch smoke-tests the
  # whole reporting path instead of leaving it exercised only by a real
  # weekly failure. `--skipped-ok` rides along on that path because the two
  # scheduled-only filers legitimately report `skipped` off the schedule.
  # ---------------------------------------------------------------------------
  report-scheduled-failures:
    needs:
      - clippy-clean
      - bench-smoke
      - bench-slo
      - mutants
      - mutants-frontend
      - file-mutation-survivors
      - fuzz
      - file-fuzz-findings
      - prek-all-files
      - full-suite
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: File, update or close the single scheduled-failure tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Rides via `env:` (not inline `${{ }}`) per zizmor template-injection.
          # `toJSON(needs)` carries every needed job's `result`; written to a
          # file rather than passed as an argv string so a payload containing
          # quotes can never be re-parsed by the shell.
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS_JSON" > needs.json
          extra=()
          if [ "$EVENT_NAME" != "schedule" ]; then
            # Dispatch/manual run: exercise the whole path, write nothing.
            extra=(--dry-run --skipped-ok)
          fi
          node scripts/file-scheduled-failures.mjs \
            --needs-json-file needs.json \
            "${extra[@]}"

      - name: Last-resort notice (the reporter itself broke)
        # Fires only when a step ABOVE in this job failed — i.e. the Node
        # reporter is the thing that broke, so the normal tracking issue was
        # NOT updated and the week's lane failures went unreported.
        #
        # Deliberately minimal and Node-free: three `gh` calls, no parsing, no
        # marker block, and a SEPARATE tracking issue so it cannot corrupt the
        # primary issue's machine-readable state. This is the step that makes
        # the failure path independent of the reporter it reports on; keep it
        # boring. `|| true` on `issue reopen` because reopening an
        # already-open issue exits non-zero.
        #
        # Scheduled-event-only: a dispatch run is being watched by the human
        # who triggered it, and its `--dry-run` failure must not file an issue.
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          title='Scheduled deep checks: the failure reporter is broken (auto-filed, do not rename)'
          body="$(printf '%s\n' \
            "The \`report-scheduled-failures\` job's own reporting step failed, so the rolling \"failing lanes\" tracking issue was **not** updated for this run — this week's lane results are unreported." \
            "" \
            "This notice is written by a deliberately minimal bash fallback (no Node, no parsing, no shared code with the reporter) so that a break in \`scripts/file-scheduled-failures.mjs\` cannot also swallow the report of itself (#3359)." \
            "" \
            "Run: $RUN_URL" \
            "" \
            "Open that run and read the lane results directly, then fix the reporter.")"
          number="$(gh issue list --repo "$TARGET_REPO" \
            --search "in:title \"$title\"" --state all \
            --json number,title,state --limit 20 \
            --jq "[.[] | select(.title == \"$title\")] | sort_by(.state != \"OPEN\") | .[0].number // empty")"
          # Every `gh` WRITE below is checked explicitly. `set -e` is
          # deliberately NOT used — a failing `gh issue list` must still fall
          # through to `gh issue create` rather than abort — but that also
          # means a bare `gh ...` followed by `echo` would leave the step's
          # exit status at the `echo`'s 0, i.e. this last-resort notice would
          # report "filed" while having written NOTHING. That is the exact
          # class of vacuous check (#3359) this job exists to eliminate, in
          # the one layer that has no layer beneath it.
          if [ -n "$number" ]; then
            gh issue reopen "$number" --repo "$TARGET_REPO" || true
            if gh issue comment "$number" --repo "$TARGET_REPO" --body "$body"; then
              echo "commented on existing reporter-broken issue #$number"
            else
              echo "::error::could not comment on reporter-broken issue #$number — this run's lane results are UNREPORTED"
              exit 1
            fi
          else
            if gh issue create --repo "$TARGET_REPO" --title "$title" --body "$body" \
              --label github-actions --label testing; then
              echo "filed a new reporter-broken issue"
            else
              echo "::error::could not file the reporter-broken issue — this run's lane results are UNREPORTED"
              exit 1
            fi
          fi
