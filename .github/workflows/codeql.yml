name: CodeQL

# Why this workflow exists:
#   * Closes Scorecard "SAST" check (alert #33, score 0/10 → 10/10): Scorecard
#     detects SAST by looking for `github/codeql-action` in a workflow. Since
#     this repo merges no PRs (solo, direct push to main), the PR-history
#     detection path can never fire — a workflow is the only signal.
#   * Adds a second independent static-analysis tool alongside zizmor / clippy
#     / oxlint. CodeQL ships GitHub's curated queries (CWE coverage,
#     supply-chain, taint analysis) that the others don't replicate.
#
# Why these triggers:
#   * push to main: re-scan immediately when shipping (matches scorecard.yml).
#   * pull_request to main: catch regressions before merge (future external
#     contributors).
#   * schedule (weekly): rescan against updated CodeQL query packs even when
#     code is idle. Tuesday 06:00 UTC — staggered from scorecard.yml's Monday.
#   * workflow_dispatch: manual re-run for debugging.
#
# Which languages: a PR analyzes only the languages its diff touches
#   (`scripts/classify-changes.sh`'s `codeql_languages`; an unrecognized path
#   selects all three); push to main, schedule and dispatch analyze all three.
#   The reason is PR runner time (`Analyze rust` is the longest job a docs or
#   frontend PR would otherwise pay for), and push to main still analyzes
#   every language after the merge. A PR that skips a
#   language shows a neutral "configurations present on main were not found"
#   note on its code-scanning check, which is not a required context.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# One in-flight run per PR (issue #814): every push to an open PR otherwise
# stacks the 3-job language matrix in parallel with the stale run. For push
# to main the group is keyed by ref (stable per-branch) rather than run_id,
# so a rapid merge stack collapses to a single scan of the latest main HEAD
# instead of N parallel 3-job matrices — the Security tab only ever reflects
# the tip of main anyway. schedule/dispatch runs share the ref group too.
# Only PR runs cancel: on main a newer run waits and replaces the one pending
# run, so a running analysis finishes instead of being thrown away (#5853).
concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      languages: ${{ steps.classify.outputs.codeql_languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the three-dot diff can resolve the merge-base.
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        shell: bash
        # No PUSH_BEFORE: every non-PR event classifies as the full set.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/classify-changes.sh >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze ${{ matrix.language }}
    needs: detect
    # Skipped only on a diff that touches no language (docs). A failed
    # `detect` leaves `languages` empty, which runs all three.
    if: ${{ !cancelled() && needs.detect.outputs.languages != '[]' }}
    runs-on: ubuntu-24.04
    # JS/TS and Actions run in 1–4 min; Rust (build-mode: none) measured
    # 19.7 min on 2026-09-02 (run 33637027967), so its cap is 45 (+50%
    # headroom, rounded up) and the others keep 15.
    timeout-minutes: ${{ matrix.language == 'rust' && 45 || 15 }}
    permissions:
      # Required: upload SARIF results to GitHub Code Scanning (Security tab).
      security-events: write
      # Required by codeql-action when analyzing the `actions` language so it
      # can resolve action references against their source repos.
      packages: read
      # Default: read the repo contents to analyze them.
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # The languages `detect` picked; see the header comment.
        language: ${{ fromJSON(needs.detect.outputs.languages || '["actions","javascript-typescript","rust"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          # Analyze without invoking a build, so no Tauri system deps
          # (libwebkit2gtk-4.1-dev, etc.) just to satisfy the extractor. Rust
          # GA'd build-mode:none in 2025.
          build-mode: none
          # Query suite AND per-query filters live in the config file. Do not
          # re-add a `queries:` input here: a bare value REPLACES the config
          # file's selection (only a `+` prefix merges), which would silently
          # strip the filters that file exists to apply.
          config-file: ./.github/codeql/codeql-config.yml
          # A TRAP-cache hit made no measurable difference to analysis time,
          # and each main commit saved a new entry into the shared cache
          # quota (#5853).
          trap-caching: false

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: '/language:${{ matrix.language }}'
