name: CodeQL

# Why this workflow exists:
#   * Closes Scorecard "SAST" check: Scorecard detects SAST by looking for
#     `github/codeql-action` in a workflow definition, which this file stays.
#   * Adds a second independent static-analysis tool alongside zizmor / clippy
#     / oxlint. CodeQL ships GitHub's curated queries (CWE coverage,
#     supply-chain, taint analysis) that the others don't replicate.
#
# Why these triggers: weekly only, never per push or PR. Slots are the scarce
# resource (`.github/AGENTS.md` § Runner slots), and a per-PR scan took a
# matrix of jobs (`Analyze rust` the longest) on every push. A finding lands in
# the Security tab up to a week after the code merged, which is the accepted
# trade; this is not a required context.
#   * schedule (weekly): Tuesday 06:00 UTC, staggered from scorecard.yml's
#     Monday and clear of `e2e-tauri-weekly.yml` (Mon 02:43) and
#     `scheduled-deep-checks.yml` (daily 04:17). Also rescans against updated
#     CodeQL query packs when the code is idle.
#   * workflow_dispatch: manual re-run for debugging.
on:
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# Scheduled and dispatched runs share one group, and a newer one waits for the
# running scan instead of cancelling it (#5853).
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    # JS/TS and Actions run in 1–4 min; Rust (build-mode: none) measured
    # 19.7 min on 2026-09-02 (run 33637027967), so its cap is 45 (+50%
    # headroom, rounded up) and the others keep 15.
    timeout-minutes: ${{ matrix.language == 'rust' && 45 || 15 }}
    permissions:
      # Required: upload SARIF results to GitHub Code Scanning (Security tab).
      security-events: write
      # Required by codeql-action when analyzing the `actions` language so it
      # can resolve action references against their source repos.
      packages: read
      # Default: read the repo contents to analyze them.
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # Analyze without invoking a build, so no Tauri system deps
          # (libwebkit2gtk-4.1-dev, etc.) just to satisfy the extractor. Rust
          # GA'd build-mode:none in 2025.
          build-mode: none
          # Query suite AND per-query filters live in the config file. Do not
          # re-add a `queries:` input here: a bare value REPLACES the config
          # file's selection (only a `+` prefix merges), which would silently
          # strip the filters that file exists to apply.
          config-file: ./.github/codeql/codeql-config.yml
          # A TRAP-cache hit made no measurable difference to analysis time,
          # and each main commit saved a new entry into the shared cache
          # quota (#5853).
          trap-caching: false

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:${{ matrix.language }}'
