name: Validate (prek-equivalent)

# Reusable workflow that runs the same checks as `prek run --all-files`
# locally, plus the full vitest + cargo nextest + Playwright suites and the
# externalBin / sqlx-offline-cache smoke checks.
#
# Invoked by ci.yml (every push/PR) and release.yml (every tag).
#
# PEND-39 C3 + C5 + C8 split the historical monolithic `validate` job into
# parallel workers; later passes (PEND-86, #833) grew that into the set
# enumerated below,
# fanned out from a `detect-changes` per-category classifier that is
# fail-closed (an unrecognized or undiffable path runs everything):
#   - detect-changes — classifies the diff into docs_only/frontend/backend/ci.
#   - verify-version-agreement — always-on mutual-agreement check across
#                        every file scripts/bump-version.sh bumps, the fuzz
#                        crate's own lock included (#2975); no path gating,
#                        no docs-only skip.
#   - verify-lockfiles — asserts BOTH Cargo.lock files (src-tauri/ and
#                        src-tauri/fuzz/) are a faithful resolution of their
#                        manifests (#4142); no build. Gated on backend
#                        changes.
#   - lint            — the full prek hook suite (clippy, cargo-deny,
#                        cargo-audit, zizmor, sqlx-prepare, …); skipped on a
#                        provably docs-only diff.
#   - docs-lint       — a cheap doc-only hook subset (markdownlint, the
#                        markdown link/citation checks, typos, lychee); runs
#                        ONLY on a docs-only diff (exactly one of
#                        lint/docs-lint runs per push/PR).
#   - vitest          — the full frontend suite as a single job (coverage,
#                        production build, bundle-size gate); gated on
#                        frontend changes. Node 24 (primary).
#   - playwright      — the e2e suite, sharded 3 ways; gated on frontend
#                        changes.
#   - cargo-tests     — backend `cargo nextest` + llvm-cov instrumentation,
#                        sharded 2 ways; gated on backend changes.
#   - cargo-coverage  — merges the cargo-tests shard coverage into one
#                        report; gated on backend changes like cargo-tests
#                        (`validate-all` requires success/allowed-skip). Its
#                        merge/upload steps can fail on a genuine
#                        merge/upload breakage, and (since #648 wired
#                        `--gate` into the rust ratchet call below) on a real
#                        coverage drop beyond tolerance — this job gates the
#                        merge like its siblings.
#   - mcp-tests       — `agaric-mcp` sidecar release build + UDS smoke +
#                        externalBin verify; gated on backend changes.
#   - validate-all    — a trivial aggregate so branch-protection rules have
#                        one stable check name to depend on; fail-closed
#                        per category (a skipped sibling job is accepted
#                        only when its category was genuinely absent from
#                        the diff).
# Per-job timeout ceilings run 3-35 min, sized for slow-mirror apt/runner
# variance rather than typical run time — `cargo-tests` and `playwright`
# are usually the long poles (see each job's own comments for observed
# wall-clock notes). Callers that `needs: validate` on the workflow-call as
# a whole continue to work — GitHub propagates per-job failures up to the
# caller.

# NO `schedule:` HERE — ON PURPOSE. A weekly whole-tree re-validation of `main`
# is genuinely wanted, but this is not the workflow that should carry it:
#   * `scheduled-deep-checks.yml` already runs it weekly, and runs MORE. Its
#     `full-suite` job is a strict superset of a scheduled run of this file —
#     the FULL prek suite in BOTH stages with NO category SKIPs, plus full
#     vitest + full (unsharded) playwright + full nextest + doc-tests, and it
#     hard-fails on whole-tree pre-commit-stage drift. It exists precisely as
#     the counterweight to the per-PR category gating `detect-changes` below
#     performs. A weekly copy of THIS workflow would re-run the same work,
#     more weakly.
#   * `detect-changes` has no diff to classify on a `schedule` event
#     (`github.event.before` is empty), so it would take the fail-closed
#     `full_suite` branch every week — i.e. degrade to exactly what
#     `full-suite` already does, minus the unskipped pre-push stage.
#   * `validate-all` is a REQUIRED status-check context (asserted by
#     `branch-protection-assert.yml`). Emitting that context from a scheduled,
#     non-PR event puts weekly pass/fail runs of a required check name onto
#     `main`'s commits, where a red weekly canary is indistinguishable at a
#     glance from a red merge gate.
# If the weekly backstop ever needs to grow, grow `scheduled-deep-checks.yml`.
on:
  workflow_call:
    # `ci.yml`'s bundle jobs gate on these two, so the classifier below is the
    # only one in the repo (#833 extended).
    outputs:
      desktop:
        description: A Linux-bundle-relevant path changed.
        value: ${{ jobs.detect-changes.outputs.desktop }}
      android:
        description: An Android-package-relevant path changed.
        value: ${{ jobs.detect-changes.outputs.android }}
  # Manual runs from the Actions tab (e.g. re-validating main after an
  # ecosystem change without pushing a commit). Reusable-only workflows
  # get no "Run workflow" button — workflow_dispatch adds it.
  workflow_dispatch:

# Read-only by default. The workers only check out the code, run prek + the
# full test suites, and upload the playwright report on failure (which uses
# its own scoped token via actions/upload-artifact).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # detect-changes (#833, extended) — per-category change classifier.
  # Emits four OR-semantics booleans from a fail-closed three-dot diff:
  #   docs_only : every path matches the docs allowlist (drives lint/docs-lint).
  #   frontend  : any src/, e2e/, *.ts/tsx/js/jsx/css, package*.json, vite/
  #               vitest/tailwind/postcss/tsconfig config, index.html.
  #   backend   : any src-tauri/, *.rs, Cargo.*, migrations, .sqlx/.
  #   ci        : any .github/, prek.toml, .taplo.toml, lychee.toml, .gitleaks.toml.
  #   desktop   : a Linux-bundle-relevant path — `ci.yml`'s `build` gates on it.
  #   android   : an Android-package-relevant path — `ci.yml`'s `android-build`
  #               gates on it. Both ride out as `workflow_call` outputs.
  # A path may match several; a backend change that regenerates src/lib/bindings.ts
  # also flips frontend (bindings-drift / mock-parity tests run) — keep that.
  # SECURITY (read with validate-all): this classifier is the ONLY thing that lets
  # a skipped sibling pass the gate, so it is allowlist-based and FAIL-CLOSED — any
  # diff-compute error makes full_suite emit docs_only=false + frontend/backend/
  # ci=true (run everything), and validate-all also fails closed if this job is not
  # success. A classifier error only ever costs CI minutes, never weakens the gate.
  # ---------------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docs: ${{ steps.classify.outputs.docs }}
      frontend: ${{ steps.classify.outputs.frontend }}
      backend: ${{ steps.classify.outputs.backend }}
      ci: ${{ steps.classify.outputs.ci }}
      desktop: ${{ steps.classify.outputs.desktop }}
      android: ${{ steps.classify.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the three-dot `base...head` diff can resolve the
          # merge-base for PRs whose head sits behind `main` (same rationale
          # as ci.yml's detect-changes).
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Helper: emit the "run everything" classification and exit 0. Used
          # for every fail-closed branch so the full suite runs whenever we are
          # not 100% certain what the diff touches. docs_only=false keeps the
          # heavy `lint` job on; frontend/backend/ci=true force every
          # category's heavy jobs to run. A classifier error costs CI minutes,
          # never a weakened gate.
          full_suite() {
            echo "$1"
            {
              echo "docs_only=false"
              echo "docs=true"
              echo "frontend=true"
              echo "backend=true"
              echo "ci=true"
              echo "desktop=true"
              echo "android=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            # push (feature branch / main) or tag (release.yml). The
            # release tag path almost never resolves a meaningful `before`
            # and is never docs-only anyway — fail-closed handles it.
            base="$PUSH_BEFORE"
            head="$PUSH_AFTER"
          fi

          # New-branch / orphan-push: github.event.before is all-zeros and
          # there is nothing to diff against → fail closed (full suite).
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            full_suite "Base sha unresolved — running full validate suite (fail-closed)."
          fi

          # Force-push rewrote the old tip out of the runner clone, or a tag
          # push has no reachable predecessor → fail closed (full suite).
          if ! git cat-file -e "$base" 2>/dev/null; then
            full_suite "Base sha $base unreachable — running full validate suite (fail-closed)."
          fi

          # Three-dot (symmetric-difference) diff: ONLY the files this branch
          # changed relative to the merge-base, never files where `main`
          # moved ahead while the branch sat behind. A two-dot diff would
          # report those base-side changes too and could mislabel a real
          # code PR as docs-only when main had unrelated doc churn — exactly
          # the bypass we must avoid. Capture into a variable and check the
          # exit code explicitly: a failed diff MUST fail closed, not be
          # swallowed by a process substitution under `set -euo pipefail`.
          if ! diff_out=$(git diff --name-only "$base"..."$head"); then
            full_suite "::warning::git diff $base...$head failed — running full validate suite (fail-closed)."
          fi

          changed=()
          if [ -n "$diff_out" ]; then
            mapfile -t changed <<< "$diff_out"
          fi

          # An empty diff is NOT treated as docs-only. There is nothing to
          # fast-path (no docs changed either) and a zero-file diff is more
          # likely a base/head confusion than an intentional no-op PR, so we
          # fail closed and run the full suite.
          if [ "${#changed[@]}" -eq 0 ]; then
            full_suite "Empty diff — running full validate suite (fail-closed)."
          fi

          echo "Changed files:"
          printf '  %s\n' "${changed[@]}"

          # Conservative docs allowlist, anchored at repo root. A path is
          # "docs" iff it matches one of these. Deliberately narrow — when in
          # doubt, a path is NOT docs and the full suite runs.
          #   - any Markdown file anywhere (READMEs, session logs, **/*.md)
          #   - anything under docs/
          #   - the LICENSE / NOTICE / AUTHORS / CHANGELOG text files
          # NOT included (intentionally): lockfiles, .toml/.yml/.yaml config,
          # source under src/ or src-tauri/, workflow YAML, prek.toml, AGENTS.md
          # changes that also touch code, etc. ANY of those ⇒ docs_only=false.
          docs_re='^(docs/|.*\.md$|LICENSE([.-].*)?$|NOTICE$|AUTHORS$|CHANGELOG$)'

          # Per-category regexes (OR semantics: a file may match several; each
          # category flips true if ANY changed file matches). Anchored where a
          # root anchor is meaningful. Note `^src-tauri/` already subsumes the
          # Cargo/migrations alternatives, but they are listed explicitly so
          # the intent is legible and robust to future anchor tweaks.
          backend_re='(^src-tauri/|\.rs$|^src-tauri/Cargo\.(toml|lock)$|src-tauri/migrations/|\.sqlx/|^scripts/(setup-dev-db|check-sqlx-cache-drift|test-related-rust|check-unsafe-allowlist)\.sh$)'
          frontend_re='(^src/|^e2e/|\.(ts|tsx|js|jsx|css)$|^package(-lock)?\.json$|^(vite|vitest|tailwind|postcss)\.config\.|^tsconfig.*\.json$|^index\.html$|^scripts/check-(axe-presence|test-file-naming)\.sh$|^scripts/check-bundle-budget(\.test)?\.mjs$)'
          # `scripts/` and `.claude/` are tooling: the guards, their manual-stage
          # self-tests and `scripts/*.test.mjs` all run in `lint`, so a
          # tooling-only PR is `ci` and pays no suite. The few scripts a suite
          # consumes are routed to that suite above (the Rust phases' helpers
          # and the unsafe allowlist to backend; the axe/test-naming hook
          # owners and the bundle-budget guard, whose test runs in `vitest`,
          # to frontend). `scripts/verify-ci-equivalent.sh` keeps the same
          # routing (`CI_PATH_RE`, `RS_SCRIPT_RE`, `HOOK_OWNER_*_RE`) and its
          # self-test ratchets the two `ci` sets against each other.
          ci_re='(^\.github/|^scripts/|^\.claude/|^prek\.toml$|^\.taplo\.toml$|^lychee\.toml$|^\.gitleaks\.toml$)'

          # Bundle/packaging gates for `ci.yml`'s two build jobs. Narrow on
          # purpose: logic correctness lives in the suites above, so these only
          # guard bundling / packaging / cross-compile drift. Android is
          # deliberately NOT every `src-tauri/**` change — host Rust almost
          # always cross-compiles — so it names the scaffold/conf files, the
          # cross-compile dependency graph, and each file carrying an
          # `cfg(target_os = "android")` / `cfg(mobile)` gate. Move one of those
          # files and move its entry here in the same commit;
          # `scripts/check-android-trigger.mjs` asserts every literal path
          # listed still exists. Both name `.github/actions/`: the build jobs
          # run their toolchain preamble through the composites there, so a
          # SHA bump inside one is a change to the bundle job and must run it.
          desktop_re='^(src-tauri/|\.cargo/config\.toml\.example$|scripts/(fix-appimage-icons\.sh|prepare-external-bins\.mjs)$|package(-lock)?\.json$|\.github/workflows/ci\.yml$|\.github/actions/)'
          android_re='^(src-tauri/gen/android/|src-tauri/tauri\.android\.conf\.json$|src-tauri/tauri\.conf\.json$|src-tauri/Cargo\.(toml|lock)$|src-tauri/build\.rs$|src-tauri/src/(lib|lifecycle|android_jni)\.rs$|src-tauri/agaric-store/src/db/mod\.rs$|src-tauri/agaric-sync/src/android_context\.rs$|src-tauri/agaric-sync/src/sync_daemon/(android_multicast|android_network_block|mod|session_supervisor)\.rs$|scripts/patch-android-build\.sh$|scripts/check-android-so-alignment\.mjs$|scripts/prepare-external-bins\.mjs$|\.github/workflows/ci\.yml$|\.github/actions/)'

          # Single pass over the changed set. docs_only stays true only while
          # EVERY path matches the docs allowlist; the three category flags are
          # sticky-true once any matching path is seen. No `break` — every path
          # must be inspected for the category flags even after docs_only flips.
          #
          # FAIL-CLOSED default for UNRECOGNIZED non-docs paths: a changed file
          # that is neither docs NOR any known category (frontend/backend/ci) —
          # e.g. rust-toolchain.toml, .cargo/config.toml, rustfmt.toml, a root
          # Justfile / Dockerfile / flake.nix / *.sh — is a build/toolchain
          # change we cannot attribute to a suite. Under per-category gating,
          # BOTH vitest and cargo-tests would skip and it could merge with no
          # heavy suite at all (a strictness regression vs the pre-#833 gate,
          # which ran EVERYTHING on any non-docs change). So we pin
          # frontend=backend=ci=true for such a path, genuinely restoring
          # "anything we don't explicitly recognize runs the full suite" — ci
          # too, so a build/toolchain script (e.g. scripts/*.sh) still runs the
          # shell-lint + skip-ci-verify guards. Recognized-but-unsuited
          # categories (a pure `ci` change like a workflow/prek.toml edit) do
          # NOT trip this — `lint` (incl. zizmor) already covers them.
          docs_only=true
          docs=false
          frontend=false
          backend=false
          ci=false
          desktop=false
          android=false
          for f in "${changed[@]}"; do
            # Did this path match ANY known non-docs category?
            matched_cat=false
            if [[ "$f" =~ $docs_re ]]; then docs=true; fi
            if [[ "$f" =~ $frontend_re ]]; then frontend=true; matched_cat=true; fi
            if [[ "$f" =~ $backend_re ]]; then backend=true; matched_cat=true; fi
            if [[ "$f" =~ $ci_re ]]; then ci=true; matched_cat=true; fi
            # Bundle gates only: they do not participate in `matched_cat`, so
            # they never suppress the fail-closed branch below.
            if [[ "$f" =~ $desktop_re ]]; then desktop=true; fi
            if [[ "$f" =~ $android_re ]]; then android=true; fi
            if [[ ! "$f" =~ $docs_re ]]; then
              if [ "$docs_only" = "true" ]; then
                echo "Non-docs path detected: $f → docs_only=false (full lint suite)."
              fi
              docs_only=false
              if [ "$matched_cat" = "false" ]; then
                echo "Unrecognized non-docs path: $f → pinning frontend=backend=ci=true (fail-closed full suite)."
                frontend=true
                backend=true
                ci=true
              fi
            fi
          done

          echo "docs_only=$docs_only docs=$docs frontend=$frontend backend=$backend ci=$ci"
          echo "desktop=$desktop android=$android"
          {
            echo "docs_only=$docs_only"
            echo "docs=$docs"
            echo "frontend=$frontend"
            echo "backend=$backend"
            echo "ci=$ci"
            echo "desktop=$desktop"
            echo "android=$android"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # verify-version-agreement (#2975) — the version mutual-agreement check over
  # every file `scripts/bump-version.sh` bumps, always-on (no detect-changes
  # gating, no docs-only fast path).
  # Extracted from release.yml's `verify-version` job, which only runs on a
  # tag push — so version drift between the manifests was previously caught
  # mid-release instead of at PR time. This job reuses the EXACT SAME
  # extraction expressions and runs them on every PR/push, but checks only
  # that the manifests agree with EACH OTHER — there is no tag yet at
  # PR time, so the tag-equality half of release.yml's check does not apply
  # here and is intentionally NOT duplicated. release.yml's `verify-version`
  # job is unchanged and still separately asserts the tag matches the
  # manifests at release time; this job does not replace it.
  #
  # `src-tauri/fuzz/Cargo.lock` is checked here even though release.yml's
  # tag-time twin does not look at it. It pins `agaric` through a path
  # dependency, so a version bump moves it too — but it sits in the fuzz
  # crate's OWN workspace, outside every parent-workspace command, and until
  # `bump-version.sh` learned to regenerate it EVERY release from 0.7.1 to
  # 0.9.8 left it stale (by up to five versions). `verify-lockfiles` below
  # already reds on that, but as a raw `cargo … --locked` error against a
  # file whose staleness is a VERSION-BUMP omission; diagnosing it from the
  # job whose name says "version agreement", with the regeneration command in
  # the message, is what turns that red into an instruction.
  # ---------------------------------------------------------------------------
  verify-version-agreement:
    runs-on: ubuntu-24.04
    # Trivial jq / grep / awk over the manifests + fail-fast comparison —
    # same budget as release.yml's verify-version job.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the version manifests mutually agree
        run: |
          set -euo pipefail
          CONF=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          PKG=$(jq -r .version package.json)
          PKG_LOCK=$(jq -r .version package-lock.json)
          CARGO_LOCK=$(awk '/^name = "agaric"$/{getline; print; exit}' src-tauri/Cargo.lock | cut -d'"' -f2)
          FUZZ_LOCK=$(awk '/^name = "agaric"$/{getline; print; exit}' src-tauri/fuzz/Cargo.lock | cut -d'"' -f2)
          echo "conf=$CONF cargo=$CARGO cargo.lock=$CARGO_LOCK fuzz/cargo.lock=$FUZZ_LOCK pkg=$PKG pkg.lock=$PKG_LOCK"
          fail=0
          for v in "$CARGO" "$CARGO_LOCK" "$FUZZ_LOCK" "$PKG" "$PKG_LOCK"; do
            if [ "$v" != "$CONF" ]; then fail=1; fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Version drift — tauri.conf.json=$CONF, Cargo.toml=$CARGO, Cargo.lock=$CARGO_LOCK, fuzz/Cargo.lock=$FUZZ_LOCK, package.json=$PKG, package-lock.json=$PKG_LOCK. Bump all of them in lockstep — scripts/bump-version.sh does it. If only src-tauri/fuzz/Cargo.lock disagrees, regenerate it with: cd src-tauri/fuzz && cargo update -p agaric --precise $CONF"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # verify-lockfiles (#4142) — assert BOTH Cargo.lock files are a faithful
  # resolution of their manifests. Nothing else in the pipeline did: no job
  # builds with `--locked`, so cargo's default on a lock that disagrees with
  # the dependency graph is to silently re-resolve and rewrite it. In a runner
  # that rewrite is discarded with the workspace, the build goes green, and
  # `main` keeps the bad lock. #4139 hand-applied a lock stanza and leaned on
  # a LOCAL `cargo metadata --locked` as the only thing that would have caught
  # a wrong `dependencies` array; this job is that check made repeatable.
  #
  # It covers `src-tauri/Cargo.lock` AND `src-tauri/fuzz/Cargo.lock` — fuzz is
  # its own workspace with its own lock, and #4139 established it sits outside
  # the advisory lane entirely, so a check that stopped at the first lock would
  # leave exactly the half-covered pair this job exists to avoid.
  #
  # THE OBLIGATION THIS CREATES, stated plainly because it is not obvious from
  # the paths a PR touches: `src-tauri/fuzz` path-depends on `agaric`,
  # `agaric-store`, `agaric-sync` and `agaric-engine`, so its lock resolves
  # every requirement declared in the parent manifests too. Adding or changing
  # a dependency REQUIREMENT in ANY `src-tauri/**/Cargo.toml` therefore
  # invalidates `src-tauri/fuzz/Cargo.lock` as well, and step (1) reds until it
  # is regenerated — even though the diff never went near `src-tauri/fuzz`.
  # Refreshing only `src-tauri/Cargo.lock` is not enough. The remedy is in the
  # step's `::error::` (`cd src-tauri/fuzz && cargo metadata --format-version 1
  # >/dev/null`, then commit the lock), and the same note is in `AGENTS.md`
  # § Coupled Dependency Updates and `docs/BUILD.md`.
  #
  # This lands hardest on Dependabot, and by design cannot self-heal there.
  # `.github/dependabot.yml`'s `/src-tauri` entry sets no
  # `versioning-strategy`, so it defaults to `increase-if-necessary` and MAY
  # edit `src-tauri/Cargo.toml` (a mdns-sd 0.20 -> 0.21 bump is exactly that
  # shape); the `/src-tauri/fuzz` entry is `lockfile-only` — load-bearing, per
  # #3432 — so it cannot regenerate the fuzz lock in response. Such a PR reds
  # here and a human has to push the one-command fix above. That is a
  # deliberate trade: `lockfile-only` is what stops a fuzz-scoped Dependabot PR
  # from silently editing the SHARED parent manifest (#3432 shipped an
  # `rmcp` ^2.0 -> ^3.0 major that way), and a loud red with the fix in the
  # annotation is cheaper than that failure mode. Do not "fix" it by relaxing
  # the fuzz entry's strategy.
  #
  # NOT about checksums: cargo verifies the sha256 on download and fails hard,
  # so a bad checksum cannot reach `main` green. This is the GRAPH half —
  # package versions, `dependencies` arrays, and the resolution they imply.
  #
  # TWO steps, because `--locked` alone is NOT sufficient (measured, cargo
  # 1.95.0): a `dependencies` entry naming a package with no `[[package]]`
  # stanza is silently DROPPED when cargo reads the lock, so
  # `cargo metadata --locked` exits 0 with no warning on it — and so do
  # `cargo tree/fetch/update --locked` and a full `cargo build --locked`
  # (all re-measured on 1.95.0). The second half re-runs cargo WITHOUT
  # `--locked` (and `--offline`, see the step body) and diffs the lock it
  # actually writes against a snapshot, which catches that residue.
  #
  # NO false positive from a stale-but-valid lock: cargo's resolver is
  # conservative, so an older locked version that still satisfies every
  # requirement is kept rather than bumped, and an existing lockfile
  # `version =` is preserved rather than migrated. Step (2) only ever
  # rewrites a lock cargo genuinely disagrees with. (Both verified on 1.95.0.)
  #
  # No build, no system deps (cargo metadata never runs build scripts), and
  # deliberately NO rust-cache: the whole job runs in comfortably under a
  # minute even from a cold CARGO_HOME, where the cost is registry download
  # bandwidth rather than compute. No frozen figure here on purpose — a
  # measured number in a comment is what this PR removed from
  # `src-tauri/tests/AGENTS.md`; the 10-minute ceiling below is the bound that
  # matters. And any action that invokes cargo before the step could
  # re-resolve and rewrite the lock ahead of the snapshot, masking the very
  # drift being looked for. 10-min ceiling sized for slow-mirror/runner
  # variance over that minute, per the file's convention.
  # ---------------------------------------------------------------------------
  verify-lockfiles:
    needs: detect-changes
    # Gated on the `backend` category, which is exactly right and needs no new
    # classifier bucket: both lockfiles and all eight Cargo.toml manifests live
    # under `src-tauri/`, which `backend_re` matches at the root anchor. The
    # classifier is also fail-closed, so an unrecognized path (e.g. a
    # `rust-toolchain.toml` bump, which CAN change resolution through the
    # MSRV-aware resolver) pins backend=true and runs this too.
    # Also OR-ed on `ci`: this job's body is ~150 lines of shell that nothing
    # else runs, so gating on `backend` alone would leave a PR editing that
    # shell — this file — with the job SKIPPED, and `validate-all` accepts the
    # skip via `be_skip_ok`. OR-ing on `ci` makes it self-exercising.
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          # #640: exact toolchain pin — keep in lockstep with
          # rust-toolchain.toml and src-tauri/Cargo.toml `rust-version`.
          # It matters more here than elsewhere: the resolver is
          # version-sensitive (MSRV-aware resolution), so a floating
          # toolchain could disagree with the committed lock for reasons
          # that have nothing to do with the diff.
          toolchain: 1.95.0

      - name: Verify both Cargo.lock files resolve their manifests
        working-directory: src-tauri
        run: |
          set -euo pipefail

          snapshots="$(mktemp -d)"

          # The restore below is UNCONDITIONAL, not path-dependent. Step (2)
          # rewrites each lock IN PLACE, and this block is meant to be run
          # verbatim locally to reproduce a red (#4142's acceptance criterion),
          # so a Ctrl-C, a job timeout, or any failure between the rewrite and
          # the in-loop `cp` must not leave a developer's Cargo.lock rewritten.
          # `set -e` is on (above), so an unguarded failure exits the step and
          # fires the EXIT trap; INT/TERM need their own traps to run it at all.
          # Restores every lock already snapshotted, then removes the snapshot
          # dir (which mktemp -d would otherwise leak on every local run).
          # `[ -f ]` is the whole decision, so it leans on the loop below
          # publishing each snapshot by rename: a name that exists here is a
          # COMPLETE copy, never a partial one (see `snap_partial` below).
          restore_locks() {
            for restore_lock in Cargo.lock fuzz/Cargo.lock; do
              restore_snap="$snapshots/${restore_lock//\//_}"
              if [ -f "$restore_snap" ]; then
                cp "$restore_snap" "$restore_lock"
              fi
            done
            rm -rf "$snapshots"
          }
          trap restore_locks EXIT
          trap 'trap - EXIT; restore_locks; exit 130' INT
          trap 'trap - EXIT; restore_locks; exit 143' TERM

          fail=0

          for lock in Cargo.lock fuzz/Cargo.lock; do
            manifest="$(dirname "$lock")/Cargo.toml"
            label="src-tauri/$lock"
            # Repo-root-relative directory to regenerate this lock from, so
            # the annotations below can hand over a command that can be pasted
            # as-is: `src-tauri` or `src-tauri/fuzz`.
            lock_dir="$(dirname "$label")"
            snap="$snapshots/${lock//\//_}"
            # Write to a `.partial` name and `mv` it into place, rather than
            # `cp` straight to "$snap". `restore_locks` decides what to put
            # back purely from `[ -f "$restore_snap" ]`, so the snapshot name
            # must never exist holding fewer bytes than the lock: a `cp` that
            # dies PARTWAY (ENOSPC is the realistic case) leaves a truncated
            # file, and the trap would then copy that truncation over the
            # committed Cargo.lock — destroying the exact "safe to run verbatim
            # locally" property the trap exists to provide. `rm -f "$snap"` on
            # the failure branch below would not be enough on its own: a
            # SIGINT landing mid-`cp` runs the INT trap without ever reaching
            # that branch. `mv` within one directory is a rename(2), so the
            # snapshot name only ever appears complete, whatever kills us.
            snap_partial="$snap.partial"
            # Guarded for the same reason the two `cargo metadata` calls below
            # are: an unguarded failure (lock missing, unreadable, snapshot dir
            # gone) would abort the whole step under `set -e` with NO
            # `::error::` annotation and no second lockfile checked — the "reds
            # as an unexplained code failure" mode this step exists to avoid.
            # Deliberately BEFORE `::group::`, so this annotation is emitted
            # outside any group and `continue` needs no `::endgroup::`.
            if ! cp "$lock" "$snap_partial" || ! mv "$snap_partial" "$snap"; then
              rm -f "$snap_partial"
              echo "::error file=$label::could not snapshot $label — see the cp error above. The file is missing or unreadable; this is an I/O problem, NOT lockfile drift, so do not regenerate the lockfile on the strength of this message."
              fail=1
              continue
            fi
            echo "::group::$label"

            # (1) The lock must be a VALID resolution of the manifests as
            # written. `--locked` forbids the silent re-resolve, so a stanza
            # whose version no dependent can satisfy is a hard error here
            # instead of a green build against a lock that was never the one
            # in the repo.
            if ! cargo metadata --locked --format-version 1 \
                  --manifest-path "$manifest" >/dev/null; then
              echo "::error file=$label::cargo could not resolve $label with --locked. See the cargo error above: normally the lock disagrees with the manifests, but a crates.io index/download failure surfaces here too. To regenerate: cd $lock_dir && cargo metadata --format-version 1 >/dev/null — then commit $label. Any cargo command WITHOUT --locked rewrites the lock conservatively (it keeps every pin that still satisfies the manifests); this one is just the cheapest, since cargo metadata runs no build. Do NOT use 'cargo generate-lockfile' or a bare 'cargo update': both re-resolve the whole graph to the newest compatible versions, which would lift deliberate holds (measured in src-tauri/fuzz: 882 packages relocked, loro 1.13.6 -> 1.13.9 against the #3161 hold that .github/dependabot.yml pins)."
              # If the FUZZ lock is the one failing, say why it can be failing
              # on a PR that never went near src-tauri/fuzz — see this job's
              # header comment.
              if [ "$lock" = fuzz/Cargo.lock ]; then
                echo "::error file=$label::note: src-tauri/fuzz is its own workspace but path-depends on agaric, agaric-store, agaric-sync and agaric-engine, so ANY added or changed dependency REQUIREMENT in any src-tauri/**/Cargo.toml invalidates this lock too, even when the PR never touches src-tauri/fuzz. Regenerating it with the command above is the whole fix."
              fi
              fail=1
              echo "::endgroup::"
              continue
            fi

            # (2) `--locked` is necessary but NOT sufficient. Cargo silently
            # DROPS a `dependencies` entry naming a package that has no
            # `[[package]]` stanza, so a hand-applied or badly-merged edit can
            # leave a phantom edge that step (1) accepts (measured against
            # cargo 1.95.0: exit 0, no warning). Re-run WITHOUT `--locked` so
            # cargo writes the lock it would actually generate, then diff
            # against the snapshot taken above. Any output is drift the
            # committed lock is carrying.
            #
            # `--offline`, not a second networked resolve. Step (1) passing
            # means cargo needs no resolution change, so the only rewrite left
            # for step (2) is dropping residue the lock already carries — that
            # can never pull a package step (1) did not already download, and
            # step (1) downloads the whole graph. Verified from an EMPTY
            # CARGO_HOME: step (1) warms exactly what step (2) needs, and the
            # phantom-edge diff still appears. This halves the job's crates.io
            # exposure, so a registry hiccup can only ever red the annotated
            # step (1) and never this one.
            #
            # But read step (2) for what it is: `--offline` is also a REDUCTION
            # IN SCOPE, not only in exposure. An offline resolve is confined to
            # what is already in CARGO_HOME, so it cannot surface drift that
            # only a networked resolve would produce — a yanked version being
            # the obvious case (offline, cargo happily keeps resolving to the
            # cached copy of a version crates.io would no longer hand out).
            # Step (2) answers "is the committed lock what cargo writes given
            # this cache", NOT "is it what cargo would write against the live
            # index today". Catching yanks/index movement is `cargo audit`'s and
            # Dependabot's lane, not this job's — do not read a green here as a
            # statement about the registry.
            #
            # NOT guard-free: an unguarded failure here would abort the whole
            # step under `set -e`, leaving `::group::` unterminated (the rest
            # of the log collapses into it), emitting no annotation, and never
            # checking the SECOND lockfile.
            if ! cargo metadata --offline --format-version 1 \
                  --manifest-path "$manifest" >/dev/null; then
              echo "::error file=$label::cargo failed to re-resolve $label offline after --locked accepted it — see the cargo error above."
              fail=1
              cp "$snap" "$lock"
              echo "::endgroup::"
              continue
            fi
            # Options BEFORE the operands: GNU getopt permutes, so the other
            # order works on ubuntu-24.04 — but this block is advertised as
            # runnable verbatim locally and a non-GNU diff may not permute.
            # diff's exit code is THREE-valued: 0 = identical, 1 = differences,
            # 2+ = "trouble" (an operand it could not read, etc.). Collapsing
            # 2 into 1 with a bare `if ! diff` would report an I/O fault as
            # lockfile drift and tell the reader to "regenerate and commit the
            # lockfile" — advice that cannot fix it. Capture the status instead
            # of branching on truthiness. `|| rc=$?` keeps `set -e` from
            # aborting on the expected non-zero.
            diff_rc=0
            diff -u --label "$label (committed)" \
              --label "$label (what cargo resolves)" "$snap" "$lock" || diff_rc=$?
            if [ "$diff_rc" -eq 1 ]; then
              echo "::error file=$label::$label is not what cargo resolves — the diff above is what cargo rewrote. Regenerate and commit it: cd $lock_dir && cargo metadata --format-version 1 >/dev/null (NOT 'cargo generate-lockfile' — see the --locked annotation's note)."
              fail=1
            elif [ "$diff_rc" -ge 2 ]; then
              echo "::error file=$label::diff could not compare $label (exit $diff_rc — 'trouble', e.g. an operand it could not read); see the diff error above. This is an I/O problem, NOT lockfile drift — the committed lock has not been shown to be wrong, so do not regenerate it on the strength of this message."
              fail=1
            fi
            # Step (2) rewrites the lock IN PLACE. Put the committed bytes
            # back before the next iteration: it keeps the checkout clean for
            # anything that runs after this step and makes the loop order
            # irrelevant (no iteration can ever snapshot a lock a previous one
            # rewrote). The `restore_locks` trap above is what makes the
            # guarantee unconditional — this in-loop `cp` is what keeps the
            # rest of THIS run reading committed bytes.
            cp "$snap" "$lock"
            echo "::endgroup::"
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::Cargo.lock verification FAILED (see above)."
            exit 1
          fi
          echo "Both Cargo.lock files are graph-consistent with their manifests."

  # ---------------------------------------------------------------------------
  # lint — prek hook suite (excluding vitest/cargo-test/no-commit-to-branch),
  # npm audit signatures (warn-only), cargo audit (blocking — see PEND-41 R5), and the sqlx
  # offline-cache drift check. Needs the full Node + Rust + mold + cargo
  # plugins stack because prek's hooks invoke clippy, cargo-deny, sqruff,
  # zizmor, etc.
  # ---------------------------------------------------------------------------
  lint:
    needs: detect-changes
    # #833: the FULL lint job (clippy, cargo-deny, cargo-audit, sqlx-prepare,
    # zizmor, the whole prek suite + the heavy Rust/Node toolchain it needs)
    # is skipped on a provably docs-only diff. Docs are still linted by the
    # lightweight `docs-lint` job below, which runs the cheap doc-only hooks
    # (typos, markdownlint, lychee) with no toolchain. Fail-closed: an
    # uncertain classification ⇒ docs_only=false ⇒ this full job runs.
    #
    # This is the CROSS-CUTTING guard: clippy / oxfmt / import-baseline / zizmor
    # all live here and must run on ANY non-docs change, so it stays gated on
    # `docs_only != 'true'` (NOT on a single category) — the prek hooks
    # self-filter by file type, so it is cheap-ish on a small diff.
    if: needs.detect-changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    # PEND-41 R1 — observed wall-clock 11.2 min (run 25966040732, 2026-05-16,
    # n=1 post-PEND-39-split). +50% headroom + round up to nearest 5 → 20 min.
    # 20 → 30 (#1458): the `Install system dependencies` apt step can crawl to
    # ~12 min on a slow Ubuntu mirror (same root cause as the playwright cap
    # bump), which ran this job out the 20-min budget mid-clippy. The deb
    # re-download itself is tracked as #1464; 30 min absorbs the variance.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks (run via prek) inspects git history, so we need the
          # full commit graph rather than the default shallow checkout.
          fetch-depth: 0
          persist-credentials: false

      - name: Toolchain (apt, mold, Rust, Node, npm ci)
        uses: ./.github/actions/toolchain
        with:
          # ci/path-conditional-jobs: the Tauri system deps, mold, the toolchain
          # and the cargo cache exist only for the cargo-invoking prek hooks and
          # the sqlx steps below, so a backend-less PR skips them. Fail-closed:
          # an unrecognized path pins backend=true (see detect-changes).
          rust: ${{ needs.detect-changes.outputs.backend }}
          rust-shared-key: rust-lint

      - name: Script unit tests (node:test)
        # Lives in `lint`, not `vitest` (#4544). `lint` is gated on
        # `docs_only != 'true'`, needs no frontend build to run a node:test
        # file, and does not depend on a fail-closed SIDE EFFECT holding.
        #
        # That last clause is the subtle one, and the reason not to "simplify"
        # this into `vitest`: a scripts-only PR does reach `vitest` today, but
        # only by accident. `scripts/*.mjs` matches none of `detect-changes`'
        # three category regexes (`.mjs` does not satisfy frontend_re's
        # `\.(ts|tsx|js|jsx|css)$` — the character before `js` is `m`), so it
        # is an UNRECOGNIZED non-docs path and hits the fail-closed branch
        # above, which pins frontend=backend=ci=true. Move the test there and
        # it runs on an unrecognized-path fallback — which stops holding the
        # day someone adds `\.mjs$` to frontend_re.
        #
        # Named explicitly rather than globbed: a glob here would silently
        # adopt every future `scripts/*.test.mjs` into this job, including
        # ones needing a toolchain it does not install. Adding a line is the
        # deliberate act; the cost of forgetting is a test that runs nowhere,
        # which is the defect class #4544 itself is about.
        run: node --test scripts/pr-diff-base.test.mjs

      - name: Verify npm package provenance signatures
        # Requires Node 22.5+; rejects packages whose registry-side Sigstore
        # provenance attestation is missing or invalid. Catches the
        # "compromised maintainer republishes from a different machine"
        # class of attack (Sigstore signs at publish time from CI, so a
        # local laptop republish has no valid attestation). Mode is `audit`
        # not `install` so missing attestations log a warning rather than
        # failing the build — many transitive deps don't yet publish with
        # provenance and we don't want to gate CI on that today.
        run: npm audit signatures || echo "::warning::npm audit signatures had findings (warn-only mode); review the log above"

      - name: Prepare externalBin placeholder (FEAT-4f)
        # ci/path-conditional-jobs: these placeholders exist only to satisfy
        # Tauri's build.rs during cargo invocations, so they are gated with the
        # toolchain — a backend-less PR runs no cargo and needs none of them.
        if: needs.detect-changes.outputs.backend == 'true'
        # Tauri's build.rs validates externalBin paths on every cargo
        # invocation — clippy, cargo-deny, machete all trigger it.
        run: node scripts/prepare-external-bins.mjs --placeholder-only

      # ci/path-conditional-jobs: this taiki-e step is SPLIT so a backend-less PR
      # still gets the tools the whole-tree NON-Rust hooks and the prek runner
      # itself need. This first (UNGATED) install carries prek (runs the whole
      # suite), zizmor (workflow security audit), taplo-cli (TOML lint/fmt),
      # typos-cli (typo check), and sqruff (SQL-migration lint). None invoke
      # cargo (sqruff/typos/taplo run standalone binaries), and all must run on
      # every non-docs PR — so they are installed regardless of the backend flag.
      - name: Install prek + non-Rust lint tools via prebuilt binaries
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          # sqruff pinned: unpinned resolves to latest via cargo-binstall's
          # from-source fallback, and sqruff >=0.39 requires rustc 1.96 while
          # this repo pins 1.95.0 (rust-toolchain.toml) — reds the whole lint
          # job. 0.38.x supports rustc 1.94/1.95. Bump when the rustc pin moves.
          #
          # zizmor pinned (#3476): unpinned, CI floated to whatever was latest
          # while a dev box kept whatever `cargo install` last fetched, so the
          # two ran different AUDIT SETS — #3475 reddened every open PR with
          # findings from an audit that did not exist locally, unreproducible
          # by construction. Must match `ZIZMOR_PINNED_VERSION` in
          # scripts/zizmor-hook.sh (the wrapper fails this job if it does not)
          # and the same pin in scheduled-deep-checks.yml.
          #
          # prek/taplo-cli/typos-cli pinned (#3742): same failure shape, hit
          # live via prek itself. `.github/zizmor.yml` went red on `check
          # yaml` with a comment-count parser limit that prek 0.4.11
          # (whatever CI happened to resolve) enforces and prek 0.3.8
          # (whatever was installed locally) does not — a green tree turned
          # red with no repo change, and the "fix" that passed locally still
          # failed in CI. Must match `pinned_version_for` in
          # scripts/setup-hooks.sh (which installs these versions locally,
          # replacing any different one already on PATH) and the same pins
          # in the two scheduled-deep-checks.yml install steps. Verified by
          # scripts/check-prek-version-pin.mjs.
          tool: prek@0.3.8,zizmor@1.28.0,taplo-cli@0.10.0,typos-cli@1.46.0,sqruff@0.38.0

      # ci/path-conditional-jobs: the cargo-* plugins are invoked only by the
      # Rust prek hooks (cargo-deny/cargo-machete) + the cargo-audit step below,
      # so they are gated on backend == 'true'. A backend-less PR SKIPs those
      # hooks (see the Run prek step) and never needs these installed.
      - name: Install cargo plugins via prebuilt binaries (PEND-39 C1)
        if: needs.detect-changes.outputs.backend == 'true'
        # taiki-e/install-action pulls prebuilt binaries from the upstream
        # GitHub Releases of each tool, side-stepping the per-binary
        # `cargo install` compile that previously dominated cold-cache
        # runs. Unlike `cargo install`, the binary cache here is not
        # invalidated by `Cargo.lock` changes — only by the explicit `@v2`
        # tag bump or a tool-version pin change. cargo-nextest lives on
        # the cargo-tests job (the only consumer); this job needs the
        # lint/audit set.
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-deny,cargo-machete,cargo-audit

      - name: Install sqlx-cli (custom features, cargo fallback)
        # ci/path-conditional-jobs: sqlx-cli compiles from source and is used
        # only by the sqlx offline-cache-check steps below, so it is gated on
        # backend == 'true' — a backend-less PR skips those checks.
        if: needs.detect-changes.outputs.backend == 'true'
        # sqlx-cli with the right features set isn't covered by
        # taiki-e/install-action's binary list — has to compile from source.
        # Cached across runs via Swatinem/rust-cache's cache-bin: 'true';
        # only recompiles when Cargo.lock invalidates that cache.
        run: |
          if ! command -v cargo-sqlx >/dev/null; then cargo install --locked sqlx-cli --no-default-features --features rustls,sqlite; fi

      - name: Install lychee (prebuilt binary)
        # The `lychee` pre-commit hook (prek.toml `[[repos.hooks]] id = "lychee"`)
        # is a `local` hook calling the system `lychee` binary, since the
        # upstream `lycheeverse/lychee` pre-commit repo is broken on a
        # normal dev box (see commit bd3dc79c for the failure modes).
        # That means CI must put a `lychee` binary on PATH explicitly —
        # `taiki-e/install-action` doesn't manifest lychee, so we pull the
        # official prebuilt release directly. Fast (~1s) and avoids the
        # slow `cargo install` compile.
        run: |
          set -euo pipefail
          VERSION=lychee-v0.24.2
          DIR=lychee-x86_64-unknown-linux-gnu
          TARBALL="${DIR}.tar.gz"
          # Known-good SHA256 of the linux-gnu tarball for VERSION above — the
          # published release checksum (the sibling `${TARBALL}.sha256` asset),
          # independently reproducible with `sha256sum`. GitHub release assets
          # are mutable under a tag, so the version pin alone does not prevent
          # asset replacement; this is the only unverified-binary gap in an
          # otherwise SHA-pinned toolchain. MUST be updated in the same PR that
          # bumps VERSION or the `sha256sum -c` below fails the job.
          SHA256=1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
          curl -fsSL -o /tmp/lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/${VERSION}/${TARBALL}"
          echo "${SHA256}  /tmp/lychee.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/lychee.tar.gz -C /tmp "${DIR}/lychee"
          install -m 0755 "/tmp/${DIR}/lychee" "${HOME}/.local/bin/lychee"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/lychee" --version

      - name: Restore lychee link-check cache
        # Persist the lychee URL cache across runs so we don't re-hit the
        # same github.com / crates.io / npm URLs from cold every time.
        # Key on the markdown file set so a doc edit invalidates as expected;
        # restore-keys lets a partial cache survive when the key misses.
        # node_modules/ is excluded from the hash (#819 (3)): this step
        # runs after `npm ci`, so dependency markdown churn (READMEs,
        # CHANGELOGs) was invalidating the key on every unrelated dep
        # bump even though lychee only ever checks tracked docs.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ hashFiles('**/*.md', '!node_modules/**') }}
          restore-keys: |
            lychee-${{ runner.os }}-

      - name: Compute prek SKIP (per changed category)
        # ci/path-conditional-jobs: the per-category list lives in
        # `prek_skip_list` in scripts/verify-ci-equivalent.sh — the pre-push
        # verifier and this gate read the one list. `no-commit-to-branch` is
        # appended here because it is CI-only (the verifier runs pre-push,
        # where the guard is the point). A category is ABSENT when its output
        # is not exactly 'true' (fail-closed: detect-changes pins
        # frontend=backend=true on any unrecognized non-docs path, so those
        # hooks stay ON in doubt).
        env:
          FRONTEND: ${{ needs.detect-changes.outputs.frontend }}
          BACKEND: ${{ needs.detect-changes.outputs.backend }}
          CI: ${{ needs.detect-changes.outputs.ci }}
          DOCS: ${{ needs.detect-changes.outputs.docs }}
        run: |
          set -euo pipefail

          # `docs` is the ANY-docs-changed flag (not docs_only): a mixed
          # code+docs PR reaches this job and must still lint its markdown.
          flag() { if [ "$1" = "true" ]; then echo 1; else echo 0; fi; }
          skip_csv="no-commit-to-branch,$(bash scripts/verify-ci-equivalent.sh --print-skip \
            "$(flag "$DOCS")" "$(flag "$FRONTEND")" "$(flag "$BACKEND")" "$(flag "$CI")")"
          printf 'Computed prek SKIP: %s\n' "$skip_csv"
          printf 'SKIP=%s\n' "$skip_csv" >> "$GITHUB_ENV"

      - name: Run prek (same as `prek run --all-files` locally)
        env:
          # SKIP is computed by the preceding "Compute prek SKIP" step and
          # exported via $GITHUB_ENV. It always carries the pre-push-only /
          # sibling-job hooks (no-commit-to-branch, vitest, cargo-test) and
          # appends a category's hooks only when that category is absent from
          # the diff (`prek_skip_list` in scripts/verify-ci-equivalent.sh has
          # the per-category + compound AND rules).
          # Security / hygiene hooks are never in it, so they always run here.
          SKIP: ${{ env.SKIP }}
          # Lychee reads GITHUB_TOKEN automatically. Without this, lychee
          # makes unauthenticated requests to github.com and gets rate-
          # limited (~60 req/hour) — bursty Dependabot PR runs blow the
          # budget and surface as transient lint failures even with 429 +
          # 5xx accepted in `lychee.toml`.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: prek run --all-files

      - name: Run prek manual stage (self-tests + CI-only guards, #4556 Phase 2)
        # Every surviving self-test and the CI-only guards live in the `manual`
        # stage, which `prek run --all-files` above never selects. SKIP is
        # emptied explicitly: the computed SKIP is exported via $GITHUB_ENV and
        # would otherwise silently drop hooks from this run. Exact count, not
        # `> 0`, and no `Skipped`: a `files:`-scoped hook that matches nothing
        # reports Skipped and exits 0 (the knip false-green shape below).
        env:
          SKIP: ''
        run: |
          set -euo pipefail
          # Counted from prek.toml at run time, the independent source: every
          # manual hook is that line. `|| true` because grep -c exits 1 on none.
          expected=$(grep -cE '^stages = \["manual"\]$' prek.toml || true)
          [ "$expected" -gt 0 ] || { echo "no manual-stage hooks found in prek.toml"; exit 1; }
          listed=$(prek list --hook-stage manual --output-format json | jq length)
          [ "$listed" -eq "$expected" ] || { echo "manual stage lists $listed hooks, expected $expected"; exit 1; }
          prek run --all-files --hook-stage manual 2>&1 | tee manual.log
          passed=$(grep -c 'Passed$' manual.log || true)
          [ "$passed" -eq "$expected" ] || { echo "$passed of $expected manual hooks reported Passed"; exit 1; }
          if grep -q 'Skipped' manual.log; then echo "a manual-stage hook was Skipped"; exit 1; fi

      - name: Run cargo clippy (backend PRs)
        # cargo-clippy is staged `pre-push` in prek.toml, so the pre-commit-stage
        # `prek run --all-files` above never executes it — clippy would not gate
        # PRs at all without this step. Invoke the hook explicitly (mirrors the
        # npm-audit step) so its exact config runs: `cargo clippy --workspace
        # --all-targets -- -D warnings`. Gated on backend == 'true' — the Rust
        # toolchain is installed under the same condition; skipped on
        # frontend/docs/ci-only PRs (fail-closed: unrecognized paths pin
        # backend=true, so any Rust diff keeps clippy on).
        if: needs.detect-changes.outputs.backend == 'true'
        run: prek run --all-files --hook-stage pre-push cargo-clippy

      - name: Cargo check the fuzz targets (backend PRs)
        # `src-tauri/fuzz` is its own workspace, so `--workspace` clippy never
        # compiles it and a fuzz target that no longer builds surfaced only in
        # the weekly sweep (#3163 hid for five days). Nightly is needed only
        # to RUN with sanitizers; a plain `cargo check` works on the stable
        # toolchain here. Sharing clippy's target dir means only the fuzz
        # crate itself compiles (~1 min measured locally).
        if: needs.detect-changes.outputs.backend == 'true'
        env:
          SQLX_OFFLINE: 'true'
        run: >-
          CARGO_TARGET_DIR="$PWD/src-tauri/target"
          cargo check --manifest-path src-tauri/fuzz/Cargo.toml --locked

      - name: Run npm-audit advisory scan (pre-push-staged hook)
        # ci/path-conditional-jobs: npm-audit is a Node/frontend advisory scan,
        # gated on frontend == 'true' — a backend/ci-only PR has no npm surface
        # to audit (fail-closed: unrecognized paths pin frontend=true).
        # npm-audit is staged `pre-push` in prek.toml (#1087: it hits the
        # registry advisory endpoint over the network, which doesn't belong on
        # the commit path), so the `prek run --all-files` above — which runs
        # only pre-commit-stage hooks — does NOT execute it. Invoke it
        # explicitly with `--hook-stage pre-push` (mirrors the lychee step in
        # the docs-lint job) so the advisory vulnerability scan stays in CI.
        # `npm audit signatures` above is a different, warn-only provenance
        # check and does not cover advisories.
        if: needs.detect-changes.outputs.frontend == 'true'
        run: prek run --all-files --hook-stage pre-push npm-audit

      - name: Run knip (dead-code / unused-dependency analysis)
        # ci/path-conditional-jobs: knip is a Node/frontend dead-code analysis,
        # gated on frontend == 'true' — no npm surface on a backend/ci-only PR.
        # knip is staged `pre-push` in prek.toml (it is a whole-repo analysis
        # that goes red on stale branches for diffs unrelated to the commit, so
        # it doesn't belong on the commit path). Unlike npm-audit / lychee, the
        # `prek run --all-files --hook-stage pre-push knip` selector SKIPS with
        # "no files to check" (knip declares `pass_filenames = false` with a
        # `types` filter, which prek resolves to an empty set under --all-files),
        # so routing through prek here would be a silent false-green. Invoke the
        # underlying command (the hook's own `entry`) directly instead — the
        # `npm ci` above provides node_modules. This closes the gap where knip
        # ran only on local pre-push and drifted red on main unnoticed.
        if: needs.detect-changes.outputs.frontend == 'true'
        run: npx knip

      - name: Migrations append-only backstop (#806)
        # `prek run --all-files` cannot enforce the append-only
        # invariant — the migrations-immutable hook's staged-index scan
        # is empty on a fresh CI checkout, so a one-time local
        # `--no-verify` bypass would be permanent without this. Re-run
        # the same script in `--range` mode over the PR / push range so
        # any M/D/R/C/T under src-tauri/migrations/*.sql fails CI.
        # Checkout above uses fetch-depth: 0, so the base sha resolves.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # NOT `github.event.pull_request.base.sha` (#4544). That is the
            # base tip as of the TRIGGERING EVENT, and HEAD here is
            # `refs/pull/N/merge`, which GitHub regenerates against main's
            # current tip — so `merge-base(base.sha, HEAD) == base.sha` and
            # the range below widens to include other people's merges as main
            # advances, blaming this PR for a migration it never touched.
            # Same defect this PR fixes in the mutation lane; same fix.
            #
            # NO `|| true` here, and it is not an oversight. Under the old
            # code `base` was `$PR_BASE_SHA`, always non-empty on a
            # `pull_request` event, so the skip guard below was reachable only
            # on push/tag. Swallowing a resolver failure would make this
            # append-only backstop skip SILENTLY on a PR while the job stays
            # green: a fail-open, in a step whose entire purpose is to catch a
            # `--no-verify` bypass that would otherwise be permanent. `set -e`
            # fails the step instead. The skip guard below still covers the
            # push/tag arm, which is the case it was written for.
            base="$(node scripts/pr-diff-base.mjs --base-ref "$PR_BASE_REF")"
          else
            base="$PUSH_BEFORE"
          fi
          # New branch / tag push / orphan: nothing to diff against.
          # The commit-time hook (always_run) remains the enforcement
          # point; this backstop only covers ranges it can resolve.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$base" 2>/dev/null; then
            echo "Base sha unresolved — skipping range backstop."
            exit 0
          fi
          bash scripts/check-migrations-immutable.sh --range "$base...HEAD"

      - name: Cargo audit (RustSec advisory check, blocking)
        # ci/path-conditional-jobs: `cargo audit` needs the toolchain + the
        # cargo-audit plugin (both gated above), and only advises on the Rust
        # dependency tree, so it is skipped on a backend-less PR. Fail-closed:
        # any Cargo.lock/Rust change pins backend=true, so advisories still run.
        if: needs.detect-changes.outputs.backend == 'true'
        # Complements `cargo deny check` (in the prek run above) by hitting
        # the upstream RustSec advisory DB directly — catches advisories
        # published since `deny.toml`'s ignore list was last triaged.
        #
        # PEND-41 R5 — promoted from warn-only to blocking. A new advisory
        # surfaces here exactly once; the maintainer must either fix the
        # underlying dep or add an explicit entry to
        # `src-tauri/deny.toml [advisories].ignore` with a `reason` field
        # documenting why the call-site is unaffected — `deny.toml` is the
        # single source of truth (#11) — then run
        # `node scripts/sync-audit-from-deny.mjs` to regenerate
        # `src-tauri/.cargo/audit.toml [advisories].ignore`, the file
        # `cargo audit` itself actually reads (see `cargo-audit-guard.sh`'s
        # own banner, which names the generated file because that is the
        # one this step's tool consults, not the one a human edits). The
        # `audit-toml-in-sync` prek hook (manual stage, run above) fails,
        # naming the same command, if the two ever drift. The .nsprc-style
        # explicit-waiver discipline
        # applies; same pattern used by the npm-side audit step.
        #
        # #3688 — a malformed upstream advisory (RustSec commit e11d6b33,
        # gettext-rs/gettext-sys directory mismatch) makes bare `cargo
        # audit` refuse to load the advisory DATABASE and exit non-zero
        # BEFORE it reads our dependency tree — indistinguishable, from the
        # exit code alone, from a real vulnerable dependency, and the
        # waiver above structurally cannot help (no advisory ID is ever
        # reported to ignore). `scripts/cargo-audit-guard.sh` runs the same
        # `cargo audit`, unchanged, but classifies a database-load failure
        # separately (exit 2, with a banner explaining why this is NOT a
        # statement about our dependencies) from a real advisory report
        # (exit 1, unchanged). Still blocking either way (fail closed) —
        # only the diagnosis changes. See the script's own header and
        # `--self-test` for the full rationale.
        working-directory: src-tauri
        run: bash ../scripts/cargo-audit-guard.sh .

      - name: sqlx offline cache check
        # ci/path-conditional-jobs: sqlx `prepare --check` compiles the crate
        # against its committed .sqlx/ cache — Rust-only, and .sqlx/ changes pin
        # backend=true — so it is skipped on a backend-less PR.
        if: needs.detect-changes.outputs.backend == 'true'
        # Reusable composite action (#2621 layered-workspace split): each
        # workspace crate that carries `query!`/`query_as!` macros — and so
        # its own committed `.sqlx/` cache — gets its own lane by calling
        # this action with a distinct working-directory + database-url. The
        # sqlx-0.9.x `prepare --check` rationale and the `-- --tests`
        # default (query drift in `#[cfg(test)]` modules must not slip
        # through — prek.toml MAINT-227) live in the action itself. Four
        # crates now carry a cache: `agaric` (this lane), `agaric-store`,
        # `agaric-engine`, and `agaric-sync` (the lanes below).
        uses: ./.github/actions/sqlx-offline-check
        with:
          working-directory: src-tauri
          database-url: 'sqlite:ci-sqlx-prepare.db'

      - name: sqlx offline cache check (agaric-store)
        # ci/path-conditional-jobs: same as the app-crate lane above — Rust-only
        # sqlx compile, skipped on a backend-less PR (backend != 'true').
        if: needs.detect-changes.outputs.backend == 'true'
        # #2621 wave S3b-ii: op_log's `query!`/`query_as!` macros moved into
        # agaric-store, which now carries its own committed `.sqlx/` cache.
        # A `../migrations` symlink under the crate lets both this action's
        # `cargo sqlx migrate run` and `sqlx::migrate!` resolve the shared
        # workspace migrations.
        #
        # The `database-url` MUST be absolute for a NON-root workspace member.
        # `cargo sqlx database create` runs in `working-directory`
        # (src-tauri/agaric-store), but `sqlx::query!` resolves a *relative*
        # sqlite path at compile time from rustc's CWD — the WORKSPACE ROOT
        # (src-tauri), not the crate dir — so a relative url has the DB created
        # under agaric-store/ yet looked for under src-tauri/, failing every
        # query with "unable to open database file". The app lane above works
        # with a relative url only because the app crate IS the workspace root.
        uses: ./.github/actions/sqlx-offline-check
        with:
          working-directory: src-tauri/agaric-store
          database-url: 'sqlite:${{ runner.temp }}/agaric-store-sqlx-prepare.db'

      - name: sqlx offline cache check (agaric-engine)
        # ci/path-conditional-jobs: same as the app-crate lane above — Rust-only
        # sqlx compile, skipped on a backend-less PR (backend != 'true').
        if: needs.detect-changes.outputs.backend == 'true'
        # #2621 wave E1: loro's `query!`/`query_scalar!` macros moved into
        # agaric-engine, which now carries its own committed `.sqlx/` cache.
        # A `../migrations` symlink under the crate lets both this action's
        # `cargo sqlx migrate run` and `sqlx::migrate!` resolve the shared
        # workspace migrations.
        #
        # The `database-url` MUST be absolute for a NON-root workspace member —
        # see the agaric-store lane's comment above for the relative-path
        # failure mode (rustc resolves relative sqlite paths from the workspace
        # root, not the crate dir).
        uses: ./.github/actions/sqlx-offline-check
        with:
          working-directory: src-tauri/agaric-engine
          database-url: 'sqlite:${{ runner.temp }}/agaric-engine-sqlx-prepare.db'

      - name: sqlx offline cache check (agaric-sync)
        # ci/path-conditional-jobs: same as the app-crate lane above — Rust-only
        # sqlx compile, skipped on a backend-less PR (backend != 'true').
        if: needs.detect-changes.outputs.backend == 'true'
        # #2621 Sync-D: the net/protocol/daemon/files + snapshot cluster's
        # `query!`/`query_as!`/`query_scalar!` macros moved into agaric-sync,
        # which now carries its own committed `.sqlx/` cache. A `../migrations`
        # symlink under the crate lets both this action's `cargo sqlx migrate
        # run` and `sqlx::migrate!` resolve the shared workspace migrations.
        #
        # The `database-url` MUST be absolute for a NON-root workspace member —
        # see the agaric-store lane's comment above for the relative-path
        # failure mode (rustc resolves relative sqlite paths from the workspace
        # root, not the crate dir).
        uses: ./.github/actions/sqlx-offline-check
        with:
          working-directory: src-tauri/agaric-sync
          database-url: 'sqlite:${{ runner.temp }}/agaric-sync-sqlx-prepare.db'

  # ---------------------------------------------------------------------------
  # docs-lint (#833) — the docs-only counterpart to `lint`. Runs ONLY on a
  # provably docs-only diff (the full `lint` job is skipped then) and runs
  # just the cheap doc-relevant prek hooks — markdownlint, the markdown
  # link/citation checks, typos, remove-after-markers, and lychee — with no
  # Rust toolchain, clippy, cargo-deny, cargo-audit, or sqlx-prepare. This
  # keeps docs actually linted on the fast path instead of waving them
  # through.
  #
  # remove-after-markers (#4129) is in this list because it scans `.md` too
  # (#4147): without it, a docs-only PR that adds an expired `REMOVE AFTER`
  # marker to a design note merged clean, uncaught by the guard that claims
  # `.md` coverage unconditionally. It is a fast Node scan (no cargo, no
  # network), so it costs the fast path almost nothing.
  #
  # EXACTLY ONE of {lint, docs-lint} runs per PR (they have opposite
  # docs_only conditions). validate-all requires BOTH (a skipped sibling is
  # accepted only under docs_only — see that job), so whichever one ran must
  # have succeeded for the gate to pass. The prek config is NOT modified:
  # the reduced set is selected by passing hook ids on the command line.
  # ---------------------------------------------------------------------------
  docs-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    # Cheap: Node + three prebuilt binaries + a handful of doc hooks. No
    # Rust compile. Generous 10-min ceiling (lychee hits the network).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # markdownlint/typos/lychee only need the working tree, but keep a
          # full clone so prek's local hooks behave identically to the `lint`
          # job (no shallow-clone surprises).
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        # markdownlint runs via `npx markdownlint-cli2`; the md-link-targets
        # and doc-vs-code-paths hooks are node scripts. All resolve from
        # node_modules, so `npm ci` is required.
        run: npm ci

      - name: Install prek + typos via prebuilt binaries
        # Only the tools the reduced doc-hook set needs — no cargo-deny /
        # sqruff / zizmor / taplo / cargo-audit (those gate code, which a
        # docs-only diff does not touch).
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          # prek/typos-cli pinned (#3742) — must match `pinned_version_for`
          # in scripts/setup-hooks.sh and the other tool: lists in this repo.
          tool: prek@0.3.8,typos-cli@1.46.0

      - name: Install lychee (prebuilt binary)
        # The `lychee` prek hook is a `local` hook calling the system
        # binary; install it the same way the full `lint` job does.
        run: |
          set -euo pipefail
          VERSION=lychee-v0.24.2
          DIR=lychee-x86_64-unknown-linux-gnu
          TARBALL="${DIR}.tar.gz"
          # Known-good SHA256 of the linux-gnu tarball for VERSION above — the
          # published release checksum (the sibling `${TARBALL}.sha256` asset),
          # independently reproducible with `sha256sum`. GitHub release assets
          # are mutable under a tag, so the version pin alone does not prevent
          # asset replacement; this is the only unverified-binary gap in an
          # otherwise SHA-pinned toolchain. MUST be updated in the same PR that
          # bumps VERSION or the `sha256sum -c` below fails the job.
          SHA256=1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
          curl -fsSL -o /tmp/lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/${VERSION}/${TARBALL}"
          echo "${SHA256}  /tmp/lychee.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/lychee.tar.gz -C /tmp "${DIR}/lychee"
          install -m 0755 "/tmp/${DIR}/lychee" "${HOME}/.local/bin/lychee"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/lychee" --version

      - name: Restore lychee link-check cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ hashFiles('**/*.md', '!node_modules/**') }}
          restore-keys: |
            lychee-${{ runner.os }}-

      - name: Run doc-only prek hooks (markdownlint, link/citation, typos, remove-after-markers)
        # Pass the hook ids positionally so prek runs ONLY this reduced set —
        # the prek.toml config itself is untouched (#833 constraint).
        # remove-after-markers is included so a docs-only PR gets the same
        # `.md` REMOVE AFTER coverage the full `lint` job gives every other
        # PR (#4147) — it needs no toolchain beyond the Node/git already set
        # up above.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: prek run --all-files markdownlint md-link-targets doc-vs-code-paths typos remove-after-markers

      - name: Run lychee link check (pre-push-staged hook)
        # lychee is staged `pre-push` in prek.toml, so it needs the explicit
        # `--hook-stage pre-push` selector (the run above is the default
        # pre-commit stage). GITHUB_TOKEN avoids github.com rate-limiting.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: prek run --all-files --hook-stage pre-push lychee

  # ---------------------------------------------------------------------------
  # vitest — frontend unit + integration suite (PEND-86: single job).
  # Previously a 3-shard matrix + a separate merge job; consolidated into one
  # full-suite run. Three ~3-min shards in parallel cost three runner slots and
  # still needed a 4th (merge) job, while the critical path was gated by the
  # 16-min cargo-tests long pole anyway. One full run (~8-9 min with v8
  # coverage) frees two runner slots, drops the merge job, and produces the
  # coverage report directly — no cross-shard istanbul merge to maintain.
  # Node-only; no Rust toolchain or apt deps needed.
  # ---------------------------------------------------------------------------
  vitest:
    needs: detect-changes
    # Run the frontend unit/integration suite iff the diff touches frontend
    # files (src/, e2e/, .ts/.tsx/.js/.jsx/.css, package[-lock].json, the
    # vite/vitest/tailwind/postcss configs, tsconfig*.json, index.html). Fail-
    # open is impossible: the classifier fails CLOSED (frontend=true on any
    # diff error), and a classifier failure fails the gate outright.
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    # PEND-41 R1 — full-suite wall-clock was ~3×2.2 min of test work split
    # across shards; run as one job that's ~6-7 min of tests + ~2 min v8
    # instrumentation, plus the ~1-2 min production build below (issue
    # #812). ~10-11 min observed-equivalent; +50% headroom + round up to
    # nearest 5 → 20 min.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Vitest (full suite, with coverage)
        # #749: `vitest.config.ts` is the SINGLE source of truth for the
        # coverage thresholds. This step no longer overrides them to 0 — the
        # config thresholds now actually gate here, at zero marginal cost
        # (the suite already runs with coverage). Measured full-suite
        # coverage clears all four with headroom (lines 91.6 / functions
        # 90.9 / branches 82.0 / statements 89.8), so enabling the gate
        # does not red an otherwise-green PR; it stops a new untested module
        # from silently dropping below the OSPS-Silver line. The old three
        # contradictory versions (config 90/89/80/89, the `=0` override
        # here, and a `>=80%/>=75%` step-summary string) were reconciled to
        # this one by #749 — then drifted apart again (#3258) when a later
        # PR changed the config thresholds without updating the two prose
        # copies below. Do not restate the numbers in a comment here; the
        # "Coverage summary" step derives them from `vitest.config.ts` at
        # run time via `scripts/print-coverage-thresholds.mjs` so this
        # comment can't go stale again. Writes the json summary to
        # `coverage-merged/` for the summary step + artifact.
        run: |
          npx vitest run \
            --coverage \
            --coverage.reportsDirectory=coverage-merged \
            --coverage.reporter=json \
            --coverage.reporter=json-summary

      - name: Production build (tsc -b && vite build)
        # Issue #812: nothing else on the PR path runs the production
        # bundler — Playwright uses the dev server, prek's tsc covers types
        # only, and `cargo tauri build` is path-gated away from
        # frontend-only diffs. Without this (~1-2 min) step, a change that
        # breaks rolldown/lightningcss production bundling (dynamic
        # imports, env handling, chunking) passes every PR check and
        # surfaces first at release-tag time.
        run: npm run build

      - name: Bundle-size budget gate (#750)
        # Zero new CI minutes — the production `dist/` from the build step
        # above is already on disk. The gate measures each PERF-24-tuned
        # chunk's gzip size against the checked-in budgets and fails on a
        # regression (e.g. a heavy lib pulled onto the entry path via a new
        # static import). Budgets are measured + 10% headroom; re-baseline
        # with `node scripts/check-bundle-budget.mjs --update`.
        run: |
          node --test scripts/check-bundle-budget.test.mjs
          node scripts/check-bundle-budget.mjs

      - name: Coverage summary
        if: hashFiles('coverage-merged/coverage-summary.json') != ''
        run: |
          {
            echo "## Coverage (vitest, full suite)"
            echo
            echo "| Metric | % | Covered / Total |"
            echo "| --- | --- | --- |"
            jq -r '
              .total |
              "| Lines      | \(.lines.pct)% | \(.lines.covered) / \(.lines.total) |",
              "| Statements | \(.statements.pct)% | \(.statements.covered) / \(.statements.total) |",
              "| Functions  | \(.functions.pct)% | \(.functions.covered) / \(.functions.total) |",
              "| Branches   | \(.branches.pct)% | \(.branches.covered) / \(.branches.total) |"
            ' coverage-merged/coverage-summary.json
            echo
            thresholds="$(node scripts/print-coverage-thresholds.mjs)"
            echo "_Gated against \`vitest.config.ts\` thresholds (#749, single source of truth): ${thresholds}. The vitest step above fails the job if any metric drops below its threshold._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage ratchet (#648, non-blocking)
        if: hashFiles('coverage-merged/coverage-summary.json') != ''
        # Non-blocking patch-level signal: compares this run's total line
        # coverage against the checked-in baseline (scripts/coverage-
        # baseline.json) and surfaces a drop in the step summary. ALWAYS
        # exits 0 — coverage is deliberately not gated here (#648); the
        # config thresholds above are the only vitest gate. Zero new CI
        # minutes (the summary already exists).
        run: node scripts/coverage-ratchet.mjs --summary coverage-merged/coverage-summary.json --key vitest

      - name: Upload coverage artifact
        # Kept the `vitest-coverage-merged` name so any downstream Codecov /
        # badge tooling that referenced it keeps working after the merge
        # job was removed.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-coverage-merged
          path: coverage-merged/
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # playwright — E2E browser tests, sharded 3-ways. Per-shard report uploaded
  # on failure (artifact name includes the shard number so the shards don't
  # collide). No merge step yet — deferred per the plan.
  # ---------------------------------------------------------------------------
  playwright:
    needs: detect-changes
    # Run the E2E browser suite iff the diff touches frontend files (same
    # `frontend` category as vitest). Fail-closed classifier — see
    # detect-changes.
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    # 35 min = the measured 25-43s preamble + the install-deps step's
    # worst-known-legitimate 21m10s (300s attempt-1 bound + 30s SIGKILL grace
    # + 180s lock poll + 760s cold-mirror attempt 2) + ~9 min for the shard
    # itself, ~13% headroom.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Playwright setup (Node, npm ci, browsers, system deps)
        uses: ./.github/actions/playwright-setup

      - name: Playwright E2E tests (shard ${{ matrix.shard }}/3)
        id: playwright
        run: npx playwright test --shard ${{ matrix.shard }}/3

      - name: Upload Playwright report (on failure)
        if: failure() && steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # `${{ matrix.shard }}` keeps shard artifacts from colliding —
          # GitHub rejects duplicate artifact names within a workflow run.
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # cargo-tests — full Rust test suite (nextest) with cargo-llvm-cov
  # source-based coverage. Uses its own `rust-cov` Swatinem cache key
  # (issue #813) — the instrumented tree shares nothing with the lint /
  # mcp / release trees. MCP build + UDS smoke + externalBin verify live
  # in their own `mcp-tests` job so a coverage-suite slowdown doesn't
  # gate the MCP-sidecar signal (and vice versa).
  # ---------------------------------------------------------------------------
  cargo-tests:
    needs: detect-changes
    # Run the Rust nextest+coverage suite iff the diff touches backend files
    # (src-tauri/, .rs, Cargo.toml/lock, migrations, .sqlx/). Fail-closed
    # classifier — see detect-changes. cargo-coverage `needs: cargo-tests`, so
    # it skips transitively when this job is skipped.
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    # PEND-86: split into a 2-shard matrix via nextest `--partition count:N/2`.
    # The single-job full suite + llvm-cov was the ~16-min critical-path long
    # pole; sharding halves the test+instrument time per cell (each shard
    # compiles the instrumented tree once — the compile isn't halved, but the
    # test+coverage execution is — so expect ~9-11 min/cell). Each shard emits
    # a PARTIAL lcov + json summary; the `cargo-coverage` job below merges
    # them and gates the merge on the result (since #648's `--gate`) — see
    # that job.
    # PEND-41 R1 — pre-split observed wall-clock 22.6 min (run 25966040732).
    # Per-shard is roughly half the test work on the same compile; keep a
    # generous 35-min budget until we have instrumented per-shard samples.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space on runner
        # Run 26569299876 failed with `System.IO.IOException: No space left
        # on device` (annotation on job 78272043133) during the cargo-llvm-cov
        # instrumented compile. The instrumented build tree plus the rust-deps
        # Swatinem cache restore are the heavy consumers; this job uses none
        # of the preinstalled .NET / Haskell / Android / Swift toolchains, so
        # deleting them frees the headroom needed before cargo runs. `df -h`
        # is logged before+after so future tightening can size against real
        # numbers instead of a guess.
        #
        # Backgrounded: the reclaim measured 1:37-1:48 per shard on the
        # critical path (2026-09-02); the apt / rust-toolchain / rust-cache
        # steps overlap it. "Wait for disk reclaim" sits before "Install
        # Node.js" on purpose: `$AGENT_TOOLSDIRECTORY` is the last tree the
        # `rm` walks and the one setup-node installs into.
        run: |
          set -euo pipefail
          echo "Before:" && df -h /
          (
            sudo rm -rf /usr/share/dotnet \
                        /usr/local/lib/android \
                        /opt/ghc \
                        /usr/local/share/boost \
                        /usr/local/share/powershell \
                        /usr/share/swift \
                        "$AGENT_TOOLSDIRECTORY" || status=$?
            echo "${status:-0}" > "$RUNNER_TEMP/free-disk.exit"
          ) > "$RUNNER_TEMP/free-disk.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/free-disk.pid"

      - name: Prepare apt (free dpkg lock, bound downloads)
        uses: ./.github/actions/prepare-apt

      # Shared with the other Tauri-dep jobs (lint, cargo-tests, mcp-tests) and
      # reused across runs (#1464): on a hit `apt-get install` resolves from the
      # cached .debs instead of the slow Ubuntu mirror. Bump `-v1` if the list
      # below changes.
      - name: Cache apt archives (Tauri system deps)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-tauri-${{ runner.os }}-v1

      - name: Install system dependencies
        # Same apt list as the `lint` sibling — both jobs compile Rust and
        # need the webkit/gtk/ssl/rsvg/soup stack plus mold for fast linking.
        # #4163: `apt-get update` is ADVISORY inside this action -- a mirror
        # that cannot serve the index no longer reds this job as a code
        # failure; the INSTALL decides. Measured trace + exit codes in
        # .github/actions/apt-install/action.yml.
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libssl-dev
            librsvg2-dev
            libsoup-3.0-dev
            pkg-config
            mold

      - name: Enable mold linker (CI-only .cargo/config.toml)
        run: |
          mkdir -p .cargo
          cp .cargo/config.toml.example .cargo/config.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          # #640: exact toolchain pin — keep in lockstep with
          # rust-toolchain.toml and src-tauri/Cargo.toml `rust-version`.
          # Without an explicit `toolchain:` this SHA-pinned action
          # installs the floating latest stable, and rustup would then
          # re-download the rust-toolchain.toml pin at first cargo run.
          toolchain: 1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          cache-bin: 'true'
          # Per-job-class key (issue #813): the llvm-cov instrumented tree
          # (coverage RUSTFLAGS) shares no artifacts with the lint / mcp /
          # release trees, so under the old shared `rust-deps` key it lost
          # the single cache slot to a faster sibling and recompiled from
          # scratch every PR. See the matching comment in the `lint` job.
          shared-key: rust-cov
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Wait for disk reclaim
        # Must precede "Install Node.js": setup-node populates
        # `$AGENT_TOOLSDIRECTORY`, which the backgrounded `rm` is still
        # walking on a warm-cache run.
        run: |
          set -euo pipefail
          pid=$(cat "$RUNNER_TEMP/free-disk.pid")
          while kill -0 "$pid" 2>/dev/null; do sleep 2; done
          cat "$RUNNER_TEMP/free-disk.log"
          [ "$(cat "$RUNNER_TEMP/free-disk.exit")" = "0" ] || { echo "disk reclaim failed"; exit 1; }
          echo "After:" && df -h /

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        # Needed for `scripts/prepare-external-bins.mjs` below (it imports
        # from node_modules to resolve the host triple).
        run: npm ci

      - name: Prepare externalBin placeholder (FEAT-4f)
        # Tauri's build.rs validates externalBin paths on every cargo
        # invocation — including nextest. The full-release agaric-mcp
        # build below replaces this placeholder with the real binary.
        run: node scripts/prepare-external-bins.mjs --placeholder-only

      - name: Install cargo-nextest + cargo-llvm-cov via prebuilt binary (PEND-39 C1)
        # `cargo-llvm-cov` wraps LLVM's source-based coverage instrumentation
        # — the gold standard for Rust coverage. It composes with
        # `cargo nextest` natively (`cargo llvm-cov nextest ...`), so we
        # don't have to swap runners. Output is lcov (industry standard,
        # consumable by Codecov / coveralls / VSCode coverage gutters) plus
        # a JSON summary the step below renders as a markdown table.
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Cargo test (nextest, shard ${{ matrix.shard }}/2, with llvm-cov)
        working-directory: src-tauri
        # Run THIS shard's deterministic partition under llvm-cov, then emit a
        # PARTIAL lcov for the lines this shard's tests exercised. The
        # `cargo-coverage` job below unions the two partials. `--partition
        # count:N/2` is nextest's stable hash partition (forwarded through
        # `cargo llvm-cov nextest`). `--no-fail-fast` mirrors plain nextest so
        # the coverage map shape is pass/fail-independent.
        #
        # `--workspace` (#2817): without it, only the ROOT package's tests ran
        # under llvm-cov — and since this is CI's only Rust unit/integration
        # job, the #2621 library crates' suites (agaric-core/store/engine)
        # were silently not executing in CI at all, and every module wave
        # showed a phantom coverage drop as its tests left the measured set.
        run: |
          cargo llvm-cov nextest --workspace --profile ci --no-fail-fast \
            --partition count:${{ matrix.shard }}/2 --no-report
          cargo llvm-cov report --lcov \
            --output-path coverage-${{ matrix.shard }}.lcov

      - name: Cargo test --doc (executable doc-comment examples)
        # nextest (the step above) does NOT run doc-tests — they compile as
        # their own per-example binaries outside the nextest harness. Without
        # this step a broken `/// ```` example on a pure helper would rot
        # silently (#2555). Doc-tests aren't partitioned, so one shard is
        # enough: shard 2, the shorter of the two, so the ~5 min lands on the
        # lane that finishes first instead of extending the job's critical
        # path. Cheap while there are few doc-tests; the per-example binary is
        # the real cost as adoption grows, which is why the convention is pure
        # helpers only.
        if: matrix.shard == 2
        working-directory: src-tauri
        run: cargo test --doc --workspace

      - name: Upload shard coverage artifact
        # Partial lcov for this shard. Retained 7 days — the merged artifact
        # the `cargo-coverage` job publishes is the long-lived one.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-shard-${{ matrix.shard }}
          path: src-tauri/coverage-${{ matrix.shard }}.lcov
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # cargo-coverage — union-merge the two cargo-tests shards' partial lcov
  # reports into the canonical `rust-coverage-lcov` artifact + a step-summary.
  # GATING: this job IS in `validate-all`'s needs (`check_job cargo-coverage`
  # requires success, allowed-skip only when backend is absent from the
  # diff) — a merge hiccup, an lcov-tool quirk, or (since #648 wired `--gate`
  # into the rust ratchet call below) a real coverage drop all fail the push.
  # `if: !cancelled()` so partial coverage still publishes if a shard went red.
  # ---------------------------------------------------------------------------
  cargo-coverage:
    runs-on: ubuntu-24.04
    needs: cargo-tests
    # `success() || failure()` (i.e. cargo-tests actually ran) — NOT
    # `!cancelled()`, because a backend-absent PR SKIPS cargo-tests, and a
    # skipped upstream would otherwise let this job run and then fail
    # downloading shard artifacts that were never produced. Skipping coverage
    # when no Rust changed is correct and consistent with the `backend`
    # category gate on cargo-tests: this job stays paired with cargo-tests and
    # runs iff cargo-tests ran.
    if: ${{ (success() || failure()) && needs.cargo-tests.result != 'cancelled' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lcov
        # 120s, not the 300s default: this job is `timeout-minutes: 10`, so two
        # 300s attempts would BE the whole budget. Before #4163 this site had no
        # retry at all AND no `::error::` marker, so its 124 surfaced as the bare
        # `Process completed with exit code 124` the issue reports (job
        # 95981259083). It now gets the same two advisory attempts as every other
        # site, and `lcov` installs from the image's own lists when they suffice.
        # #4163: `apt-get update` is ADVISORY inside this action -- the install,
        # not the index refresh, decides this step. See the action for the trace.
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            lcov
          update-timeout: '120'

      - name: Download shard coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rust-coverage-shard-*
          path: ./rust-coverage-shards
          merge-multiple: true

      - name: Union-merge the shard lcovs
        # `lcov --add-tracefile` takes the union of covered lines across the
        # two partition reports — the correct combine (concatenation would
        # duplicate records). `--ignore-errors` keeps the merge resilient to
        # llvm-cov/lcov-2.x format strictness.
        #
        # #3170: a missing shard artifact is a DISTINCT failure from a real
        # coverage drop, and must never be silently treated as one. The
        # shard upload step is success-gated, so when a cargo-tests shard
        # fails, its lcov never uploads — merging (or skipping past) whatever
        # partial set survives and feeding it to the ratchet compares
        # half-a-suite against a full-suite baseline, which manufactures a
        # fake "coverage regression" on top of the real cargo-tests failure
        # (one root cause reported as multiple confusing red checks). So
        # before merging anything we assert every expected shard artifact is
        # present; if any is missing we fail loudly with an explicit,
        # unambiguous message instead of computing (or waving through) a
        # partial number.
        run: |
          set -euo pipefail
          shopt -s nullglob

          # EXPECTED_SHARDS mirrors cargo-tests' `strategy.matrix.shard`
          # above (currently `[1, 2]`, i.e. 2 shards). GitHub Actions has no
          # cross-job way to read a sibling job's matrix size via `needs`,
          # so this count is a hand-kept literal — bump both together if the
          # shard count ever changes.
          EXPECTED_SHARDS=2

          missing=()
          for i in $(seq 1 "$EXPECTED_SHARDS"); do
            if [ ! -f "rust-coverage-shards/coverage-${i}.lcov" ]; then
              missing+=("$i")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            for i in "${missing[@]}"; do
              msg="coverage skipped: shard ${i}/${EXPECTED_SHARDS} artifact missing — upstream test job failed; coverage NOT evaluated"
              echo "::error::${msg}"
              echo "### Coverage ratchet (rust): ${msg}" >> "$GITHUB_STEP_SUMMARY"
            done
            exit 1
          fi

          shards=(rust-coverage-shards/*.lcov)
          echo "Merging ${#shards[@]} shard lcov(s): ${shards[*]}"
          args=()
          for f in "${shards[@]}"; do
            args+=(--add-tracefile "$f")
          done
          lcov --ignore-errors inconsistent,unused,empty,format \
            "${args[@]}" \
            --output-file coverage.lcov

      - name: Coverage summary (rust, merged)
        if: hashFiles('coverage.lcov') != ''
        run: |
          {
            echo "## Coverage (rust, merged across 2 cargo-tests shards)"
            echo
            echo '```'
            lcov --summary coverage.lcov 2>&1 | grep -E 'lines|functions' || true
            echo '```'
            echo
            echo "_LLVM source-based coverage; the two nextest partitions' lcovs union-merged via \`lcov --add-tracefile\`._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Node.js (for the coverage ratchet)
        if: hashFiles('coverage.lcov') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Coverage ratchet (#648, gated via --gate)
        if: hashFiles('coverage.lcov') != ''
        # HARD GATE: compares total Rust line coverage (summed LF/LH from the
        # merged lcov) against the checked-in baseline and surfaces a drop in
        # the step summary. `--gate` below makes coverage-ratchet.mjs exit 1
        # when coverage dropped beyond tolerance, which fails this step and
        # (via validate-all's `check_job cargo-coverage`) the merge gate.
        # This became gating with #648, superseding the original
        # non-blocking-signal design — the vitest call (above, no `--gate`)
        # is still exit-0/non-blocking by contrast. The `rust` baseline key
        # is seeded from the first main run via `--update` (no cargo-llvm-cov
        # is available off-CI to measure it locally).
        run: node scripts/coverage-ratchet.mjs --lcov coverage.lcov --key rust --gate

      - name: Upload merged rust coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles('coverage.lcov') != ''
        with:
          name: rust-coverage-lcov
          path: coverage.lcov
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # mcp-tests — agaric-mcp sidecar build, UDS smoke test, and externalBin
  # staging verification. Split out of cargo-tests so MCP-sidecar failures
  # surface on a dedicated check (and vice versa: a flaky coverage run
  # doesn't gate MCP signal). Uses its own `rust-mcp` Swatinem cache key
  # (issue #813) — its release + debug-smoke tree matches neither the
  # lint tree nor the llvm-cov instrumented tree.
  # ---------------------------------------------------------------------------
  mcp-tests:
    needs: detect-changes
    # Run the MCP sidecar build + UDS smoke iff the diff touches backend files
    # (same `backend` category as cargo-tests). Fail-closed classifier — see
    # detect-changes.
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    # MCP build + smoke is much lighter than the full nextest+llvm-cov
    # run on cargo-tests: one dev-profile compile of `src-tauri` shared by
    # the `agaric-mcp` bin and the smoke test. 9.7 min measured with the old
    # release build (2026-09-02), less now; the apt step is bounded by the
    # apt-install action and the .deb cache (#1464). 20 min.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain (apt, mold, Rust, Node, npm ci)
        uses: ./.github/actions/toolchain
        with:
          # Per-job-class key (#813): this job compiles a dev-profile
          # `agaric-mcp` plus the nextest smoke tree, neither of which matches
          # the lint tree or cargo-tests' llvm-cov instrumented tree, so
          # sharing one slot just meant the first finisher evicted everyone
          # else. See the matching comment in `lint`.
          rust-shared-key: rust-mcp

      - name: Install cargo-nextest via prebuilt binary (PEND-39 C1)
        # nextest is the test runner for the UDS smoke test below. Prebuilt
        # binary via taiki-e/install-action keeps cold-cache cost tiny.
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-nextest

      - name: Prepare externalBin placeholder (FEAT-4f)
        # Tauri's build.rs validates externalBin paths on every cargo
        # invocation. The full-release rebuild below overwrites this
        # placeholder with the real binary.
        run: node scripts/prepare-external-bins.mjs --placeholder-only

      - name: Build agaric-mcp stub binary (FEAT-4f)
        # Dev profile, deliberately: the I-MCP-9 smoke test below searches
        # `target/{debug,release}/` for the binary and its own nextest
        # compile is a dev tree, so one profile serves both and the
        # artifacts are shared. The release profile (thin LTO,
        # codegen-units=1) cost 5:18 here (2026-09-02) and the `build` job
        # produces and verifies the real release sidecar anyway.
        run: node scripts/prepare-external-bins.mjs --profile dev

      - name: MCP stub-binary smoke test (I-MCP-9)
        working-directory: src-tauri
        run: cargo nextest run --features ci-smoke --profile ci -E 'test(stub_binary_roundtrips_initialize_over_uds)'

      - name: Verify agaric-mcp smoke (--version)
        run: src-tauri/target/debug/agaric-mcp --version

      - name: Verify externalBin artifact exists
        run: test -x src-tauri/binaries/agaric-mcp-x86_64-unknown-linux-gnu

  # ---------------------------------------------------------------------------
  # validate-all — the single required aggregate gate (branch protection + the
  # ci.yml / release.yml callers depend on this one context, so adding/removing
  # siblings never churns the protected-check list).
  #
  # SECURITY-SENSITIVE (#805 strict gate + #833 per-category fast-path). Read
  # slowly. `if: always()` is load-bearing: a plain needs: would SKIP this job on
  # a sibling failure, and a skipped REQUIRED check counts as PASSING — a red
  # sibling would stay mergeable. It always runs and decides from sibling results:
  #   - detect-changes must have SUCCEEDED; else pin frontend=backend=true,
  #     docs_only=false and fail (fail-closed).
  #   - success always OK; failure/cancelled NEVER OK; skipped OK only when the
  #     job's category is absent — lint iff docs_only; vitest/playwright iff
  #     !frontend; cargo-tests/cargo-coverage/mcp-tests iff !backend; docs-lint is
  #     the complement (success iff docs_only, else skipped).
  # INVARIANT: under classifier failure or any category true, that category's
  # heavy jobs MUST be success — no code change rides in on a skip (classifier is
  # allowlist-based + fail-closed; a backend change that regenerates bindings also
  # flips frontend). Full truth table in the PR body.
  # ---------------------------------------------------------------------------
  validate-all:
    needs: [detect-changes, verify-version-agreement, verify-lockfiles, lint, docs-lint, vitest, playwright, cargo-tests, cargo-coverage, mcp-tests]
    if: always()
    runs-on: ubuntu-24.04
    # PEND-41 R1 — trivial jq/bash assertion (~2s observed); 5-min floor.
    timeout-minutes: 5
    steps:
      - name: Assert validate gate (per-category, fail-closed)
        env:
          # The full needs context, e.g. {"lint": {"result": "success"}, ...}.
          # Passed via env (not inline interpolation) so the JSON can never
          # be parsed as shell.
          NEEDS_JSON: ${{ toJSON(needs) }}
          # Read the classifier category outputs directly (NOT from NEEDS_JSON
          # — outputs live under .outputs there, but reading the resolved value
          # here is clearer). Each is passed via env, never inline-interpolated
          # into the script body. Empty/anything-but-"true" is treated as the
          # category being ABSENT (i.e. not docs-only / no frontend / no
          # backend); the gate normalises them below.
          DOCS_ONLY: ${{ needs.detect-changes.outputs.docs_only }}
          FRONTEND: ${{ needs.detect-changes.outputs.frontend }}
          BACKEND: ${{ needs.detect-changes.outputs.backend }}
        run: |
          set -euo pipefail

          fail=0
          gate_fail() { echo "::error::$1"; fail=1; }

          result_of() { jq -r --arg k "$1" '.[$k].result // "missing"' <<< "$NEEDS_JSON"; }

          # check_job JOB SKIP_OK: success is always OK; skipped is OK only when
          # SKIP_OK=="true" (that job's category is absent); failure/cancelled/
          # anything-else is NEVER OK. `fail` is a global mutated via gate_fail.
          check_job() {
            local j="$1" skip_ok="$2" r
            r="$(result_of "$j")"
            if [ "$r" = "success" ]; then
              return 0
            fi
            if [ "$r" = "skipped" ] && [ "$skip_ok" = "true" ]; then
              echo "$j skipped (allowed: category absent)."
              return 0
            fi
            gate_fail "job '$j' result=$r is not acceptable (skip_ok=$skip_ok)."
          }

          classifier="$(result_of detect-changes)"
          echo "detect-changes result=$classifier docs_only=${DOCS_ONLY:-<empty>} frontend=${FRONTEND:-<empty>} backend=${BACKEND:-<empty>}"

          # ---- Resolve category booleans, fail-closed -----------------------
          # On a SUCCESSFUL classifier, trust its outputs (normalised so only
          # the literal string "true" counts as present). Otherwise we cannot
          # trust any category: PIN frontend=true, backend=true, docs_only=false
          # (require/run everything) and fail the gate — a classifier that did
          # not succeed can never let a heavy job pass on a skip.
          docs_only="false"
          frontend="true"
          backend="true"
          if [ "$classifier" = "success" ]; then
            docs_only="false"; if [ "$DOCS_ONLY" = "true" ]; then docs_only="true"; fi
            frontend="false"; if [ "$FRONTEND" = "true" ]; then frontend="true"; fi
            backend="false"; if [ "$BACKEND" = "true" ]; then backend="true"; fi
          else
            gate_fail "detect-changes did not succeed (result=$classifier) — failing gate (fail-closed); pinning frontend=backend=true, docs_only=false."
          fi
          echo "resolved: docs_only=$docs_only frontend=$frontend backend=$backend"

          # verify-version-agreement is always-on (#2975) — no category gates
          # it, so a skip is never acceptable.
          check_job verify-version-agreement "false"

          # ---- Per-category acceptance --------------------------------------
          # lint is CROSS-CUTTING: it runs on any non-docs change, so its skip
          # is allowed only when docs_only.
          lint_skip_ok="false"; if [ "$docs_only" = "true" ]; then lint_skip_ok="true"; fi
          check_job lint "$lint_skip_ok"

          # frontend suite: skip allowed only when the frontend category is
          # absent from the diff.
          fe_skip_ok="false"; if [ "$frontend" != "true" ]; then fe_skip_ok="true"; fi
          check_job vitest "$fe_skip_ok"
          check_job playwright "$fe_skip_ok"

          # backend suite (+ its transitive coverage): skip allowed only when
          # the backend category is absent from the diff.
          be_skip_ok="false"; if [ "$backend" != "true" ]; then be_skip_ok="true"; fi
          check_job cargo-tests "$be_skip_ok"
          check_job cargo-coverage "$be_skip_ok"
          check_job mcp-tests "$be_skip_ok"
          # #4142: the Cargo.lock graph check is gated on the same `backend`
          # category (both lockfiles and every Cargo.toml live under
          # src-tauri/), so it takes the same skip rule.
          check_job verify-lockfiles "$be_skip_ok"

          # ---- docs-lint: the complement (runs on docs-only PRs) ------------
          # success → OK only under docs_only (it should have run)
          # skipped → OK only under !docs_only (it is path-gated off)
          dl="$(result_of docs-lint)"
          if [ "$docs_only" = "true" ]; then
            if [ "$dl" != "success" ]; then
              gate_fail "docs-lint result=$dl but a docs-only PR requires it to pass."
            fi
          else
            if [ "$dl" != "skipped" ]; then
              gate_fail "docs-lint result=$dl but a non-docs PR expects it skipped."
            fi
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::validate-all gate FAILED (see above)."
            exit 1
          fi
          echo "validate-all gate PASSED (docs_only=$docs_only frontend=$frontend backend=$backend)."
