name: Android launch smoke

# Builds a release-profile x86_64 APK, installs it on an emulator, starts the
# app and fails when it dies or logcat shows a crash (#6050). Only a release
# build reproduces `panic = "abort"`; a debug build unwinds, which is how
# 0.15.0 crashed on every Android launch with CI green.
#
# Runs on a release tag (`release.yml` gates `android-build-and-release` on it)
# and weekly (`scheduled-deep-checks.yml`), never per PR. `workflow_dispatch`
# runs it on any branch. It ships nothing: the APK is signed with a throwaway
# key and discarded, so it takes no secrets and restores no cache.

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NPM_CONFIG_LOGLEVEL: warn
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'
  CARGO_TERM_COLOR: always

jobs:
  launch:
    runs-on: ubuntu-24.04
    # The cold aarch64 release build alone measures ~19 min in
    # `release.yml`'s `android-build-and-release`; this adds the emulator boot
    # on top. A guess until the first dispatch run replaces it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free up runner disk space
        # Same cleanup as `ci.yml`'s `android-build`: the NDK, a cold release
        # `target/` tree and the emulator image share ~14 GB.
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null || true

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          # #640: exact toolchain pin — keep in lockstep with
          # rust-toolchain.toml and src-tauri/Cargo.toml `rust-version`.
          toolchain: 1.95.0
          targets: x86_64-linux-android

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
          packages: >
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018

      - name: Install Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare externalBin placeholder
        # tauri-build validates `externalBin` on every cargo invocation, and
        # Android ships no sidecar (see `tauri.android.conf.json`).
        run: node scripts/prepare-external-bins.mjs --placeholder-only

      - name: Initialize Tauri Android project
        # The same scaffold reset as `ci.yml`'s `android-build`: stash the
        # tracked overrides, regenerate the scaffold, restore the overrides.
        shell: bash
        run: |
          set -euo pipefail

          OVERRIDES="$(mktemp -d)"
          if [ -d src-tauri/gen/android ]; then
            while IFS= read -r f; do
              rel="${f#src-tauri/gen/android/}"
              mkdir -p "$OVERRIDES/$(dirname "$rel")"
              cp "$f" "$OVERRIDES/$rel"
            done < <(git ls-files src-tauri/gen/android)
            rm -rf src-tauri/gen/android
          fi

          npm run tauri -- android init

          if find "$OVERRIDES" -mindepth 1 -print -quit | grep -q .; then
            cp -R "$OVERRIDES/." src-tauri/gen/android/
          fi
          rm -rf "$OVERRIDES"
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018

      - name: Apply platform-baseline overrides (minSdk 30, jvmTarget 17)
        run: bash scripts/patch-android-build.sh

      - name: Build Android APK (x86_64 release, unsigned)
        # No `--debug`: the release profile is what sets `panic = "abort"`.
        run: npm run tauri -- android build --target x86_64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018

      - name: Sign the APK with a throwaway key
        # The emulator refuses an unsigned APK. The key lives and dies with
        # this job; `-P 16` matches `release.yml`'s signing step.
        shell: bash
        run: |
          set -euo pipefail
          src="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          if [ ! -f "$src" ]; then
            echo "::error::expected APK not found at $src"
            exit 1
          fi
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass android -keypass android \
            -alias smoke -keyalg RSA -keysize 2048 -validity 1 -dname "CN=agaric launch smoke"
          "$build_tools/zipalign" -P 16 -f 4 "$src" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign --ks "$RUNNER_TEMP/smoke.jks" --ks-key-alias smoke \
            --ks-pass pass:android --key-pass pass:android \
            --out "$RUNNER_TEMP/launch-smoke.apk" "$RUNNER_TEMP/aligned.apk"

      - name: Enable KVM
        # Hardware acceleration on the hosted runner, as the emulator action documents.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch the APK on an emulator
        # No AVD cache: it would be read once a week, and `.github/AGENTS.md`
        # § Caches says a weekly reader finds the entry evicted.
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          emulator-boot-timeout: 300
          script: node scripts/android-launch-smoke.mjs "$RUNNER_TEMP/launch-smoke.apk"
