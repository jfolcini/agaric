name: Commit regenerated Gradle verification metadata

# When CI's Android build fails Gradle dependency verification on a pull
# request, the android-build job regenerates
# src-tauri/gen/android/gradle/verification-metadata.xml under its read-only
# token and uploads it as the `gradle-verification-metadata` artifact. This
# workflow commits that one file to the PR branch.
#
# It is split from the build on purpose: the job that runs the PR's code and
# its new dependencies never holds a write token, and this one, which does,
# never checks the PR branch out: it accepts the artifact only as a well-formed
# Gradle verification file and commits it through the GitHub API
# (scripts/commit-via-api.sh, from the default branch), for branches of this
# repository (never a fork). A commit made with GITHUB_TOKEN starts no CI run,
# which is the point:
# the new hashes are trusted on first use, so the PR comment asks a person to
# review them and then reopen the PR (or push) to run CI against them.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- never checks out the PR branch: it commits one validated data file through the API, for same-repo branches only
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  commit:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # download the artifact from the CI run
      contents: write # push the regenerated file
      pull-requests: write # tell the PR
    steps:
      - name: Download the regenerated metadata, if CI made one
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/regenerated"
          if gh run download "$RUN_ID" --repo "$REPO" --name gradle-verification-metadata --dir "$dir" 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No gradle-verification-metadata artifact on run $RUN_ID; nothing to commit."
          fi

      - name: Check out the default branch (the script this job runs)
        if: steps.download.outputs.found == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Commit it to the PR branch
        if: steps.download.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/regenerated/verification-metadata.xml"
          dest="src-tauri/gen/android/gradle/verification-metadata.xml"
          # The artifact came from a job that ran PR code: accept it only as a
          # well-formed Gradle verification file.
          python3 -I -c 'import sys, xml.dom.minidom as m; d = m.parse(sys.argv[1]); sys.exit(d.documentElement.tagName != "verification-metadata")' "$src"
          out="$RUNNER_TEMP/out"
          mkdir -p "$out/$(dirname "$dest")"
          cp "$src" "$out/$dest"
          message="$(printf '%s\n\n%s' 'build(android): regenerate Gradle dependency verification metadata' "From the CI run on $HEAD_SHA, which failed Gradle dependency verification.")"
          commit="$(bash scripts/commit-via-api.sh "$BRANCH" "$HEAD_SHA" "$message" "$out" "$dest")"
          [ -n "$commit" ] || exit 0
          pr="$(gh pr list --repo "$REPO" --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "$REPO" --body "CI's Android build failed Gradle dependency verification, so I regenerated \`src-tauri/gen/android/gradle/verification-metadata.xml\` and committed it to this branch. Those hashes are trusted on first use: review the diff (new or changed artifacts should match the dependency bump), then reopen this PR or push to run CI against them."
          fi
