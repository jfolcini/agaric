version: 2

# Dependabot keeps three ecosystems fresh on a single weekly cadence:
#
#   1. github-actions  — SHA-pinned action references in `.github/workflows/`
#                        (workflows pin to a 40-char commit SHA + a `# vX`
#                        comment per the PEND-37 security baseline; without
#                        this entry SHA-pinning becomes "pin once and
#                        forget", which is almost worse than tag-floating
#                        because security fixes never reach us).
#   2. npm            — `package.json` / `package-lock.json` at the repo root.
#   3. cargo          — `src-tauri/Cargo.toml` / `Cargo.lock` (Tauri workspace).
#
# Cadence: every Monday. A single weekday batch is easier to triage
# than a trickle across the week, and Monday-AM lines the PRs up before
# the maintainer's review window.
#
# Per-ecosystem PR caps (open-pull-requests-limit) keep the inbox
# manageable. Grouping rules below collapse the long tail of coupled
# updates (Tauri stack, React stack, TipTap, Radix, sqlx, tokio,
# tracing, rustls, serde, etc.) into single PRs so we get ≈8-10 PRs/
# week per ecosystem instead of one per transitive dep. Coupled-dep
# rules are sourced from AGENTS.md § "Coupled Dependency Updates".
#
# Majors and grouping — read this before assuming a major arrives alone.
# A `groups:` entry that omits `update-types` takes **every** level,
# majors included. That is Dependabot's default, not an oversight, and
# this repo has the receipts: PR #3401 carried jsdom 29.1.1 -> 30.0.1
# *inside* the `vitest` group, which sets no `update-types`. So
# `tauri-apps`, `react`, `tiptap`, `radix-ui`, `vitest`, `playwright`,
# `lint-and-build` (npm) and the cargo stack groups all group majors too.
#
# Only a group that says otherwise narrows the range. Two do, and they
# are the `*` catch-alls named `minor-and-patch`: a major matching no
# earlier pattern falls out of them and lands as its own PR. That is the
# review isolation this file actually buys — for unlisted deps, not for
# everything.
#
# `codeql-action` and `stryker` spell all three levels out explicitly.
# That is a no-op against the default and deliberately so: their members
# pin each other at an EXACT version, so a split major fails `npm ci` or
# the action resolver before any test runs, and the property is too
# load-bearing to leave resting on a default nobody can see in the file.
# See each group's own comment.
#
# Grouping and SECURITY updates — the other default that is easy to miss.
# A `groups:` entry with no `applies-to` covers `version-updates` ONLY.
# Every group in this file was in that state until #4351, which means a
# CVE against a single member of an EXACT-PIN group would arrive as a solo
# security PR and hit the very install failure the group exists to
# prevent — on the path that arrives unannounced and under time pressure.
# Five groups are exact-pin and now carry a `*-security` mirror alongside
# them: `codeql-action` (github-actions), `stryker`, `tiptap` and `vitest`
# (npm), and `iroh` (cargo). Each pair MUST be edited together; Dependabot
# cannot serve both paths from one entry, so the duplication is by design.
#
# `iroh` needed BOTH halves rather than just the mirror: `iroh`,
# `iroh-base` and `iroh-dns` are pinned at an exact `=1.0.3` across
# `agaric-sync` and `agaric-store` and pin each other in the same sense,
# but they were in no group at all — they fell into the cargo
# `minor-and-patch` catch-all, whose `update-types` would additionally have
# split a major. So the version-updates group is the fix and the security
# mirror is what keeps it from being bypassed by a CVE.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(actions)
    labels:
      - dependencies
      - github-actions
    groups:
      # codeql-action's init / analyze / upload-sarif sub-actions refuse to
      # mix versions within one workflow run ("Loaded a configuration file
      # for version 'X', but running version 'Y'"), so split bumps fail
      # their own PR CI (#2377 / #2378). Bump them as one PR. Majors are
      # included on purpose: a version skew breaks CI either way, so even
      # a major must move all sub-actions at once.
      codeql-action:
        patterns:
          - github/codeql-action*
        update-types:
          - major
          - minor
          - patch
      # ── SECURITY MIRROR of `codeql-action` above (#4351). EDIT THE TWO
      # TOGETHER. ────────────────────────────────────────────────────────
      # A `groups:` entry with no `applies-to` defaults to
      # `version-updates`, so the group above covers Monday's scheduled
      # bumps and NOTHING ELSE — a CVE filed against one sub-action alone
      # would open a SOLO security PR and hit the exact version-skew
      # failure the group exists to prevent. Dependabot cannot serve both
      # paths from one entry (`applies-to` takes a single value), so the
      # duplication is by design, not an oversight.
      #
      # The security path is the one that arrives unannounced and under
      # time pressure, which makes leaving it uncovered the wrong way
      # round. No `update-types` here: Dependabot documents that option as
      # affecting VERSION updates only, so carrying it across would be
      # dead config that reads like a constraint.
      codeql-action-security:
        applies-to: security-updates
        patterns:
          - github/codeql-action*

  # ─── npm (frontend) ────────────────────────────────────────────────
  #
  # Grouping rationale (AGENTS.md § Coupled Dependency Updates):
  #   • tauri-apps  — every `@tauri-apps/*` package ships in lockstep
  #                   with the Cargo `tauri-*` crates; mixing JS-side
  #                   and Rust-side versions breaks IPC.
  #   • react       — React core + types + the Vite plugin must agree
  #                   on a major; partial bumps wedge the type system.
  #   • tiptap      — every `@tiptap/*` package must sit on the exact
  #                   same version (currently 3.22.4); the editor
  #                   silently misbehaves on mixed versions.
  #   • radix-ui    — `@radix-ui/*` primitives are API-compatible
  #                   within a major; never mix majors.
  #   • vitest      — runner + matchers + DOM env must agree.
  #   • playwright  — `@playwright/test` and the `playwright` runtime
  #                   ship as a pair.
  #   • lint-and-build — oxlint, oxfmt, typescript, vite, tslib — bumping
  #                   these together avoids tsc/oxc rule churn
  #                   landing across multiple PRs in the same week.
  #   • minor-and-patch — catch-all for everything else; majors stay
  #                   individual PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Cooldown (#816): hold every npm update for 7 days after publish
    # before opening a PR. audit-signatures is warn-only and would not
    # block a freshly-compromised release that lands in Monday's grouped
    # batch; a one-week quarantine lets a malicious version be yanked /
    # flagged upstream before it ever reaches a PR here.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 8
    commit-message:
      prefix: chore(npm)
    labels:
      - dependencies
      - npm
    groups:
      tauri-apps:
        patterns:
          - '@tauri-apps/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - '@vitejs/plugin-react'
          - 'vite-plugin-*'
      tiptap:
        patterns:
          - '@tiptap/*'
      # ── SECURITY MIRROR of `tiptap` above (#4351). EDIT THE TWO TOGETHER. ──
      # Found by the #4351 audit ("does any other group's members pin each
      # other exactly?"), and they do: every `@tiptap/*` package
      # peer-depends on `@tiptap/core` / `@tiptap/pm` at an EXACT version,
      # not a range (`package-lock.json` — 44 such peer edges at 3.30.1),
      # which is the same shape as `stryker` below, only wider. A solo
      # security bump of one `@tiptap/*` package therefore fails `npm ci`
      # with ERESOLVE before any test runs.
      tiptap-security:
        applies-to: security-updates
        patterns:
          - '@tiptap/*'
      radix-ui:
        patterns:
          - '@radix-ui/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'vitest-axe'
          - 'happy-dom'
          - 'jsdom'
      # ── SECURITY MIRROR of `vitest` above (#4351). EDIT THE TWO TOGETHER. ──
      # Also found by the #4351 audit: `@vitest/coverage-v8` peer-depends on
      # `vitest` at an EXACT version (4.1.10), and `vitest` returns the
      # favour for every `@vitest/*` add-on. Both sides are inside this
      # group's own patterns, so a solo security bump of either splits an
      # exact pin — same `npm ci` ERESOLVE as `stryker` and `tiptap`.
      # (`jsdom` / `happy-dom` / `vitest-axe` ride along because the group
      # is the unit, exactly as they do for version updates.)
      vitest-security:
        applies-to: security-updates
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'vitest-axe'
          - 'happy-dom'
          - 'jsdom'
      playwright:
        patterns:
          - '@playwright/*'
          - 'playwright'
      lint-and-build:
        patterns:
          - 'oxlint'
          - 'oxfmt'
          - 'typescript'
          - 'vite'
          - 'tslib'
      # `@stryker-mutator/core` and `@stryker-mutator/vitest-runner` pin each
      # other at an EXACT peer version, not a range. A split bump therefore
      # produces a dependency set that cannot install at all: each PR alone
      # fails `npm ci` with ERESOLVE before a single test, lint rule or
      # Playwright spec runs, so eight unrelated-looking checks went red on
      # each (#4332 / #4333). Merging them independently would have broken
      # `npm ci` on main at whichever landed first, in either order.
      #
      # Majors are included on purpose, and are the case that needs it:
      # `minor-and-patch` below already groups the lesser bumps via its `*`
      # pattern, so 9.6.1 -> 10.0.0 was the one that escaped and split.
      stryker:
        patterns:
          - '@stryker-mutator/*'
        update-types:
          - major
          - minor
          - patch
      # ── SECURITY MIRROR of `stryker` above (#4351). EDIT THE TWO TOGETHER. ──
      # The group above is `version-updates` only (Dependabot's default when
      # `applies-to` is absent), so a CVE filed against
      # `@stryker-mutator/core` ALONE would open a solo security PR and hit
      # the exact `ERESOLVE` that made #4332 structurally unmergeable — the
      # failure #4350 opened the group to prevent. One entry cannot serve
      # both paths, so this duplication is by design.
      #
      # No `update-types`: Dependabot documents it as affecting VERSION
      # updates only. A security update is triggered by an advisory, not by
      # a semver level, so listing them here would be inert config that
      # reads like a constraint.
      stryker-security:
        applies-to: security-updates
        patterns:
          - '@stryker-mutator/*'
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # ─── cargo (src-tauri workspace) ───────────────────────────────────
  #
  # Grouping rationale (AGENTS.md § Coupled Dependency Updates):
  #   • tauri      — `tauri`, `tauri-build`, every `tauri-plugin-*`,
  #                   and `tauri-utils` must share a major. Mixed
  #                   versions break the IPC ABI.
  #   • sqlx       — `sqlx` + `sqlx-cli` move together; the `.sqlx/`
  #                   offline cache regenerates on the next prepare.
  #   • tokio      — `tokio` + every `tokio-*` adapter (rustls,
  #                   tungstenite, etc.) must agree on a major.
  #   • loro       — `loro` + `loro-*` ship as a CRDT engine bundle.
  #   • tracing    — `tracing` + `tracing-subscriber` + `tracing-
  #                   appender` move together.
  #   • rustls     — the rustls stack: `rustls`, `rustls-*`,
  #                   `tokio-rustls`, `webpki-roots`. The repo runs
  #                   rustls-everywhere (MAINT-91); mixing rustls
  #                   majors fragments the TLS stack.
  #   • serde      — `serde`, `serde_json`, `serde_with` derive +
  #                   runtime must align on a serde major.
  #   • chrono     — `chrono` + `chrono-tz` (timezone data table is
  #                   tied to a specific chrono major).
  #   • minor-and-patch — catch-all for everything else; majors stay
  #                   individual PRs.
  #
  # Ignore rationale: `specta` and `tauri-specta` are intentionally
  # pinned to exact `=2.0.0-rc.24` (AGENTS.md § Coupled Dependency
  # Updates). Auto-bumping either crate regenerates `src/lib/
  # bindings.ts` with incompatible types and breaks the IPC surface.
  # Patch updates are also blocked because the rc.* line is not
  # semver-stable. The ignore covers every semver level explicitly.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    # Cooldown (#816): hold every cargo update for 7 days after publish
    # before opening a PR (same supply-chain quarantine rationale as the
    # npm ecosystem above — deny.toml locks sources to crates.io but does
    # not gate on release age).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 8
    commit-message:
      prefix: chore(cargo)
    labels:
      - dependencies
      - cargo
    groups:
      tauri:
        patterns:
          - 'tauri'
          - 'tauri-build'
          - 'tauri-plugin-*'
          - 'tauri-utils'
      sqlx:
        patterns:
          - 'sqlx'
          - 'sqlx-*'
      tokio:
        patterns:
          - 'tokio'
          - 'tokio-*'
      loro:
        patterns:
          - 'loro'
          - 'loro-*'
      tracing:
        patterns:
          - 'tracing'
          - 'tracing-*'
      rustls:
        patterns:
          - 'rustls'
          - 'rustls-*'
          - 'tokio-rustls'
          - 'webpki-roots'
      serde:
        patterns:
          - 'serde'
          - 'serde_json'
          - 'serde_with'
      chrono:
        patterns:
          - 'chrono'
          - 'chrono-tz'
      # #4351 — `iroh`, `iroh-base` and `iroh-dns` are pinned at an EXACT
      # `=1.0.3` (`agaric-sync/Cargo.toml:62,68`, `agaric-store/Cargo.toml:79`)
      # and pin each other in the same sense: moving one alone cannot resolve,
      # so an ungrouped bump is a guaranteed-failing PR. Without this entry they
      # fell into the `minor-and-patch` catch-all, which carries `update-types`
      # and so would have split a major.
      #
      # EDIT THE TWO TOGETHER — see `iroh-security` below.
      iroh:
        patterns:
          - 'iroh'
          - 'iroh-*'
      # The security-updates half. A `groups:` entry with no `applies-to`
      # covers version-updates ONLY, so without this a CVE against one iroh
      # crate would arrive as a solo PR and hit the exact resolution failure
      # the group above exists to prevent — on the path that arrives
      # unannounced and under time pressure. No `update-types`: it is inert on
      # the security path (GitHub's own reference says so), and carrying it
      # would read as a constraint that is not one.
      iroh-security:
        applies-to: security-updates
        patterns:
          - 'iroh'
          - 'iroh-*'
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: 'specta'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      - dependency-name: 'tauri-specta'
        update-types:
          - 'version-update:semver-patch'
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      # loro is held at 1.13.6 (#3161). 1.13.7 makes find_common_ancestor
      # (loro-internal/src/dag.rs) quadratic in document history once the
      # frontier is wider than one: measured 215x at 1000 rounds, with a
      # diverging growth curve — 1.13.6 is linear, 1.13.7 is not. That is the
      # ordinary one-user-two-devices shape, so it is reachable in production.
      #
      # This ignore exists because the hold was otherwise ONLY the lockfile:
      # Cargo.toml carries a caret `loro = "1.12"`, which 1.13.7 satisfies, so
      # any `cargo update` would lift it silently. Worse, our own regression
      # test can no longer catch it — #3187 narrowed the frontier to width 1,
      # which hits dag.rs's `left.len() <= 1 && right.len() == 1` fast path
      # and measures at parity. The detector is gone; the defect is not.
      #
      # Do not remove without a width-2 measurement showing 1.13.6 parity.
      # 1.13.7 is still the newest on crates.io and the suspect commit is
      # untouched upstream, so there is nothing newer to move to.
      - dependency-name: 'loro'
      - dependency-name: 'loro-*'

  # Fuzz crate (#2734). `src-tauri/fuzz` is its OWN workspace (excluded from
  # `src-tauri/Cargo.toml` members = [".", "agaric-core", "agaric-store",
  # "diagnostics"]) with an independent `Cargo.lock`, so the `/src-tauri`
  # entry above does not resolve or update it — and neither the blocking
  # `cargo audit` step nor `deny.toml` (both `working-directory: src-tauri`)
  # covers it. Its libFuzzer deps are compiled and run monthly in
  # scheduled-deep-checks.yml, so they need the same cooldown-quarantined
  # update signal as every other lockfile. Small dep set (libfuzzer-sys,
  # arbitrary, the parent crate as a path dep) → one catch-all group.
  #
  # `versioning-strategy: lockfile-only` is load-bearing, not a style choice
  # (#3432). The fuzz crate takes FOUR *path* deps — `agaric` (`..`),
  # `agaric-store`, `agaric-sync`, `agaric-engine` — so Dependabot fetches
  # each of those manifests too and treats every dep declared in them
  # (rmcp, mdns-sd, …) as an in-scope DIRECT dep of this entry. Under the
  # cargo default (`increase-if-necessary`) a bump whose new version does not
  # satisfy the parent's requirement makes Dependabot EDIT the shared
  # `src-tauri/Cargo.toml` while regenerating only `fuzz/Cargo.lock` — which
  # is exactly how #3432 shipped `rmcp` `^2.0` → `^3.0` (a breaking major
  # needing an `rmcp_adapter.rs` port) inside a PR titled as confined to
  # `/src-tauri/fuzz`, with `src-tauri/Cargo.lock` left pinned at 2.2.0 so
  # `--locked` builds broke. `lockfile-only` = "Only create pull requests to
  # update lockfiles. Ignore any new versions that would require package
  # manifest changes", and cargo implements it by refusing to unlock
  # requirements at all (dependabot-core `cargo/update_checker.rb`:
  # `requirements_unlocked_or_can_be?` → false). So this entry can now only
  # ever produce a `src-tauri/fuzz/Cargo.lock`-only diff.
  #
  # What we keep: the entry's actual purpose — refreshing the fuzz lock for
  # versions the manifests already allow (e.g. a patch bugfix inside the
  # caret/tilde range a parent manifest already declares — the mdns-sd
  # 0.20.2 → 0.20.3 bump under `mdns-sd = "0.20"` was the motivating case;
  # both manifests have since moved to "0.21"). What we give up: a
  # libfuzzer-sys `0.4` → `0.5` bump would need editing
  # `src-tauri/fuzz/Cargo.toml` and so is now skipped here. That is an
  # acceptable trade: libfuzzer-sys majors are coupled to the cargo-fuzz CLI
  # version and need a hand-written migration anyway.
  #
  # Rejected alternatives: `allow: [dependency-type: indirect]` does NOT help
  # (rmcp/mdns-sd are parsed as *direct* — they are declared in a manifest
  # Dependabot fetched); an explicit `allow` name list would have to
  # enumerate every parent-crate dep and silently rot as that list grows.
  - package-ecosystem: cargo
    directory: /src-tauri/fuzz
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 8
    commit-message:
      prefix: chore(cargo)
    labels:
      - dependencies
      - cargo
    groups:
      fuzz:
        patterns:
          - '*'
    # The fuzz workspace has an independent lockfile, so the root cargo
    # entry's Loro hold above does not protect it. Keep fuzzing on the same
    # production dependency line until #3161's width-2 regression is cleared.
    ignore:
      - dependency-name: 'loro'
      - dependency-name: 'loro-*'
