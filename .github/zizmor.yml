# zizmor configuration — security audit for GitHub Actions workflows.
# https://docs.zizmor.sh/configuration/
#
# This file is a BASELINE: it suppresses every finding zizmor reports
# today so the hook only catches *new* findings going forward. Existing
# findings are tracked as MAINT items in REVIEW-LATER.md and should be
# triaged off the baseline over time — fix the underlying issue (or
# document why it's safe in the threat-model sense), then drop the
# matching entry from this file.
#
# Triage progress (closed entries appear elsewhere, not here):
#   - template-injection × 6 — closed: workflow inputs are routed through
#     `env:` + `$INPUT_*` instead of being interpolated directly into
#     `run:` scripts.
#   - artipacked × 6 — closed: every checkout across .github/workflows/
#     passes `persist-credentials: false` (verified by grep — there is no
#     longer any checkout that keeps credentials for a tag push).
#   - excessive-permissions × 1 — closed: release.yml uses workflow-level
#     `contents: read` with per-job `contents: write` scoped only to the
#     jobs that actually push.
#
# Threat-model context (AGENTS.md): Agaric is single-user, no cloud,
# no adversarial peers.
#
# ─── WHY THE cache-poisoning HISTORY LIVES UP HERE ────────────────────────
#
# It used to sit inline above `ignore:`, and it grew until `check-yaml`
# rejected the whole file: "too many consecutive comments before resolving
# collection entry". MEASURED against the parser CI actually runs (prek
# 0.4.11's Rust check-yaml, binary-searched): the limit is **32 comment lines
# inside a block before its collection entry resolves**, that block had 42,
# and BLANK LINES DO NOT RESET THE COUNT — which is why an earlier fix that
# broke the run into paragraphs passed locally and still failed in CI.
# Document-level comments, i.e. these, are not counted at all. So the
# narrative lives here and only the operating procedure stays inline.
#
# (The local/CI split is its own trap: CI installs `prek@latest` while a
# developer has whatever they installed — 0.3.8 locally accepted the file
# 0.4.11 rejects.)
#
# ─── cache-poisoning baseline history ────────────────────────────────────
#
# Re-anchored 2026-07-16 (#2736). The previous baseline pinned to
# ci.yml/release.yml line numbers from 2026-05 that had since drifted onto
# unrelated content (comment blocks, the AppImage verify step), and two `:3`
# entries silently anchored on the `on:` block, acting as blanket file-wide
# suppressions of the whole rule.
#
# Narrowed 2026-08-07 (#3542) from 9 entries to 6. The three release.yml
# entries (`:1039`, `:1071`, `:1330`) covered the caches in
# `android-build-and-release` and `generate-vex`. Those two jobs SIGN, ATTEST
# and UPLOAD published artefacts, so the underlying findings were FIXED rather
# than re-anchored: the `Swatinem/rust-cache` step was deleted outright and
# both `actions/setup-node` steps now pass `package-manager-cache: false`
# (which also covers setup-node v7's enabled-by-default npm cache, not just an
# explicit `cache: npm`). The anchors were then removed instead of being left
# behind — a dead anchor is not inert, it is a landmine: it silently
# re-attaches to whatever content drifts onto that line, which is exactly how
# the `:3` entries above became blanket file-wide suppressions.
#
# Narrowed again 2026-08-08 (#3573), from 6 entries to 4. The desktop
# `build-and-release` matrix is now cache-free too: its restore-only Rust
# cache was deleted and setup-node explicitly disables its automatic npm
# cache. Every release lane that builds, signs, attests or uploads an artefact
# is therefore cache-free. Verified with an empty ignore list: exactly the four
# ci.yml findings below fire, with none in release.yml.
#
# Re-anchored 2026-08-09 (#3672), +18 lines each: `273/296/426/458` →
# `291/314/444/476`. No cache step moved and none was added — the comment block
# above ci.yml's `concurrency:` grew by eighteen lines and every anchor below
# it drifted, turning four suppressed findings into four `high` failures on a
# diff that touched no cache at all. Re-derived by the procedure below and then
# checked line-for-line: each new anchor names the same `Swatinem/rust-cache` /
# `actions/setup-node` step as the old one, and the count is still four. That
# check is the point — re-anchoring blind is how a dead anchor becomes a
# blanket file-wide suppression. The line-anchoring itself is #3737.
#
# Re-anchored 2026-08-13 (#3847 follow-up), +10 lines each:
# `291/314/444/476` → `301/324/454/486`. Same cause as #3672 and the same
# non-cause: no cache step moved and none was added — a ten-line comment was
# added above ci.yml's `android_re`, explaining why that trigger had gone
# stale, and every anchor below it drifted. Re-derived by the procedure below
# (ignore list emptied, four findings, same two step types in the same order)
# and checked line-for-line before committing.
#
# Re-anchored again the same day (#3849 review follow-up), +12 each:
# `301/324/454/486` -> `313/336/466/498`. Same cause a third time — the
# `android_re` comment block grew while repairing the trigger itself.
#
# THREE times in one day, every time from an unrelated comment edit high in
# ci.yml, and every time turning four suppressed findings into four `high`
# failures on a diff that touches no cache step. Same count, same two step
# types, same order on each re-derivation. That is the argument for #3737:
# a line number is a poor key for "this specific step", and the procedure
# below is a workaround for the key, not a fix.

rules:
  cache-poisoning:
    # PROCEDURE (history and rationale: file header above). These are LINE
    # ANCHORS, so any edit that adds or removes lines in ci.yml above a cache
    # step silently invalidates them. Never edit the numbers blind: re-run
    # `zizmor` with this ignore list EMPTIED, take the lines it reports, and
    # check line-for-line that each new anchor names the same cache step as
    # the old one and that the count is unchanged. A dead anchor is not
    # inert — it re-attaches to whatever drifts onto that line and becomes a
    # blanket suppression.
    #
    # Keep this block under 32 comment lines; see the file header.
    ignore:
      - ci.yml:313
      - ci.yml:336
      - ci.yml:466
      - ci.yml:498
  # unpinned-uses: empty — closed 2026-05-16 by SHA-pinning every
  # `uses: org/action@vX` reference across _validate.yml, ci.yml, and
  # release.yml to a 40-char commit SHA + `# vX` comment. Dependabot
  # (.github/dependabot.yml) opens weekly PRs to bump SHAs when new
  # release tags land. Any *new* unpinned reference will now fire, as
  # intended for a baseline-then-tighten workflow.
