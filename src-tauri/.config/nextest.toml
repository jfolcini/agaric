# cargo-nextest configuration
# See https://nexte.st/book/configuration.html

# Named setup-script tables have been supported since nextest 0.9.98; setup scripts
# pass environment variables to matching test children through $NEXTEST_ENV:
# https://nexte.st/docs/configuration/setup-scripts/
# https://github.com/nextest-rs/nextest/releases/tag/cargo-nextest-0.9.98
#
# nextest 0.9.131 added an environment map to wrapper commands
# (https://nexte.st/changelog/#cargo-nextest-0-9-131), but using it here would still
# require a wrapper executable such as POSIX-only `env` to launch the test binary.
# Platform-specific setup scripts avoid that portability trap while keeping the
# environment scoped to the two combined guard/control test children. Guard 1 depends
# on this today; Guard 2's current relay path calls the injected resolver directly, but
# carries the same bypass so an upstream move to a proxyable path cannot silently make
# it vacuous. The scripts use the standard wildcard value so every current or future
# hostname remains observable.
nextest-version = "0.9.98"
experimental = ["setup-scripts"]

[scripts.setup.iroh-no-proxy-unix]
command = ["bash", "scripts/nextest-iroh-no-proxy.sh"]

[scripts.setup.iroh-no-proxy-windows]
command = ["powershell.exe", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/nextest-iroh-no-proxy.ps1"]

[profile.default]
# Fail-fast disabled: run all tests even if some fail
fail-fast = false
# Retry flaky tests once before reporting failure
retries = 1
# Generous per-test timeout (DB-backed tests may be slow on cold cache)
slow-timeout = { period = "30s", terminate-after = 2 }
# PEND-41 R25 — wait this long for subprocess cleanup before flagging a leak.
# sync_daemon tests spawn TCP listeners that occasionally need a moment to
# release sockets; 30s is generous enough to avoid false-positive leak reports.
leak-timeout = "30s"

# The two LAN-only DNS guards each contain their permissive control in the same test
# outcome. Bypass ambient proxies only for those exact children so each control must
# issue an observable lookup before its guard is allowed to pass. Both uppercase and
# lowercase variables are intentional: proxy implementations differ on which spelling
# they honor. The wildcard is also intentional: Guard 1 asserts that *no* hostname was
# queried, so a suffix allowlist would make an unknown future hostname unobservable.
[[profile.default.scripts]]
filter = 'binary_id(agaric-sync) and test(=transport::endpoint::tests::lan_only_endpoint_resolves_no_hostnames)'
platform = { host = 'cfg(unix)' }
setup = "iroh-no-proxy-unix"

[[profile.default.scripts]]
filter = 'binary_id(agaric-sync) and test(=transport::endpoint::tests::lan_only_endpoint_never_looks_for_a_relay)'
platform = { host = 'cfg(unix)' }
setup = "iroh-no-proxy-unix"

[[profile.default.scripts]]
filter = 'binary_id(agaric-sync) and test(=transport::endpoint::tests::lan_only_endpoint_resolves_no_hostnames)'
platform = { host = 'cfg(windows)' }
setup = "iroh-no-proxy-windows"

[[profile.default.scripts]]
filter = 'binary_id(agaric-sync) and test(=transport::endpoint::tests::lan_only_endpoint_never_looks_for_a_relay)'
platform = { host = 'cfg(windows)' }
setup = "iroh-no-proxy-windows"

# Headroom for the suite's heaviest DB-bound tests so full-suite CPU contention
# can't push them past the global 2×30s=60s terminate window and kill them on the
# first attempt — which surfaces as a spurious "flaky" (TRY 1 terminated, retry
# passes). These tests are correct and deterministic and have no internal
# wall-clock assertions; they're just slow by construction, so the fix is a longer
# leash (4×30s=120s), not trimming their coverage. Found while shipping #1987.
#
#   * apply_reproject_proptest::{b2,b3,b4} (#1683) — drive dozens of generated
#     op-chains through the full engine→SQL reprojection pipeline (a Loro engine +
#     DB pools per case); B4 runs ~30s even alone.
#   (#3612 dropped perf26_draft_recovery_at_10k_ops from this list. Its ~50s was
#   never its own subject: the fixture seeded 10K ops via `append_local_op_in_tx`,
#   which does not materialize them, so `recover_at_boot`'s Step 1.5 boot replay
#   drained all 10K through the Materializer/Loro apply pipeline before draft
#   recovery was reached — 98.6% of the runtime, none of it the block-scoped
#   op_log lookup the test guards. The fixture now marks those ops materialized;
#   measured 39.76s -> 0.72s total, ~40× under the 30s SLOW threshold, so it
#   needs no leash in either profile.)
#   * replay_streams_all_rows_across_multiple_chunks_1574 — drives 205 full
#     import_and_project rounds (one per seeded inbox row, spanning 2 replay
#     chunks); ~50s alone on a dev box, so full-suite CPU contention pushes it
#     past the 60s kill on the first attempt.
#   * issue611_oversized_loro_snapshot_syncs_via_chunked_wire_path — pushes an
#     oversized Loro snapshot through the full chunked-wire catch-up path
#     (>30s under the full suite). It carried NO timeout override, so under the
#     `cargo-coverage` build's llvm-cov instrumentation (2-3× slower) it could
#     terminate on the first attempt and DROP the coverage of the large
#     snapshot-transfer path it exercises — a spurious `cargo-coverage` ratchet
#     failure whose likelihood shifts with nextest's per-run partition layout.
#     Give it (and `replay_streams`, previously only covered in the default
#     profile) the same extended leash under CI so coverage is stable.
#   * dag::proptest_b2::find_lca_terminates_on_any_graph (#3532) — drives an
#     adversarial-graph strategy through LCA search. Measured 14.5s / 12.8s /
#     18.3s in three targeted foreground repeats on an unloaded box, against the
#     default 2×30s=60s window; at ~15s nominal a 2× contention slowdown
#     terminates TRY 1, which surfaces as a spurious "flaky" (observed FLAKY 2/2
#     in a full-suite run at load 39, TRY 2 passing at 36.5s). Its slow peers
#     above were given overrides and this one was not — no reason in its content,
#     it just never happened to be noticed.
#   * loro::engine_proptest::n_way::n_way_concurrent_mixed_streams_all_to_all_converges
#     (#4474) — same shape, same omission: 3..=5 peers each run an independent
#     mixed-op stream through an all-to-all snapshot sweep. Measured 15.2s
#     nominal against the same 2×30s=60s window, and observed TMT at 60.021s in
#     a full-workspace run.
[[profile.default.overrides]]
filter = 'test(/apply_reproject_proptest::/) | test(/replay_streams_all_rows_across_multiple_chunks_1574/) | test(/issue611_oversized_loro_snapshot_syncs_via_chunked_wire_path/) | test(/find_lca_terminates_on_any_graph/) | test(/n_way_concurrent_mixed_streams_all_to_all_converges/)'
slow-timeout = { period = "30s", terminate-after = 4 }

# The weekly deep-checks lane (#4282). `scheduled-deep-checks.yml`'s `bench-slo`
# job runs `cargo nextest run --workspace --run-ignored=only` with NO
# `--profile`, so every `#[ignore]`d test in the workspace inherits the
# `profile.default` window above it: flagged SLOW at 30s, TERMINATED at
# 2x30s = 60s. For most of that lane the kill is a backstop worth having. For
# the three `..._residency_at_*_blocks_4242` measurement tests
# (`agaric-store`, `cache::tests`) it is pure downside: their gate is an
# equality assertion — the post-#4242 streamed fold against a faithful copy of
# the pre-#4242 buffered one — and the peak-RSS figures they print are not
# bounded by anything. A termination there cannot catch a regression; it can
# only lose the diagnostic and redden the lane on runner noise. The 100k point
# seeds a 100,000-block vault through 400 chunked INSERTs, the most I/O-bound
# work in the lane.
#
# Measured, not assumed. All four of the lane's block-links tests run together
# under nextest on one 16-core dev box at load ~4, two runs: 20k 1.02s / 1.02s,
# 50k 2.52s / 2.22s, 100k 4.51s / 4.29s. Serialised on the same box: 0.93s /
# 2.18s / 4.14s, ~7.2s for the trio, reproducing the "~7s total weekly cost"
# recorded in the tests' module comment. Against the 60s kill that is ~13x on
# the worst point — but on a dev box, not a shared runner, and the sibling
# sweep's doc comment argues a 4-7x shared-runner slowdown is plausible for
# this lane. That would put the 100k point at 18-32s: over the 30s SLOW flag
# at the top of the range and within reach of the kill. Hence the leash.
#
# 4x30s = 120s, the same shape as the entry above. Note what it does NOT
# change: the 30s SLOW *flag* still fires, so a lane that starts drifting is
# still visible in the run output. The leash removes the spurious kill, not
# the warning.
#
# `block_links_unresolved_oracle_scale_sweep_4241` runs in the same lane, under
# the same 60s window, and is deliberately NOT listed here. It asserts no
# wall-clock bound either, but for it termination IS the assertion: the O(n^2)
# defect it guards against was measured at 142.3s wall against a 4.1s clean
# run, and being killed is the only way it reddens the lane. Leashing it to
# 120s would cut that margin from 2.4x to 1.19x. See its doc comment in
# `src/reconciliation_oracle/tests.rs`.
#
# `profile.default` only, on purpose: `--run-ignored=only` is passed by
# `bench-slo` alone, and that lane passes no `--profile`. The three
# `--profile ci` invocations (deep-checks `full-suite`, `_validate.yml`'s
# `cargo llvm-cov nextest` shards, and its `--features ci-smoke` UDS
# roundtrip) do not run ignored tests at all, so a
# `profile.ci` twin of this entry would match nothing. That is the opposite of
# the four tests above, which are not `#[ignore]`d and so need both.
[[profile.default.overrides]]
filter = 'test(/rebuild_block_links_unresolved_residency_at_.*_blocks_4242/)'
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
fail-fast = false
retries = 2
slow-timeout = { period = "60s", terminate-after = 2 }
leak-timeout = "30s"

# Same headroom in CI (3×60s=180s) — see the default-profile override above.
# Every test flagged SLOW (>30s) in a full-suite sweep is listed here so the
# llvm-cov `cargo-coverage` build (2-3× slower) can never terminate one on the
# first attempt and lose its coverage: apply_reproject_proptest,
# replay_streams_all_rows…_1574,
# issue611_oversized_loro_snapshot_syncs_via_chunked_wire_path,
# find_lca_terminates_on_any_graph, and
# n_way_concurrent_mixed_streams_all_to_all_converges (#4474).
# (perf26_draft_recovery dropped in #3612 — see the default-profile note above:
# it runs in ~0.7s now, so even a 3× coverage build stays far under 30s.)
[[profile.ci.overrides]]
filter = 'test(/apply_reproject_proptest::/) | test(/replay_streams_all_rows_across_multiple_chunks_1574/) | test(/issue611_oversized_loro_snapshot_syncs_via_chunked_wire_path/) | test(/find_lca_terminates_on_any_graph/) | test(/n_way_concurrent_mixed_streams_all_to_all_converges/)'
slow-timeout = { period = "60s", terminate-after = 3 }

# The SQL-only-fallback / reproject / recompute observability counters
# (`agaric_engine::apply::sql_only_fallback` and the coordinator's
# `reproject_call_spy` / `recompute_call_spy`) are process-global monotonic
# statics. The convergence / hydration / scaling handler tests assert on
# before/after counter DELTAS, which are only valid if no *other* test in the
# same process increments the same counter between the two reads. Under
# nextest's default all-core parallelism a sibling test in this set could
# corrupt a peer's delta (~1-2 spurious "flaky" reports per full-suite run,
# always passing on retry and in isolation). Pin the whole delta-asserting set
# to a single-threaded test-group so each measures its counter window in
# isolation; nextest keeps the other cores busy with ungrouped tests, so
# serialising just this DB-heavy subset costs little wall-clock. (The slow
# `apply_reproject_proptest` cases also carry the longer slow-timeout above —
# override settings from both entries layer.)
#
# ------------------------------------------------------------------------
# OPEN QUESTION (#3959) — the paragraph above cannot be the whole story.
#
# Its mechanism is stated in same-process terms ("no *other* test in the same
# process", "a sibling test in this set could corrupt a peer's delta"). That
# cannot happen under nextest: nextest "executes each individual test in a
# separate process" (nexte.st, *How nextest works*) for every test, grouped or
# not, so each test sees its own copy of a process-global static and no
# sibling can move it between the two reads. `max-threads = 1` is a
# concurrency semaphore over the group's members — it serialises them; it does
# not grant process isolation that nextest already provides. The corrected
# statement of the mechanism now lives in the module docs of
# `agaric-engine/src/loro/shared.rs` (the canonical statement, #3983); the
# delta-asserting files themselves (e.g.
# `src/materializer/handlers/tag_convergence_tests.rs`) carry only a
# one-line pointer back to `shared.rs`, not a restatement, and those files
# cite THIS file only for the fact of the pin, never for the reason.
#
# What is NOT explained, and is deliberately not guessed at here: the symptom
# was measured, not theorised. The group was introduced in b51d1ddb0
# (#2857 / #2621, "serialize spy-counter tests"), reporting "~1-2 spurious
# 'flaky' per full-suite run, passing on retry and in isolation" — with
# `retries = 1` (default) / `retries = 2` (ci) above, "flaky" means a TRY 1
# failure that passed on retry. Something real was producing those retries;
# under the corrected mechanism, cross-test counter pollution is not it, and
# no replacement cause has been established. One adjacent data point, offered
# as a fact rather than an answer: the slow-timeout override note ~30 lines
# above documents a DIFFERENT, verified cause of spurious FLAKY for one member
# of this very set (`apply_reproject_proptest` — TRY 1 terminated by the
# slow-timeout under load, TRY 2 passing at 36.5s). Whether that generalises
# to the rest of the set is unverified.
#
# The entry is therefore left in place: it is cheap, it is not wrong as
# configuration, and removing it would discard a measured mitigation on the
# strength of a corrected explanation alone. Resolving this needs a run that
# reproduces the flakiness with the group removed and identifies the actual
# cause. Until then, treat this comment's original rationale as superseded and
# the underlying flakiness as unexplained.
# ------------------------------------------------------------------------
[test-groups.spy-counter-serial]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(/materializer::handlers::(apply_reproject_proptest|create_edit_convergence_tests|delete_restore_convergence_tests|import_scaling_tests|move_convergence_tests|space_hydration_tests|tag_convergence_tests)::/)'
test-group = 'spy-counter-serial'

[[profile.ci.overrides]]
filter = 'test(/materializer::handlers::(apply_reproject_proptest|create_edit_convergence_tests|delete_restore_convergence_tests|import_scaling_tests|move_convergence_tests|space_hydration_tests|tag_convergence_tests)::/)'
test-group = 'spy-counter-serial'
