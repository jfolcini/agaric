# cargo-deny configuration for Agaric
# Docs: https://embarkstudios.github.io/cargo-deny/

# No `targets`: the graph is the whole Cargo.lock, the view `cargo audit`, OSV
# and Scorecard take, so one waiver list fits every scanner.
[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ── Advisories (RustSec) ────────────────────────────────────────────────────
#
# A waiver that matches nothing fails the check, so it goes the first run after
# its advisory is withdrawn or its crate is patched or dropped. The nightly deep
# checks run this on main, so that happens even when no dependency changed.
# `.cargo/audit.toml` and the `osv-scanner.toml` files are generated from this
# list: run `node scripts/sync-audit-from-deny.mjs` after editing it. Each
# reason becomes a release's VEX impact statement (scripts/generate-vex.mjs).
[advisories]
unused-ignored-advisory = "deny"
# Transitive unsound crates too: OSV and Scorecard report them.
unsound = "all"
ignore = [
    # Tauri transitive unmaintained crates
    { id = "RUSTSEC-2024-0370", reason = "Tauri transitive dep: proc-macro-error" },
    { id = "RUSTSEC-2024-0436", reason = "Tauri transitive dep: paste (via serde_with, specta)" },
    # zbus 5.x folded zvariant, zvariant_derive and zbus_names into itself; the
    # standalone crates are marked unmaintained. zbus 5.14 reaches us through
    # notify-rust, tauri-plugin-opener and tauri-plugin-single-instance, which
    # have not moved yet. Drops when those plugins release on the merged zbus.
    { id = "RUSTSEC-2026-0370", reason = "Tauri transitive dep: zvariant (via zbus 5.14; folded into zbus upstream)" },
    { id = "RUSTSEC-2026-0371", reason = "Tauri transitive dep: zbus_names (via zbus 5.14; folded into zbus upstream)" },
    { id = "RUSTSEC-2026-0372", reason = "Tauri transitive dep: zvariant_derive (via zbus 5.14; folded into zbus upstream)" },
    # glib 0.18 is the GTK3 binding wry uses on Linux; the fix (0.20) needs
    # Tauri's move off GTK3.
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18.5 VariantStrIter is unsound; glib 0.18 is the GTK3 binding wry needs on Linux, the fix (0.20) waits on Tauri leaving GTK3, and Agaric never iterates a GVariant string array" },
    # quick-xml <0.41 quadratic duplicate-attribute check (DoS-class, needs
    # attacker-controlled XML). Two remaining lock entries, both transitive
    # pins we cannot bump: quick-xml 0.39 (wayland-scanner ^0.39, its sole
    # consumer since plist 1.10 moved to the patched 0.41) and quick-xml 0.37
    # (tauri-winrt-notification, Windows-only) — none parse untrusted XML at
    # app runtime (build-time codegen and bundled-config parsing). The hard
    # blocker is wayland-scanner: its latest release (0.31.10) requires
    # `quick-xml ^0.39`, which caps below the patched 0.41 — so this cannot
    # drop until wayland-rs releases against >=0.41. Tracked in #2310.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39 (wayland-scanner ^0.39 hard cap) and 0.37 (Windows notify); no untrusted-XML runtime exposure; blocked on wayland-rs releasing against >=0.41 (#2310)" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml NsReader sibling advisory, same transitive pins and exposure analysis as RUSTSEC-2026-0194; removal tracked in #2310" },
    # Loro transitive unmaintained crate (atomic-polyfill via heapless → postcard → loro)
    { id = "RUSTSEC-2023-0089", reason = "Loro transitive dep: atomic-polyfill (via heapless → postcard)" },
    # Loro 1.13.6 depends on the archived `im` collection stack. There is no
    # patched `im`, `bitmaps`, or `sized-chunks` release; replacing them with
    # the maintained `imbl` family must happen upstream in Loro. Agaric cannot
    # lift its Loro pin until the width-2 history regression documented in
    # .github/dependabot.yml / #3161 is resolved. The separate `im::OrdSet`
    # unsoundness is not reachable through Loro 1.13.6: its production source
    # uses `im::HashMap` only (`im::HashSet` occurs only in Loro's tests), and
    # contains no `OrdSet` use.
    { id = "RUSTSEC-2026-0247", reason = "bitmaps is unmaintained with no patched release; transitive only through pinned Loro 1.13.6's im stack (#3161)" },
    { id = "RUSTSEC-2026-0248", reason = "im is unmaintained with no patched release; transitive only through pinned Loro 1.13.6 (#3161)" },
    { id = "RUSTSEC-2026-0251", reason = "sized-chunks is unmaintained with no patched release; transitive only through pinned Loro 1.13.6's im stack (#3161)" },
    { id = "RUSTSEC-2023-0126", reason = "im::OrdSet insertion is unsound, but Loro 1.13.6 production code uses im::HashMap and contains no OrdSet use; blocked on upstream replacing im (#3161)" },
    { id = "RUSTSEC-2026-0255", reason = "sized-chunks double-drops when an element Drop panics inside clear/drop_left/drop_right; no patched release, transitive only through pinned Loro 1.13.6's im stack (#3161); shipped builds use the release profile's panic = abort, so that panic ends the process before the second free" },
    # heapless: the fix is 0.9.4 only. 0.7 (postcard, under Loro and
    # iroh-relay) and 0.8 (loro-delta) have no patched release; 0.9.3
    # (generic-btree) moves to 0.9.4 once it clears the 7-day release-age gate.
    { id = "RUSTSEC-2026-0574", reason = "heapless sorted_linked_list::FindMutView::pop use-after-free; Agaric reaches heapless only through postcard, loro-delta and generic-btree, whose non-test code uses heapless::Vec alone, never a SortedLinkedList" },
    { id = "RUSTSEC-2026-0575", reason = "heapless spsc::Spsc::peek memory ordering; Agaric reaches heapless only through postcard, loro-delta and generic-btree, whose non-test code uses heapless::Vec alone, never an spsc queue" },
    { id = "RUSTSEC-2026-0576", reason = "heapless IndexMap::truncate; Agaric reaches heapless only through postcard, loro-delta and generic-btree, whose non-test code uses heapless::Vec alone, never an IndexMap" },
    { id = "RUSTSEC-2026-0577", reason = "heapless double drop when an element Drop panics (Vec IntoIter drop among others); shipped builds use the release profile's panic = abort, so that panic ends the process before the second drop" },
    { id = "RUSTSEC-2026-0578", reason = "heapless SortedLinkedList::zeroize; Agaric reaches heapless only through postcard, loro-delta and generic-btree, whose non-test code uses heapless::Vec alone, never a SortedLinkedList" },
    { id = "RUSTSEC-2026-0579", reason = "heapless Deque try_from on a full array (0.9.3 only, generic-btree's copy); Agaric reaches heapless only through postcard, loro-delta and generic-btree, whose non-test code uses heapless::Vec alone, never a Deque" },
    { id = "RUSTSEC-2026-0580", reason = "heapless treiber-stack pool race (arc_pool, box_pool, object_pool, pool); Agaric reaches heapless only through postcard, loro-delta and generic-btree, whose non-test code uses heapless::Vec alone, never a pool" },
    { id = "RUSTSEC-2026-0581", reason = "heapless Deque::make_contiguous; Agaric reaches heapless only through postcard, loro-delta and generic-btree, whose non-test code uses heapless::Vec alone, never a Deque" },
    { id = "RUSTSEC-2026-0582", reason = "heapless IndexMap::insert at u16::MAX entries; Agaric reaches heapless only through postcard, loro-delta and generic-btree, whose non-test code uses heapless::Vec alone, never an IndexMap" },
    # chrono: an unmaintained notice, not a vulnerability. Six workspace crates
    # use it directly, and specta (exact-pinned rc), rmcp and schemars pull it
    # in too, so moving our own code to jiff would not remove it.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained (no vulnerability); also required by specta, rmcp and schemars, so dropping it is blocked on them even if Agaric's own code moved to jiff" },
    { id = "RUSTSEC-2026-0459", reason = "Agaric opens only its own notes.db and its own backups, never a database or -wal another party wrote; the fix (libsqlite3-sys 0.39) is outside sqlx 0.9.0's <0.38 range" },
    # Fixed upstream, but the fix is younger than the 7-day release-age gate
    # (.github/dependabot.yml cooldown); take it once it clears.
    { id = "RUSTSEC-2026-0592", reason = "url Url::origin() recursion on nested blob: URLs; neither Agaric, Tauri nor wry calls Url::origin(); the fix, url 2.5.9, clears the 7-day release-age gate on 2026-11-27" },
    { id = "RUSTSEC-2026-0594", reason = "cookie private-jar nonce reuse after fork [vex:vulnerable_code_not_present]; Tauri builds cookie without its private feature, so the private jar is not compiled in; the fix, cookie 0.18.3, clears the 7-day release-age gate on 2026-11-30" },
]

# ── Licenses ────────────────────────────────────────────────────────────────
#
# GPL-3.0-or-later compatibility audit.
#
# The repo itself is licensed GPL-3.0-or-later (see `LICENSE`), so every
# entry below MUST be one-way-compatible with GPL-3.0-or-later (i.e.,
# can be linked into a GPL-3 work). The current list is all permissive
# (MIT, BSD, ISC, 0BSD, Unlicense, Zlib, Apache-2.0 + LLVM-exception)
# or weak-copyleft compatible (MPL-2.0, BSL-1.0). `MIT-0`, `Apache-2.0`,
# and `BSL-1.0` are GPL-3-compatible by their respective FSF analyses.
# `Unicode-3.0` / `Unicode-DFS-2016` are permissive Unicode license
# variants (FSF-compatible). `CDLA-Permissive-2.0` enters via the
# webpki-roots data bundle (see inline note below) — permissive data
# license, no copyleft.
#
# NOT ALLOWED here (and why): AGPL-3.0-* (incoming compatibility OK
# but the project license would then have to be AGPL to comply with
# AGPL's network-use clause — out of scope for a local-first app),
# GPL-2.0-only (one-way incompatibility), CDDL (incompatible per FSF),
# EPL-1.0/-2.0 (incompatible per FSF), CC-BY-NC-* (non-commercial
# clauses are not OSI-compatible), proprietary "source-available"
# pseudo-OSS licenses (BSL-1.1, SSPL, etc.).
#
# When a new transitive dep introduces a license not in this list,
# cargo-deny will fail at commit time — either swap the dep, fork it
# to a compatible license, or add to this list with a documented
# rationale.
[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    # CDLA-Permissive-2.0 enters via webpki-roots (→ hyper-rustls → reqwest 0.12
    # → oauth2 v5). It is an OSI-equivalent permissive data-commons license; no
    # copyleft. Safe to allow for the dual-root-cert bundle this repo already
    # ships through rustls-tls.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true

# ── Bans ────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # OpenSSL is a maintenance and security burden; prefer rustls
    { crate = "openssl", reason = "use rustls instead" },
    { crate = "openssl-sys", reason = "use rustls instead" },
]
skip = []
skip-tree = []

# ── Sources ─────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
