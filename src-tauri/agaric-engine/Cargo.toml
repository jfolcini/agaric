# agaric-engine — CRDT / document-domain layer for the layered-workspace split
# (#2621).
#
# Wave E0 established the crate with the query-free leaf `bibliography` module.
# Wave E1 folds in the Loro CRDT runtime (`loro`) — the first query-bearing
# engine module, so the crate now carries its own `.sqlx` offline cache
# (migrations symlink + committed cache + a 3rd `sqlx prepare` CI lane,
# mirroring `agaric-store`). Later waves fold in the `dag` materializer. The
# `agaric` crate depends on this via a version-pinned path dep and re-exports
# each module (`pub use agaric_engine::{bibliography, loro};` …) so existing
# `crate::bibliography::…` / `crate::loro::…` paths keep resolving unchanged
# during the transition.
[package]
name = "agaric-engine"
version = "0.1.0"
edition = "2024"
# Keep in lockstep with ../Cargo.toml (the app crate) + rust-toolchain.toml.
rust-version = "1.95.0"
license = "GPL-3.0-or-later"
publish = false

[features]
# `test-util` exposes loro's `projection::reproject_call_spy` invocation counter
# and the materializer's handler seams to downstream crates' test builds. The
# app crate's `materializer_app_tests` modules enable it (via a dev-dep
# feature); `materializer::handlers::import_scaling_tests`, the spy's original
# consumer (#2621, wave E1), lives in this crate since #4502.
# It also compiles `proptest_db_harness` (#4499 phase 1), which the app's
# B2-B4 proptests and this crate's `tests/reverse_proptest_b1.rs` share, so
# `proptest` is an optional normal dependency the feature turns on: the lib
# rlib a test binary links is built without this package's dev-dependencies.
test-util = ["dep:proptest"]

# Cargo-machete allowlist — each entry carries a reachability rationale, per
# the sibling block in `src-tauri/Cargo.toml`.
[package.metadata.cargo-machete]
ignored = [
    # Declaration-only, and deliberately so: it exists to pin `loro-internal`
    # exactly, because `loro = "=1.13.6"` leaves it free to float to 1.13.9 and
    # that is the crate #3161's quadratic `find_common_ancestor` lives in.
    # There is no `use loro_internal` anywhere in this workspace and there
    # should not be — the `loro` facade is the API we consume.
    "loro-internal",
]

[dependencies]
# Versions/features mirror the app crate's `[dependencies]` so cargo's feature
# unification keeps a single build of each crate across the workspace.
# `agaric-core` — `bibliography` references `error::AppError`. Path dep pinned
# with a version (cargo-deny wildcard ban).
agaric-core = { path = "../agaric-core", version = "0.1.0" }
# `agaric-store` — loro's `projection` writer + registry/snapshot reach the DB
# core (`db`), op payloads (`op`), `space::SpaceId`, and
# `block_descendants::…`. Path dep pinned with a version (cargo-deny wildcard
# ban), same as the store's own `agaric-core` pin.
agaric-store = { path = "../agaric-store", version = "0.1.0" }
# `bibliography` parses the CSL-JSON format via `serde_json::Value`; loro's
# projection serializes cohort/tag payloads via `serde_json::Value`.
serde_json = "1"
# `import`'s markdown parser compiles a handful of `LazyLock<Regex>` patterns
# (wiki-link / block-ref / frontmatter scanning). Version mirrors the app crate.
regex = "1"
# `draft::Draft` derives `Serialize`/`Deserialize` (#2621, wave E2). Version/
# features mirror the app crate exactly for cargo feature-unification.
serde = { version = "1", features = ["derive"] }
# `draft::Draft` derives `specta::Type` (frontend binding generation). Version/
# features mirror the app crate exactly for cargo feature-unification.
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono"] }
# The Loro CRDT crate — `LoroEngine` wraps `LoroDoc`, `Frontiers`, tree/map
# containers. This is the workspace's owning entry since #3120 (the app crate
# no longer depends on it); agaric-sync mirrors it. Not part of any coupled
# dep stack per AGENTS.md §"Coupled Dependency Updates".
# HELD at 1.13.6 (#3161). 1.13.7 made `find_common_ancestor` quadratic in
# history at frontier width > 1 — one user, two devices, one concurrent edit.
# Re-measured 2026-09-04 against 1.13.9, the newest release: still quadratic,
# 192x slower than 1.13.6 at 1000 rounds (5.7ms -> 10466ms). Not fixed.
#
# Both crates are pinned exactly, and that is load-bearing rather than
# belt-and-braces: `loro = "=1.13.6"` ALONE still resolves `loro-internal` to
# 1.13.9, because loro 1.13.6 itself requires only `loro-internal = "^1.13.6"`.
# The regression lives in `loro-internal/src/dag.rs`, so a float there ships it
# with the facade pinned. Verified by observation, not inference: a bare
# `cargo generate-lockfile` under an exact `loro` pin produced loro-internal
# 1.13.9. The previous note here reasoned from that same fact to "pin nothing,
# the lockfile is the real hold"; pinning BOTH closes the hole instead of
# conceding it, and cargo then refuses the bad resolution outright.
#
# Do not lift either pin without re-running the width-2 reproducer (2 peers,
# alternating commit + cross-import, N rounds, under `subscribe_root` so the
# diff actually fires). CI cannot catch this: #3187 narrowed the regression
# test to frontier width 1, which is dag.rs's linear fast path and measures at
# parity on every version.
loro = "=1.13.6"
# Not used in our source — declared solely to pin the crate the #3161
# regression actually lives in. See the loro note above for why the facade pin
# cannot do this on its own. cargo-machete allowlisted below.
loro-internal = "=1.13.6"
# `loro/engine/mod.rs` derives peer ids + block-content hashes via `xxh3_64`.
# Version/features mirror the app crate exactly.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# loro's `projection` writer runs `sqlx::query!` macros against the workspace
# schema (offline-cached under this crate's `.sqlx`). Version/features mirror
# the app crate exactly for cargo feature-unification.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
# loro's `projection` parses RFC-3339 timestamps via `chrono::DateTime`.
# Version/features mirror the app crate exactly.
chrono = { version = "0.4.44", features = ["serde"] }
# The engine registry + snapshot use `parking_lot` (arc_lock guards, no
# poisoning). Version/features mirror the app crate exactly.
parking_lot = { version = "0.12.5", features = ["arc_lock"] }
# loro logs recovery/migration warnings via `tracing::warn!` / `#[instrument]`.
# Version/features mirror the app crate exactly.
tracing = { version = "0.1.44", features = ["attributes"] }
# `peer_epoch`'s retry backoff (`tokio::time::sleep`) + the periodic-snapshot
# task's `tokio::time::interval` need tokio's timer in prod. Version mirrors the
# app crate; features are enabled explicitly (the app relies on workspace
# feature unification to pull them) so the engine builds standalone. The
# `materializer` (#4502) adds `rt` (its `JoinSet` + the runtime handle the app
# passes in), `sync` (queue channels / `Notify`), `fs` (the attachment GC walk)
# and `macros` (`select!`).
tokio = { version = "1", features = ["time", "rt", "sync", "fs", "macros"] }
# `materializer::handlers::apply` records each op's apply duration to the OTel
# histogram. Observability depends only on `agaric-core`, so no cycle.
agaric-observability = { path = "../agaric-observability", version = "0.1.0" }
# `materializer::dedup` keys its task set with `FxHashSet`. Version mirrors the
# app crate.
rustc-hash = "2.1.2"
# `materializer::handlers::attachments` names its GC quarantine files with a
# fresh ULID. Version mirrors the app crate.
ulid = "3.0.0"

# Reached only through `test-util` (see the feature's comment); a default
# build never compiles it. Version mirrors the dev-dependency below.
proptest = { version = "1.11.0", optional = true }

[dev-dependencies]
# The integration binaries under `tests/` link this crate's lib as an external
# crate, so the `test-util` seams (`proptest_db_harness`) are reached the way
# the app and store crates do it: a dev-dependency on ourselves with the
# feature on. Dev-dependency features never leak into a normal build.
agaric-engine = { path = ".", version = "0.1.0", features = ["test-util"] }
# The moved loro tests use `#[tokio::test]` (single- + multi-thread flavors).
# Version/features mirror the app crate's `[dev-dependencies]` exactly.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util"] }
# `engine_proptest.rs` property tests. Version mirrors the app crate.
proptest = "1.11.0"
# `import`'s parse-output / IPC-envelope snapshots and `draft`'s durable
# anchor shape (#3459). Version/features mirror the app crate's,
# `agaric-core`'s and `agaric-store`'s `[dev-dependencies]` so cargo unifies
# one insta build across the workspace.
insta = { version = "1.47.0", features = ["yaml", "redactions"] }
# One `engine/mod.rs` test captures `tracing::warn!` output via an in-process
# subscriber (`fmt::MakeWriter`). Version/features mirror the app crate.
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# The moved DB tests build a migrated temp-file pool via `TempDir`. Version
# mirrors the app crate.
tempfile = "3.27.0"
# The loro DB tests build a migrated pool via `agaric_store::test_support::
# test_pool` — enable the store's `test-util` feature so that module compiles
# for this crate's test build (#2621, wave E1).
agaric-store = { path = "../agaric-store", version = "0.1.0", features = ["test-util"] }
# Re-declare agaric-core with `test-util` so the `*::test_id` newtype
# constructors compile for this crate's test build — the moved `draft` tests
# build synthetic `BlockId::test_id(..)` fixtures (#2621, wave E2).
agaric-core = { path = "../agaric-core", version = "0.1.0", features = ["test-util"] }

# Mirror the app crate's lint posture so clippy/rustc behave identically under
# CI (same pattern as the `agaric-core` / `agaric-store` members).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
too_many_lines = "warn"                     # AGENTS.md item 6; threshold in the workspace clippy.toml (#4639)
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
fallible_impl_from = "deny"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
large_futures = "warn"
default_trait_access = "warn"
