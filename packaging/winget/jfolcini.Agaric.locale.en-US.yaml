ShortDescription: Local-first outliner and personal knowledge base
Description: |-
  Agaric is a block-based outliner and personal knowledge base inspired by Org-mode and Logseq.
  Notes live in a local SQLite database, with full-text search, backlinks, a journal and an agenda.
  Sync runs over the local network between devices you pair yourself; there is no cloud and no telemetry.
