# STATUS: DO NOT SUBMIT AS IT IS. An AI agent wrote this file, and Flathub
# accepts no AI-generated or AI-assisted manifest. See README.md.
#
# Builds the checkout this file sits in. cargo-sources.json and
# node-sources.json are generated, not committed (README.md).
app-id: io.github.jfolcini.Agaric
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: agaric
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Voice notes and audio attachments.
  - --socket=pulseaudio
  # LAN sync between paired devices (mDNS discovery, QUIC) and link previews.
  - --share=network
  # Exports are saved by the webview's own download, which writes there.
  - --filesystem=xdg-download
  # Due-task notifications go to the notification service directly.
  - --talk-name=org.freedesktop.Notifications
  # tauri-plugin-single-instance: a second launch hands over to the first.
  - --own-name=com.agaric.app.SingleInstance
modules:
  - name: agaric
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
      env:
        CARGO_HOME: /run/build/agaric/cargo
        SQLX_OFFLINE: 'true'
        XDG_CACHE_HOME: /run/build/agaric/flatpak-node/cache
        npm_config_cache: /run/build/agaric/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      # The node24 extension's npm is older than package.json's engines.npm; drop
      # --engine-strict=false once the extension's npm satisfies it.
      - npm ci --engine-strict=false
      - npm run build
      - cargo --offline build --release --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol --bin agaric --bin agaric-mcp
      - install -Dm755 -t $FLATPAK_DEST/bin src-tauri/target/release/agaric src-tauri/target/release/agaric-mcp
      - install -Dm644 -t $FLATPAK_DEST/share/applications packaging/flathub/$FLATPAK_ID.desktop
      - install -Dm644 -t $FLATPAK_DEST/share/metainfo packaging/flathub/$FLATPAK_ID.metainfo.xml
      - install -Dm644 -t $FLATPAK_DEST/share/licenses/$FLATPAK_ID LICENSE
      - for s in 32 64 128 256 512; do install -Dm644 src-tauri/icons/${s}x${s}.png $FLATPAK_DEST/share/icons/hicolor/${s}x${s}/apps/$FLATPAK_ID.png; done
    sources:
      - type: dir
        path: ../..
        skip:
          - node_modules
          - src-tauri/target
      - cargo-sources.json
      - node-sources.json
