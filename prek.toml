# Session-log numbering: the number must be free in the MERGE TARGET, not
# just on your branch. Past session-999, lexicographic `ls | tail` reported
# the wrong max (session-1000 < session-996) and produced fifteen
# session-1000 collisions. The max+1 rule that fixed that is not
# collision-safe under parallel work (#3690): two branches forked from the
# same main both compute the same next number, both pass in isolation, and
# collide on merge — which is how docs/session-log/ ended up with two
# session-1281 files. The guard now checks against origin/main too, and
# checks the `# Session NNNN` heading inside the file against the filename.
# #3929: exact max+1 turned the number into a dense sequence, which only
# ONE parallel PR can hold at a time — every sibling had to renumber (a
# full re-push each) the moment any one of them merged. The guard now
# accepts a bounded window above the max instead of demanding the exact
# next value; the collision check above (against origin/main) is what
# actually prevents a duplicate landing, and does not depend on density.
[[repos.hooks]]
id = "session-log-numbering"
name = "session-log numbering guard"
entry = "bash scripts/check-session-log-numbering.sh"
language = "system"
pass_filenames = false
files = "^docs/session-log/session-.*\\.md$"
stages = ["pre-commit"]

# #3690: the guard above is only worth having if it fails on a collision it
# used to pass. Its fixture suite builds throwaway repositories — including
# the exact parallel-branch shape (base at 1280, origin/main already at
# 1281) — and runs the guard inside them, so what is asserted is the guard
# as invoked rather than a model of it.
[[repos.hooks]]
id = "session-log-numbering-self-test"
name = "session-log numbering guard self-test (#3690 parallel-collision fixtures)"
entry = "bash scripts/check-session-log-numbering.sh --self-test"
language = "system"
pass_filenames = false
files = "^scripts/check-session-log-numbering\\.sh$"
stages = ["pre-commit"]

# JS: better-npm-audit (security advisories). Pre-push only (#817, #1087):
# `better-npm-audit audit` shells out to `npm audit`, a network round-trip to
# the registry advisory endpoint, so a dependency-bump commit would block on
# the network and go red when flaky/offline — the same rationale that moved
# knip and lychee off the commit path. As a pre-push-staged hook it runs once,
# directly from the pre-push git shim (not via Phase A, which is
# pre-commit-stage only), so CI must invoke it explicitly with
# `--hook-stage pre-push npm-audit` (see .github/workflows/_validate.yml);
# `npm audit signatures` there is a different, warn-only provenance check.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "npm-audit"
name = "npm audit"
entry = "npx better-npm-audit audit"
language = "system"
pass_filenames = false
files = "(^package\\.json$|^package-lock\\.json$)"
stages = ["pre-push"]

# JS: license-checker (license compliance). The repo is
# GPL-3.0-or-later, so every accepted license below must be one-way-
# compatible with GPL-3 (permissive or weak-copyleft compatible). The
# Rust side enforces the equivalent allowlist in `src-tauri/deny.toml`
