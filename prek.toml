[[repos.hooks]]
id = "snapshot-redaction"
name = "snapshot redaction"
entry = "node scripts/check-snapshot-redaction.mjs"
language = "system"
pass_filenames = false
# The `.rs` half of the trigger covers EVERY workspace member, not just the
# app crate (#3465): the fixture allowlist is built from all of them, so a
