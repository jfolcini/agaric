# pre-commit hook from `lycheeverse/lychee`. The upstream hook is
# broken on a normal dev box (verified 2026-05-27): both the
# `lychee-v0.24.2` script (`git describe --tags --exact-match` fails
# because prek's shallow clone strips tags) and the `lychee-v0.24.0`
# fallback (`cargo-binstall` extracted without an executable bit →
# Permission denied) fail in different ways, with no easy workaround.
#
# A `local`-language hook calling the system `lychee` binary
# sidesteps both failure modes entirely. Install via
# `cargo install lychee` if missing. CI installs lychee explicitly
# in the workflow, so this stays consistent across environments.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "lychee"
name = "lychee"
entry = "lychee"
args = ["--no-progress", "--max-concurrency=4", "--cache"]
language = "system"
types = ["markdown"]
pass_filenames = true
# Pre-push only (#817): lychee resolves links over the NETWORK, which is
# slow and flaky on the commit path; network checks don't belong in
# `git commit`. As a pre-push-staged hook it runs once, directly from the
# pre-push git shim (not via Phase A, which is pre-commit-stage only).
stages = ["pre-push"]

# SQL: sqruff (SQLite migrations lint)
# Scope: src-tauri/migrations/*.sql only. Inline `sqlx::query!` strings in Rust
# are not linted (covered by sqlx compile-time validation against .sqlx/ cache).
# Rule set picked to match all currently-shipped migrations without triggering
# any fixes (shipped migrations are append-only per AGENTS.md invariant #1;
# sqlx tracks their checksums in _sqlx_migrations).
[[repos]]
repo = "local"
[[repos.hooks]]
id = "sqruff"
name = "sqruff"
entry = "bash -c '. \"$HOME/.cargo/env\" && sqruff lint \"$@\"' --"
language = "system"
pass_filenames = true
files = "^src-tauri/migrations/.*\\.sql$"
stages = ["pre-commit"]

# Tauri command IPC error-sanitization check. Every
# `#[tauri::command]` wrapper that returns `Result<_, AppError>` and
# propagates errors via `?` should funnel them through
# `.map_err(sanitize_internal_error)` so the IPC boundary never leaks
# bare `AppError::Sqlx` / `AppError::Internal` payloads to the
# frontend. A code-level wrapper macro would obstruct specta's type
# extraction, so the convention is enforced as a regex check instead.
# Pre-existing violations are grandfathered via an explicit allowlist
# inside the script — adjust there, not here.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "tauri-command-sanitize"
name = "tauri command sanitize"
entry = "node scripts/check-tauri-command-sanitize.mjs"
language = "system"
pass_filenames = false
files = "^src-tauri/src/commands/.*\\.rs$"
stages = ["pre-commit"]

# tauri-command-instrumented (#2110 M2): every `#[tauri::command]` must be
# covered by a `tracing` span — directly `#[instrument]`-ed, or delegating to
# an instrumented in-file helper (the `*_inner` convention) — so the
# OpenTelemetry trace pipeline sees every IPC entry point. Trivial span-free
# getters + commands instrumented via a cross-module helper are listed in an
# explicit allowlist inside the script (adjust there, not here).
[[repos.hooks]]
id = "tauri-command-instrumented"
name = "tauri command instrumented"
entry = "node scripts/check-tauri-command-instrumented.mjs"
language = "system"
pass_filenames = false
files = "^src-tauri/src/commands/.*\\.rs$"
stages = ["pre-commit"]

# Self-test the instrumentation guard's own exit behavior (DIRECT/DELEGATED
# PASS, GAP FAILS, doc-mention does not count, stale allowlist FAILS) whenever
# the guard script itself changes, so a regression that re-vacuums it can't
# land unnoticed. Mirrors `ipc-error-path-coverage-selftest`.
[[repos.hooks]]
id = "tauri-command-instrumented-selftest"
name = "tauri command instrumented self-test"
entry = "node scripts/check-tauri-command-instrumented.mjs --self-test"
language = "system"
pass_filenames = false
files = "^scripts/check-tauri-command-instrumented\\.mjs$"
stages = ["pre-commit"]

# #2110 (M4) — frontend trace-interaction naming. Every `traceInteraction`
# span must be named from the central `INTERACTIONS` registry
# (`src/lib/observability/interactions.ts`), never an interpolated string, so
# exported span names stay PII-safe by construction (the registry values are
# reviewed, opaque labels). The guard parses each call's first argument and
# fails any that is not an `INTERACTIONS.<KEY>` member access.
[[repos.hooks]]
id = "trace-interactions-named"
name = "frontend traceInteraction naming"
entry = "node scripts/check-trace-interactions.mjs"
language = "system"
pass_filenames = false
files = "^src/.*\\.tsx?$"
stages = ["pre-commit"]

# Self-test the trace-interaction naming guard's own detection (member access
# PASSES, string/template/variable/call FAIL) whenever the guard script itself
# changes. Mirrors `tauri-command-instrumented-selftest`.
[[repos.hooks]]
id = "trace-interactions-named-selftest"
name = "frontend traceInteraction naming self-test"
entry = "node scripts/check-trace-interactions.mjs --self-test"
language = "system"
pass_filenames = false
files = "^scripts/check-trace-interactions\\.mjs$"
stages = ["pre-commit"]

# Rust: raw write-tx guard (#110). replaced ad-hoc
# `pool.begin_with("BEGIN IMMEDIATE")` write transactions on user-edit
# paths with the `CommandTx` convention (open via
# `crate::db::begin_immediate_logged`, couple the commit with post-commit
# materializer dispatch). This hook stops the convention from silently
# regressing: it flags any NEW raw write-tx opened outside the audited
# allowlist (cache rebuilds, FTS/tag-inheritance derived indexes,
# snapshot/recovery/sync system paths, external-integration internals)
# or the per-site `// allow-raw-tx: <reason>` escape hatch. `#[cfg(test)]`
# modules and whole test files are skipped — fixtures legitimately open
# raw transactions. Runs at both pre-commit and pre-push so a raw site
# can't slip in via either path. Allowlist + escape-hatch rules live in
# scripts/check-raw-tx.py.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "check-raw-tx"
name = "raw write-tx guard (#110 CommandTx convention)"
entry = "python3 scripts/check-raw-tx.py"
language = "system"
# Four crate roots (#3110): the #2621 split moved the write-tx primitive and
# its callers into agaric-store/agaric-engine/agaric-sync. Mirrors the sibling
# check-table-ownership trigger regex. (diagnostics has no triggering files
# today; its src/bin audit tools are skipped inside the script.)
files = '^src-tauri/(src|agaric-store/src|agaric-engine/src|agaric-sync/src)/.*\.rs$'
stages = ["pre-commit", "pre-push"]

# #653: the raw-tx guard now also flags a bare `pool.begin()` (DEFERRED)
# in any file that calls `append_local_op_in_tx` — that pairing breaks the
# `SELECT MAX(seq)+1`+`INSERT` BEGIN IMMEDIATE contract. This companion
# hook runs the guard's own fixture suite (`--self-test`) so the proximity
# logic and false-positive exemptions (CommandTx path, read-only `.begin()`,
# `// allow-raw-tx:`, `#[cfg(test)]`) cannot silently regress. No file args.
[[repos.hooks]]
id = "check-raw-tx-self-test"
name = "raw write-tx guard self-test (#653 deferred-tx fixtures)"
entry = "python3 scripts/check-raw-tx.py --self-test"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit", "pre-push"]

# Rust: dynamic-SQL justification guard (#646). docs/architecture/tooling.md
# claims every runtime `sqlx::query()` (non-macro) site carries a comment
# justifying the runtime form — until #646 that claim was unenforced (unlike
# every sibling invariant: check-raw-tx, unsafe-allowlist, migrations-
# immutable). This hook counts runtime `sqlx::query(`/`query_as(`/
# `query_scalar(` sites per production file (the macro forms are compile-
# checked and exempt) and compares against a checked-in baseline
# (src-tauri/dynamic-sql-baseline.txt). Existing sites are grandfathered;
# a file that grows PAST its baseline must carry a `// dynamic-sql: <reason>`
# marker at every dynamic site, applying back-pressure toward the compile-
# checked macros. Comment-/string-stripping and `#[cfg(test)]`-module skipping
# are shared with check-raw-tx.py. Since #3107 the scan follows the four crate
# roots the #2621 split moved dynamic-SQL surface into (app = src-tauri/src,
# agaric-store, agaric-engine, agaric-sync) — mirroring the table-ownership
# hook's `files` — plus the diagnostics crate (its bins are excluded at the
# guard level). Regenerate the baseline with `python3
# scripts/check-dynamic-sql.py --update-baseline`. Allowlist/rules live in
# scripts/check-dynamic-sql.py.
[[repos.hooks]]
id = "check-dynamic-sql"
name = "dynamic-SQL justification guard (#646)"
entry = "python3 scripts/check-dynamic-sql.py"
language = "system"
files = '^src-tauri/(src|agaric-store/src|agaric-engine/src|agaric-sync/src)/.*\.rs$'
stages = ["pre-commit", "pre-push"]

# #1188: the guard's detection regex must tolerate a turbofish between the
# method name and the call parens (`sqlx::query_scalar::<_, Option<i64>>(`) —
# in fact the dominant runtime-query spelling here, which the pre-#1188 regex
# silently skipped. This companion hook runs the guard's own fixture suite
# (`--self-test`) so the match contract (turbofish + nested-generic close,
# macro-form exemption) cannot silently regress. No file args.
[[repos.hooks]]
id = "check-dynamic-sql-self-test"
name = "dynamic-SQL guard self-test (#1188 turbofish fixtures)"
entry = "python3 scripts/check-dynamic-sql.py --self-test"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit", "pre-push"]

# Rust: per-(crate, table) raw-write table-ownership baseline guard (#2895).
# Agaric's SQLite store is written from four crates (app = src-tauri/src,
# agaric-store, agaric-engine, agaric-sync). Each core table has ONE owner
# crate; a raw `sqlx` write to a table from a NON-owner crate is how a
# table's invariants silently drift out of one place. This hook counts raw
# writes (`INSERT [OR ...] INTO t` / `UPDATE t` / `DELETE FROM t`) per
# (crate, table) across all four roots and fails when a non-owner pair's
# count EXCEEDS its checked-in baseline (src-tauri/table-ownership-baseline.txt).
# Owner-crate writes are unconstrained; existing cross-crate sites are
# grandfathered, so the ratchet only back-pressures NEW ones. Regenerate the
# baseline with `python3 scripts/check-table-ownership.py --update-baseline`.
# Ownership is aggregate, so the guard rescans the whole tree regardless of
# which files changed. Ownership map/rules: src-tauri/migrations/AGENTS.md.
[[repos.hooks]]
id = "check-table-ownership"
name = "table-ownership baseline guard (#2895)"
entry = "python3 scripts/check-table-ownership.py"
language = "system"
files = '^src-tauri/(src|agaric-store/src|agaric-engine/src|agaric-sync/src)/.*\.rs$'
stages = ["pre-commit", "pre-push"]

# #2895: the ownership guard must match SQL inside `sqlx::query!("…")` macro
# STRINGS (unlike the code-token sibling guards) while still ignoring comment
# prose and #[cfg(test)] regions, and its write-regex must respect word
# boundaries (`blocks` != `block_links` / `_new_blocks` / `blocks_fts`). This
# companion hook runs the guard's own fixture suite (`--self-test`) so that
# match/exclusion contract cannot silently regress. No file args.
[[repos.hooks]]
id = "check-table-ownership-self-test"
name = "table-ownership guard self-test (#2895 write-regex fixtures)"
entry = "python3 scripts/check-table-ownership.py --self-test"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit", "pre-push"]

# Migration → JS-mock schema-contract guard (#3084). The browser/e2e Tauri
# mock (src/lib/tauri-mock/) is a hand-maintained SECOND implementation of the
# schema; when a migration changes a table the mock models, the mock silently
# keeps modeling the OLD schema and drifts (the tag-space bug: a retired
# block_properties(key='space') row kept alive after space moved to the native
# blocks.space_id column — shipped past green e2e). This DIFF-scoped guard sees
# both changed migrations AND changed mock files in one invocation (the `files`
# alternation below). For each NEW migration (not grandfathered in
# src-tauri/migrations-mock-ack-baseline.txt) that touches a table in the
# CONTRACT map, it requires EITHER a modeling mock file changed alongside it,
# OR a `-- mock-unaffected: <reason>` annotation line in the migration. The
# baseline makes `prek run --all-files` (CI), pre-commit, and pre-push behave
# identically with no git dependence. Regenerate after landing a new migration:
# `python3 scripts/check-migration-mock-contract.py --update-baseline`.
[[repos.hooks]]
id = "check-migration-mock-contract"
name = "migration → mock schema-contract guard (#3084)"
entry = "python3 scripts/check-migration-mock-contract.py"
language = "system"
files = '^(src-tauri/migrations/.*\.sql|src/lib/tauri-mock/.*)$'
stages = ["pre-commit", "pre-push"]

# #3084: the guard's CONTRACT map (table → mock store symbol + modeling files),
# its migration-DDL table parser (CREATE/ALTER/DROP TABLE, CREATE TRIGGER … ON,
# `_new_<t>` rebuild forms; CREATE INDEX excluded), and the (a) mock-changed /
# (b) `-- mock-unaffected:` acknowledgement + baseline-exemption logic must not
# silently regress. This companion hook runs the guard's own fixture suite
# (`--self-test`), which also asserts every CONTRACT file exists and mentions
# its store symbol so the map cannot rot. No file args.
[[repos.hooks]]
id = "check-migration-mock-contract-self-test"
name = "migration → mock guard self-test (#3084 fixtures + CONTRACT integrity)"
entry = "python3 scripts/check-migration-mock-contract.py --self-test"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit", "pre-push"]

# Rust: tauri-specta 10-argument ceiling guard (#1317). The tauri-specta IPC
# bridge codegen has a HARD 10-argument limit per `#[tauri::command]`, and a
# `State<'_, T>` param counts toward it (it costs a Rust signature slot even
# though it doesn't appear in bindings.ts). This ceiling is documented in
# src-tauri/src/commands/AGENTS.md § "tauri-specta 10-argument ceiling" with
# the WriteCtx bundling solution (#1056) — but until #1317 NOTHING enforced
# it: an 11-param command compiled cleanly and failed only later, at specta-
# export / IPC time. This hook scans `src-tauri/src/commands/**/*.rs` for
# every `#[tauri::command]` fn, counts ALL declared params (conservatively
# including State, parsed across multiline sigs with bracket-depth counting),
# and fails any command over 10. Comment-stripping is shared with
# check-raw-tx.py. Rules live in scripts/check-command-arity.py.
[[repos.hooks]]
id = "check-command-arity"
name = "tauri-specta 10-arg ceiling guard (#1317)"
entry = "python3 scripts/check-command-arity.py"
language = "system"
files = '^src-tauri/src/commands/.*\.rs$'
stages = ["pre-commit", "pre-push"]

# #1317: the arity parser must survive multiline signatures, nested generics /
# tuples / closures (which must NOT inflate the param count), attribute args,
# and commented-out attributes. This companion hook runs the guard's own
# fixture suite (`--self-test`) so the 10-vs-11 boundary and the bracket-depth
# param counter cannot silently regress. No file args.
[[repos.hooks]]
id = "check-command-arity-self-test"
name = "tauri-specta arity guard self-test (#1317 fixtures)"
entry = "python3 scripts/check-command-arity.py --self-test"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit", "pre-push"]

# Rust: space-filter drift guard (#139). Space membership is a first-class
# `blocks.space_id` column (#533, migration 0086), so the active-space read
# filter is the canonical guard fragment `(?N IS NULL OR b.space_id = ?N)`
# (same bind index on both sides), inlined at ~30 paginated-read call sites.
# The maintainer deferred the build.rs / include_str! consolidation that
# would dedupe it (blocked on sqlx#3388) and adopted this cheap drift-guard
# instead: it fails when an inlined copy is mangled — a mismatched `?N`, a
# wrong column, or the `?N IS NULL OR` guard dropped (degrading it to a bare
# `b.space_id = ?N`), the last caught via a per-file count baseline
# (src-tauri/space-filter-baseline.txt) since a bare `b.space_id = ?` is
# legitimate at single-space query sites. Re-anchor the baseline with
# `python3 scripts/check-space-filter-drift.py --update-baseline`. Mirrors
# the `space_filter_canonical.rs` parity test at pre-commit stage. Rules
# live in scripts/check-space-filter-drift.py.
[[repos.hooks]]
id = "check-space-filter-drift"
name = "space-filter drift guard (#139)"
entry = "python3 scripts/check-space-filter-drift.py"
language = "system"
files = '^src-tauri/src/.*\.rs$'
stages = ["pre-commit", "pre-push"]

# Rust: cargo fmt. Auto-fix formatter (#817): drops `--check` so a
# formatting miss is rewritten in place + re-staged mechanically instead
# of aborting the commit with a manual `cargo fmt` step. Matches the prek
# "fixer" contract used by the builtin trailing-whitespace hook — the hook
# mutates the file, prek detects the modification and fails the run, and
# the author re-stages the now-formatted file.
#
# `--all`: without it, `cargo fmt` formats only the root `agaric` package
# and skips the `agaric-diagnostics` member (same blind spot `cargo clippy`
# had without `--workspace`). `--all` formats every workspace member.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
entry = "bash -c '. \"$HOME/.cargo/env\" && cd src-tauri && cargo fmt --all'"
language = "system"
pass_filenames = false
types = ["rust"]
stages = ["pre-commit"]

# Companion read-only gate (#2633). The fixer above runs at `pre-commit` and
# rewrites unformatted files in place — but it only fires when the commit
# actually runs the hooks. A `git commit --no-verify`, or a commit made before
# the hook toolchain finished provisioning in the background, bypasses it, so
# an unformatted file can still land in history and reach a push — where it
# only surfaces as a red `cargo fmt` in CI's `validate / lint` lane.
#
# This `--check` variant re-verifies formatting at `pre-push`: read-only (no
# tree mutation on the push path, unlike the fixer) and it aborts the push if
# any committed Rust file drifted, catching the miss one step before CI does.
# `cargo fmt` only parses + formats (it does not compile), so the push-path
# cost is a couple of seconds. Pre-push-staged, so it does not double-run in
# CI's `prek run --all-files` (that pass runs the pre-commit stage).
[[repos.hooks]]
id = "cargo-fmt-check"
name = "cargo fmt --check"
entry = "bash -c '. \"$HOME/.cargo/env\" && cd src-tauri && cargo fmt --all --check'"
language = "system"
pass_filenames = false
types = ["rust"]
stages = ["pre-push"]

# Rust: cargo clippy
[[repos]]
repo = "local"
[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
# `--all-targets` (#639): the bare invocation lints only the default
# target set (lib + bins), so the 26 criterion benches and the
# interactive_slo SLO gate (~1,271 lines) were never even COMPILED by
# clippy or CI — a refactor of agaric_lib internals could break every
# bench file silently. `--all-targets` adds benches/tests/examples to the
# lint set, turning "benches compile" into a checked contract on the fast
# (per-PR) path at near-zero marginal cost.
#
# `--workspace`: without it, `cargo clippy` in the workspace root lints only
# the root `agaric` package, silently skipping the `agaric-diagnostics`
# member (its 2 bins were never linted, so pedantic lints added to its
# Cargo.toml had unfixed violations CI never saw). `--workspace` lints every
# member.
#
# Pre-push only (#817): clippy compiles the whole workspace (+ all targets)
# and surfaces latent warnings in untouched files, so it's too slow and too
# broad for the commit path. As a pre-push-staged hook it runs once,
# directly from the pre-push git shim (not via Phase A, which is
# pre-commit-stage only).
entry = "bash -c '. \"$HOME/.cargo/env\" && cd src-tauri && cargo clippy --workspace --all-targets -- -D warnings'"
language = "system"
pass_filenames = false
types = ["rust"]
stages = ["pre-push"]

# Rust: smart related-only tests. Pre-push only (#817): the related-test
# selector falls back to the FULL nextest suite whenever a foundational
# module is touched (the app lib/main entry points or any file below its
# db module, agaric-core's error.rs, agaric-store's op.rs, or any file below
# its pagination module — see test-related-rust.sh), so at commit time this
# routinely ran the entire suite and dominated commit latency. The pre-push
# verifier runs nextest once, scoped to the push range, in Phase D of
# verify-ci-equivalent.sh;
# Phase A passes SKIP=cargo-test so it is not re-run there. (As a
# pre-push-staged prek hook it would invoke the script with the default
# `--cached` source against an empty index → a no-op at push; the genuine
# run is Phase D's `--range`.)
[[repos]]
repo = "local"
[[repos.hooks]]
id = "cargo-test"
name = "cargo nextest run"
entry = "scripts/test-related-rust.sh"
language = "system"
pass_filenames = false
types = ["rust"]
stages = ["pre-push"]

# #3220: the related-test selector's own fixture suite. Until #3220 the
# per-file loop only matched `src-tauri/src/**`, so a commit confined to
# agaric-store/engine/sync/core/observability/diagnostics produced an empty
# filter list and the gate ran ZERO tests while reporting success — 2087 of
# ~5452 workspace tests had no local gate at all. This companion hook pins
# the shapes that regression is made of: a crate-only change must yield a
# non-empty filter, a package filter must force `--workspace` (without it
# `package(agaric-engine)` matches nothing — #3212), an unmappable .rs file
# must be reported loudly, and the pre-existing `src-tauri/src/**` module
# mapping (plus the #818 specta pull-in) must stay byte-identical. #3256 also
# pins current foundational file/directory fallbacks, missing-target failure,
# NUL-safe unusual filenames, nested-cwd cached/range discovery, and the exact
# cwd/argv of the non-dry full-suite cargo exec via a local stub. Runs against
# a throwaway workspace in a temp dir. No file args.
[[repos.hooks]]
id = "test-related-rust-self-test"
name = "related-test selector self-test (#3220 crate-mapping fixtures)"
entry = "bash scripts/test-related-rust.sh --self-test"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit", "pre-push"]

# Rust: cargo-deny (advisories + licenses + bans + sources)
[[repos]]
repo = "local"
[[repos.hooks]]
id = "cargo-deny"
name = "cargo deny"
entry = "bash -c '. \"$HOME/.cargo/env\" && cd src-tauri && cargo deny check'"
language = "system"
pass_filenames = false
files = "^src-tauri/Cargo\\.(toml|lock)$"
stages = ["pre-commit"]

# Cargo-audit accept-list sync (#11). `cargo audit` (run as a
# warn-only step in `_validate.yml`) does NOT consult `deny.toml`, so
# every advisory already triaged in `deny.toml`'s `[advisories].ignore`
# re-surfaces in the CI log. The sync script projects those entries
# into `src-tauri/.cargo/audit.toml` (where cargo-audit actually
# reads from). This hook re-runs the script on every change to
# `deny.toml` or `audit.toml` and fails if the working copy of
# audit.toml is out of sync — telling the author to run
# `node scripts/sync-audit-from-deny.mjs`. `deny.toml` stays the
# single source of truth; `audit.toml` is generated.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "audit-toml-in-sync"
name = "audit.toml in sync with deny.toml"
entry = "node scripts/sync-audit-from-deny.mjs --check"
language = "system"
pass_filenames = false
files = "^src-tauri/(deny\\.toml|\\.cargo/audit\\.toml)$"
stages = ["pre-commit"]

# Rust: unsafe-code allowlist. Workspace lint is
# `unsafe_code = "deny"`; the only escape hatch is a per-file
# `#![allow(unsafe_code)]`. This hook fails when a file carries that
# attribute without an explicit entry in
# `src-tauri/unsafe-allowlist.txt`, ensuring every escape hatch is
# reviewed centrally. See the allowlist file and `scripts/check-
# unsafe-allowlist.sh` for the audit procedure.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "unsafe-allowlist"
name = "unsafe-code allowlist"
entry = "bash scripts/check-unsafe-allowlist.sh"
language = "system"
pass_filenames = false
files = "^(src-tauri/src/.*\\.rs|src-tauri/unsafe-allowlist\\.txt)$"
stages = ["pre-commit"]

# Rust: cargo-machete (unused dependency detection)
[[repos]]
repo = "local"
[[repos.hooks]]
id = "cargo-machete"
name = "cargo machete"
entry = "bash -c '. \"$HOME/.cargo/env\" && cd src-tauri && cargo machete'"
language = "system"
pass_filenames = false
files = "^src-tauri/Cargo\\.(toml|lock)$"
stages = ["pre-commit"]

# typos: language-agnostic typo checker (crate-ci/typos). Catches
# misspellings in code, comments, identifiers, snapshot fixtures,
# AGENTS.md — the surface markdownlint never
# touches. Allow-list and excluded paths live in `_typos.toml`.
# `pass_filenames = false` lets typos walk the repo itself and
# apply its built-in binary detection (PNG/ICO icons, etc., which
# typos would otherwise treat as text when explicitly handed
# their paths).
# Install: `cargo install typos-cli --locked`.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "typos"
name = "typos"
entry = "bash -c '. \"$HOME/.cargo/env\" && typos'"
language = "system"
pass_filenames = false
stages = ["pre-commit"]

# shellcheck: lint shell scripts under scripts/, src-tauri/scripts/, and
# .claude/hooks/ — keep this list in step with the `files` pattern below
# (#3637: it said "scripts/ and src-tauri/scripts/" long after the pattern
# was broadened to cover the Claude hooks too).
# `--severity=warning`
# skips the `info` / `style` notices (e.g. SC2012 "use find instead
# of ls", SC2001 "use ${var//pat/repl} instead of sed") which are
# minor stylistic preferences; we still catch real bugs and probable
# bugs. Out of scope: the inline `bash -c '...'` strings inside this
# file (shellcheck cannot parse TOML-embedded bash).
# Install via system package manager (e.g. `apt-get install shellcheck`).
[[repos]]
repo = "local"
[[repos.hooks]]
id = "shellcheck"
name = "shellcheck"
entry = "shellcheck --severity=warning"
language = "system"
files = "^((scripts|src-tauri/scripts)/|\\.claude/hooks/).*\\.sh$"
stages = ["pre-commit"]

# Remote system-dependency bootstrap self-test (#3556). Drives the installer
# through fake apt/dpkg/sudo commands so neither the hook nor CI ever mutates
# the host while proving exact packages, idempotency, noninteractive privilege,
# failure truthfulness, and the CLAUDE_CODE_REMOTE wiring.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "setup-system-deps-self-test"
name = "remote setup system-dependency self-test"
entry = "bash scripts/test-setup-system-deps.sh"
language = "system"
pass_filenames = false
files = "^(scripts/(setup|setup-system-deps|test-setup-system-deps)\\.sh|\\.claude/hooks/session-start\\.sh)$"
stages = ["pre-commit"]

# Migration immutability — enforces the AGENTS.md "append-only,
# never modify shipped migrations" invariant. The sqlx runtime
# detects checksum drift via `_sqlx_migrations`, but only on the
# next app boot; this hook fails fast at commit time. Allows
# additions only; modifications, deletions, renames, copies, and
# type changes under src-tauri/migrations/ are rejected.
# `always_run = true` (#806): prek's changed-file set EXCLUDES
# deletions, so a staged `git rm migrations/0001*.sql` alone would
# never match a `files` filter and the hook would silently skip.
# The script (~10ms) rescans the staged index itself, so running it
# unconditionally costs nothing. The `--all-files` vacuousness
# (staged index is empty in CI / pre-push) is backstopped by the
# script's `--range` mode, invoked from _validate.yml's lint job and
# scripts/verify-ci-equivalent.sh Phase A.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "migrations-immutable"
name = "migrations append-only"
entry = "bash scripts/check-migrations-immutable.sh"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "migrations-immutable-self-test"
name = "migrations append-only self-test (#806 range fixtures)"
entry = "bash scripts/check-migrations-immutable.sh --self-test"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit", "pre-push"]

# STRICT tables policy. Every new `CREATE TABLE` in a
# SQLite migration must use STRICT mode (SQLite 3.37+) so silent
# type coercion fails at insert time instead of corrupting reads
# later. Pre-policy migrations 0001..0041 are skipped by a
# migration-number floor inside the script — they're immutable
# per `migrations-immutable` and will not be retrofitted. FTS5 /
# virtual tables are carved out (SQLite forbids STRICT there).
[[repos]]
repo = "local"
[[repos.hooks]]
id = "migrations-strict-tables"
name = "migrations: STRICT tables required for new schema"
entry = "node scripts/check-migrations-strict.mjs"
language = "system"
pass_filenames = true
files = "^src-tauri/migrations/.*\\.sql$"
stages = ["pre-commit"]

# Blocks-rebuild cascade guard (#606). `DROP TABLE blocks` under
# `foreign_keys = ON` immediately cascade-deletes every child row
# with an ON DELETE CASCADE FK into blocks — inside the migration
# tx, before the `_new_blocks` rename. page_aliases (no op_log
# entries) and block_drafts (device-local) do NOT re-materialize
# at boot, so the shipped rebuilds 0073/0080/0085 destroyed both.
# Since 0089, the blocks → spaces CASCADE can also trigger
# spaces → blocks.space_id SET NULL and wipe the registry plus
# memberships. Any later blocks rebuild must follow the ordered
# snapshot/empty-registry/restore recipe in migrations/AGENTS.md.
# Deep verification lives in the db seed-then-migrate `*_606` tests.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "migrations-rebuild-cascade"
name = "migrations: blocks rebuilds must preserve cascade satellites"
entry = "node scripts/check-migrations-rebuild-cascade.mjs"
language = "system"
pass_filenames = true
files = "^src-tauri/migrations/.*\\.sql$"
stages = ["pre-commit"]

[[repos]]
repo = "local"
[[repos.hooks]]
id = "migrations-rebuild-cascade-self-test"
name = "migrations: blocks rebuild guard self-test"
entry = "node scripts/check-migrations-rebuild-cascade.mjs --self-test"
language = "system"
pass_filenames = false
# The self-test also cross-checks the two other copies of the rebuild recipe
# (#3438): the ```sql block in migrations/AGENTS.md — which it now runs through
# the guard itself — and the `recipe` format string executed by
# `agents_md_table_rebuild_recipe_preserves_authoritative_state_606`. Those two
# files are inputs to the self-test, so editing either has to re-run this hook
# or the drift check would only fire on an unrelated later commit.
files = "^(scripts/check-migrations-rebuild-cascade\\.mjs|src-tauri/migrations/AGENTS\\.md|src-tauri/src/db/tests\\.rs)$"
stages = ["pre-commit"]

# zizmor-version-pin: the zizmor version zizmor-hook.sh's
# ZIZMOR_PINNED_VERSION asserts against, and the `zizmor@X` entries in every
# `taiki-e/install-action` `tool:` list under .github/workflows/, are
# independent copies Dependabot cannot track (it bumps action refs, not tool
# strings passed as an action input) (#3523). This guard fails fast, on the
# commit that caused it, instead of letting the copies silently drift apart.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "zizmor-version-pin"
name = "zizmor: version pin consistency (hook script vs. workflow tool: lists)"
entry = "node scripts/check-zizmor-version-pin.mjs"
language = "system"
pass_filenames = false
files = "^(scripts/zizmor-hook\\.sh|\\.github/workflows/.*\\.ya?ml)$"
stages = ["pre-commit"]

[[repos]]
repo = "local"
[[repos.hooks]]
id = "zizmor-version-pin-self-test"
name = "zizmor: version pin consistency guard self-test"
entry = "node scripts/check-zizmor-version-pin.mjs --self-test"
language = "system"
pass_filenames = false
files = "^scripts/check-zizmor-version-pin\\.mjs$"
stages = ["pre-commit"]

# pairing-rejection-contract: the #855 pairing-proof rejection message is
# declared independently in Rust (`PAIRING_PROOF_REQUIRED_MESSAGE` in
# src-tauri/agaric-sync/src/sync_daemon/server.rs, the text that goes on the
# wire and — since #3491 — onto the rejecting device's own event sink) and in
# TypeScript (the same-named constant in src/components/dialogs/
# PairingDialog.tsx, which substring-matches it out of a generic sync error to
# say "wrong code"). The message crosses the boundary as free prose inside
# `SyncEvent::Error { message }`, so neither compiler sees the dependency and
# neither side's tests notice a reword: the dialog just silently loses its
# failure path and falls through to a five-minute timeout blaming an expired
# code (#3492). The guard also asserts each constant is the one actually used
# (wire arm / `.includes`), so an agreeing pair that nothing reads cannot pass.
#
# `files` names BOTH compared files — a cross-check scoped to only one side
# never fires on a change to the other, which is the #3619 bug.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "pairing-rejection-contract"
name = "pairing: proof-rejection message contract (server.rs vs. PairingDialog.tsx)"
entry = "node scripts/check-pairing-rejection-contract.mjs"
language = "system"
pass_filenames = false
files = "^(src-tauri/agaric-sync/src/sync_daemon/server\\.rs|src/components/dialogs/PairingDialog\\.tsx|scripts/check-pairing-rejection-contract\\.mjs)$"
stages = ["pre-commit", "pre-push"]

[[repos]]
repo = "local"
[[repos.hooks]]
id = "pairing-rejection-contract-self-test"
name = "pairing: proof-rejection contract guard self-test"
entry = "node scripts/check-pairing-rejection-contract.mjs --self-test"
language = "system"
pass_filenames = false
files = "^scripts/check-pairing-rejection-contract\\.mjs$"
stages = ["pre-commit", "pre-push"]

# zizmor: GitHub Actions security audit. Complements actionlint
# (which is style/correctness only) by catching unpinned `uses:`,
# missing `persist-credentials: false`, env-injection in
# `${{ github.* }}` interpolation, the `pull_request_target`
# exfil class, and similar workflow/composite-action security smells. Existing
# findings are baselined in `.github/zizmor.yml`; the hook fires for workflow
# and composite-action definitions, on new findings only.
# Install: `cargo install --locked zizmor@<pin>` (or `scripts/setup-hooks.sh`).
# The version is PINNED (#3476) — `ZIZMOR_PINNED_VERSION` in
# scripts/zizmor-hook.sh is the single source of truth, and the same version
# is pinned in the `tool:` lists of .github/workflows/_validate.yml and
# .github/workflows/scheduled-deep-checks.yml. It used to float on both sides,
# so local and CI ran different audit SETS: #3475 reddened every open PR with
# `ref-version-mismatch` findings from an audit that did not exist in the
# local binary, which no local run could have reproduced. The wrapper asserts
# the version it is about to run — hard failure in CI, visible warning
# locally.
#
# Routed through scripts/zizmor-hook.sh (#2535) rather than calling zizmor
# directly: zizmor's online audits (e.g. artipacked) hit the GitHub API, and
# a session-scoped local token can 401 there ("no audit was performed"),
# hard-failing pushes for reasons unrelated to the diff. The wrapper always
# runs the full online audit in CI (`CI` env set) and only degrades to
# `--no-online-audits` locally when api.github.com is unreachable/unauthorized.
# That degradation now ANNOUNCES itself and names the audits it skipped
# (#3476): prek prints only `Passed` for a green hook and swallows its output,
# so a degraded run and a full one used to look identical.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "zizmor"
name = "zizmor"
entry = "bash scripts/zizmor-hook.sh"
language = "system"
files = "^\\.github/(workflows/.*\\.ya?ml|actions/.*/action\\.ya?ml)$"
stages = ["pre-commit"]

# Self-test the wrapper's own behaviour whenever it changes: that a version
# mismatch fails CI and warns locally, and that every degradation path names
# the audits it skipped. Drives the wrapper against stub `zizmor`/`curl`
# binaries, so it needs no network and no real zizmor.
# scripts/setup-hooks.sh is in the pattern too (#3545): the self-test also
# cross-checks setup-hooks.sh — it executes that file's own
# `ZIZMOR_VERSION_AWK=$( … )` sourcing statement and its empty-value guard, and
# greps its `cargo_get_pinned` wiring. Matching only zizmor-hook.sh meant the
# guard did not fire locally on the very file it guards, so a commit touching
# setup-hooks.sh alone reached CI (`--all-files`) before anything complained.
[[repos.hooks]]
id = "zizmor-hook-self-test"
name = "zizmor wrapper self-test"
entry = "bash scripts/zizmor-hook.sh --self-test"
language = "system"
pass_filenames = false
files = "^scripts/(zizmor-hook|setup-hooks)\\.sh$"
stages = ["pre-commit"]

# setup-hooks-selftest (#3602): cargo_get used to try a crate's latest
# version FIRST and only retry a pinned version if that failed, so a crate
# CI pins to an exact version (sqruff, `sqruff@0.38.0` in the `tool:` lists
# of _validate.yml / scheduled-deep-checks.yml) could still resolve to a
# newer local install whenever binstall could fetch it — the pin was never
# reached. Drives the real `cargo_get`/`pinned_version_for`/
# `msrv_fallback_version_for` functions against a stubbed `cargo`/
# `cargo-binstall` that logs install requests in order, so the assertion is
# on ACTUAL PRECEDENCE (which version gets requested first), not just on the
# pin table's contents — no network, no real installs.
#
# The `files` pattern covers the WORKFLOWS as well as the script (#3619), for
# the same reason `zizmor-hook-self-test` above lists setup-hooks.sh: the
# self-test's Test 4 READS the workflows to cross-check their
# `sqruff@<version>` pins against the script's `pinned_version_for` table.
# Scoped to `^scripts/setup-hooks\.sh$` alone, bumping a `sqruff@` pin in
# _validate.yml or scheduled-deep-checks.yml without touching the script never
# fired this hook locally — which is precisely the drift direction the
# cross-check exists to catch, so the guard was blind to its own subject and
# nothing complained until CI's `--all-files` run.
#
# It matches ALL of .github/, not just the two files that carry a pin today,
# because that is exactly the tree Test 4b sweeps. Keep the two in step: any
# path the self-test READS but this pattern does not match is the #3619 bug
# again — a guard blind to part of its own subject, green locally and only
# caught by CI's `--all-files` run. Matching the whole tree costs nothing
# real; the self-test runs in well under a tenth of a second.
[[repos.hooks]]
id = "setup-hooks-selftest"
name = "setup-hooks.sh self-test (pin-vs-latest precedence)"
entry = "bash scripts/setup-hooks.sh --self-test"
language = "system"
pass_filenames = false
files = '^(scripts/setup-hooks\.sh|\.github/.+)$'
stages = ["pre-commit"]

# taplo: TOML lint + format. The `check-toml` builtin only validates
# parseability; taplo enforces consistent formatting across
# prek.toml, src-tauri/Cargo.toml, src-tauri/deny.toml, lychee.toml,
# .gitleaks.toml, and src-tauri/.config/nextest.toml. Repo-specific
# style overrides live in `.taplo.toml` (4-space indent, 200-col
# width, no auto-collapse). `fmt --check` is read-only — it never
# rewrites the file in the index.
# Install: `cargo install taplo-cli --locked`.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "taplo-fmt"
name = "taplo fmt --check"
# #817 EXCEPTION: taplo stays `--check` (read-only). Switching it to write
# mode reformats all TOML in a style the repo's .taplo.toml overrides reject,
# producing mass unrelated diffs — known issue, so this fmt hook is NOT
# converted to the auto-fix contract.
entry = "bash -c '. \"$HOME/.cargo/env\" && taplo fmt --check \"$@\"' --"
language = "system"
types = ["toml"]
stages = ["pre-commit"]
[[repos]]
repo = "local"
[[repos.hooks]]
id = "taplo-lint"
name = "taplo lint"
entry = "bash -c '. \"$HOME/.cargo/env\" && taplo lint \"$@\"' --"
language = "system"
types = ["toml"]
stages = ["pre-commit"]

# ─── mutation-testing machinery (#3330 / #3245 / #3257) ───────────
#
# The StrykerJS mutation lane is weekly, non-gating and — until #3330 —
# structurally incapable of failing, which made every silent breakage in
# its config or its triage loop invisible for as long as nobody happened
# to open a step summary. These four hooks move the detectable parts of
# that breakage forward to commit time.

# stryker-modules-paths: `stryker.modules.mjs` names the file each module
# mutates and the exact test files that scope the run. Nothing verified
# those strings still resolve, so a file move turned a module into a
# `| <mod> | _no report_ |` row and a never-wired test file made the lane
# re-report already-killed mutants as survivors for weeks (#3142: 78
# reported, 22 real). Cheap — one existsSync per declared path. Runs on any
# change to the config or to the source trees it points at. `src/stores/`
# joined that list in #3350, when `page-blocks-move.ts` was enrolled: a
# path-keyed hook only guards the paths its own regex matches, so widening
# the module set without widening this pattern would have left the newest
# and highest-value module the ONLY one no local guard covers.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "stryker-modules-paths"
name = "stryker.modules.mjs paths resolve"
entry = "node scripts/check-stryker-modules.mjs"
language = "system"
pass_filenames = false
files = '^(stryker\.modules\.mjs|src/lib/.*\.ts|src/stores/.*\.ts|\.github/workflows/mutation-pr\.yml)$'
stages = ["pre-commit"]

# Self-test the guard's own exit behavior (dangling src FAILS, dangling
# test file FAILS, empty test list FAILS, all-present PASSES) whenever the
# guard script itself changes, so a regression that defangs it can't land.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "stryker-modules-paths-selftest"
name = "stryker.modules.mjs path guard self-test"
entry = "node scripts/check-stryker-modules.mjs --self-test"
language = "system"
pass_filenames = false
files = '^scripts/check-stryker-modules\.mjs$'
stages = ["pre-commit"]

# mutation-reports-guard-selftest (#3330): the `mutants-frontend` lane's
# liveness guard is the ONLY thing that can turn that job red — its own
# `npm run mutation || true`, its `_no report_` summary rows and its
# `if-no-files-found: ignore` upload cannot. Re-run its fixture suite
# (missing reports root FAILS, dropped module FAILS, invalid JSON FAILS,
# zero mutants FAILS, healthy PASSES) whenever the guard or the module
# list it reads changes.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "mutation-reports-guard-selftest"
name = "mutation lane liveness guard self-test"
entry = "node scripts/check-mutation-reports.mjs --self-test"
language = "system"
pass_filenames = false
files = '^(scripts/check-mutation-reports\.mjs|stryker\.modules\.mjs)$'
stages = ["pre-commit"]

# mutants-scope (#3386): the Rust half of the same problem, and worse — the
# `mutants` lane produced ZERO coverage for its entire life. cargo-mutants
# reads its config from `src-tauri/.cargo/mutants.toml` and NOWHERE else; the
# file sat at `src-tauri/mutants.toml` from #866, so every setting in it was
# inert (whole-crate surface, `cargo test` instead of nextest, no
# exclude_globs) and the baseline failed → `total_mutants: 0`. Two more silent
# modes ride along: a glob whose files still EXIST but now live in a package
# the lane does not examine (the #2621 arch-wave move of op.rs / op_log /
# loro-engine — a pure existence check passes and the surface collapses
# anyway), and reader paths that drift from where cargo-mutants writes
# (`--output DIR` creates `DIR/mutants.out`, not `DIR`). Pure file/YAML/TOML
# reads, no cargo. Runs on the config, the workflow, and the invariant-core
# sources the globs name.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "mutants-scope"
name = "cargo-mutants scope is live and reachable"
entry = "node scripts/check-mutants-scope.mjs"
language = "system"
pass_filenames = false
files = '^(src-tauri/(\.cargo/)?mutants\.toml|src-tauri/Cargo\.toml|\.github/workflows/scheduled-deep-checks\.yml|src-tauri/(src/reverse|agaric-store/src|agaric-engine/src/loro)/.*\.rs)$'
stages = ["pre-commit"]

# Self-test the guard's own exit behavior (missing config FAILS, stray config
# FAILS, a glob outside the examined packages FAILS, `--output` nesting is
# modelled correctly) whenever the guard script itself changes, so a
# regression that defangs it can't land.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "mutants-scope-selftest"
name = "cargo-mutants scope guard self-test"
entry = "node scripts/check-mutants-scope.mjs --self-test"
language = "system"
pass_filenames = false
files = '^scripts/check-mutants-scope\.mjs$'
stages = ["pre-commit"]

# mutation-survivors-filer-selftest (#3245/#3257): the survivor tracking
# issue's body has already broken twice — once by listing every survivor
# under both "New this run" and the machine-readable block (doubling every
# count a triager reads), once by rendering an unbounded body that 422s
# `gh issue edit` and wedges the weekly job red with no self-healing path.
# The fixture suite pins both invariants: exactly one occurrence per
# survivor, and a clamped body whose marker block is never cut mid-way.
#
# It now also pins the PARENT/CHILD layer, which multiplies every mistake by
# the number of areas: the two marker blocks must not read each other's lines
# (either direction corrupts the tracked survivor set), a child must be found
# by its recorded number or adopted by its verbatim title rather than filed
# twice, the clamp must never drop the child block, and an unchanged week must
# issue no `gh` write at all — nine children refreshed every Monday is nine
# notifications a week and the end of anyone reading them. The last group is
# driven end to end against a stub `gh` on `$PATH`, so it fails if the writing
# path stops doing what the pure renderers say it does.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "mutation-survivors-filer-selftest"
name = "mutation-survivor filer self-test"
entry = "node scripts/file-mutation-survivors.mjs --self-test"
language = "system"
pass_filenames = false
files = '^scripts/file-mutation-survivors\.mjs$'
stages = ["pre-commit"]

# mutation-summary-renderer-selftest (#3350): the summary renderer is what a
# maintainer actually reads, and it has two properties that are easy to
# regress and impossible to notice from a green run — it orders modules by
# RISK rather than alphabetically (an alphabetical regression buries the one
# module worth looking at), and it CANNOT throw (a truncated `mutation.json`
# used to take the whole table down and leave a stack trace where the
# diagnosis should be, #3360). Both are pinned by its fixture suite.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "mutation-summary-renderer-selftest"
name = "mutation summary renderer self-test"
entry = "node scripts/render-mutation-summary.mjs --self-test"
language = "system"
pass_filenames = false
files = '^scripts/render-mutation-summary\.mjs$'
stages = ["pre-commit"]

# mutation-module-selector-selftest (#3350): the diff-scoped PR lane decides
# what to mutate from the PR's own diff. Two ways that goes wrong and neither
# is visible in a green run: selecting nothing when it should have selected
# something (the lane silently stops being a lane), or selecting everything
# because a repo-wide rename touched every module (the per-PR lane becomes the
# hours-long sweep #3350 refuses to put in front of a merge). The `--max` cap
# and the empty-selection case are both pinned by the fixture suite.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "mutation-module-selector-selftest"
name = "diff-scoped mutation module selector self-test"
entry = "node scripts/select-mutation-modules.mjs --self-test"
language = "system"
pass_filenames = false
files = '^(scripts/select-mutation-modules\.mjs|stryker\.modules\.mjs)$'
stages = ["pre-commit"]

# scheduled-failure-reporter-selftest (#3359): `report-scheduled-failures` is
# the ONLY thing that tells anyone a weekly deep-check lane went red — before
# it, the #3163 fuzz break survived five days unnoticed. Its fixture suite
# pins the parts that would silently un-notify: an absent `needs` payload must
# throw rather than read as "zero lanes failed" (the reporter's own
# false-green), `cancelled`/`skipped` must count as failures, the open/close
# state machine must not spam on an unchanged failure, and — keyed to the
# workflow file too — every lane in `scheduled-deep-checks.yml` must appear in
# the reporting job's `needs:`, so a newly added lane cannot go red into the
# void again.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "scheduled-failure-reporter-selftest"
name = "scheduled-failure reporter self-test"
entry = "node scripts/file-scheduled-failures.mjs --self-test"
language = "system"
pass_filenames = false
files = '^(scripts/file-scheduled-failures\.mjs|\.github/workflows/scheduled-deep-checks\.yml)$'
stages = ["pre-commit"]

# workflow-watchdog-selftest (#3374): every in-workflow reporter shares the
# fate of the workflow it reports on, so none of them can report "this
# workflow never ran". `workflow-watchdog.yml` is the out-of-band observer
# that can, and `scripts/check-workflow-liveness.mjs` is what it runs. Its
# fixture suite pins the parts that would silently un-notify: a stale or
# never-run workflow must NOT read as healthy, an unparseable `createdAt` must
# throw rather than compare false against every window, a `gh` that fails or
# returns non-JSON must throw AND write no results file (a half-written file
# reads to the filer as "nothing is failing" and CLOSES the tracking issue),
# and the self-watch must exclude the in-flight run so it is capable of
# failing at all. Keyed to the whole workflows directory as well, because the
# `WATCHED` list must stay in lockstep with the crons on disk in BOTH
# directions — a new scheduled workflow nobody watches is the original bug.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "workflow-watchdog-selftest"
name = "scheduled-workflow watchdog self-test"
entry = "node scripts/check-workflow-liveness.mjs --self-test"
language = "system"
pass_filenames = false
files = '^(scripts/check-workflow-liveness\.mjs|\.github/workflows/.*\.ya?ml)$'
# fuzz-findings-filer-selftest (#3360): the fuzz filer is the sibling of
# `file-mutation-survivors.mjs` and the more complex of the two — libFuzzer log
# excerpting, MAX_EXCERPT_LINES/CHARS bounds, marker-block state, the same
# unguarded `execFileSync('gh', ...)` write path — and it was the one WITHOUT a
# fixture suite. The suite pins what silently un-reports a fuzz failure: the
# manifest-vs-glob target list (a partial artifact must not make a target
# vanish), the excerpt/ID bounds, one finding per non-ok status, the `[lane]`
# fallback firing on failure/cancelled only, a marker block that round-trips,
# and the body clamp ladder that keeps `gh issue edit` from 422ing the weekly
# job red forever.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "fuzz-findings-filer-selftest"
name = "fuzz-findings filer self-test"
entry = "node scripts/file-fuzz-findings.mjs --self-test"
language = "system"
pass_filenames = false
files = '^scripts/file-fuzz-findings\.mjs$'
stages = ["pre-commit"]

# ─── bench lane coverage (#3362) ──────────────────────────────────
#
# `bench-smoke` shards every bench EXCEPT the ones `bench-slo` warm-runs. That
# exclusion used to be a hardcoded `grep -vx interactive_slo` with nothing
# asserting `bench-slo` still covered it: rename the bench, rename the job, or
# drift its list, and the project's only automated latency signal ran in
# NEITHER lane while every shard still exited 0. The workflow now derives both
# lanes from one `SLO_BENCHES` variable and asserts the union at run time; this
# hook holds the half the workflow cannot check about itself — that both jobs
# still exist and still read that variable outside comments — and re-checks
# every name in it against `cargo metadata` (~30 ms, no compile) whenever the
# workflow, the manifest or the guard changes.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "bench-lane-coverage"
name = "bench lanes cover every bench target"
entry = "node scripts/check-bench-lane-coverage.mjs"
language = "system"
pass_filenames = false
files = '^(\.github/workflows/scheduled-deep-checks\.yml|src-tauri/Cargo\.toml|src-tauri/benches/.*\.rs|scripts/check-bench-lane-coverage\.mjs)$'
stages = ["pre-commit"]

# Self-test the guard's own exit behavior (deleted bench-slo job FAILS, renamed
# bench FAILS, hardcoded exclusion FAILS, a comment-only mention of SLO_BENCHES
# FAILS, empty universe FAILS, healthy PASSES) so a regression defang cannot
# land. The comment-only case is the load-bearing one: the workflow explains
# this wiring in prose right next to the code, so a reference check that
# accepted any mention would be satisfied by its own documentation.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "bench-lane-coverage-selftest"
name = "bench lane coverage guard self-test"
entry = "node scripts/check-bench-lane-coverage.mjs --self-test"
language = "system"
pass_filenames = false
files = '^scripts/check-bench-lane-coverage\.mjs$'
stages = ["pre-commit"]

# ─── pre-push only ────────────────────────────────────────────────
#
# A single chokepoint hook runs `scripts/verify-ci-equivalent.sh`. It is
# NOT a full CI mirror: it re-scopes vitest/nextest to the commit range
# being pushed (Phases C/D), re-runs the pre-commit-stage prek hooks
# whole-tree but category-aware (Phase A), gates sqlx-prepare/MCP
# phases on whether Rust/MCP paths changed (Phases E/F), and explicitly
# SKIPS Playwright locally (CI still runs the full e2e suite on every
# PR). See the script's own header comment for the full phase list and
# rationale.
#
# Sequential, not parallel (each phase can depend on the previous
# phase's setup, e.g. Phase B's externalBin placeholder before Phase D's
# `cargo nextest`).
#
# PREFERRED PUSH PATH: `scripts/push.sh` runs this verification BEFORE
# `git push` opens any SSH connection, then pushes with a
# `SKIP_CI_VERIFY=<reason>` so this hook short-circuits and the fresh
# connection is used immediately. Plain `git push` still auto-verifies
# here, but holds the SSH connection open for the whole run — on a slow
# verify GitHub closes the idle connection and the pack send fails
# ("Connection closed by remote host"). Use `scripts/push.sh`.
#
# Escape hatch (CI-R16): `SKIP_CI_VERIFY='<reason>' git push` short-circuits
# the script. The reason must be a descriptive string (≥8 chars) — a bare
# `SKIP_CI_VERIFY=1` is REJECTED so the hatch stays a deliberate one-off
# (docs-only typo fixes, etc.) rather than the default push path. Anything
# that touches source code should let the verifier run.
#
# Release pre-flight (cargo tauri bundle build for the local OS) is
# NOT here — too slow for daily push cadence. Run
# `scripts/verify-release-build.sh` manually before tagging a release.

# skip-ci-verify-guard (CI-R16): whenever the bypass guard or its caller
# changes, re-run the guard's reject/accept smoke test so a regression
# (e.g. accidentally re-allowing `SKIP_CI_VERIFY=1`) is caught at commit
# time. Fast — only the guard's early-exit branches are exercised.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "skip-ci-verify-guard"
name = "SKIP_CI_VERIFY bypass guard test"
entry = "bash scripts/test-skip-ci-verify-guard.sh"
language = "system"
pass_filenames = false
files = '^scripts/(verify-ci-equivalent|push|test-skip-ci-verify-guard)\.sh$'
stages = ["pre-commit"]

# verify-ci-equivalent-selftest (#3257): Phase E's sqlx probe databases
# used a machine-global fixed /tmp path, so two concurrent pushes from
# different worktrees — this project's standard parallel-batch workflow —
# deleted each other's database mid-`prepare --check` and produced a
# spurious Phase E failure blaming sqlx. The fixture suite asserts the
# per-invocation allocation and cleanup, plus a ratchet that fails if the
# fixed path ever comes back. Fast: exercised before the verifier body.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "verify-ci-equivalent-selftest"
name = "pre-push verifier self-test (sqlx probe isolation)"
entry = "bash scripts/verify-ci-equivalent.sh --self-test"
language = "system"
pass_filenames = false
files = '^scripts/verify-ci-equivalent\.sh$'
stages = ["pre-commit"]

# push-sh-selftest (#3380): push.sh used to exit 0 when the final `git
# push` itself failed (a connection drop mid-push reported "Connection
# closed by remote host" yet the script still reported success — the
# remote ref never moved). The fixture suite below exercises
# push_with_retry (propagates git push's real exit status; bounded retry
# ONLY on a known-transient connection-drop signature, never on a hard
# failure) and verify_landed (the actual guarantee: compares local HEAD
# against `git ls-remote` after a "successful" push and fails loudly on
# any mismatch or unreadable remote) against a stubbed `git` — no
# network, no repo mutation. Fast: runs before any real work in the
# script.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "push-sh-selftest"
name = "push.sh self-test (push-failure propagation + postcondition)"
entry = "bash scripts/push.sh --self-test"
language = "system"
pass_filenames = false
files = '^scripts/push\.sh$'
stages = ["pre-commit"]

# print-coverage-thresholds-selftest (#3258): this script derives the
# coverage-threshold clause live from `vitest.config.ts` instead of a
# hardcoded copy. Its own fixture suite (missing-metric rejection, absent-
# block rejection, fractional-value preservation, and a live anchor against
# the real on-disk config) must re-run whenever the script changes, so a
# regression that defangs the extraction can't land silently.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "print-coverage-thresholds-selftest"
name = "coverage-thresholds derivation self-test (#3258 fixtures)"
entry = "node scripts/print-coverage-thresholds.mjs --self-test"
language = "system"
pass_filenames = false
files = '^scripts/print-coverage-thresholds\.mjs$'
stages = ["pre-commit"]

[[repos]]
repo = "local"
[[repos.hooks]]
id = "verify-ci-equivalent"
name = "verify CI-equivalent"
entry = "bash scripts/verify-ci-equivalent.sh"
language = "system"
pass_filenames = false
stages = ["pre-push"]

# ─── post-commit ──────────────────────────────────────────────────
#
# Loud commit sentinel (#819 (7)). rtk's git-commit filter prints
# "ok N files changed" even when a pre-commit hook ABORTS the commit
# (HEAD does not move), which has repeatedly masked failed commits.
# Until rtk checks git's exit status upstream, this post-commit hook
# prints an unmistakable `COMMITTED <sha>` line that only appears
# when a commit actually landed — its absence after a commit attempt
# means the commit was rejected. Re-run `prek install` once so the
# post-commit git shim gets installed (`default_install_hook_types`
# at the top of this file makes plain `prek install` write it).
#
# `verbose = true` is load-bearing: prek swallows a PASSING hook's
# stdout, so without it only the static hook name prints and the
# actual sha never appears (verified against prek 0.3.8).
#
# Known limit (verified): `rtk git commit` collapses SUCCESS output
# to "ok N files changed", swallowing this line too — the sentinel
# is visible via bare `git commit` / `rtk proxy git commit`. On a
# hook ABORT, rtk passes the raw Failed output through and exits 1,
# so absence-of-COMMITTED plus exit status still disambiguates.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "commit-sentinel"
name = "commit sentinel (COMMITTED <sha>)"
entry = "bash -c 'echo \"COMMITTED $(git rev-parse --short=12 HEAD)\"'"
language = "system"
stages = ["post-commit"]
always_run = true
pass_filenames = false
verbose = true
