# main-module-detection (#3373): every guard/filer script in scripts/ gates
# its `main()` on "am I the process entry point?", so that a vitest test can
# import its pure helpers without the module `process.exit()`ing out of the
# importer. Three different idioms had drifted in, and all three compare
# `import.meta.url`/`import.meta.filename` — the RESOLVED REAL path, Node
# realpaths the entry specifier — against `process.argv[1]`, the path AS
# INVOKED. Reach the script through a symlinked scripts/ dir, a symlinked
# repo root or a symlinked checkout and the two differ: the check is false,
# `main()` never runs, and the guard EXITS 0 HAVING DONE NOTHING — which is
# indistinguishable from a clean pass. The `file://` template form
# additionally breaks on any path containing a space, because
# `import.meta.url` percent-encodes it and the interpolation does not.
# This guard bans both shapes across scripts/**.mjs plus the repo-root
# *.mjs, and requires the one sanctioned form:
#     !!process.argv[1] &&
#       realpathSync(import.meta.filename) === realpathSync(process.argv[1])
# (`fs.realpathSync` equally accepted). NOT `import.meta.main`: its old
# version-floor rationale is now moot (engines.node is the derived
# `^22.22.2 || ^24.15.0 || >=26.0.0`, and both line floors are above its
# "Added in: v24.2.0, v22.18.0"), but it remains banned because it compares
# the specifier AS SPELLED and so misjudges a script reached through a
# symlink (#3373). The guard scans scripts/ INCLUDING ITSELF, with no
# self-exemption; its own literal instances of the banned forms live in
# comments (stripped) or are assembled from fragments at runtime.
# pass_filenames=false — the script does its own scoped walk.
[[repos.hooks]]
id = "main-module-detection"
name = "Symlink-safe entry-point detection in scripts (#3373)"
entry = "node scripts/check-main-module-detection.mjs"
language = "system"
pass_filenames = false
files = "^(scripts/.*\\.(mjs|js)|[^/]+\\.(mjs|js))$"
stages = ["pre-commit"]

