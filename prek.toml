[[repos.hooks]]
id = "unanchored-content-regex-selftest"
name = "Unanchored-content-regex guard self-test"
entry = "node scripts/check-unanchored-content-regex.mjs --self-test"
language = "system"
pass_filenames = false
files = "^scripts/check-unanchored-content-regex\\.mjs$"
stages = ["pre-commit"]

# main-module-detection (#3373): every guard/filer script in scripts/ gates
# its `main()` on "am I the process entry point?", so that a vitest test can
# import its pure helpers without the module `process.exit()`ing out of the
# importer. Three different idioms had drifted in, and all three compare
# `import.meta.url`/`import.meta.filename` — the RESOLVED REAL path, Node
# realpaths the entry specifier — against `process.argv[1]`, the path AS
# INVOKED. Reach the script through a symlinked scripts/ dir, a symlinked
# repo root or a symlinked checkout and the two differ: the check is false,
# `main()` never runs, and the guard EXITS 0 HAVING DONE NOTHING — which is
# indistinguishable from a clean pass. The `file://` template form
# additionally breaks on any path containing a space, because
# `import.meta.url` percent-encodes it and the interpolation does not.
# This guard bans both shapes across scripts/**.mjs plus the repo-root
# *.mjs, and requires the one sanctioned form:
#     !!process.argv[1] &&
#       realpathSync(import.meta.filename) === realpathSync(process.argv[1])
# (`fs.realpathSync` equally accepted). NOT `import.meta.main`: its old
# version-floor rationale is now moot (engines.node is the derived
# `^22.22.2 || ^24.15.0 || >=26.0.0`, and both line floors are above its
# "Added in: v24.2.0, v22.18.0"), but it remains banned because it compares
# the specifier AS SPELLED and so misjudges a script reached through a
# symlink (#3373). The guard scans scripts/ INCLUDING ITSELF, with no
# self-exemption; its own literal instances of the banned forms live in
# comments (stripped) or are assembled from fragments at runtime.
# pass_filenames=false — the script does its own scoped walk.
[[repos.hooks]]
id = "main-module-detection"
name = "Symlink-safe entry-point detection in scripts (#3373)"
entry = "node scripts/check-main-module-detection.mjs"
language = "system"
pass_filenames = false
files = "^(scripts/.*\\.(mjs|js)|[^/]+\\.(mjs|js))$"
stages = ["pre-commit"]

# Self-test the main-module-detection guard's own exit behavior whenever it
# changes: each banned shape FAILS, the sanctioned form and commented-out
# shapes PASS, the CLI really exits 1 on a violating fixture and 2 on a
# missing layout, the guard scans its own source (no self-exemption), and —
# the #3373 regression test proper — a real script invoked through a
# symlinked scripts/ dir, this guard invoked through that same symlink, and
# a script whose path contains a space all actually RUN. Before the fix all
# three of those produced empty output and exit 0.
[[repos.hooks]]
id = "main-module-detection-selftest"
name = "Entry-point detection guard self-test"
entry = "node scripts/check-main-module-detection.mjs --self-test"
language = "system"
pass_filenames = false
# #3788 — `file-mutation-survivors.mjs` is in this pattern because the self-test
# READS AND EXECUTES it: two of the #3373 assertions run
# `file-mutation-survivors.mjs --self-test` for real, once through a symlinked
# `scripts/` dir and once from a copy in a path containing a space, and assert
# "self-test: all assertions passed" in its stdout. Keyed on this guard's own
# file alone, a commit touching only the filer — exactly the commit that can
# break those two assertions — never ran the hook that checks them.
files = "^scripts/(check-main-module-detection|file-mutation-survivors)\\.mjs$"
stages = ["pre-commit"]

# persist-hooks (#3352, split out of #3323): `pageBrowserFilters.ts` shipped
# a `persist()` of a non-scalar shape (a `Record<string, PageFilterWithKey[]>`
# plus a counter) with neither a `migrate` nor a `merge` hook. A malformed
# `localStorage` blob threw the page browser into its error boundary and
# permanently broke the counter via string concatenation. #3323 fixed that
# one store; safe-persist-storage.ts:12-13 states "the read path
# (migrate/merge) is already hardened per-store" as an invariant enforced
# only by convention — this project has paid for exactly this bug class
# five times (#753, #823, #1578, #1609, #3323). Both hooks are required,
# not just `migrate`: per search-history.ts (see the "zustand skips
# `migrate`" comment there), zustand only invokes `migrate` when the
# persisted blob's version differs from `options.version` — a same-version
# corrupt blob bypasses `migrate` entirely and reaches `merge` (or the
# unvalidated default shallow merge) directly. This guard derives
# "non-scalar" STRUCTURALLY from each store's state interface (every
# `partialize`d field's declared type), not from a hardcoded filename
# allowlist — an unresolvable type (a bare alias, a helper-delegated
# partialize) is conservatively treated as non-scalar. `space.ts` and
# `useDebugStore.ts` need no exemption entry: their single persisted field
# is a plain `string | null` / `boolean`, which the interface alone proves
# scalar. A per-site `// persist-hooks-allow: <reason>` marker (empty
# reason does not suppress) is the escape hatch for a shape this guard
# cannot see through; there is no baseline file because the live tree
# currently has zero pre-existing violations.
# pass_filenames=false — the script does its own scoped walk of src/stores/.
# Keyed to the shared scanner the guard delegates its comment/string
# scanning to (#3993) as well as its own script, so an edit to either
# re-runs the check.
[[repos.hooks]]
id = "persist-hooks"
name = "Non-scalar persist() must declare migrate AND merge (#3352)"
entry = "node scripts/check-persist-hooks.mjs"
language = "system"
pass_filenames = false
files = "^(src/stores/.*\\.(ts|tsx)|scripts/(check-persist-hooks\\.mjs|lib/js-scanner\\.mjs))$"
stages = ["pre-commit"]

# Self-test the persist-hooks guard's own exit behavior whenever it — or the
# shared scanner it delegates its lexing to (#3993) — changes:
# a non-scalar persist() missing migrate, missing merge, or missing both all
# FAIL (including the search-history.ts shape — merge present, migrate
# absent); two scalar-only stores (mirroring space.ts and useDebugStore.ts)
# with neither hook PASS via the interface, not a filename; a reasoned
# persist-hooks-allow marker suppresses, an empty-reason marker does not;
# and the guard is proven to scan only its synthetic src/stores/ fixture
# tree (or the real repo's), never its own scripts/ source.
[[repos.hooks]]
id = "persist-hooks-selftest"
name = "Persist-hooks guard self-test"
entry = "node scripts/check-persist-hooks.mjs --self-test"
language = "system"
pass_filenames = false
files = "^scripts/(check-persist-hooks|lib/js-scanner)\\.mjs$"
# metric-provable (#3349, theme T6 "accounting for conditions that cannot
# occur, read as health"): every metric must have a test proving it can
# fire. `[profile.release]` sets `panic = "abort"` — deliberately and with
# a documented rationale — yet `materializer/consumer.rs` bumps `fg_panics`
# / `bg_panics` on the `JoinError::is_panic` arm of a `tokio::spawn` join,
# an arm that requires an unwind the release profile makes impossible. A
# counter that cannot move is worse than dead code: an operator auditing
# panic rates reads zero and concludes the system is healthy, exactly as a
# check that cannot fail reads as a passing gate.
#
# The metric surface is enumerated structurally, not from a list: every
# `<name>: Atomic…` field of `QueueMetrics`, plus every module that
# pairs a `static NAME: Atomic…` with a `fn count()` (the repo's
# process-global counter idiom — `sql_only_fallback`, `divergence`,
# `cycle_rejected_metrics`, `snapshot_fallback_metrics`,
# `descendant_fanout_dropped`). Three rules:
#   - `no-firing-test` — no test asserts the metric ABOVE ITS SEED. A test
#     that asserts it IS zero is not a proof; it is what `fg_panics`,
#     `fg_full_waits` and `bg_full_waits` have today, and it would pass
#     unchanged after the emit site was deleted. String literals are
#     blanked before matching so an assertion MESSAGE naming the metric
#     cannot launder a proof onto it. The bar is the value `impl Default`
#     seeds the field with, not the constant zero (#3707): two fields are
#     seeded non-zero at construction — `fts_last_optimize_ms` to `now_ms`
#     and `cached_op_log_count` to the `u64::MAX` "never computed" sentinel
#     — so `assert!(m > 0)` on either holds from birth, passes on a value
#     that never reached the code under test, and keeps passing with the
#     production `.store(…)` physically deleted. For a seeded field only a
#     comparison against a BINDING, or a literal the seed does not already
#     satisfy, is credited.
#   - `no-production-emit` — nothing outside test code can move it.
#   - `unreachable-under-panic-abort` — every emit site is inside a
#     panic-detection branch while the release profile aborts. Inert if
#     `[profile.release]` stops saying `panic = "abort"`.
# Exemptions are explicit: a per-declaration
# `// metric-fire-exempt(<rule>): <reason>` marker (empty reason does not
# suppress, and the marker is rule-scoped), or an entry in
# scripts/metric-firing-baseline.json, which is a ratchet — a stale entry
# FAILS and an entry with no `reason` is a hard error.
# pass_filenames=false — the script does its own scoped walk of src-tauri/.
# `files` includes the script itself: without it, a commit that touches only
# the guard runs the self-test but never re-evaluates the LIVE tree, so a
# change that made a real metric violate would land green.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "metric-provable"
name = "Every metric must have a test proving it can fire (#3349)"
entry = "node scripts/check-metric-provable.mjs"
language = "system"
pass_filenames = false
files = "^(src-tauri/(src|[^/]+/src|[^/]+/[^/]+/src)/.*\\.rs|src-tauri/Cargo\\.toml|scripts/(check-metric-provable\\.mjs|metric-firing-baseline\\.json))$"
stages = ["pre-commit"]

# Self-test the metric-provable guard's own exit behavior whenever it
# changes: a zero-only assertion, a test-only write, a panic-gated emit
# under `panic = "abort"`, an empty-reason marker, a wrong-rule marker, a
# stale baseline entry, two metrics colliding on one id, and a newly-added
# counter all FAIL with a real non-zero exit from a real subprocess; a
# firing assertion, a reasoned marker, a reasoned baseline entry, the same
# panic-gated emit under `panic = "unwind"`, and a process-global config
# atomic with no `count()` all PASS. A bound firing comparison
# (`let rose = m.x > before;`) is NOT a proof however it is later READ —
# logged, tested by a no-op `if`, or rebound — because none of those can
# fail; it IS a proof when an `assert!` is what reads it, which is the line
# #3384 drew between the two. Each #3384 widening carries its sibling
# rejection: an equality against a SQL ground truth counts while the same
# equality against a projection of the same counter — or against a SQL read
# parameterised by the counter itself — does not; `if o.was_panic`
# is a panic gate while `if !o.panicked` is not; a second `…Metrics` struct is
# enumerated while a struct named otherwise is not; a type-aliased or
# `Arc`-wrapped atomic is a counter while an `AtomicBool` and a `f64` alias are
# not. Enumeration is pinned against silent narrowing: the exact
# `scanRoots` set, the exact set of metric-declaring files, and the
# declaration variants Rust allows (`pub(crate)`, no trailing comma, a
# path-qualified type, a non-U64 atomic, a static inside a `mod`). It also
# asserts the guard reads nothing outside src-tauri/, reads only `.rs`, and
# that this script's own path lies under no scan root (so it cannot match its
# own source, fixtures or baseline) and that the live release profile really
# is `panic = "abort"`, without which rule 3 would be silently inert. Evidence
# is scoped to test code on both sides: an `assert!` in production code is not
# a firing test, and a module's own mutator definition is not a production
# caller of it — both were credited until #3384's review pinned them. #3707's
# seed rule carries the same pairing: `> 0` and `!= 0` on a metric seeded to 7
# are rejected while `> 7`, `!= 7` and `after > before` are credited; the
# bound-predicate form (`let ok = m > 0; assert!(ok)`) cannot smuggle the
# tautology back in; and the live seeded SET is read out of `impl Default`
# rather than written down, so a rename that makes the parse return nothing
# fails loudly instead of silently restoring the hole for every field at once.
#
# Keyed to `metrics.rs` as well as to the guard's own source (#3728). The
# self-test's live-tree assertions READ that file — that the non-zero-seeded
# set is exactly `fts_last_optimize_ms` and `cached_op_log_count`, and that
# every `QueueMetrics` field is matched inside `impl Default` — so a
# `metrics.rs`-only edit was precisely the commit where they did not run. The
# `metric-provable` hook is keyed to `metrics.rs` and still catches a real
# violation; what was skipped is the ENUMERATION pin, which is what catches a
# `Default` block the parser stopped understanding — the failure that silently
# zeroes every seed and re-opens #3707's hole for every field at once.
[[repos.hooks]]
id = "metric-provable-selftest"
name = "Metric-provability guard self-test"
entry = "node scripts/check-metric-provable.mjs --self-test"
language = "system"
pass_filenames = false
files = "^(scripts/check-metric-provable\\.mjs|src-tauri/src/materializer/metrics\\.rs)$"
stages = ["pre-commit"]

# snapshot-redaction: scan every `*.snap` file under `src/` and
# `src-tauri/` for unredacted ULIDs (26-char Crockford base32),
# blake3 hashes (64-char lowercase hex), ISO-8601 timestamps with a
# time component, and base64url cursors. Values that appear verbatim
# in any `src-tauri/src/**/*.rs` source file are auto-allowlisted as
# deterministic test fixtures (per src-tauri/tests/AGENTS.md:319 —
