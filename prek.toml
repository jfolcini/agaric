# fixture (`git init`, in a command line or an argv array) without wiring
# itself to that helper at all. `.mjs` and `.py` joined the scan in #4015:
# the scanner was `.sh`-only, and a `.mjs` self-test added in #3962 duly
# leaked, enumerating the real repository's 4,610 paths in place of its
# 8-file fixture with every assertion green. `always_run`
# because this is a whole-tree scan (pass_filenames = false) whose job is
# partly to catch a DELETION — e.g. a script's sourcing line getting
