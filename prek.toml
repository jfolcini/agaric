# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.

# All five git shims this config relies on (#819 (7) / #817): a plain
# `prek install` only writes `.git/hooks/pre-commit` by default, so
# without this list the prepare-commit-msg (dco-signoff), pre-push
# (verify-ci-equivalent), post-commit (commit-sentinel), and commit-msg
# (conventional-pre-commit) stages would silently never fire on a fresh
# clone. The `commit-msg` shim was missing before #817, so the
# Conventional-Commits hook never actually ran locally. Verified against
# prek 0.3.8: `prek install` with this key writes all five shims; run
# `prek install -f` once on an existing clone to add the new commit-msg
# shim.
default_install_hook_types = ["pre-commit", "commit-msg", "prepare-commit-msg", "pre-push", "post-commit"]

[[repos]]
repo = "builtin"
# Stage pinning (#817): every stage-less hook below is re-run by Phase A
# of the pre-push verifier (`prek run --all-files --hook-stage pre-commit`),
# so pinning each to `stages = ["pre-commit"]` makes it run once at commit
# AND exactly once per push (via Phase A) instead of the previous up-to-3×
# (pre-commit shim + pre-push shim + Phase A re-run).
hooks = [
    # `src/lib/bindings.ts` is tauri-specta-generated (already excluded from
    # oxfmt/oxlint/knip). The generator emits trailing whitespace in doc
    # comments and a trailing blank line, so these two whitespace fixers strip
    # them and make `specta_tests::ts_bindings_up_to_date` fail (committed !=
    # generated). Exclude the generated file from both, like the other formatters.
    { id = "trailing-whitespace", exclude = "(\\.(png|ico|icns|svg)$|^src/lib/bindings\\.ts$)", stages = [
        "pre-commit",
    ] },
    { id = "end-of-file-fixer", exclude = "(\\.(png|ico|icns|svg)$|^src/lib/bindings\\.ts$)", stages = [
        "pre-commit",
    ] },
    { id = "check-yaml", stages = [
        "pre-commit",
    ] },
    { id = "check-toml", stages = [
        "pre-commit",
    ] },
    { id = "check-json", exclude = "(tsconfig.*\\.json$|\\.sqlx/)", stages = [
        "pre-commit",
    ] },
    { id = "check-merge-conflict", stages = [
        "pre-commit",
    ] },
    { id = "check-added-large-files", args = [
        "--maxkb=500",
    ], exclude = "^docs/session-log/", stages = [
        "pre-commit",
    ] },
    { id = "no-commit-to-branch", args = [
        "--branch=main",
    ], stages = [
        "pre-push",
    ] },
    # The `src-tauri/...` alternation is deliberately narrow: `exclude` is a regex
    # filter, not an existence assertion, so an alternation naming a deleted file
    # silently stops matching and nobody notices. The two mTLS-era entries
    # (`agaric-sync/src/sync_cert.rs`, `src/sync_net/tests.rs`) were dropped in
    # #3510 when the iroh cutover deleted those files; keep this list pruned.
    { id = "detect-private-key", exclude = "^src-tauri/src/sync_daemon/tests\\.rs$|^SESSION-LOG\\.md$|^docs/session-log/", stages = [
        "pre-commit",
    ] },
    # Catch the "I added a script but forgot chmod +x" / "I marked a non-executable as +x" class of mistake.
    # scripts/ mixes .sh, .mjs, and .py files that all rely on shebangs + +x bits. `*.rs` is excluded
    # because Rust's inner-attribute syntax `#![...]` looks like a shebang to this builtin and gives
    # unactionable false positives on every test module under src-tauri/src/commands/tests/.
    { id = "check-shebang-scripts-are-executable", exclude = "\\.rs$", stages = [
        "pre-commit",
    ] },
    { id = "check-executables-have-shebangs", stages = [
        "pre-commit",
    ] },
    # Normalise CRLF leakage from non-Linux contributors.
    { id = "mixed-line-ending", args = [
        "--fix=lf",
    ], stages = [
        "pre-commit",
    ] },
]

# Secret scanning (gitleaks)
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"       # v8.30.1
hooks = [{ id = "gitleaks", stages = ["pre-commit"] }]

# Conventional Commits enforcement on commit-msg stage.
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "91ab4bf57e58b32adf1a122681f6ebe164d081c8"                                 # v4.4.0
hooks = [{ id = "conventional-pre-commit", stages = ["commit-msg"], args = [] }]

# DCO sign-off auto-append. Mirrors `git commit -s` so the DCO check on
# CI (.github/workflows/dco.yml) never rejects a PR for a forgotten
# `-s`. Runs at prepare-commit-msg so the trailer lands before the
# editor opens (or before the commit lands for `-m`). The framework
# passes the commit message file as the single argument when
# `pass_filenames = true` at this stage.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "dco-signoff"
name = "DCO sign-off (auto-append)"
entry = "bash scripts/dco-signoff.sh"
language = "system"
stages = ["prepare-commit-msg"]
pass_filenames = true
always_run = true

# GitHub Actions workflow lint (catches missing `permissions:` blocks,
# bad uses syntax, deprecated set-output usage, etc.). Closes the
# `actions/missing-workflow-permissions` class of CodeQL findings
# locally instead of letting them surface on push.
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca"         # v1.7.12
hooks = [{ id = "actionlint", stages = ["pre-commit"] }]

# OXC: lint (oxlint) + format check (oxfmt) for JS/TS
[[repos]]
repo = "local"
[[repos.hooks]]
id = "oxlint"
name = "oxlint"
entry = "npx oxlint --report-unused-disable-directives-severity=error"
language = "system"
types_or = ["javascript", "jsx", "ts", "tsx"]
exclude = "(src/lib/bindings\\.ts$|\\.sqlx/)"
pass_filenames = true
stages = ["pre-commit"]
# Auto-fix formatter (#817): `oxfmt` writes in place (its default mode) so a
# formatting miss is mechanically corrected + re-staged instead of aborting
# the commit with a manual fixup step. This matches the prek "fixer" contract
# used by the builtin trailing-whitespace / end-of-file-fixer hooks: the hook
# mutates the file, prek detects the modification and fails the run, and the
# user re-stages the now-formatted file. (taplo stays `--check` below — writing
# it conflicts with the repo's .taplo.toml style overrides.)
[[repos.hooks]]
id = "oxfmt"
name = "oxfmt (write)"
entry = "npx oxfmt --write"
language = "system"
types_or = ["javascript", "jsx", "ts", "tsx", "json", "css"]
# oxfmt errors (exit 2) when every passed file is internally ignored, which
# breaks lockfile-only commits: package(-lock).json matches `json` here but
# oxfmt won't format it. Exclude them so a deps-only commit has ≥1 target.
exclude = "(src/lib/bindings\\.ts$|\\.sqlx/|^package(-lock)?\\.json$)"
pass_filenames = true
stages = ["pre-commit"]

# TypeScript type checking — TypeScript 7.0's `tsc` IS the native (Go-port)
# compiler now, graduated from the `@typescript/native-preview` (`tsgo`)
# preview. Fast native typecheck (~8x faster than the old JS `tsc`). Binary
# ships prebuilt via platform optionalDependencies, so it resolves under
# `.npmrc` ignore-scripts=true.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "tsc"
name = "typescript check (tsc)"
entry = "npm run typecheck"
language = "system"
pass_filenames = false
types_or = ["ts", "tsx"]
stages = ["pre-commit"]

# tsc root-file drop guard (#3912): `tsc -b` (the hook above) silently
# DROPS a root file from a project's `include` set whenever it shares a
# basename with a same-directory sibling of a different TS extension —
# e.g. a `.ts` file makes tsc discard a same-named `.tsx` file, with no
# error, no warning, and a clean exit. That is exactly how
# `src/hooks/__tests__/useStarredPages.test.tsx` went unchecked since it
# was added — the `tsc` hook above was green the entire time. This guard
# independently re-derives each of the five referenced tsconfig projects'
# intended `.ts`/`.tsx` root-file set from their raw include/exclude
# patterns (without replicating tsc's same-basename collapsing) and
# fails if it disagrees with what `tsc -p <project> --showConfig`
# actually resolved — in either direction, so its own pattern-resolution
# model can't quietly drift from tsc's either. always_run — this scans
# the whole tree itself (pass_filenames=false) and a NEW collision is
# always introduced by an add/rename that `files` would catch, but a
# regression in the guard script itself (scripts/check-tsc-root-files.mjs)
# must still be caught even on a commit that touches neither .ts/.tsx
# source nor the script (#3722-class lesson: prek's changed-file set
# excludes deletions, so a trigger regex is not a substitute for running
# the check).
[[repos.hooks]]
id = "tsc-root-files"
name = "tsc root-file drop guard (#3912)"
entry = "node scripts/check-tsc-root-files.mjs"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

# Self-test the tsc root-file drop guard's own exit behavior (a real
# a.ts/a.tsx collision, driven end-to-end through the real
# `tsc -p ... --showConfig`, FAILS; renaming away the collision PASSES;
# plus the pure include/exclude pattern-resolution cases) whenever the
# guard script itself changes, so a regression that defangs it can't
# land.
[[repos.hooks]]
id = "tsc-root-files-self-test"
name = "tsc root-file drop guard self-test (#3912 fixtures)"
entry = "node scripts/check-tsc-root-files.mjs --self-test"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

# CSS variable wrapper guard — theme uses oklch(), so hsl()/rgb() wrappers are invalid
[[repos]]
repo = "local"
[[repos.hooks]]
id = "no-hsl-rgb-var-wrap"
name = "no hsl/rgb wrapping css vars"
entry = "bash -c 'if grep -rn \"hsl(var(--\\|rgb(var(--\" src/ --include=\"*.tsx\" --include=\"*.ts\" --include=\"*.css\"; then echo \"ERROR: Use var(--name) directly, not hsl(var(--name)) — theme uses oklch values\"; exit 1; fi'"
language = "system"
pass_filenames = false
types_or = ["ts", "tsx", "css"]
stages = ["pre-commit"]

# Sonner chokepoint guard — every production toast call must route through
# `src/lib/notify.ts` so the wrapper (Phase 3a, design-system-maintainability)
# stays the single source of truth. Allowed direct importers: the wrapper
# itself, the `Toaster` UI primitive that mounts the sonner provider, the
# test mock, and the global vitest setup that wires the mock.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "no-direct-sonner-import"
name = "no direct sonner import outside lib/notify + Toaster + tests"
entry = "bash -c 'if grep -rnE \"from ['\\''\\\"]sonner['\\''\\\"]\" src/ --include=\"*.ts\" --include=\"*.tsx\" --exclude-dir=__tests__ --exclude=\"*.test.ts\" --exclude=\"*.test.tsx\" | grep -vE \"^src/lib/notify\\.ts:|^src/components/ui/sonner\\.tsx:|^src/test-setup\\.ts:\"; then echo \"ERROR: import sonner via @/lib/notify instead — Phase 3a chokepoint (design-system-maintainability)\"; exit 1; fi'"
language = "system"
pass_filenames = false
types_or = ["ts", "tsx"]
stages = ["pre-commit"]

# Layer-boundary guard — UI primitives in `src/components/ui/` must be
# stateless. They are atomic building blocks (AGENTS.md "Component
# hierarchy") and must never reach into zustand stores: any feature
# requiring app state belongs in `src/components/` (shared) or higher
# layers. Catches the drift class where someone wires a primitive
# directly to `useNavigationStore` etc. — the next reviewer would
# otherwise have to spot the violation by eye on every PR.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "no-ui-store-imports"
name = "ui primitives must not import zustand stores"
entry = "bash -c 'if grep -rnE \"from ['\\''\\\"](\\@/stores|\\.\\./stores|\\.\\./\\.\\./stores)\" src/components/ui/ --include=\"*.ts\" --include=\"*.tsx\" --exclude-dir=__tests__; then echo \"ERROR: src/components/ui/ primitives must be stateless — move state-dependent logic up to src/components/ (shared) or src/hooks/. See AGENTS.md \\\"Component hierarchy\\\".\"; exit 1; fi'"
language = "system"
pass_filenames = false
types_or = ["ts", "tsx"]
stages = ["pre-commit"]

# Retired-doc-citation guard (#2233). The `pending/*.md` workplan convention
# was retired — those files were migrated to GitHub issues and no longer
# exist, so a comment citing `pending/<plan>-<date>.md` points at nothing.
# This hook fails on any NEW such reference in source (ts/tsx/rs). The
# pattern requires a hyphen after the slash so it matches the dead plan
# filenames (`pending/design-system-...`, `pending/-pages-view-...`) without
# firing on the unrelated `pending/loading` state phrase or the Tailwind
# opacity classes (`status-pending/30`). Generated `bindings.ts` is exempt
# (regenerated from the Rust specta docs). Historical archives under
# `docs/session-log/` and `SESSION-LOG.md` legitimately mention the retired
# convention and are .md files outside the scanned globs, so they are not hit.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "no-retired-pending-doc-refs"
name = "no citations of retired pending/*.md workplans (#2233)"
entry = "bash -c 'if grep -rnE \"pending/[A-Za-z]*-\" src/ src-tauri/src/ --include=\"*.ts\" --include=\"*.tsx\" --include=\"*.rs\" | grep -vE \"^src/lib/bindings\\.ts:\"; then echo \"ERROR: reference to a retired pending/*.md workplan — those docs were migrated to GitHub issues (see MEMORY: pending folder convention). Cite a surviving issue/#NNN or write an inline rationale instead.\"; exit 1; fi'"
language = "system"
pass_filenames = false
types_or = ["ts", "tsx", "rust"]
stages = ["pre-commit"]

# Elevation-tier drift guard (#1810, follow-up to #1654). #1654 routed the
# hand-rolled component surfaces through the elevation-tier tokens
# (`--shadow-resting/floating/overlay`, registered in src/index.css, #1098),
# applied as the `shadow-(--shadow-<tier>)` utility. This hook stops a NEW
# raw `shadow-(sm|md|lg)` (with any variant prefix, e.g. `focus:shadow-lg`)
# from silently re-drifting a container surface under src/components/ off the
# tiers. A small set of intentional non-tier shadows (badge legibility,
# pressed-state insets, control affordances, the floating-sidebar variant)
# are allowlisted with reasons inside the script. Comments are stripped first
# so a shadow class mentioned only in a code comment never fires. Rules +
# allowlist live in scripts/check-elevation-tiers.py.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "check-elevation-tiers"
name = "elevation-tier guard (#1810 no raw shadow-sm/md/lg on surfaces)"
entry = "python3 scripts/check-elevation-tiers.py"
language = "system"
files = '^src/components/.*\.(tsx|ts)$'
stages = ["pre-commit", "pre-push"]

# Companion: run the guard's own fixture suite (`--self-test`) so the match
# contract (variant prefixes, tier-utility/longer-token boundary,
# comment-stripping, allowlist exemption) cannot silently regress. No file
# args.
[[repos.hooks]]
id = "check-elevation-tiers-self-test"
name = "elevation-tier guard self-test (#1810 fixtures)"
entry = "python3 scripts/check-elevation-tiers.py --self-test"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit", "pre-push"]

# Legacy React API guard — block re-introduction of APIs we migrated away from
# (React 19, TypeScript 6, follow-up MutableRefObject removal).
# Two legitimate `React.JSX.IntrinsicElements` uses in RichContentRenderer.tsx are
# the correct React-19 form and are excluded by the `[^.]` prefix in the pattern.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "no-legacy-react-apis"
name = "no legacy react apis"
entry = "bash -c 'set -e; if grep -rnE \"\\bforwardRef\\b|\\bReact\\.forwardRef\\b|\\bMutableRefObject\\b|\\bReact\\.ComponentRef\\b\" src/ --include=\"*.ts\" --include=\"*.tsx\" --exclude-dir=mocks --exclude=bindings.ts; then echo \"ERROR: legacy React API detected — forwardRef / MutableRefObject / React.ComponentRef were removed during the React 19 / TS 6 migration\"; exit 1; fi; if grep -rnE \"(^|[^.])JSX\\.(IntrinsicElements|Element)\" src/ --include=\"*.ts\" --include=\"*.tsx\" --exclude-dir=mocks --exclude=bindings.ts; then echo \"ERROR: ambient JSX.* namespace detected — use React.JSX.IntrinsicElements / React.ReactElement instead (React 19 dropped the global JSX namespace)\"; exit 1; fi'"
language = "system"
pass_filenames = false
types_or = ["ts", "tsx"]
stages = ["pre-commit"]

# Vitest: smart related-only tests. Pre-push only (#817): test-related-ts.sh
# collects the changed .ts/.tsx files (skipping bindings.ts), and — when any
# match — runs `npx vitest related --run` on them. vitest's `related` then
# expands that set to every test that transitively imports those files. There
# is no foundational-module fallback to the full suite (unlike the Rust
# selector below); the fan-out is purely driven by the import graph, so a
# widely-imported shared module can still pull in most of the suite — far too
# slow for the commit path. The pre-push verifier runs it once, scoped to the
# push range, in Phase C of scripts/verify-ci-equivalent.sh; Phase A
# additionally passes SKIP=vitest so this hook is not re-run there.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "vitest"
name = "vitest"
entry = "scripts/test-related-ts.sh"
language = "system"
pass_filenames = false
types_or = ["ts", "tsx"]
stages = ["pre-push"]

# Tauri-mock parity: ensures every IPC command emitted from
# `src/lib/bindings.ts` (the auto-generated tauri-specta surface) has a
# handler in the in-browser tauri mock at `src/lib/tauri-mock/handlers.ts`.
# Catches the Phase 2 class of bug where a new backend command
# ships without a mock entry; e2e flows then silently get `null` and
# fail in unrelated places. Allowlist for genuinely-not-mockable
# commands (OAuth, OS sockets) lives inside the script.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "tauri-mock-parity"
name = "tauri-mock parity"
entry = "node scripts/check-tauri-mock-parity.mjs"
language = "system"
pass_filenames = false
files = "^src/lib/(bindings\\.ts|tauri-mock/handlers\\.ts)$"
stages = ["pre-commit"]

# Tracked-file Markdown link integrity. Verifies that every relative
# `](path.md)` link in tracked Markdown files points to a file that's
# also tracked by git. Lychee can't catch this locally because an
# untracked working-tree copy of the target shadows the gap; CI's
# fresh checkout sees the real state. This script asks
# `git ls-files`, matching CI semantics.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "md-link-targets"
name = "markdown link targets are tracked"
entry = "node scripts/check-md-link-targets.mjs"
language = "system"
pass_filenames = false
types = ["markdown"]
stages = ["pre-commit"]

# …and its #3962/#4017 source suite: index-vs-working-tree in throwaway
# fixtures. Keyed on the guard AND the two shared libraries it delegates to —
# keyed on the script alone, editing `guard-file-source.mjs`, which decides
# whether the guard judges the index or the working tree, fires no hook at
# all (the #3993/#3997 shape: a guard defanged by editing its dependency).
[[repos]]
repo = "local"
[[repos.hooks]]
id = "md-link-targets-selftest"
name = "markdown link-target guard source self-test (#4017 index vs working tree)"
entry = "node scripts/check-md-link-targets.mjs --self-test"
language = "system"
pass_filenames = false
files = '^scripts/(check-md-link-targets\.mjs|lib/guard-file-source\.mjs|lib/git-scratch-guard\.(mjs|sh))$'
stages = ["pre-commit"]

# doc-vs-code drift detector (ui-improvements 2026-05-16 §Maintenance /
# tooling). Complements `md-link-targets`: this hook scans inline-code
# spans + markdown link targets in narrative docs for `src/…`,
# `src-tauri/…`, `scripts/…`, `e2e/…`, `docs/…`, `pending/…`, or
# `.github/…` repo-rooted paths and fails when the cited path is missing
# from the tracked tree. Catches the case where a doc cites a file that
# has been renamed, refactored away, or moved without a sweep.
# `docs/session-log/*` (archive of past state) and `pending/*` (forward-
# looking plans) are excluded; gitignored build-output paths are skipped
# in the script.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "doc-vs-code-paths"
name = "doc citations point at tracked code"
entry = "node scripts/check-doc-code-paths.mjs"
language = "system"
pass_filenames = false
types = ["markdown"]
stages = ["pre-commit"]

# …and its #3962/#4017 source suite. This guard carries TWO working-tree
# reads, not one: the doc body, and the cited target's existence
# (`existsSync`). The second is what made a citation of a file that is staged
# but no longer on disk a red — a commit blocked over content that is
# correct in what is being committed. Keyed on the shared libraries too, for
# the reason `md-link-targets-selftest` gives above.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "doc-vs-code-paths-selftest"
name = "doc-vs-code path guard source self-test (#4017 index vs working tree)"
entry = "node scripts/check-doc-code-paths.mjs --self-test"
language = "system"
pass_filenames = false
files = '^scripts/(check-doc-code-paths\.mjs|lib/guard-file-source\.mjs|lib/git-scratch-guard\.(mjs|sh))$'
stages = ["pre-commit"]

# Stale-citation guard (#2546). `docs/ARCHITECTURE.md` used to be a big
# numbered-section document; it was split into `docs/architecture/*.md` and
# is now a short index with no numbered sections at all. This hook fails
# any tracked `*.md` / `*.rs` / `*.ts` / `*.tsx` file that still cites
# `ARCHITECTURE.md §N` — those citations point nowhere post-split. Fix by
# retargeting to the concrete split file + heading, e.g.
# `docs/architecture/<file>.md § <Heading>`. `docs/session-log/*` (archive
# of past state) is excluded; rules live in
# scripts/check-architecture-citations.mjs.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "architecture-citations"
name = "no stale ARCHITECTURE.md section citations"
entry = "node scripts/check-architecture-citations.mjs"
language = "system"
pass_filenames = false
files = "\\.(md|rs|ts|tsx)$"
stages = ["pre-commit"]

# Self-test the guard's own exit-2 invocation-error path (spawns itself with
# `git` stripped from PATH and asserts exit 2 + an "invocation error" stderr)
# whenever the guard script itself changes. Without this the exit-2 branch is
# reachable only by hand, so a regression that re-swallowed a genuine git
# failure as fail-open-clean would land unnoticed. Mirrors
# `dead-symbol-citations-selftest` below.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "architecture-citations-selftest"
name = "architecture citation guard self-test (#3982 exit-2 path)"
entry = "node scripts/check-architecture-citations.mjs --self-test"
language = "system"
pass_filenames = false
# Its own script AND the shared libraries it delegates to (#3962). Keyed on the
# script alone, editing `guard-file-source.mjs` — which decides whether the
# guard judges the index or the working tree — fired no hook at all. That is
# the #3993/#3997 shape: a guard defanged by editing its own dependency.
files = "^scripts/(check-architecture-citations\\.mjs|lib/guard-file-source\\.mjs|lib/git-scratch-guard\\.(mjs|sh))$"
stages = ["pre-commit"]

# Dead-symbol citation guard (#3817). ~10 Rust test-tree comments instructed
# readers to call a test-harness installer on the Loro engine state to drive
# the production engine path; that fn was deleted in #2249/#2250 (engine
# state moved from a process-global `OnceLock` to an explicit `&LoroState`
# parameter), and the stale comments actively misled a later session before
# being fixed. This hook fails any tracked `*.rs` or `*.md` file that still
# cites it as a whole word, except the one file that legitimately documents
# the deletion (the allowlist in the script) and `docs/session-log/**`,
# whose historical records name it in the past tense. `.md` is in scope
# because the same dead citation had also rotted into the canonical design
# doc docs/architecture/sql-only-convergence.md. Narrow and
# incident-specific by design — see scripts/check-dead-symbol-citations.mjs
# for the symbol itself, the rationale, the KNOWN COVERAGE GAP (the sibling
# `shared::get()` / `shared::init()` deletions cannot be guarded — `get` and
# `init` are too generic to word-match), and how to add another dead symbol.
#
# This comment deliberately does NOT spell the guarded symbol out. `.toml` is
# not in the scan set, so a citation here would be exempt by accident of file
# extension rather than by the allowlist the design is built on — and that
# exemption would evaporate silently if the scan set were ever widened. One
# hop to the script header costs a reader nothing and keeps this file clean
