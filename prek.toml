# Broken link check
#
# Uses a locally-installed `lychee` binary instead of the upstream
# pre-commit hook from `lycheeverse/lychee`. The upstream hook is
# broken on a normal dev box (verified 2026-05-27): both the
# `lychee-v0.24.2` script (`git describe --tags --exact-match` fails
# because prek's shallow clone strips tags) and the `lychee-v0.24.0`
# fallback (`cargo-binstall` extracted without an executable bit →
# Permission denied) fail in different ways, with no easy workaround.
#
# A `local`-language hook calling the system `lychee` binary
# sidesteps both failure modes entirely. Install via
# `cargo install lychee` if missing. CI installs lychee explicitly
# in the workflow, so this stays consistent across environments.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "lychee"
name = "lychee"
entry = "lychee"
args = ["--no-progress", "--max-concurrency=4", "--cache"]
language = "system"
types = ["markdown"]
pass_filenames = true
# Pre-push only (#817): lychee resolves links over the NETWORK, which is
# slow and flaky on the commit path; network checks don't belong in
# `git commit`. As a pre-push-staged hook it runs once, directly from the
# pre-push git shim (not via Phase A, which is pre-commit-stage only).
stages = ["pre-push"]

# SQL: sqruff (SQLite migrations lint)
# Scope: src-tauri/migrations/*.sql only. Inline `sqlx::query!` strings in Rust
# are not linted (covered by sqlx compile-time validation against .sqlx/ cache).
# Rule set picked to match all currently-shipped migrations without triggering
# any fixes (shipped migrations are append-only per AGENTS.md invariant #1;
# sqlx tracks their checksums in _sqlx_migrations).
[[repos]]
repo = "local"
[[repos.hooks]]
id = "sqruff"
name = "sqruff"
entry = "bash -c '. \"$HOME/.cargo/env\" && sqruff lint \"$@\"' --"
language = "system"
pass_filenames = true
files = "^src-tauri/migrations/.*\\.sql$"
stages = ["pre-commit"]

# sqlx offline-cache drift guard (#3901). `cargo sqlx prepare` deletes any
# cache entry it does not OBSERVE in that run, so a partial/wrong-scope
# invocation (the bare `cargo sqlx prepare --workspace` run from
# `src-tauri/`, or any warm-tree prepare) silently prunes entries a sibling
# `.sqlx/` cache still needs — 83, then 260, then 273 entries across three
# documented incidents, all green locally (online mode papers over it) and
# red only in CI's offline lane, far from the commit that caused it. This
# hook inspects the diff itself rather than running `cargo sqlx prepare`
# (too slow for a hook, and a partial recompile IS the trap): an entry that
# disappears from one `.sqlx/` cache while an identically-named entry (== the
# same query hash) still exists in a sibling cache is exactly that
# signature, and fails unless the diff also removes a `query!`-family call
# site (the escape valve for a genuinely-partial-but-intentional cleanup).
# An entry that disappears from EVERY cache at once — the correct
# `just gen-sqlx` shape, or a deliberate cross-cache prune like #3910's — is
# never flagged. `always_run = true` for the same reason as
# `migrations-immutable`: prek's changed-file set excludes deletions, so a
# `files`-filtered hook would silently skip a staged `.sqlx/` deletion.
# Staged-index mode only (like migrations-immutable); the `--range`
# backstop for LOCAL pre-push (staged index is empty at push time) is
# invoked directly from `scripts/verify-ci-equivalent.sh`, not through
# this stage — that script is a local hook only, never executed by any
# GitHub Actions workflow (see PR #3945 review note 5). The per-PR CI net
# for this same drift shape is `.github/actions/sqlx-offline-check`'s
# four `cargo sqlx prepare --check` lanes in `_validate.yml`'s `lint` job
# (invoked on every `pull_request` via `ci.yml`) — if a partial prepare
# left the cache disagreeing with a crate's actual `query!` call sites,
# that lane fails, independent of this bash guard and independent of the
# scheduled `cargo sqlx prepare --check` in `scheduled-deep-checks.yml`.
# Detection rules live in scripts/check-sqlx-cache-drift.sh.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "check-sqlx-cache-drift"
name = "sqlx cache drift guard (#3901)"
entry = "bash scripts/check-sqlx-cache-drift.sh"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

# Runs the guard's own fixture suite (`--self-test`) so the cross-cache
# survival check and the query!-removal escape valve cannot silently
# regress. No file args; mirrors `migrations-immutable-self-test`.
[[repos.hooks]]
id = "check-sqlx-cache-drift-self-test"
name = "sqlx cache drift guard self-test (#3901 fixtures)"
entry = "bash scripts/check-sqlx-cache-drift.sh --self-test"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit", "pre-push"]

# Tauri command IPC error-sanitization check. Every
# `#[tauri::command]` wrapper that returns `Result<_, AppError>` and
# propagates errors via `?` should funnel them through
# `.map_err(sanitize_internal_error)` so the IPC boundary never leaks
# bare `AppError::Sqlx` / `AppError::Internal` payloads to the
# frontend. A code-level wrapper macro would obstruct specta's type
# extraction, so the convention is enforced as a regex check instead.
# Pre-existing violations are grandfathered via an explicit allowlist
# inside the script — adjust there, not here.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "tauri-command-sanitize"
name = "tauri command sanitize"
entry = "node scripts/check-tauri-command-sanitize.mjs"
language = "system"
pass_filenames = false
files = "^src-tauri/src/commands/.*\\.rs$"
stages = ["pre-commit"]

