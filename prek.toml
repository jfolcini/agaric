language = "system"
pass_filenames = false
# #3978 widened this from the original 3-guard trio to all six whole-tree
# ratchets this script now runs against the merge result — the self-test
# seeds a fixture copy of every one of them (mr_seed_guards), plus the
# shared scanner check-tauri-import-baseline.mjs imports
# (scripts/lib/js-scanner.mjs) — so a change to any of them must re-run
# this self-test too.
files = '^(scripts/pr-merge-result-check\.sh|scripts/lib/git-scratch-guard\.sh|scripts/check-raw-tx\.py|scripts/check-dynamic-sql\.py|scripts/check-table-ownership\.py|scripts/check-unsafe-allowlist\.sh|scripts/check-migrations-immutable\.sh|scripts/check-tauri-import-baseline\.mjs|scripts/lib/js-scanner\.mjs|\.github/workflows/pr-overlap\.yml)$'
stages = ["pre-commit"]

# git-scratch-guard-selftest (#3722): the SHARED scrubber that every script
# building git fixtures must source before its first fixture command. A prek
# self-test runs inside the pre-commit environment, where git exports
# GIT_DIR / GIT_INDEX_FILE / GIT_WORK_TREE pointing at the REAL repository —
# and those OUTRANK `git -C <fixture>`. Unscrubbed, `git -C "$tmp" init`
# re-initialises the developer's own repo and never creates the fixture, so
# every command after it lands on their checkout: identity overwritten,
# `core.worktree` rewritten to a temp dir about to be deleted (after which
# every git call in that repo dies with "fatal: Invalid path", including the
# ones `gh` shells out to), index left claiming every tracked file was
# deleted. That has now happened three times — #3690, #3722, and #3736, where
# the offender was a NEW self-test added by the very PR that was fixing signal
# integrity.
#
# Shared, because three scripts already carried private copies of this
# scrubber and none of them protected the fourth. Its fixtures assert both
# directions against a throwaway victim repo: WITH the guard the victim's
# HEAD, index, identity and core.worktree survive a fixture build under a live
# hook environment; WITHOUT it the fixture repo is never created and the
# victim's identity is overwritten — so the positive assertions cannot be
# vacuous. Plus the abort path (a readonly export `unset` cannot remove must
# exit 3 rather than proceed) and that the scrub and its verification read one
# list, since a checker with a shorter list than the scrubber reports clean
# while the variable it forgot is still doing the damage.
[[repos]]
repo = "local"
[[repos.hooks]]
id = "git-scratch-guard-selftest"
name = "Shared git-scratch guard self-test (#3722)"
entry = "bash scripts/lib/git-scratch-guard.sh --self-test"
language = "system"
pass_filenames = false
files = '^scripts/lib/git-scratch-guard\.sh$'
stages = ["pre-commit"]

