# they inject the divergence list straight into `computeOverlap`; the git
# computation was the untested part. It now lives in a script that builds the
# real topologies and drives itself end to end. Its fixtures pin the OLD
# formulation returning nothing on the merge-ref shape, the new one returning
# the baseline file main moved under the branch, and the sibling rejection that
# keeps it honest: a branch whose last commit is `git merge origin/main` is
# ALSO a two-parent HEAD, and taking `HEAD^2` there would compare the base
# branch with itself — the same bug wearing a different hat. The contract's two
# exit codes are pinned separately, because "could not compute" and "computed,
# and nothing diverged" are the two facts this entire lane exists to keep
# apart.
[[repos]]
