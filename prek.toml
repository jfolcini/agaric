# pr-merge-result-check-selftest (#3672 steps 2/3): the overlap lane reports
# which files two PRs share or which ratchet files diverged from `main` under
# a branch — it deliberately never runs a guard on the MERGE RESULT itself,
# because that needs a git worktree and the guard's own toolchain. This
# script does: given a base ref and a head sha, it builds a FRESH merge in a
# disposable worktree (never the caller's own checkout) and runs the
# toolchain-free Rust ratchet-guard trio (check-raw-tx, check-dynamic-sql,
# check-table-ownership — the five-crate-root scan, #3107) against it. The
# self-test's fixtures are the #3724 near-miss, minimised to the smallest
# reproducible shape: two branches each add ONE dynamic-SQL site to
# DIFFERENT, non-overlapping lines of the SAME file, and each (correctly,
# from ITS OWN base) baselines that file at 1 — `git merge` auto-resolves
# both hunks with no textual conflict, and the merged tree then has 2 sites
# in a file baselined at 1. Both branches pass check-dynamic-sql ALONE
# (pinned first, so the failure below is provably a MERGE property and not
# just "the guard can fail"); the merge does not. A sibling clean fixture
# (two branches editing DIFFERENT files) proves the same machinery reports a
# pass when the merge really is fine, and a real textual conflict is pinned
# as NOT COMPUTED (exit 2) rather than silently "clean" — GitHub's own merge
# check already owns that case, this script must not pretend to re-decide it.
# Separately pinned, because all three used to exit 0 having examined
# nothing: a guard absent from the merged tree, zero `.rs` files under any
# known crate root, and a missing python3 are exit 3 ("verified nothing"),
# which the workflow treats as a failure. The base is also pinned to resolve
# through `origin/<ref>` rather than a stale local branch — the freshness
# claim, which no fixture without a remote could tell apart.
