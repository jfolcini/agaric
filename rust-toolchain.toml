[toolchain]
# #640: exact pin instead of floating `stable` — a floating channel lets
# every ~6-week Rust release land new lints (clippy runs with -D warnings)
# and break all open PRs simultaneously, and makes release binaries
# non-reproducible across time. rustup takes no hash, so an exact version is
# the pin (AGENTS.md § Supply-chain pinning). Bump deliberately via PR with
# `just pin-bump rust <version>`. The workflows read this channel through
# `scripts/pins.sh github-output` (`steps.pins.outputs.rust`); the one copy
# left to edit by hand is `rust-version` in each crate manifest (MSRV
# documentation).
channel = "1.100.0"
# clippy + rustfmt are required by the prek hooks (`cargo clippy -- -D
# warnings`, `cargo fmt --check`). With a floating `stable` they came along
# implicitly (full-profile installs); a pinned exact version is typically a
# fresh `--profile minimal` install (`.github/actions/rust-toolchain` in CI),
# which ships NEITHER — rustup installs components listed here automatically
# whenever this toolchain file is in effect. rust-analyzer (the language
# server editors and agents use) and rust-src (the std sources it reads) are in
# neither profile either, so a pinned toolchain only has them if listed here.
components = ["clippy", "rustfmt", "rust-analyzer", "rust-src"]
